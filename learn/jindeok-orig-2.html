/www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><\/mrow><\/math> 가 남는다. 나눠야 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><\/mrow><\/math> 가 사라진다."]}}, {"질문": "두 원이 서로 다른 두 점에서 만난다(중심 거리 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><\/mrow><\/math> 가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/math> 와 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/math> 사이)는 사실은 풀이에서 어떤 역할을 하나?", "선지": ["두 원 사이를 지나는 접선이 없어 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math> 후보가 버려진다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><\/math> 후보가 버려지는 이유다", "공통접선이 원점을 지난다는 뜻이다", "두 원의 공통현이 구하는 접선이라는 뜻이다", "답에는 영향이 없다 — 접선의 기울기만 정한다"], "말": ["맞다. 두 원이 겹쳐 있으면 둘 사이를 가르는 접선은 없다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math> 이 그쪽 후보다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><\/math> 는 실제로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math> 을 주며 살아남는 후보다. 버려지는 건 어느 쪽인지 다시 보자.", "원점은 작은 원의 중심이다. 중심을 지나는 직선이 그 원에 접할 수 있을까?", "공통현은 두 원과 두 점에서 만나는 선이다. 접선은 원과 한 점에서만 만난다.", "기울기는 거리식이 정한다. 위치 관계는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><\/mrow><\/math> 의 두 후보와 관련 있다. 어느 후보일지 보자."], "풀이": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>n<\/mi><mo>&#x02212;<\/mo><mn>4<\/mn><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mn>3<\/mn><mo stretchy=\"false\">&#x0007C;<\/mo><mi>n<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 에서 나온 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math> 은 두 원 사이를 가르는 접선 쪽 후보인데, 두 원이 겹쳐 있으니 그런 접선은 없다. 실제로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math> 이면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>m<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mn>1<\/mn><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 라 불가능하다. 살아남는 건 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>m<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math> 쪽이고, 공통현은 두 원과 만나는 선이지 접선이 아니다.", "보조": {"질문": "두 원이 서로 다른 두 점에서 만날 때 공통접선은 몇 개?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><\/mrow><\/math>"], "말": ["맞다. 바깥을 감싸는 접선 2개뿐, 둘 사이를 지나는 접선은 없다. 그럼 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><\/mrow><\/math> 의 두 후보 중 어느 쪽이 사라질까?", "4개는 두 원이 완전히 떨어져 있을 때다.", "3개는 두 원이 외접할 때다."]}}, {"질문": "작은 원은 그대로, 큰 원의 중심만 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>4<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 에 kSuQmCC\" style=\"width:62mm\"><\/div><\/div>", "M": [{"질문": "이 문제가 결국 묻는 핵심은?", "선지": ["접기는 AB 에 대한 대칭이동이라 접힌 호는 같은 반지름 원의 일부, AB 는 공통현", "접힌 호는 처음 원을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>축에 대해 대칭이동한 것", "선분 AB 는 처음 원의 지름이다", "접힌 호는 반지름이 절반인 원의 일부이다", "A, B 는 처음 원이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>축, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축과 만나는 점이다"], "말": ["맞다. 접으면 반지름은 그대로이고, 두 원이 A, B 를 함께 지나 AB 가 공통현이 된다.", "축에 접하는 그림이라 축 대칭이 떠올랐구나. 근데 무엇을 기준으로 접었는지 다시 보자.", "지름으로 접으면 접힌 호가 원래 원의 반대쪽 반원과 겹친다. 그게 두 축에 닿을지 생각해 보자.", "접는다고 크기가 바뀌진 않는다. 종이를 접어도 곡선의 굽은 정도는 같다.", "그림에서 A, B 가 축 가까이 보여도 축 위의 점은 아니다."], "풀이": "접는 것은 직선 AB 에 대한 대칭이동이라 접힌 호의 원은 반지름이 같다. 두 원이 A, B 를 함께 지나니 AB 는 공통현이다. 그림에서 A, B 가 축 가까이 보여도 축 위의 점은 아니다.", "보조": {"질문": "곡선을 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>l<\/mi><\/mrow><\/math> 을 접는 선으로 접으면, 접힌 곡선은 원래 곡선을 어떻게 옮긴 것인가?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>l<\/mi><\/mrow><\/math> 에 대하여 대칭이동한 것", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>l<\/mi><\/mrow><\/math> 방향으로 평행이동한 것", "원점에 대하여 대칭이동한 것"], "말": ["맞다. 대칭이동은 모양과 크기를 그대로 둔다. 접힌 호가 어떤 원의 일부인지 보자.", "접으면 뒤집힌다. 미끄러지듯 옮기는 게 아니다.", "접는 선이 원점을 지난다는 보장은 없다. 기준은 접는 선이다."]}}, {"질문": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>y<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo> 2<\/mn><\/msup><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>y<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>25<\/mn><\/mrow><\/math> 의 안에 있나?", "선지": ["밖에 있다", "안에 있다", "원 위에 있다"], "말": ["맞다. 접힌 호는 처음 원 안쪽에 놓인다. 그러면 중심이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>5<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mn>5<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 인 접힌 원이 가능할까?", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x02212;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>5<\/mn><mo>&#x02212;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>37<\/mn><\/mrow><\/math> 을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>25<\/mn><\/mrow><\/math> 와 비교해 보자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x02212;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>5<\/mn><mo>&#x02212;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><\/mrow><\/math> 을 계산해 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>25<\/mn><\/mrow><\/math> 와 비교해 보자."]}}, {"질문": "반지름 5 는 그대로, 처음 원의 중심만 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 에서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 로 옮기면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/math> 는 바꾸기 전보다?", "선지": ["길어진다 — 두 중심이 가까워져 중심에서 AB 까지 거리가 준다", "짧아진다 — 중심이 축에서 멀어져 접힌 호가 작아진다", "그대로다 — 반지름이 같으면 AB 도 같다", "AB 가 지름이 된다 — 접힌 원과 처음 원이 겹친다", "접는 것이 불가능해진다 — A, B 가 제1사분면을 벗어난다"], "말": ["맞다. 두 중심이 가까워지면 공통현이 중심 쪽으로 다가와 길어진다.", "접힌 원은 여전히 반지름 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>5<\/mn><\/mrow><\/math>, 중심 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>5<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>5<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 다. 바뀐 건 두 중심 사이 거리다.", "반지름이 같아도 두 중심 사이 거리가 바뀌면 공통현 길이가 바뀐다.", "두 원이 겹치려면 중심이 같아야 한다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 와 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>5<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>5<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 는 다르다.", "중심 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 인 원도 제1사분면에 충분히 걸쳐 있다. A, B 를 직접 찾아보면 제1사분면이다."], "풀이": "접힌 원의 중심은 여전히 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>5<\/mn><mo>&#x0002C;<\/mo><mn>5<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 다. 중심 거리가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/math> 에서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/math> 로 줄어 중심에서 AB 까지 거리도 절반씩 준다. 그래서 반 현 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><mn>25<\/mn><mo>&#x02212;<\/mo><msup><mi>d<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msqrt><\/mrow><\/math> 이 커져 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><msqrt><mrow><mn>17<\/mn><\/mrow><\/msqrt><\/mrow><\/math> 에서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><mn>82<\/mn><\/mrow><\/msqrt><\/mrow><\/math> 로 길어진다.", "보조": {"질문": "반지름이 같은 두 원의 중심 거리가 줄면, 중심에서 공통현까지의 거리는?", "선지": ["줄어든다", "늘어난다", "변하지 않는다"], "말": ["맞다. 중심에서 현까지 가까울수록 현은 길다. 이제 AB 가 어떻게 되는지 보자.", "공통현은 두 중심의 한가운데를 지난다. 중심이 가까워지면 그 가운데까지도 가까워진다.", "중심 거리의 절반이 곧 현까지 거리다. 중심 거리가 바뀌면 같이 바뀐다."]}}, {"질문": "어떤 학생이 답을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><msqrt><mrow><mn>21<\/mn><\/mrow><\/msqrt><\/mrow><\/math> 로 적었다. 원인은?", "선지": ["두 중심 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>5<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>5<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 사이 거리를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/math> 가 아니라 4 로 봤다", "처음 원과 두 축의 교점을 A, B 로 잡았다", "중심에서 AB 까지 거리를 중심 사이 거리 전체로 썼다", "반 현의 길이만 구하고 2배를 하지 않았다", "접힌 원의 중심을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 로 잡았다"], "말": ["맞다. 중심 거리를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><\/mrow><\/math> 로 보면 현까지 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><\/mrow><\/math>, 반 현 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><mn>21<\/mn><\/mrow><\/msqrt><\/mrow><\/math> 이 나온다.", "축과의 교점으로 잡으면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><mn>21<\/mn><\/mrow><\/msqrt><\/mrow><\/math> 같은 값이 나오기 어렵다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>21<\/mn><mo>&#x0003D;<\/mo><mn>25<\/mn><mo>&#x02212;<\/mo><mn>4<\/mn><\/mrow><\/math> 를 떠올려 보자.", "그러면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>25<\/mn><mo>&#x02212;<\/mo><mn>32<\/mn><\/mrow><\/math> 가 음수라 루트가 안 된다.", "2배를 안 했다면 답에 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><\/mrow><\/math> 가 안 붙는다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><msqrt><mrow><mn>21<\/mn><\/mrow><\/msqrt><\/mrow><\/math> 은 2배까지 한 값이다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 과 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 의 거리는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/math> 라 현까지 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/math>, 반 현 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><mn>23<\/mn><\/mrow><\/msqrt><\/mrow><\/math> 이다."], "풀이": "중심 거리를 4 로 보면 AB 까지 거리 2, 반 현 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><mn>25<\/mn><mo>&#x02212;<\/mo><mn>4<\/mn><\/mrow><\/msqrt><mo>&#x0003D;<\/mo><msqrt><mrow><mn>21<\/mn><\/mrow><\/msqrt><\/mrow><\/math> 이라 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><msqrt><mrow><mn>21<\/mn><\/mrow><\/msqrt><\/mrow><\/math> 이다. 실제 거리는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/math> 라 AB 까지 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/math>, 답 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><msqrt><mrow><mn>17<\/mn><\/mrow><\/msqrt><\/mrow><\/math> 이다. 축과의 교점을 쓰면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mn>2<\/mn><\/msqrt><mo>&#x0002B;<\/mo><mn>4<\/mn><msqrt><mn>3<\/mn><\/msqrt><\/mrow><\/math>, 2배를 안 하면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><mn>17<\/mn><\/mrow><\/msqrt><\/mrow><\/math> 이 된다.", "보조": {"질문": "두 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>5<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>5<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 사이의 거리는?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>8<\/mn><\/mrow><\/math>"], "말": ["맞다. 이걸 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><\/mrow><\/math> 로 보면 무엇이 나오는지 계산해 보자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>좌표 차만 봤다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>좌표 차도 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><\/mrow><\/math> 다.", "두 차를 그냥 더했다. 거리는 제곱해 더한 뒤 루트다."]}}, {"질문": "이 문제와 같은 핵심 개념으로 푸는 것을 모두 고르면?<br>ㄱ. 원 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>9<\/mn><\/mrow><\/math> 의 호를 현 AB 로 접었더니 접힌 호의 원 중심이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, 직선 AB 는?<br>ㄴ. 원 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>y<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>25<\/mn><\/mrow><\/math> 를 평행이동해 두 축에 접하게 한 원의 방정식<br>ㄷ. 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 을 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>l<\/mi><\/mrow><\/math> 에 대해 대칭이동하면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>5<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>5<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 일 때 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>l<\/mi><\/mrow><\/math> 의 방정식", "선지": ["ㄱ, ㄷ", "ㄱ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "말": ["맞다. ㄱ은 두 중심의 수직이등분선, ㄷ도 두 점의 수직이등분선이다. 둘 다 '접기 = 대칭이동' 이다.", "ㄱ은 잘 봤다. 원이 안 나와도 '접기 = 대칭이동' 인 보기가 있는지 보자.", "ㄱ은 잘 봤다. ㄴ은 원을 옮기긴 하는데, 뒤집는 이동일까?", "ㄷ은 잘 봤다. ㄴ의 이동이 대칭인지 평행인지 다시 보자. 그리고 ㄱ도.", "셋 다 같은 원이나 점이 나온다. 대칭이동이 실제로 쓰이는 게 어느 것인지 보자."], "풀이": "ㄱ은 접는 선이 두 중심 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 의 수직이등분선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math> 이고, ㄷ도 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 과 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>5<\/mn><mo>&#x0002C;<\/mo><mn>5<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 의 수직이등분선이다. 둘 다 '접기 = 대칭이동' 이다. ㄴ은 같은 원과 두 축이 나와도 평행이동이라 다른 개념이다.", "보조": {"질문": "점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 을 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>l<\/mi><\/mrow><\/math> 에 대하여 대칭이동한 점이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>5<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>5<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 일 때 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>l<\/mi><\/mrow><\/math> 은?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>6<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math>"], "말": ["맞다. 이 문제의 직선 AB 도 바로 이 선이다. 보기를 다시 보자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 는 두 점을 다 지난다. 대칭축은 두 점 사이를 수직으로 가른다.", "두 점의 중점은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>3<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 이다. 이 점을 지나는지 확인해 보자."]}}], "H": {"질문": "이 문제, 첫 발은 뭐로 뗄까?", "선지": ["원의 식을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>y<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>25<\/mn><\/mrow><\/math> 로 바꿔 중심·반지름을 구한다", "A, B 를 원과 두 축의 교점으로 잡는다", "접힌 호의 반지름을 절반인 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>5<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 로 둔다", "선분 AB 를 원의 지름으로 둔다", "직선 AB 를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 로 둔다"], "말": ["좋다. 중심 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, 반지름 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>5<\/mn><\/mrow><\/math> 다. 접어도 반지름은 그대로라는 게 다음 열쇠다.", "축에 닿는 건 접힌 호다. A, B 는 축 위의 점이 아니다.", "접는다고 크기가 줄진 않는다.", "지름으로 접으면 접힌 호가 원래 원과 겹친다. 두 축에 접할 수 없다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 는 두 중심을 잇는 방향이다. 접는 선은 그것과 다르다."], "힌트": ["접는 것은 선분 AB 에 대한 대칭이동이다. 접힌 호를 품은 원의 반지름과 중심을 생각해 보자.", "접힌 원은 반지름 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>5<\/mn><\/mrow><\/math> 이고 두 축에 접하니 중심이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>5<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>5<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 다. AB 는 두 원 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>y<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>25<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mn>5<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>y<\/mi><mo>&#x02212;<\/mo><mn>5<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>25<\/mn><\/mrow><\/math> 의 공통현이다."]}}];</script><script>
const KEY='haebu-tree:'+META.id;
let S={pi:0,log:[]};
const $=s=>document.querySelector(s);
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function rnd(seed){let x=seed%2147483647;if(x<=0)x+=2147483646;return()=>(x=x*16807%2147483647)/2147483647;}
function hash(s){let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))%1000003;return h;}
function shuffled(n,tag){const r=rnd(hash(META.id+tag)+n);const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function scrollEnd(n){setTimeout(()=>n.scrollIntoView({behavior:'smooth',block:'start'}),60);}

/* 카드 하나: 질문 + 선지. onPick(원래 인덱스) */
function ask(box,lab,labc,q,opts,tag,locked,onPick){
  const b=el('div','bub q');b.appendChild(el('div','lab'+(labc?' '+labc:''),lab));b.appendChild(el('div','',q));
  const g=el('div','opts');const ord=shuffled(opts.length,tag);
  ord.forEach((k,i)=>{const o=el('button','op'+((locked||[]).includes(k)?' lock':''),'<b>'+'①②③④⑤'[i]+'</b><span>'+opts[k]+'</span>');
    o.onclick=()=>{if(g.classList.contains('done'))return;
      g.querySelectorAll('.op').forEach(x=>x.classList.remove('pick'));o.classList.add('pick');sel=[k,o];
      ok.disabled=false;ok.textContent='이걸로 할게';};g.appendChild(o);});
  // (1009) 바로 넘어가지 않는다 — 고른 뒤 [이걸로 할게] 를 눌러야 확정. 잘못 터치하면 다른 걸 다시 고르면 된다.
  let sel=null;const ok=el('button','nx cf','하나 골라 봐');ok.disabled=true;
  ok.onclick=()=>{if(!sel||g.classList.contains('done'))return;g.classList.add('done');ok.remove();onPick(sel[0],sel[1],g);};
  b.appendChild(g);b.appendChild(ok);box.appendChild(b);scrollEnd(b);return g;
}
function say(box,cls,h){const b=el('div','bub say '+cls,h);box.appendChild(b);return b;}
function nextBtn(box,txt,fn){const n=el('button','nx',txt);n.onclick=()=>{n.remove();fn();};box.appendChild(n);scrollEnd(n);}

function runProblem(pi){
  const P=PROBS[pi];const root=$('#thread');root.innerHTML='';
  const card=$('#prob');card.innerHTML='';card.className='prob';
  card.appendChild(el('div','ph',(pi+1)+' / '+PROBS.length+' · '+P.id+(P.단원?' · '+P.단원:'')));
  card.appendChild(el('div','stem',P.발문));
  const tog=el('button','tog','문제 접기');tog.onclick=()=>{card.classList.toggle('fold');tog.textContent=card.classList.contains('fold')?'문제 펼치기':'문제 접기';};card.appendChild(tog);
  const dots=el('div','dots');for(let k=0;k<6;k++)dots.appendChild(el('i'));card.appendChild(dots);
  const res=Array(6).fill(null);   // 'o' | 't' | 'x'
  const rec={id:P.id,입구:null,갈림:null,첫발:null,스텝:[]};
  const paint=cur=>dots.querySelectorAll('i').forEach((d,k)=>d.className=res[k]||(k===cur?'cur':''));

  // ① 입구
  ask(root,'먼저','', '이 문제, 풀어 봤을 때 어땠어?',
    ['맞혔고, 왜 그런지 설명도 할 수 있다','맞히긴 했는데 감으로 풀었다','풀었는데 틀렸다','손도 못 댔다'],'in',[],k=>{
      rec.입구=k;
      if(k<=1){say(root,'',k===0?'좋아. 그럼 진짜 설명할 수 있는지 하나씩 확인해 보자.':'감으로 맞힌 건 다음엔 틀릴 수 있다. 근거를 하나씩 세워 보자.');go([0,1,2,3,4,5]);}
      else if(k===2){
        ask(root,'어디서','', '어디서 갈렸던 것 같아?',
          ['무엇을 묻는 문제인지부터 헷갈렸다','식을 어떻게 세울지 몰랐다','조건을 놓쳤거나 잘못 읽었다','계산하거나 답 고르다 틀렸다','잘 모르겠다'],'wh',[],j=>{
            rec.갈림=j;const first=[0,1,2,4,0][j];
            say(root,'','그럼 거기부터 보자. 나머지도 이어서 짚는다.');
            go([first,...[0,1,2,3,4,5].filter(x=>x!==first)]);});
      } else firstStep(()=>go([0,1,2,3,4,5]));
    });

  function firstStep(done){
    const H=P.H;let tries=0;const locked=[];
    const once=()=>ask(root,'첫 발','h',H.질문,H.선지,'H'+tries,locked,(k,o)=>{
      if(k===0){o.classList.add('right');say(root,'ok',H.말[0]);rec.첫발=tries;nextBtn(root,'이제 문제를 뜯어보자',done);}
      else{o.classList.add('wrong');locked.push(k);say(root,'no',H.말[k]);
        if(tries===0){tries=1;say(root,'sol','💡 '+H.힌트[0]);nextBtn(root,'다시 골라 볼게',once);}
        else{say(root,'sol','💡 '+H.힌트[1]);rec.첫발=2;nextBtn(root,'이제 문제를 뜯어보자',done);}}
    });
    once();
  }

  function go(order){
    let i=0;
    const step=()=>{
      if(i>=order.length)return finish();
      const s=order[i++];paint(s);const M=P.M[s];const locked=[];
      const lab='STEP '+(s+1)+' · '+STEPNAME[s];
      ask(root,lab,'',M.질문,M.선지,'M'+s,locked,(k,o)=>{
        if(k===0){o.classList.add('right');say(root,'ok',M.말[0]);res[s]='o';rec.스텝[s]={결과:'o',고른것:[k]};paint(-1);nextBtn(root,i<order.length?'다음':'정리 보기',step);return;}
        o.classList.add('wrong');locked.push(k);say(root,'no',M.말[k]);const picks=[k];
        // 보조 → 재도전
        nextBtn(root,'작은 것부터 확인',()=>{
          const B=M.보조;
          ask(root,'디딤돌','sub',B.질문,B.선지,'B'+s,[],(j,o2)=>{
            o2.classList.add(j===0?'right':'wrong');say(root,j===0?'ok':'no',B.말[j]);
            if(j!==0)say(root,'sol','디딤돌 답: '+B.선지[0]);
            nextBtn(root,'처음 질문 다시',()=>{
              ask(root,lab+' · 다시','',M.질문,M.선지,'M'+s+'r',locked,(k2,o3)=>{
                picks.push(k2);
                if(k2===0){o3.classList.add('right');say(root,'ok','다시 잡았다. '+M.말[0]);res[s]='t';}
                else{o3.classList.add('wrong');say(root,'no',M.말[k2]);say(root,'sol','<b>정리</b> '+M.풀이);res[s]='x';}
                rec.스텝[s]={결과:res[s],고른것:picks,디딤돌:j};paint(-1);
                nextBtn(root,i<order.length?'다음':'정리 보기',step);
              });
            });
          });
        });
      });
    };
    step();
  }

  function finish(){
    paint(-1);S.log[pi]=rec;save();
    const sm=el('div','sum');sm.appendChild(el('h3','',P.id+' 정리'));
    const mk={o:['○','o','한 번에'],t:['△','t','디딤돌 뒤'],x:['✕','x','다시 볼 것']};
    for(let k=0;k<6;k++){const r=res[k];const m=r?mk[r]:['–','s','건너뜀'];
      const row=el('div','row');row.appendChild(el('span','','STEP '+(k+1)+' '+STEPNAME[k]));row.appendChild(el('span','mk '+m[1],m[0]+' '+m[2]));sm.appendChild(row);}
    const weak=[...Array(6).keys()].filter(k=>res[k]==='x'||res[k]==='t');
    sm.appendChild(el('div','weak',weak.length?'<b>여기가 약한 곳</b> · '+weak.map(k=>STEPNAME[k]).join(', ')+(rec.입구<=1&&weak.length>=2?'<br>맞힌 문제였는데도 여기서 걸렸다 — 답을 외운 건 아닌지 다시 보자.':''):'<b>여섯 군데 다 한 번에 통과.</b> 이 문제는 진짜 네 거다.'));
    root.appendChild(sm);
    if(pi+1<PROBS.length)nextBtn(root,'다음 문제 →',()=>{S.pi=pi+1;save();window.scrollTo(0,0);runProblem(pi+1);});
    else root.appendChild(el('div','bub say ok','오늘 세트 끝. 수고했다.'));
    scrollEnd(sm);
  }
}
try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.log)S=d;}catch(e){}
runProblem(Math.min(S.pi||0,PROBS.length-1));
</script></body></html>
