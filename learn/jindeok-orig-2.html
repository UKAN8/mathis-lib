<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>진덕고 프린트 해부 · 원의 방정식</title><style>
:root{--key:#EA9090;--deep:#C0524E;--ink:#333;--mute:#8A8A8A;--tint:#FAE3E1;
 --soft:#F6F6F6;--line:#E6E6E6;--ok:#3E8E6E;--okbg:#E9F4EF;--no:#C0524E;--nobg:#FBEDEC;
 --warn:#B26A00;--warnbg:#FFF3E0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Paperlogy','Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
 background:#EFEFEF;color:var(--ink);font-size:16px;line-height:1.65;padding-bottom:64px}
.wrap{max-width:560px;margin:0 auto;background:#fff;min-height:100vh}
header{padding:22px 20px 16px;background:#2E2E2E;color:#fff;position:sticky;top:0;z-index:20}
.brand{font-size:12px;letter-spacing:.08em;color:var(--key);font-weight:700}
h1{margin:6px 0 2px;font-size:21px;font-weight:800;letter-spacing:-.01em}
.meta{font-size:12.5px;color:#B9B9B9}
.bar{display:flex;gap:5px;margin-top:14px}
.bar i{flex:1;height:4px;border-radius:2px;background:#4A4A4A;transition:background .25s}
.bar i.done{background:var(--key)}
.bar i.wrong{background:#7A4B49}
.guide{margin:0;padding:15px 20px;background:var(--tint);color:var(--deep);font-size:13.5px;line-height:1.6}
.guide b{display:block;font-size:14.5px;margin-bottom:3px}
.part{padding:22px 20px 4px}
.part .pl{font-size:12px;font-weight:800;color:var(--deep);letter-spacing:.04em}
.part .pt{font-size:17px;font-weight:800;margin-top:3px}
.part .pd{font-size:13px;color:var(--mute);margin-top:3px}
.q{padding:20px 20px 24px;border-bottom:10px solid #F1F1F1}
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.qno{font-size:13px;font-weight:800;color:var(--deep)}
.tag{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--tint);color:var(--deep);font-weight:600}
.tag.grey{background:var(--soft);color:var(--mute)}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.pct{background:#EDEDED;color:#6E6E6E}
.stem{font-size:15.5px;margin:0 0 4px}
/* (0908) 학교프린트 원문 조각 — hwpx2html 산출을 그대로 담는다 */
.print{font-size:15px;line-height:1.7}
.print p{margin:0 0 2px}
.print .lead,.print .box{background:var(--soft);border-left:3px solid #555;padding:6px 10px;margin:8px 0}
.print .bogi{border:1px solid #444;padding:12px 10px 6px;margin:12px 2px 8px;position:relative}
.print .bogi .lbl{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:#fff;padding:0 6px;font-weight:700;font-size:13px}
.print .bl{margin:0 0 2px}
.print .fig{text-align:center;margin:8px 0}
.print img{max-width:100%;height:auto}
.print .fl{float:right;margin:0 0 4px 8px;max-width:48%}
.print .fl.left{float:left;margin:0 8px 4px 0}
.print .pcs{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 10px;margin-top:10px;clear:both}
.print .pcs.c1{grid-template-columns:1fr}
.print .pch{display:flex;gap:4px;align-items:baseline}
.print .pcn{color:var(--mute);flex-shrink:0}
.print .tbl{border-collapse:collapse;margin:4px auto;font-size:14px}
.print .tbl td{border:1px solid #444;padding:2px 6px;text-align:center}
.print .tbl.grid td{border:none}
.print .tab{display:inline-block;width:14px}
.print .missing{color:var(--no)}
.disp{margin:14px 0;text-align:center;font-size:17px;overflow-x:auto}
.field{margin-top:16px}
.flabel{font-size:13px;color:var(--mute);margin-bottom:6px;display:block}
.row{display:flex;gap:8px;align-items:stretch}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:17px;padding:13px 14px;
 border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--key)}
input[type=text]:disabled{background:var(--soft);color:var(--mute)}
button{font:inherit;cursor:pointer;border:none}
.btn{padding:13px 20px;border-radius:10px;background:var(--ink);color:#fff;font-weight:700;
 font-size:15px;white-space:nowrap}
.btn:disabled{background:#CFCFCF;cursor:default}
.btn.wide{width:100%;padding:16px;font-size:16px}
.choices{display:grid;gap:8px;margin-top:8px}
.ch{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);
 border-radius:10px;font-size:14.5px;background:#fff;text-align:left;color:var(--ink);line-height:1.5}
.ch b{color:var(--mute);font-weight:700;flex-shrink:0}
.ch.sel{border-color:var(--key);background:var(--tint)}
.ch:disabled{opacity:1}
.ch.ans{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.ch.ans b{color:var(--ok)}
.ch.miss{border-color:var(--no);background:var(--nobg);color:var(--no)}
.ch.idk{border-style:dashed;color:var(--mute);background:var(--soft);font-size:13px;padding:9px 14px}
.ch.idk.sel{border-color:var(--warn);background:var(--warnbg);color:var(--warn)}
.ch.miss b{color:var(--no)}
.ch.dim{opacity:.45}
.steps{margin-top:8px;border-left:2px solid var(--tint);padding-left:14px}
.step{margin-bottom:18px}.step:last-child{margin-bottom:4px}
.sk{font-size:13px;font-weight:700;color:var(--deep);margin-bottom:7px}
.verdict{margin-top:16px;border-radius:12px;padding:14px 16px;font-size:14.5px;display:none}
.verdict.show{display:block}
.verdict.ok{background:var(--okbg);color:var(--ok)}
.verdict.no{background:var(--nobg);color:var(--no)}
.verdict .vt{font-weight:800;font-size:15px;margin-bottom:6px}
.sol{margin-top:12px;padding-top:12px;border-top:1px solid rgba(0,0,0,.08);color:var(--ink);font-size:14px}
.sol .sl{font-weight:700;font-size:12.5px;color:var(--mute);margin-bottom:6px}
.sol p{margin:0 0 7px}
.result{padding:26px 20px 34px;display:none;scroll-margin-top:132px}
.result.show{display:block}
.score{text-align:center;padding:18px 0 14px}
.score .n{font-size:46px;font-weight:800;color:var(--deep);line-height:1}
.score .l{font-size:13px;color:var(--mute);margin-top:6px}
.rsec{margin-top:20px}
.rsec .rh{font-size:12px;font-weight:800;color:var(--deep);letter-spacing:.04em;margin-bottom:2px}
.rlist{border-top:1px solid var(--line)}
.ri{display:flex;justify-content:space-between;gap:12px;padding:11px 2px;
 border-bottom:1px solid var(--line);font-size:14px}
.ri span:first-child{color:var(--mute);flex:1}
.ri .o{color:var(--ok);font-weight:700}.ri .x{color:var(--no);font-weight:700}
.next{margin-top:22px;background:var(--tint);border-radius:12px;padding:16px 18px;font-size:14px}
.next b{display:block;color:var(--deep);font-size:14.5px;margin-bottom:7px}
.next .nl{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.next .nl em{font-style:normal;color:var(--deep);font-weight:700;font-size:13px;white-space:nowrap}
.next .nl em.done{color:var(--ok)}
.next .nl em.zero{color:var(--no)}
.next .nn{margin-top:10px;padding-top:10px;border-top:1px solid rgba(192,82,78,.22);color:var(--deep);font-size:13px;font-weight:700}
details.dev{border-top:10px solid #F1F1F1;padding:18px 20px;background:#FAFAFA}
details.dev summary{font-size:13px;font-weight:700;color:var(--mute);cursor:pointer}
pre{background:#2E2E2E;color:#E8E8E8;padding:14px;border-radius:10px;overflow-x:auto;
 font-size:11.5px;line-height:1.6;font-family:ui-monospace,Menlo,Consolas,monospace}
.flag{margin-top:12px;text-align:right}
.flag .fl{font-size:12px;color:#BDBDBD;text-decoration:underline;cursor:pointer;
 background:none;border:none;padding:2px 0}
.flag textarea{width:100%;font:inherit;font-size:14.5px;padding:11px 12px;line-height:1.5;
 border:1.5px solid var(--line);border-radius:10px;margin-top:8px;resize:vertical;
 color:var(--ink);background:#fff;text-align:left}
.flag textarea:focus{outline:none;border-color:var(--key)}
.flag .sm{padding:9px 16px;font-size:13.5px;margin-top:7px;border-radius:9px;
 background:var(--ink);color:#fff;font-weight:700}
.flag .sent{font-size:12.5px;color:var(--ok);font-weight:700}
.foot{text-align:center;padding:22px;color:#B5B5B5;font-size:11.5px}
/* 제출 상태 바 (0907) — 학생이 '냈다'고 믿는 것과 서버에 남은 것이 어긋나던 사고.
   전송 성공·실패·남은 문항을 화면 아래에 항상 띄운다. */
.sbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;
 gap:10px;padding:11px 16px;font-size:13.5px;font-weight:700;line-height:1.45;
 background:#2E2E2E;color:#fff;box-shadow:0 -2px 10px rgba(0,0,0,.14)}
.sbar.ok{background:var(--ok)}
.sbar.no{background:var(--no)}
.sbar .st{flex:1}
.sbar button{padding:8px 14px;font:inherit;font-size:13px;border:none;border-radius:9px;
 background:#fff;color:var(--ink);font-weight:800;cursor:pointer;white-space:nowrap}
.card{margin:2px 20px 6px;padding:18px 18px 16px;background:var(--tint);border-radius:14px}
.card .cl{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--deep)}
.card .ct{font-size:17.5px;font-weight:800;margin:4px 0 12px;color:var(--ink);letter-spacing:-.01em}
.card h4{margin:15px 0 5px;font-size:14px;font-weight:800;color:var(--deep)}
.card h4:first-of-type{margin-top:0}
.card p{margin:0 0 6px;font-size:14.5px;line-height:1.7}
.card .eq{margin:10px 0;text-align:center;font-size:16.5px;overflow-x:auto}
.card .key{margin-top:13px;padding:12px 14px;background:#fff;border-radius:10px;
 font-size:14px;font-weight:700;color:var(--deep);line-height:1.6}
.ov{border-top:1.15px solid currentColor;padding-top:1px;margin:0 .06em;
 font-family:'Cambria Math','Times New Roman',Georgia,serif;font-style:normal;white-space:nowrap}
.ov+sup{font-style:normal;font-family:'Cambria Math','Times New Roman',Georgia,serif}
.card .fig{margin:12px 0 14px;text-align:center;line-height:0}
.card .fig svg{max-width:100%;height:auto;display:inline-block}
.card .fig .cap{display:block;line-height:1.5;margin-top:5px;font-size:12px;color:var(--mute)}
.card .cwarn{margin-top:9px;padding:11px 14px;background:var(--warnbg);color:var(--warn);
 border-radius:10px;font-size:13.5px;font-weight:700;line-height:1.6}
/* (0911) 되짚기(사후평가) — 풀지 않는다. 내 답·정답 한 줄 + 상태·원인 두 묶음 */
.pe-meta{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 2px;font-size:13.5px;color:var(--mute)}
.pe-meta b{color:var(--ink);font-weight:700}
.pe-meta .no{color:var(--no)}
.pe-meta .yes{color:var(--ok)}
.pe .choices{gap:6px}
.pe .ch{padding:10px 13px;font-size:14px}
.pe .ch.sel:disabled{border-color:var(--key);background:var(--tint)}
/* (0913 유강) 문제 자세히보기 — 어떤 문제였는지 기억 안 나는 애들이 있다. 기본은 접힘(8문항이면 페이지가 길다)
   (0926) <details>/<summary> 를 버리고 버튼+클래스로 — 일부 폰 브라우저에서 summary 탭이 안 먹힌다는 신고. 버튼은 어디서나 먹는다 */
.peek{margin:8px 0 2px}
.peek>.pk{display:inline-flex;align-items:center;gap:5px;cursor:pointer;background:#fff;
 font-size:13px;font-weight:700;font-family:inherit;line-height:1.3;color:var(--key);border:1px solid var(--line);border-radius:9px;
 padding:7px 12px;user-select:none;-webkit-appearance:none;appearance:none}
.peek>.pk::before{content:'＋';font-weight:400}
.peek.open>.pk::before{content:'－'}
.peek>.stem{display:none;margin-top:9px;padding:11px 13px;background:var(--soft);border-radius:10px}
.peek.open>.stem{display:block}
math{font-family:'Cambria Math','STIX Two Math','Latin Modern Math','Times New Roman',serif;font-size:1.06em}
.disp math{font-size:1.18em}
.stem math,.ch math,.sk math,.sol math{vertical-align:-0.1em}

.tw{padding:0 16px 90px;box-sizing:border-box}
.bub,.nx,.sum,.prob{scroll-margin-top:150px}
.prob{background:var(--card,#fff);border:1px solid var(--line,#e5e7eb);border-radius:14px;padding:14px 14px 10px;margin:14px 0}
.prob .ph{font-size:12px;color:#6b7280;margin-bottom:6px;font-weight:600}
.prob .stem{font-size:15px;line-height:1.7}
.prob .fig img{max-width:100%;height:auto}
.prob.fold .stem{max-height:5.2em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent)}
.prob .tog{font-size:12px;color:#6b7280;background:none;border:0;padding:4px 0;cursor:pointer}
.thread{margin-top:6px}
.bub{border-radius:14px;padding:12px 14px;margin:10px 0;line-height:1.65;font-size:15px;animation:up .25s ease}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bub.q{background:#fff;border:1px solid #e5e7eb}
.bub.q .lab{font-size:11px;font-weight:700;letter-spacing:.04em;color:#b45309;margin-bottom:4px}
.bub.q .lab.sub{color:#2563eb}
.bub.q .lab.h{color:#7c3aed}
.bub.say{background:#f3f4f6;border-left:3px solid #9ca3af}
.bub.say.ok{background:#ecfdf5;border-left-color:#10b981}
.bub.say.no{background:#fff7ed;border-left-color:#f97316}
.bub.say.sol{background:#eff6ff;border-left-color:#3b82f6}
.opts{display:grid;gap:8px;margin-top:10px}
.op{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid #e5e7eb;background:#fff;border-radius:12px;padding:11px 12px;font:inherit;font-size:15px;line-height:1.5;color:inherit;cursor:pointer}
.op b{flex:none;color:#9ca3af;font-weight:600}
.op:active{background:#f9fafb}
.op.pick{border-color:#111827;background:#f9fafb}
.op.right{border-color:#10b981;background:#ecfdf5}
.op.wrong{border-color:#f97316;background:#fff7ed}
.op.lock{opacity:.38;pointer-events:none;text-decoration:line-through}
.opts.done .op{pointer-events:none}
.opts.done .op:not(.pick):not(.right){opacity:.45}
.nx.cf{margin-top:12px}.nx.cf:disabled{background:#d1d5db;cursor:default}
.nx{display:block;width:100%;margin:12px 0 4px;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:700;background:#111827;color:#fff;cursor:pointer}
.sum{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin:14px 0}
.sum h3{margin:0 0 8px;font-size:15px}
.sum .row{display:flex;justify-content:space-between;padding:6px 0;border-top:1px dashed #e5e7eb;font-size:14px}
.sum .row:first-of-type{border-top:0}
.mk{font-weight:800}.mk.o{color:#059669}.mk.t{color:#d97706}.mk.x{color:#dc2626}.mk.s{color:#9ca3af}
.sum .weak{margin-top:10px;font-size:14px;background:#fff7ed;border-radius:10px;padding:10px}
.dots{display:flex;gap:6px;margin:10px 0 0}
.dots i{flex:1;height:5px;border-radius:3px;background:#e5e7eb}
.dots i.cur{background:#111827}.dots i.o{background:#10b981}.dots i.t{background:#f59e0b}.dots i.x{background:#ef4444}
.stem math,.op math,.bub math{vertical-align:-0.1em}
</style></head><body><div class="wrap tw"><header><div class="brand">수학은유강 · TARGET TRAINING</div><h1>진덕고 프린트 해부 · 원의 방정식</h1><div class="meta">원본 문제를 다시 푸는 게 아니다 · 고른 뒤 [이걸로 할게]를 누르면 반응하고, 답에 따라 다음 질문이 바뀐다 · 8문항</div></header><div id="prob" class="prob"></div><div id="thread" class="thread"></div></div><script>const META={"id": "tree-진덕고21-진덕고22-진덕고23-진덕고24-진덕고25-진덕고26-진덕고27-진덕고28", "제목": "진덕고 프린트 해부 · 원의 방정식"};const STEPNAME=["무엇을 묻나", "어디서 쓰이나", "조건의 역할", "조건을 바꾸면", "함정", "같은 개념"];const PROBS=[{"id": "진덕고 #2-1", "단원": "원의 방정식", "발문": "<div class=\"print\"><p class=\"first\">원 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mi>k<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mrow><mn>2<\/mn><\/mrow><\/msup><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>y<\/mi><mo>&#x02212;<\/mo><mn>2<\/mn><mi>k<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mrow><mn>2<\/mn><\/mrow><\/msup><mo>&#x0003D;<\/mo><mn>9<\/mn><\/mrow><\/math>가 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>6<\/mn><\/mrow><\/math>과 서로 다른 두 점에서 만나고, 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>9<\/mn><\/mrow><\/math>와 만나지 않도록 하는 모든 정수 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><\/mrow><\/math>의 값의 합을 구하시오.<\/p><\/div>", "M": [{"질문": "이 문제가 결국 묻는 핵심은?", "선지": ["중심과 각 직선 사이 거리를 반지름 3 과 비교해 k 의 범위를 정하는 것", "두 평행선 사이의 거리를 원의 지름과 비교하는 것", "원의 중심이 두 직선 사이에 놓이는 k 를 찾는 것", "원이 두 직선에 모두 접하도록 하는 k 를 찾는 것", "중심의 자취 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><\/mrow><\/math> 와 두 직선의 교점을 구하는 것"], "말": ["맞다. 몇 점에서 만나는지는 중심-직선 거리와 반지름의 대소로 정한다.", "두 직선이 평행이라 그 사이 거리가 눈에 띈다. 근데 조건은 각 직선과 원이 따로 어떻게 만나는지다.", "중심이 두 직선 사이에 있어도 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>9<\/mn><\/mrow><\/math> 와 만날 수 있다. 거리를 따져야 한다.", "조건은 '두 점에서 만난다', '안 만난다'다. 접하는 건 그 경계일 뿐이다.", "중심이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><\/mrow><\/math> 위를 움직이는 건 맞다. 근데 교점이 아니라 거리가 문제다."], "풀이": "원과 직선이 몇 점에서 만나는지는 중심에서 직선까지 거리 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><\/mrow><\/math> 와 반지름 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><\/mrow><\/math> 로 정한다. 두 점이면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mo>&#x0003C;<\/mo><mi>r<\/mi><\/mrow><\/math>, 안 만나면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mo>&#x0003E;<\/mo><mi>r<\/mi><\/mrow><\/math> 이다. 두 직선이 평행하다고 지름과 직선 사이 거리를 비교하는 문제가 아니다. 접하는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><\/mrow><\/math> 를 찾는 것도 아니다.", "보조": {"질문": "중심과 직선 사이 거리 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><\/mrow><\/math>, 반지름 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><\/mrow><\/math> 일 때 원과 직선이 두 점에서 만날 조건은?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mo>&#x0003C;<\/mo><mi>r<\/mi><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mo>&#x0003E;<\/mo><mi>r<\/mi><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mo>&#x0003D;<\/mo><mi>r<\/mi><\/mrow><\/math>"], "말": ["맞다. 안 만나는 건 반대쪽 부등호다. 두 직선에 각각 이걸 쓰면 된다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mo>&#x0003E;<\/mo><mi>r<\/mi><\/mrow><\/math> 이면 원이 직선에 닿지 않는다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d<\/mi><mo>&#x0003D;<\/mo><mi>r<\/mi><\/mrow><\/math> 이면 접한다. 한 점이다."]}}, {"질문": "중심 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>k<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>2<\/mn><mi>k<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 를 쓴 뒤 답을 결정짓는 단계는?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mn>9<\/mn><mo>&#x02212;<\/mo><mi>k<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><mrow><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/mfrac><\/mstyle><mo>&#x0003E;<\/mo><mn>3<\/mn><\/mrow><\/math> 의 두 범위 중 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><mo>&#x0003C;<\/mo><mn>9<\/mn><mo>&#x02212;<\/mo><mn>3<\/mn><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/math> 쪽만 첫 범위와 겹친다", "중심 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>k<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>2<\/mn><mi>k<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 를 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>6<\/mn><\/mrow><\/math> 에 대입해 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><\/mrow><\/math> 를 구한다", "두 번째 조건을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mn>9<\/mn><mo>&#x02212;<\/mo><mi>k<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><mrow><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/mfrac><\/mstyle><mo>&#x0003C;<\/mo><mn>3<\/mn><\/mrow><\/math> 으로 세운다", "첫 조건을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mn>6<\/mn><mo>&#x02212;<\/mo><mi>k<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><mrow><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/mfrac><\/mstyle><mo>&#x02264;<\/mo><mn>3<\/mn><\/mrow><\/math> 으로 등호까지 넣는다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mi>k<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>y<\/mi><mo>&#x02212;<\/mo><mn>2<\/mn><mi>k<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>9<\/mn><\/mrow><\/math> 를 전개해 일반형으로 바꾼다"], "말": ["맞다. 두 갈래 중 첫 범위와 겹치는 쪽만 남아 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>3<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>4<\/mn><\/mrow><\/math> 가 된다.", "중심이 직선 위에 오는 건 한 경우일 뿐이다. 범위를 구해야 한다.", "'만나지 않는다'를 식으로 옮길 때 부등호 방향을 다시 보자.", "'서로 다른 두 점'이면 접하는 경우는 빠져야 한다.", "전개는 준비 단계다. 일반형으로 바꿔도 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><\/mrow><\/math> 는 안 정해진다."], "풀이": "첫 조건은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>6<\/mn><mo>&#x02212;<\/mo><mn>3<\/mn><msqrt><mn>2<\/mn><\/msqrt><mo>&#x0003C;<\/mo><mi>k<\/mi><mo>&#x0003C;<\/mo><mn>6<\/mn><mo>&#x0002B;<\/mo><mn>3<\/mn><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/math>, 둘째 조건은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><mo>&#x0003C;<\/mo><mn>9<\/mn><mo>&#x02212;<\/mo><mn>3<\/mn><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/math> 또는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><mo>&#x0003E;<\/mo><mn>9<\/mn><mo>&#x0002B;<\/mo><mn>3<\/mn><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/math> 이다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>9<\/mn><mo>&#x0002B;<\/mo><mn>3<\/mn><msqrt><mn>2<\/mn><\/msqrt><mo>&#x02248;<\/mo><mn>13.2<\/mn><\/mrow><\/math> 는 첫 범위 밖이라 겹치는 건 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><mo>&#x0003C;<\/mo><mn>9<\/mn><mo>&#x02212;<\/mo><mn>3<\/mn><msqrt><mn>2<\/mn><\/msqrt><mo>&#x02248;<\/mo><mn>4.76<\/mn><\/mrow><\/math> 쪽뿐이다. 그래서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mn>4<\/mn><\/mrow><\/math> 다. 둘째 조건을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0003C;<\/mo><mn>3<\/mn><\/mrow><\/math> 으로 세우면 '만난다'를 푼 것이다.", "보조": {"질문": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mn>9<\/mn><mo>&#x02212;<\/mo><mi>k<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><mrow><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/mfrac><\/mstyle><mo>&#x0003E;<\/mo><mn>3<\/mn><\/mrow><\/math> 을 풀면?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><mo>&#x0003C;<\/mo><mn>9<\/mn><mo>&#x02212;<\/mo><mn>3<\/mn><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/math> 또는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><mo>&#x0003E;<\/mo><mn>9<\/mn><mo>&#x0002B;<\/mo><mn>3<\/mn><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>9<\/mn><mo>&#x02212;<\/mo><mn>3<\/mn><msqrt><mn>2<\/mn><\/msqrt><mo>&#x0003C;<\/mo><mi>k<\/mi><mo>&#x0003C;<\/mo><mn>9<\/mn><mo>&#x0002B;<\/mo><mn>3<\/mn><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><mo>&#x0003E;<\/mo><mn>9<\/mn><mo>&#x02212;<\/mo><mn>3<\/mn><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/math>"], "말": ["맞다. 두 갈래다. 이 중 첫 범위 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>6<\/mn><mo>&#x02212;<\/mo><mn>3<\/mn><msqrt><mn>2<\/mn><\/msqrt><mo>&#x0003C;<\/mo><mi>k<\/mi><mo>&#x0003C;<\/mo><mn>6<\/mn><mo>&#x0002B;<\/mo><mn>3<\/mn><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/math> 와 겹치는 쪽은?", "그건 '작다'일 때의 범위다. 절댓값이 '크다'면 바깥쪽이다.", "절댓값이 크다는 건 양쪽 바깥이다. 한쪽만이 아니다."]}}, {"질문": "발문의 '모든 정수 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><\/mrow><\/math>' 에서 '정수' 는 풀이에서 어떤 역할을 하나?", "선지": ["범위 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>6<\/mn><mo>&#x02212;<\/mo><mn>3<\/mn><msqrt><mn>2<\/mn><\/msqrt><mo>&#x0003C;<\/mo><mi>k<\/mi><mo>&#x0003C;<\/mo><mn>9<\/mn><mo>&#x02212;<\/mo><mn>3<\/mn><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/math> 에서 더할 값을 셋으로 끊는다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/math> 를 어림하지 않고도 답을 구하게 해 준다", "두 갈래 중 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><mo>&#x0003E;<\/mo><mn>9<\/mn><mo>&#x0002B;<\/mo><mn>3<\/mn><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/math> 쪽을 버리게 한다", "중심 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>k<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>2<\/mn><mi>k<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 가 제1사분면에 오게 한다", "답에는 영향이 없다 — 범위 안의 수를 다 더해도 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>9<\/mn><\/mrow><\/math> 다"], "말": ["맞다. 범위 안의 실수는 무수히 많다. '정수'가 셋만 남겨 합을 만든다.", "오히려 끝값 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>6<\/mn><mo>&#x02212;<\/mo><mn>3<\/mn><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/math>, <math xmlns=\"http: msup><mi>r<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math> 에 접하고 기울기가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m<\/mi><\/mrow><\/math> 인 직선은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>m<\/mi><mi>x<\/mi><mi>&#x000B1;<\/mi><mi>r<\/mi><msqrt><mrow><msup><mi>m<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mn>1<\/mn><\/mrow><\/msqrt><\/mrow><\/math> 이다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><mo>&#x0003D;<\/mo><msqrt><mn>5<\/mn><\/msqrt><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math> 면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><mi>&#x000B1;<\/mi><mn>5<\/mn><\/mrow><\/math>."]}}, {"id": "진덕고 #2-3", "단원": "원의 방정식", "발문": "<div class=\"print\"><p class=\"first\">원 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><mo>&#x0002B;<\/mo><mn>6<\/mn><mi>x<\/mi><mo>&#x02212;<\/mo><mn>8<\/mn><mi>y<\/mi><mo>&#x0002B;<\/mo><mn>19<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 위의 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>에 대하여 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><msup><mi>a<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><mo>&#x0002B;<\/mo><msup><mi>b<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><\/mrow><\/msqrt><\/mrow><\/math>의 최댓값과 최솟값을 각각 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>M<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>m<\/mi><\/mrow><\/math>이라 할 때, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>M<\/mi><mi>m<\/mi><\/mrow><\/math>의 값을 구하시오.<\/p><\/div>", "M": [{"질문": "이 문제가 결국 묻는 핵심은?", "선지": ["원점과 원 위의 점 사이 거리의 최대·최소를 중심을 거쳐 구하는 것", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0002B;<\/mo><mi>b<\/mi><\/mrow><\/math> 의 최댓값을 직선이 원에 접할 때로 구하는 것", "원 위의 점의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>좌표, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>좌표가 가장 클 때를 각각 구하는 것", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mi>b<\/mi><mi>a<\/mi><\/mfrac><\/mstyle><\/mrow><\/math> 를 원점을 지나는 직선의 기울기로 보는 것", "점 P 에서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>축까지 거리의 합을 구하는 것"], "말": ["맞다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>b<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msqrt><\/mrow><\/math> 를 원점까지 거리로 읽는 게 이 문제의 출발점이다.", "원 위의 점의 최대·최소라 접선이 떠올랐구나. 근데 구하는 식이 정말 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0002B;<\/mo><mi>b<\/mi><\/mrow><\/math> 인지 다시 보자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><\/mrow><\/math> 를 따로 키우면 될 것 같지만, 둘이 동시에 가장 커지는 점은 없다. 식 전체가 뜻하는 게 뭘까?", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mi>b<\/mi><mi>a<\/mi><\/mfrac><\/mstyle><\/mrow><\/math> 는 기울기로 읽는 식이다. 이 문제의 식엔 나눗셈이 없다.", "축까지 거리의 합은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>a<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi>b<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 다. 이 식은 제곱해서 더한 뒤 루트를 씌운 꼴이다."], "풀이": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>b<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msqrt><\/mrow><\/math> 는 원점에서 P 까지의 거리다. 원 밖의 점에서 원 위 점까지 거리는 중심을 지나는 직선 위에서 최대·최소가 된다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0002B;<\/mo><mi>b<\/mi><\/mrow><\/math> 의 최대는 접선을 쓰는 다른 문제다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mi>b<\/mi><mi>a<\/mi><\/mfrac><\/mstyle><\/mrow><\/math> 는 원점을 지나는 직선의 기울기로 읽는 또 다른 문제다.", "보조": {"질문": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>b<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msqrt><\/mrow><\/math> 는 어떤 두 점 사이의 거리인가?", "선지": ["원점과 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>", "점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 와 원의 중심", "점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 와 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축"], "말": ["맞다. 그러면 문제는 '원 위의 점이 원점에서 얼마나 멀고 가까운가'가 된다.", "중심까지 거리라면 식에 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>3<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><\/mrow><\/math> 가 들어가야 한다. 이 식엔 없다.", "점과 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축 사이 거리는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>b<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 하나다."]}}, {"질문": "중심 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">C<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>4<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mn>5<\/mn><\/mrow><\/math> 를 구한 뒤 답을 정하는 단계는?", "선지": ["P 가 직선 OC 위에 올 때 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">P<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mn>5<\/mn><mi>&#x000B1;<\/mi><msqrt><mn>6<\/mn><\/msqrt><\/mrow><\/math> 이 된다", "완전제곱식으로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>3<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>y<\/mi><mo>&#x02212;<\/mo><mn>4<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>6<\/mn><\/mrow><\/math> 을 만든다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>b<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math> 의 최솟값을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 일 때로 잡는다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>M<\/mi><mo>&#x0003D;<\/mo><mn>5<\/mn><mo>&#x0002B;<\/mo><mn>6<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m<\/mi><mo>&#x0003D;<\/mo><mn>5<\/mn><mo>&#x02212;<\/mo><mn>6<\/mn><\/mrow><\/math> 으로 반지름 자리에 6 을 넣는다", "원점에서 그은 접선의 접점에서 거리가 최소가 된다"], "말": ["맞다. 원점과 중심을 잇는 직선 위에서 가장 먼 점과 가장 가까운 점이 나온다.", "맞는 식이지만 중심·반지름을 찾는 준비 단계다. 아직 최대·최소는 안 정해졌다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 인 점이 이 원 위에 있긴 할까? 거리가 가장 짧은 점이 어느 방향에 있을지 보자.", "6 이 어디서 왔는지 보자. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>3<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>y<\/mi><mo>&#x02212;<\/mo><mn>4<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>6<\/mn><\/mrow><\/math> 의 우변이 반지름 그 자체일까?", "접선은 원점에서 원을 스치는 방향이다. 그 접점이 원점에 가장 가까운 점일까?"], "풀이": "가장 먼 점과 가장 가까운 점은 직선 OC 와 원의 두 교점이다. 그래서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>M<\/mi><mo>&#x0003D;<\/mo><mn>5<\/mn><mo>&#x0002B;<\/mo><msqrt><mn>6<\/mn><\/msqrt><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m<\/mi><mo>&#x0003D;<\/mo><mn>5<\/mn><mo>&#x02212;<\/mo><msqrt><mn>6<\/mn><\/msqrt><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>M<\/mi><mi>m<\/mi><mo>&#x0003D;<\/mo><mn>19<\/mn><\/mrow><\/math> 다. 완전제곱식은 맞지만 준비 단계다. 6 은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>r<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math> 이라 반지름 자리에 넣으면 안 된다.", "보조": {"질문": "원 밖의 점 O 에서 원 위의 점까지 거리가 가장 짧은 점은?", "선지": ["O 와 중심을 잇는 선분이 원과 만나는 점", "O 에서 원에 그은 접선의 접점", "원 위에서 가장 아래에 있는 점"], "말": ["맞다. 가장 먼 점도 같은 직선 위, 반대쪽에 있다.", "접점까지 거리는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><msup><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><msup><mi>r<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msqrt><\/mrow><\/math> 라 그보다 가까운 점이 있다.", "낮은 곳에 있다고 O 에 가까운 건 아니다. O 의 위치를 기준으로 봐야 한다."]}}, {"질문": "풀이에서 '원점과 중심 사이 거리 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>5<\/mn><\/mrow><\/math> 가 반지름 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mn>6<\/mn><\/msqrt><\/mrow><\/math> 보다 크다'를 확인한다. 이 판단은 어디에 쓰이나?", "선지": ["원점이 원 밖에 있어 최솟값을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>5<\/mn><mo>&#x02212;<\/mo><msqrt><mn>6<\/mn><\/msqrt><\/mrow><\/math> 으로 쓸 수 있다", "주어진 방정식이 실제로 원을 나타냄을 보인다", "최댓값을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>5<\/mn><mo>&#x0002B;<\/mo><msqrt><mn>6<\/mn><\/msqrt><\/mrow><\/math> 으로 쓸 수 있게 해 준다", "P 가 직선 OC 위에 올 수 있음을 보장한다", "답에는 영향이 없다 — 검산용일 뿐이다"], "말": ["맞다. 원점이 원 밖이어야 '중심 거리 − 반지름'이 그대로 최솟값이 된다.", "원이 되는지는 우변 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>6<\/mn><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math> 이 정한다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>5<\/mn><\/mrow><\/math> 와 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mn>6<\/mn><\/msqrt><\/mrow><\/math> 을 비교하는 건 다른 일이다.", "최댓값 쪽은 원점이 원 안이든 밖이든 같은 꼴이다. 그럼 이 비교가 필요한 쪽은 어디일까?", "중심을 지나는 직선은 원과 항상 두 점에서 만난다. 비교 없이도 된다.", "만약 중심 거리가 반지름보다 작다면 '중심 거리 − 반지름'은 음수다. 거리가 음수일 수 있을까?"], "풀이": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>5<\/mn><mo>&#x0003E;<\/mo><msqrt><mn>6<\/mn><\/msqrt><\/mrow><\/math> 이라 원점이 원 밖에 있고, 가장 가까운 점까지 거리가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>5<\/mn><mo>&#x02212;<\/mo><msqrt><mn>6<\/mn><\/msqrt><\/mrow><\/math> 이다. 중심 거리가 반지름보다 작았다면 '중심 거리 − 반지름'은 음수라 거리가 못 되고, 최솟값은 '반지름 − 중심 거리'로 바뀐다. 최댓값은 어느 경우든 '중심 거리 + 반지름'이라 이 판단과 상관없다. 원이 되는지는 우변 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>6<\/mn><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math> 이 따로 보장한다.", "보조": {"질문": "원 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math> 위의 점과 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 사이 거리의 최솟값은?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><\/mrow><\/math>"], "말": ["맞다. 점이 원 안이면 최솟값은 '반지름 − 거리'다. 원 밖일 때와 꼴이 다르다.", "거리는 음수가 될 수 없다. '거리 − 반지름'을 그대로 쓴 결과다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><\/mrow><\/math> 은 반대쪽, 가장 먼 점까지의 거리다."]}}, {"질문": "중심 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>4<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 는 그대로 두고 원이 원점을 지나도록 상수항을 바꾸면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>M<\/mi><mi>m<\/mi><\/mrow><\/math> 은?", "선지": ["0 — P 가 원점에 올 수 있어 최솟값 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 이다", "19 — 중심이 그대로라 곱도 그대로다", "25 — <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><mn>2<\/mn><\/msup><\/mrow><\/math> 만 남는다", "구할 수 없다 — 원점이 원 위라 최솟값이 없다", "10 — <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>M<\/mi><mo>&#x0003D;<\/mo><mn>10<\/mn><\/mrow><\/math> 만 남고 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m<\/mi><\/mrow><\/math> 은 따지지 않는다"], "말": ["맞다. 원점이 원 위에 올라오면 P 가 원점에 닿을 수 있어 최솟값이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math> 이다.", "중심이 같으니 그대로라고 본 거다. 그런데 원점을 지나도록 바꾸면 반지름이 달라진다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><mn>2<\/mn><\/msup><\/mrow><\/math> 만 보고 반지름을 잊었다. 원점을 지나면 반지름이 얼마가 될까?", "최솟값이 '없는' 건 거리가 계속 줄기만 하고 닿지 못할 때다. P 가 원점에 닿을 수 있는지 보자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>M<\/mi><\/mrow><\/math> 만 구하고 멈췄다. 곱하려면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m<\/mi><\/mrow><\/math> 도 있어야 한다."], "풀이": "원점을 지나면 반지름이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mn>5<\/mn><\/mrow><\/math> 가 되고, P 가 원점일 때 거리 0 이다. 최솟값은 0 으로 있다. 그래서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>M<\/mi><mi>m<\/mi><mo>&#x0003D;<\/mo><mn>10<\/mn><mo>&#x000D7;<\/mo><mn>0<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 이다. 중심이 같아도 반지름이 바뀌면 곱은 바뀐다.", "보조": {"질문": "중심이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>4<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 인 원이 원점을 지나면 반지름은?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>5<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mn>6<\/mn><\/msqrt><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>25<\/mn><\/mrow><\/math>"], "말": ["맞다. 반지름이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><\/mrow><\/math> 와 같아졌다. 그럼 원점과 원 위의 점 사이 거리는 어디까지 줄어들까?", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mn>6<\/mn><\/msqrt><\/mrow><\/math> 은 상수항이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>19<\/mn><\/mrow><\/math> 일 때다. 원점을 지나도록 바꾸면 반지름도 바뀐다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>25<\/mn><\/mrow><\/math> 는 반지름의 제곱이다."]}}, {"질문": "어떤 학생이 답을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>11<\/mn><\/mrow><\/math> 로 적었다. 원인은?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>3<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>y<\/mi><mo>&#x02212;<\/mo><mn>4<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>6<\/mn><\/mrow><\/math> 의 6 을 반지름으로 썼다", "최솟값을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mn>6<\/mn><\/msqrt><mo>&#x02212;<\/mo><mn>5<\/mn><\/mrow><\/math> 로 잡았다", "중심을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mn>4<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 로 읽었다", "거리 대신 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>b<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math> 의 최대·최소를 곱했다", "원점에서 그은 접선의 길이를 제곱했다"], "말": ["맞다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>r<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>6<\/mn><\/mrow><\/math> 을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><\/mrow><\/math> 로 써서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>5<\/mn><mo>&#x0002B;<\/mo><mn>6<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>5<\/mn><mo>&#x02212;<\/mo><mn>6<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>11<\/mn><\/mrow><\/math> 이 나왔다.", "그 실수라면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>5<\/mn><mo>&#x0002B;<\/mo><msqrt><mn>6<\/mn><\/msqrt><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><msqrt><mn>6<\/mn><\/msqrt><mo>&#x02212;<\/mo><mn>5<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>19<\/mn><\/mrow><\/math> 가 나온다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>11<\/mn><\/mrow><\/math> 은 다른 데서 왔다.", "중심 부호를 바꿔도 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><\/mrow><\/math> 는 그대로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>5<\/mn><\/mrow><\/math> 다. 답이 바뀌지 않는다.", "제곱끼리 곱하면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>361<\/mn><\/mrow><\/math> 이다. 음수는 나올 수 없다.", "접선 길이의 제곱은 양수다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>11<\/mn><\/mrow><\/math> 같은 음수는 안 나온다."], "풀이": "반지름을 6 으로 쓰면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>5<\/mn><mo>&#x0002B;<\/mo><mn>6<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>5<\/mn><mo>&#x02212;<\/mo><mn>6<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>11<\/mn><\/mrow><\/math> 이다. 최솟값을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mn>6<\/mn><\/msqrt><mo>&#x02212;<\/mo><mn>5<\/mn><\/mrow><\/math> 로 잡으면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>19<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>b<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math> 끼리 곱하면 361 이다. 접선 길이의 제곱은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>25<\/mn><mo>&#x02212;<\/mo><mn>6<\/mn><mo>&#x0003D;<\/mo><mn>19<\/mn><\/mrow><\/math> 로 오히려 답과 같다. 중심 부호를 바꿔도 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mn>5<\/mn><\/mrow><\/math> 라 19 다.", "보조": {"질문": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>3<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>y<\/mi><mo>&#x02212;<\/mo><mn>4<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>6<\/mn><\/mrow><\/math> 인 원의 반지름은?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mn>6<\/mn><\/msqrt><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>6<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>36<\/mn><\/mrow><\/math>"], "말": ["맞다. 우변은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>r<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math> 이다. 이걸 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><\/mrow><\/math> 로 쓰면 무슨 값이 나올지 계산해 보자.", "우변은 반지름의 제곱이다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>r<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>6<\/mn><\/mrow><\/math> 이다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>36<\/mn><\/mrow><\/math> 은 <math xmlns=\"http://www.w3.org/1998/M \"false\">&#x00029;<\/mo><\/mrow><\/math> 을 지나는 원<br>ㄷ. 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><mi>x<\/mi><mo>&#x02212;<\/mo><mn>4<\/mn><mi>y<\/mi><mo>&#x0002B;<\/mo><mn>5<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 과 두 축에 동시에 접하는 원의 반지름", "선지": ["ㄱ, ㄷ", "ㄱ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "말": ["맞다. ㄱ은 중심 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>r<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>r<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, ㄷ은 중심 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>t<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>&#x000B1;<\/mi><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 에 조건을 붙인다. 둘 다 두 축에 접하는 원이다.", "ㄱ은 잘 봤다. 두 축에 접하는 원이 또 나오는 보기가 있는지 보자.", "ㄱ은 잘 봤다. ㄴ의 원은 두 축과 무슨 관계인지 다시 보자.", "ㄴ의 원이 두 축에 접한다는 말이 있었나? 그리고 ㄱ도 다시 보자.", "셋 다 원의 중심을 찾는 문제다. 그중 '두 축에 접한다' 가 실제로 쓰이는 게 어느 것인지 보자."], "풀이": "ㄱ은 중심 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>r<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>r<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 로 놓고, ㄷ은 중심 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>t<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>&#x000B1;<\/mi><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 에서 직선까지 거리를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 로 놓는다. 둘 다 두 축 접 조건이 핵심이다. ㄴ은 겉은 비슷하지만 수직이등분선 위의 중심을 찾는 문제다.", "보조": {"질문": "점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 을 지나고 두 축에 동시에 접하는 원의 중심은 어떻게 놓나?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>r<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>r<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> (<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>)", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>r<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mi>r<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> (<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>)"], "말": ["맞다. 두 축 접 조건으로 중심을 두는 이 문제와 같은 설정이다. 보기를 다시 보자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 은 원이 지나는 점이지 중심이 아니다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>r<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mi>r<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 은 제4사분면이다. 그 원이 제1사분면의 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 을 지날 수 있을까?"]}}], "H": {"질문": "이 문제, 첫 발은 뭐로 뗄까?", "선지": ["두 축에 접하는 원의 중심을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>t<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>&#x000B1;<\/mi><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, 반지름을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 로 둔다", "주어진 원의 식을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mn>2<\/mn><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>4<\/mn><mi>y<\/mi><mo>&#x02212;<\/mo><mn>12<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 으로 전개한다", "주어진 원과 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>축의 교점부터 구한다", "구하는 원의 중심을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 로 둔다", "구하는 원과 주어진 원이 접한다고 두고 식을 세운다"], "말": ["좋다. 이제 이 중심을 주어진 원의 식에 넣으면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math> 에 대한 식이 두 개 나온다.", "전개는 틀리지 않았지만 구하는 원에 대해선 아무것도 안 정해진다. 먼저 구하는 원을 문자로 두자.", "축과의 교점은 주어진 원 쪽 정보다. 축에 접하는 건 구하는 원이다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 는 주어진 원의 중심이다. 구하는 원의 중심은 그 원 '위'에 있다.", "두 원이 접한다는 말은 발문에 없다. 중심이 원 위에 있다는 것뿐이다."], "힌트": ["'두 축에 동시에 접한다' 를 중심 좌표와 반지름 사이 관계로 바꿔 보자. 중심이 놓일 수 있는 직선이 두 개다.", "중심 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>t<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 이면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>t<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>t<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>17<\/mn><\/mrow><\/math>, 중심 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>t<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 이면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>t<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mi>t<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>17<\/mn><\/mrow><\/math> 이다. 반지름은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 다."]}}, {"id": "진덕고 #2-5", "단원": "원의 방정식", "발문": "<div class=\"print\"><p class=\"first\">원 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><mo>&#x0003D;<\/mo><mn>10<\/mn><\/mrow><\/math> 위의 두 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">A<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>3<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">B<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>에서의 두 접선이 만나는 점을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">P<\/mi><\/mrow><\/math>라 할 때, 네 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">O<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi mathvariant=\"normal\">A<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi mathvariant=\"normal\">B<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi mathvariant=\"normal\">P<\/mi><\/mrow><\/math>를 꼭짓점으로 하는 사각형의 넓이를 구하시오. (단, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">O<\/mi><\/mrow><\/math>는 원점이다.)<\/p><\/div>", "M": [{"질문": "이 문제가 결국 묻는 핵심은?", "선지": ["원 위의 점에서의 접선 공식과 접선 ⊥ 반지름으로 생기는 직각삼각형", "기울기가 주어진 접선 공식으로 두 접선을 구하는 것", "사각형 OAPB 를 정사각형으로 보는 것", "두 원의 공통현의 길이를 구하는 것", "두 접선이 만나는 점을 원의 중심으로 보는 것"], "말": ["맞다. 접점이 주어졌으니 접선은 공식으로 바로 나오고, 접선 ⊥ 반지름이 직각을 만든다.", "기울기를 알면 그 공식도 쓸 수 있다. 근데 이 문제에서 먼저 주어진 건 기울기일까, 접점일까?", "모양이 반듯해 보여 정사각형으로 본 거다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02220;<\/mo><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/math> 가 정말 직각인지 OA, OB 기울기로 확인해 보자.", "원이 하나뿐이라 공통현이 생길 두 원이 없다.", "두 접선이 만나는 점은 원 밖에 있다. 원의 중심은 이미 원점이다."], "풀이": "A, B 는 원 위의 점이라 접선은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>3<\/mn><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>10<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>10<\/mn><\/mrow><\/math> 으로 바로 나온다. 접선은 접점의 반지름과 수직이라 직각삼각형이 생긴다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02220;<\/mo><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/math> 는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>90<\/mn><mo>&#x02218;<\/mo><\/msup><\/mrow><\/math> 가 아니라 정사각형이 아니다.", "보조": {"질문": "원 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>10<\/mn><\/mrow><\/math> 위의 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>3<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 에서의 접선은?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>3<\/mn><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>10<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>10<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>3<\/mn><mi>y<\/mi><mo>&#x0003D;<\/mo><msqrt><mrow><mn>10<\/mn><\/mrow><\/msqrt><\/mrow><\/math>"], "말": ["맞다. 접점 좌표를 그대로 계수로 쓴다. 이제 이 접선과 반지름 OA 사이 각을 보자.", "계수 자리가 뒤바뀌었다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math> 앞에는 접점의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>좌표가 온다.", "우변은 반지름이 아니라 반지름의 제곱 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>r<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math> 이다."]}}, {"질문": "P 를 구한 뒤 넓이를 결정하는 단계는?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02220;<\/mo><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">P<\/mi><\/mrow><mo>&#x0003D;<\/mo><msup><mn>90<\/mn><mo>&#x02218;<\/mo><\/msup><\/mrow><\/math> 이라 사각형은 직각삼각형 OAP 두 개다", "A 에서의 접선을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>10<\/mn><\/mrow><\/math> 으로 쓴다", "A, B 가 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 에 대해 대칭임을 확인한다", "넓이를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><mo>&#x000D7;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/math> 로 구한다", "접선의 기울기를 반지름 OA 의 기울기 3 과 같게 둔다"], "말": ["맞다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02220;<\/mo><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">P<\/mi><\/mrow><mo>&#x0003D;<\/mo><mo>&#x02220;<\/mo><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">B<\/mi><mi mathvariant=\"normal\">P<\/mi><\/mrow><mo>&#x0003D;<\/mo><msup><mn>90<\/mn><mo>&#x02218;<\/mo><\/msup><\/mrow><\/math> 라 합동인 직각삼각형 두 개로 쪼개진다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>10<\/mn><\/mrow><\/math> 은 B 에서의 접선이다. A 의 좌표를 공식에 그대로 넣어 보자.", "대칭은 맞는 관찰이다. 그런데 대칭만으론 넓이 수치가 안 나온다. 넓이 공식에 쓸 길이와 각을 찾아보자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><mo>&#x000D7;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/math> 는 OA ⊥ OB 일 때나 쓸 만한 식이다. OA, OB 기울기를 곱해 보자.", "접선과 반지름은 같은 방향이 아니다. 둘 사이 각을 떠올려 보자."], "풀이": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02220;<\/mo><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">P<\/mi><\/mrow><mo>&#x0003D;<\/mo><mo>&#x02220;<\/mo><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">B<\/mi><mi mathvariant=\"normal\">P<\/mi><\/mrow><mo>&#x0003D;<\/mo><msup><mn>90<\/mn><mo>&#x02218;<\/mo><\/msup><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/math> 라 두 삼각형은 합동이다. 넓이는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mo>&#x000D7;<\/mo><mstyle displaystyle=\"false\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><mo>&#x000D7;<\/mo><msqrt><mrow><mn>10<\/mn><\/mrow><\/msqrt><mo>&#x000D7;<\/mo><mstyle displaystyle=\"false\" scriptlevel=\"0\"><mfrac><mrow><msqrt><mrow><mn>10<\/mn><\/mrow><\/msqrt><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mstyle><mo>&#x0003D;<\/mo><mn>5<\/mn><\/mrow><\/math> 다. A 에서의 접선은 A 의 좌표를 그대로 계수로 써야 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>3<\/mn><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>10<\/mn><\/mrow><\/math> 이다.", "보조": {"질문": "원의 접선과 접점을 지나는 반지름이 이루는 각은?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>90<\/mn><mo>&#x02218;<\/mo><\/msup><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>45<\/mn><mo>&#x02218;<\/mo><\/msup><\/mrow><\/math>", "접점마다 다르다"], "말": ["맞다. 그럼 사각형 OAPB 안에서 직각이 어디 어디 생기는지 보자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>45<\/mn><mo>&#x02218;<\/mo><\/msup><\/mrow><\/math> 는 정사각형의 대각선 쪽 각이다. 접선과 반지름 사이는 늘 같은 각이다.", "어느 접점에서든 같다. 원의 접선의 기본 성질이다."]}}, {"질문": "두 접점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">A<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>3<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">B<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 이 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 에 대하여 대칭이라는 사실은 풀이에서 어떻게 쓰이나?", "선지": ["P 가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 위에 있어, 접선 하나에 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 를 넣으면 P 가 나온다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02220;<\/mo><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><mo>&#x0003D;<\/mo><msup><mn>90<\/mn><mo>&#x02218;<\/mo><\/msup><\/mrow><\/math> 임을 알려 준다", "두 접선이 서로 수직임을 알려 준다", "P 가 원 위의 점임을 알려 준다", "대칭이 아니면 사각형의 넓이를 구할 수 없다"], "말": ["맞다. 그림 전체가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 에 대칭이라 P 도 그 위에 있다. 연립을 반으로 줄여 준다.", "OA, OB 의 기울기 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>3<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 를 곱해 보자. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math> 이 나오나?", "두 접선의 기울기 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>3<\/mn><\/mfrac><\/mstyle><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>3<\/mn><\/mrow><\/math> 을 곱해 보자. 대칭이라고 수직이 되진 않는다.", "두 접선이 원 위의 점에서 만나면 접선이 하나뿐이다. P 는 원 밖이다.", "대칭이 아니어도 두 접선을 연립하면 P 가 나오고 넓이도 구해진다. 대칭이 해 주는 건 더 가벼운 일이다."], "풀이": "A, B 가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 에 대칭이고 원도 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 에 대칭이라 두 접선도 서로 대칭이고, 그 교점 P 는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 위에 있다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>3<\/mn><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>10<\/mn><\/mrow><\/math> 에 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 를 넣으면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>5<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><\/mrow><\/math>, 즉 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">P<\/mi><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>5<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>5<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/math> 다. OA, OB 기울기의 곱도, 두 접선 기울기의 곱도 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math> 이라 어느 쪽도 수직이 아니다. 대칭이 없어도 두 접선을 연립하면 P 는 구해진다.", "보조": {"질문": "직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 에 대하여 대칭인 두 직선이 한 점에서 만나면, 그 교점은?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 위에 있다", "원점이다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축 위에 있다"], "말": ["맞다. 그럼 A, B 에서의 두 접선도 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 에 대칭인지, P 를 어떻게 빨리 찾을지 보자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math> 과 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><mi>x<\/mi><mo>&#x0002B;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 에 대칭인데 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 에서 만난다.", "교점을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 에 대칭이동해도 자기 자신이어야 한다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축 위의 점이 그대로 남을까?"]}}, {"질문": "A 는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>3<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 그대로, B 를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 대신 원 위의 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mn>3<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 으로 바꾸면?", "선지": ["두 접선이 평행해 P 가 없다 — A, B 가 지름의 양 끝이다", "P 가 원점이 된다 — 두 접선이 원점에서 만난다", "넓이가 5 그대로다 — 반지름이 그대로라서", "P 가 원 위의 점이 된다 — 두 접점이 붙어서", "두 접선이 수직이다 — 사각형이 정사각형이 된다"], "말": ["맞다. A, B 가 지름의 양 끝이면 두 접선은 평행해서 만나지 않는다.", "원점은 원의 중심이다. 접선이 원 안쪽의 중심을 지날 수 있을까?", "반지름만 보고 판단했다. 그런데 P 가 생기기는 하는지 두 접선부터 써 보자.", "원 위의 한 점에서 만나려면 두 접선이 같은 점에서 접해야 한다. 접점은 서로 다르다.", "수직인지는 두 접선 기울기의 곱으로 확인한다. 직접 써서 곱해 보자."], "풀이": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>3<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 과 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mo>&#x02212;<\/mo><mn>3<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 은 원점 대칭이라 지름의 양 끝이다. 접선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>3<\/mn><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>10<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mn>3<\/mn><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>10<\/mn><\/mrow><\/math> 은 평행해서 만나지 않는다. 그래서 P 가 생기지 않는다.", "보조": {"질문": "원 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>10<\/mn><\/mrow><\/math> 위의 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mn>3<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 에서의 접선의 기울기는?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>3<\/mn><\/mfrac><\/mstyle><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>3<\/mn><\/mfrac><\/mstyle><\/mrow><\/math>"], "말": ["맞다. A 에서의 접선 기울기와 비교해 보자. 두 접선이 만나기는 할까?", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><\/mrow><\/math> 은 반지름 쪽 기울기다. 접선은 반지름과 수직이다.", "부호를 다시 보자. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mn>3<\/mn><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>10<\/mn><\/mrow><\/math> 을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math> 에 대해 풀어 보자."]}}, {"질문": "어떤 학생이 넓이를 10 으로 적었다. 원인은?", "선지": ["사각형을 한 변이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><mn>10<\/mn><\/mrow><\/msqrt><\/mrow><\/math> 인 정사각형으로 봤다", "삼각형 OAP 하나의 넓이만 구했다", "접선을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>3<\/mn><mi>y<\/mi><mo>&#x0003D;<\/mo><msqrt><mrow><mn>10<\/mn><\/mrow><\/msqrt><\/mrow><\/math> 으로 써서 P 를 잘못 구했다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"false\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><msup><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">P<\/mi><\/mrow><\/mrow><mn>2<\/mn><\/msup><\/mrow><\/math> 을 넓이로 썼다", "넓이를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><mo>&#x000D7;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/math> 로 구했다"], "말": ["맞다. 한 변 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqr
