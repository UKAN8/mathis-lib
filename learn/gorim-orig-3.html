<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>고림고 프린트 해부 · 도형의 이동</title><style>
:root{--key:#EA9090;--deep:#C0524E;--ink:#333;--mute:#8A8A8A;--tint:#FAE3E1;
 --soft:#F6F6F6;--line:#E6E6E6;--ok:#3E8E6E;--okbg:#E9F4EF;--no:#C0524E;--nobg:#FBEDEC;
 --warn:#B26A00;--warnbg:#FFF3E0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Paperlogy','Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
 background:#EFEFEF;color:var(--ink);font-size:16px;line-height:1.65;padding-bottom:64px}
.wrap{max-width:560px;margin:0 auto;background:#fff;min-height:100vh}
header{padding:22px 20px 16px;background:#2E2E2E;color:#fff;position:sticky;top:0;z-index:20}
.brand{font-size:12px;letter-spacing:.08em;color:var(--key);font-weight:700}
h1{margin:6px 0 2px;font-size:21px;font-weight:800;letter-spacing:-.01em}
.meta{font-size:12.5px;color:#B9B9B9}
.bar{display:flex;gap:5px;margin-top:14px}
.bar i{flex:1;height:4px;border-radius:2px;background:#4A4A4A;transition:background .25s}
.bar i.done{background:var(--key)}
.bar i.wrong{background:#7A4B49}
.guide{margin:0;padding:15px 20px;background:var(--tint);color:var(--deep);font-size:13.5px;line-height:1.6}
.guide b{display:block;font-size:14.5px;margin-bottom:3px}
.part{padding:22px 20px 4px}
.part .pl{font-size:12px;font-weight:800;color:var(--deep);letter-spacing:.04em}
.part .pt{font-size:17px;font-weight:800;margin-top:3px}
.part .pd{font-size:13px;color:var(--mute);margin-top:3px}
.q{padding:20px 20px 24px;border-bottom:10px solid #F1F1F1}
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.qno{font-size:13px;font-weight:800;color:var(--deep)}
.tag{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--tint);color:var(--deep);font-weight:600}
.tag.grey{background:var(--soft);color:var(--mute)}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.pct{background:#EDEDED;color:#6E6E6E}
.stem{font-size:15.5px;margin:0 0 4px}
/* (0908) 학교프린트 원문 조각 — hwpx2html 산출을 그대로 담는다 */
.print{font-size:15px;line-height:1.7}
.print p{margin:0 0 2px}
.print .lead,.print .box{background:var(--soft);border-left:3px solid #555;padding:6px 10px;margin:8px 0}
.print .bogi{border:1px solid #444;padding:12px 10px 6px;margin:12px 2px 8px;position:relative}
.print .bogi .lbl{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:#fff;padding:0 6px;font-weight:700;font-size:13px}
.print .bl{margin:0 0 2px}
.print .fig{text-align:center;margin:8px 0}
.print img{max-width:100%;height:auto}
.print .fl{float:right;margin:0 0 4px 8px;max-width:48%}
.print .fl.left{float:left;margin:0 8px 4px 0}
.print .pcs{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 10px;margin-top:10px;clear:both}
.print .pcs.c1{grid-template-columns:1fr}
.print .pch{display:flex;gap:4px;align-items:baseline}
.print .pcn{color:var(--mute);flex-shrink:0}
.print .tbl{border-collapse:collapse;margin:4px auto;font-size:14px}
.print .tbl td{border:1px solid #444;padding:2px 6px;text-align:center}
.print .tbl.grid td{border:none}
.print .tab{display:inline-block;width:14px}
.print .missing{color:var(--no)}
.disp{margin:14px 0;text-align:center;font-size:17px;overflow-x:auto}
.field{margin-top:16px}
.flabel{font-size:13px;color:var(--mute);margin-bottom:6px;display:block}
.row{display:flex;gap:8px;align-items:stretch}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:17px;padding:13px 14px;
 border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--key)}
input[type=text]:disabled{background:var(--soft);color:var(--mute)}
button{font:inherit;cursor:pointer;border:none}
.btn{padding:13px 20px;border-radius:10px;background:var(--ink);color:#fff;font-weight:700;
 font-size:15px;white-space:nowrap}
.btn:disabled{background:#CFCFCF;cursor:default}
.btn.wide{width:100%;padding:16px;font-size:16px}
.choices{display:grid;gap:8px;margin-top:8px}
.ch{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);
 border-radius:10px;font-size:14.5px;background:#fff;text-align:left;color:var(--ink);line-height:1.5}
.ch b{color:var(--mute);font-weight:700;flex-shrink:0}
.ch.sel{border-color:var(--key);background:var(--tint)}
.ch:disabled{opacity:1}
.ch.ans{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.ch.ans b{color:var(--ok)}
.ch.miss{border-color:var(--no);background:var(--nobg);color:var(--no)}
.ch.idk{border-style:dashed;color:var(--mute);background:var(--soft);font-size:13px;padding:9px 14px}
.ch.idk.sel{border-color:var(--warn);background:var(--warnbg);color:var(--warn)}
.ch.miss b{color:var(--no)}
.ch.dim{opacity:.45}
.steps{margin-top:8px;border-left:2px solid var(--tint);padding-left:14px}
.step{margin-bottom:18px}.step:last-child{margin-bottom:4px}
.sk{font-size:13px;font-weight:700;color:var(--deep);margin-bottom:7px}
.verdict{margin-top:16px;border-radius:12px;padding:14px 16px;font-size:14.5px;display:none}
.verdict.show{display:block}
.verdict.ok{background:var(--okbg);color:var(--ok)}
.verdict.no{background:var(--nobg);color:var(--no)}
.verdict .vt{font-weight:800;font-size:15px;margin-bottom:6px}
.sol{margin-top:12px;padding-top:12px;border-top:1px solid rgba(0,0,0,.08);color:var(--ink);font-size:14px}
.sol .sl{font-weight:700;font-size:12.5px;color:var(--mute);margin-bottom:6px}
.sol p{margin:0 0 7px}
.result{padding:26px 20px 34px;display:none;scroll-margin-top:132px}
.result.show{display:block}
.score{text-align:center;padding:18px 0 14px}
.score .n{font-size:46px;font-weight:800;color:var(--deep);line-height:1}
.score .l{font-size:13px;color:var(--mute);margin-top:6px}
.rsec{margin-top:20px}
.rsec .rh{font-size:12px;font-weight:800;color:var(--deep);letter-spacing:.04em;margin-bottom:2px}
.rlist{border-top:1px solid var(--line)}
.ri{display:flex;justify-content:space-between;gap:12px;padding:11px 2px;
 border-bottom:1px solid var(--line);font-size:14px}
.ri span:first-child{color:var(--mute);flex:1}
.ri .o{color:var(--ok);font-weight:700}.ri .x{color:var(--no);font-weight:700}
.next{margin-top:22px;background:var(--tint);border-radius:12px;padding:16px 18px;font-size:14px}
.next b{display:block;color:var(--deep);font-size:14.5px;margin-bottom:7px}
.next .nl{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.next .nl em{font-style:normal;color:var(--deep);font-weight:700;font-size:13px;white-space:nowrap}
.next .nl em.done{color:var(--ok)}
.next .nl em.zero{color:var(--no)}
.next .nn{margin-top:10px;padding-top:10px;border-top:1px solid rgba(192,82,78,.22);color:var(--deep);font-size:13px;font-weight:700}
details.dev{border-top:10px solid #F1F1F1;padding:18px 20px;background:#FAFAFA}
details.dev summary{font-size:13px;font-weight:700;color:var(--mute);cursor:pointer}
pre{background:#2E2E2E;color:#E8E8E8;padding:14px;border-radius:10px;overflow-x:auto;
 font-size:11.5px;line-height:1.6;font-family:ui-monospace,Menlo,Consolas,monospace}
.flag{margin-top:12px;text-align:right}
.flag .fl{font-size:12px;color:#BDBDBD;text-decoration:underline;cursor:pointer;
 background:none;border:none;padding:2px 0}
.flag textarea{width:100%;font:inherit;font-size:14.5px;padding:11px 12px;line-height:1.5;
 border:1.5px solid var(--line);border-radius:10px;margin-top:8px;resize:vertical;
 color:var(--ink);background:#fff;text-align:left}
.flag textarea:focus{outline:none;border-color:var(--key)}
.flag .sm{padding:9px 16px;font-size:13.5px;margin-top:7px;border-radius:9px;
 background:var(--ink);color:#fff;font-weight:700}
.flag .sent{font-size:12.5px;color:var(--ok);font-weight:700}
.foot{text-align:center;padding:22px;color:#B5B5B5;font-size:11.5px}
/* 제출 상태 바 (0907) — 학생이 '냈다'고 믿는 것과 서버에 남은 것이 어긋나던 사고.
   전송 성공·실패·남은 문항을 화면 아래에 항상 띄운다. */
.sbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;
 gap:10px;padding:11px 16px;font-size:13.5px;font-weight:700;line-height:1.45;
 background:#2E2E2E;color:#fff;box-shadow:0 -2px 10px rgba(0,0,0,.14)}
.sbar.ok{background:var(--ok)}
.sbar.no{background:var(--no)}
.sbar .st{flex:1}
.sbar button{padding:8px 14px;font:inherit;font-size:13px;border:none;border-radius:9px;
 background:#fff;color:var(--ink);font-weight:800;cursor:pointer;white-space:nowrap}
.card{margin:2px 20px 6px;padding:18px 18px 16px;background:var(--tint);border-radius:14px}
.card .cl{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--deep)}
.card .ct{font-size:17.5px;font-weight:800;margin:4px 0 12px;color:var(--ink);letter-spacing:-.01em}
.card h4{margin:15px 0 5px;font-size:14px;font-weight:800;color:var(--deep)}
.card h4:first-of-type{margin-top:0}
.card p{margin:0 0 6px;font-size:14.5px;line-height:1.7}
.card .eq{margin:10px 0;text-align:center;font-size:16.5px;overflow-x:auto}
.card .key{margin-top:13px;padding:12px 14px;background:#fff;border-radius:10px;
 font-size:14px;font-weight:700;color:var(--deep);line-height:1.6}
.ov{border-top:1.15px solid currentColor;padding-top:1px;margin:0 .06em;
 font-family:'Cambria Math','Times New Roman',Georgia,serif;font-style:normal;white-space:nowrap}
.ov+sup{font-style:normal;font-family:'Cambria Math','Times New Roman',Georgia,serif}
.card .fig{margin:12px 0 14px;text-align:center;line-height:0}
.card .fig svg{max-width:100%;height:auto;display:inline-block}
.card .fig .cap{display:block;line-height:1.5;margin-top:5px;font-size:12px;color:var(--mute)}
.card .cwarn{margin-top:9px;padding:11px 14px;background:var(--warnbg);color:var(--warn);
 border-radius:10px;font-size:13.5px;font-weight:700;line-height:1.6}
/* (0911) 되짚기(사후평가) — 풀지 않는다. 내 답·정답 한 줄 + 상태·원인 두 묶음 */
.pe-meta{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 2px;font-size:13.5px;color:var(--mute)}
.pe-meta b{color:var(--ink);font-weight:700}
.pe-meta .no{color:var(--no)}
.pe-meta .yes{color:var(--ok)}
.pe .choices{gap:6px}
.pe .ch{padding:10px 13px;font-size:14px}
.pe .ch.sel:disabled{border-color:var(--key);background:var(--tint)}
/* (0913 유강) 문제 자세히보기 — 어떤 문제였는지 기억 안 나는 애들이 있다. 기본은 접힘(8문항이면 페이지가 길다)
   (0926) <details>/<summary> 를 버리고 버튼+클래스로 — 일부 폰 브라우저에서 summary 탭이 안 먹힌다는 신고. 버튼은 어디서나 먹는다 */
.peek{margin:8px 0 2px}
.peek>.pk{display:inline-flex;align-items:center;gap:5px;cursor:pointer;background:#fff;
 font-size:13px;font-weight:700;font-family:inherit;line-height:1.3;color:var(--key);border:1px solid var(--line);border-radius:9px;
 padding:7px 12px;user-select:none;-webkit-appearance:none;appearance:none}
.peek>.pk::before{content:'＋';font-weight:400}
.peek.open>.pk::before{content:'－'}
.peek>.stem{display:none;margin-top:9px;padding:11px 13px;background:var(--soft);border-radius:10px}
.peek.open>.stem{display:block}
math{font-family:'Cambria Math','STIX Two Math','Latin Modern Math','Times New Roman',serif;font-size:1.06em}
.disp math{font-size:1.18em}
.stem math,.ch math,.sk math,.sol math{vertical-align:-0.1em}

.tw{padding:0 16px 90px;box-sizing:border-box}
.bub,.nx,.sum,.prob{scroll-margin-top:150px}
.prob{background:var(--card,#fff);border:1px solid var(--line,#e5e7eb);border-radius:14px;padding:14px 14px 10px;margin:14px 0}
.prob .ph{font-size:12px;color:#6b7280;margin-bottom:6px;font-weight:600}
.prob .stem{font-size:15px;line-height:1.7}
.prob .fig img{max-width:100%;height:auto}
.prob.fold .stem{max-height:5.2em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent)}
.prob .tog{font-size:12px;color:#6b7280;background:none;border:0;padding:4px 0;cursor:pointer}
.thread{margin-top:6px}
.bub{border-radius:14px;padding:12px 14px;margin:10px 0;line-height:1.65;font-size:15px;animation:up .25s ease}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bub.q{background:#fff;border:1px solid #e5e7eb}
.bub.q .lab{font-size:11px;font-weight:700;letter-spacing:.04em;color:#b45309;margin-bottom:4px}
.bub.q .lab.sub{color:#2563eb}
.bub.q .lab.h{color:#7c3aed}
.bub.say{background:#f3f4f6;border-left:3px solid #9ca3af}
.bub.say.ok{background:#ecfdf5;border-left-color:#10b981}
.bub.say.no{background:#fff7ed;border-left-color:#f97316}
.bub.say.sol{background:#eff6ff;border-left-color:#3b82f6}
.opts{display:grid;gap:8px;margin-top:10px}
.op{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid #e5e7eb;background:#fff;border-radius:12px;padding:11px 12px;font:inherit;font-size:15px;line-height:1.5;color:inherit;cursor:pointer}
.op b{flex:none;color:#9ca3af;font-weight:600}
.op:active{background:#f9fafb}
.op.pick{border-color:#111827;background:#f9fafb}
.op.right{border-color:#10b981;background:#ecfdf5}
.op.wrong{border-color:#f97316;background:#fff7ed}
.op.lock{opacity:.38;pointer-events:none;text-decoration:line-through}
.opts.done .op{pointer-events:none}
.opts.done .op:not(.pick):not(.right){opacity:.45}
.nx.cf{margin-top:12px}.nx.cf:disabled{background:#d1d5db;cursor:default}
.nx{display:block;width:100%;margin:12px 0 4px;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:700;background:#111827;color:#fff;cursor:pointer}
.sum{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin:14px 0}
.sum h3{margin:0 0 8px;font-size:15px}
.sum .row{display:flex;justify-content:space-between;padding:6px 0;border-top:1px dashed #e5e7eb;font-size:14px}
.sum .row:first-of-type{border-top:0}
.mk{font-weight:800}.mk.o{color:#059669}.mk.t{color:#d97706}.mk.x{color:#dc2626}.mk.s{color:#9ca3af}
.sum .weak{margin-top:10px;font-size:14px;background:#fff7ed;border-radius:10px;padding:10px}
.dots{display:flex;gap:6px;margin:10px 0 0}
.dots i{flex:1;height:5px;border-radius:3px;background:#e5e7eb}
.dots i.cur{background:#111827}.dots i.o{background:#10b981}.dots i.t{background:#f59e0b}.dots i.x{background:#ef4444}

</style></head><body><div class="wrap tw"><header><div class="brand">수학은유강 · TARGET TRAINING</div><h1>고림고 프린트 해부 · 도형의 이동</h1><div class="meta">원본 문제를 다시 푸는 게 아니다 · 고른 뒤 [이걸로 할게]를 누르면 반응하고, 답에 따라 다음 질문이 바뀐다 · 4문항</div></header><div id="prob" class="prob"></div><div id="thread" class="thread"></div></div><script>const DB={"url": "https://bkgerndnwukvuuqdgnxt.supabase.co", "anon": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJrZ2VybmRud3VrdnV1cWRnbnh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNjA3MzgsImV4cCI6MjEwMTgzNjczOH0.VcfcTc9QkecKWFPUiYVXKGEXLxmVp8ugfiF6EV5_kjk"};const META={"skey": "print1009", "pan": "원본", "id": "tree-고림고Ⅰ11-고림고Ⅰ12-고림고Ⅰ13-고림고Ⅰ14", "제목": "고림고 프린트 해부 · 도형의 이동", "입구": "이 문제, 풀어 봤을 때 어땠어?"};const STEPNAME=["무엇을 묻나", "어디서 쓰이나", "조건의 역할", "조건을 바꾸면", "함정", "같은 개념"];const PROBS=[{"id": "고림고 Ⅰ-11", "단원": "도형의 이동", "발문": "<div class=\"print\"><p class=\"first\">좌표평면 위의 두 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mi mathvariant=\"normal\">A<\/mi><\/mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mi mathvariant=\"normal\">B<\/mi><\/mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>를<\/p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축의 방향으로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m<\/mi><\/mrow><\/math>만큼,<\/p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>축의 방향으로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math>만큼 평행이동한 점을 각각 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi mathvariant=\"normal\">A<\/mi><mi>&#x02032;<\/mi><\/msup><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi mathvariant=\"normal\">B<\/mi><mi>&#x02032;<\/mi><\/msup><\/mrow><\/math>이라 하자.<\/p><p>두 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi mathvariant=\"normal\">A<\/mi><mi>&#x02032;<\/mi><\/msup><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi mathvariant=\"normal\">B<\/mi><mi>&#x02032;<\/mi><\/msup><\/mrow><\/math>이 다음 조건을 만족시킬 때, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m<\/mi><mo>&#x000D7;<\/mo><msup><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><mrow><mn>2<\/mn><\/mrow><\/msup><\/mrow><\/math>의 값은?<\/p><p>(단, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mi>b<\/mi><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math>이고 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m<\/mi><\/mrow><\/math>은 상수이다.)<\/p><p><div class=\"box\"><div class=\"bl\">(가) 선분 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi mathvariant=\"normal\">A<\/mi><mi>&#x02032;<\/mi><\/msup><msup><mi mathvariant=\"normal\">B<\/mi><mi>&#x02032;<\/mi><\/msup><\/mrow><\/math>을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mspace width=\"0.167em\" /><mi>:<\/mi><mspace width=\"0.167em\" /><mn>1<\/mn><\/mrow><\/math>로 내분하는 점의 좌표는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>4<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>이다.<\/div><div class=\"bl\">(나) 두 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi mathvariant=\"normal\">A<\/mi><mi>&#x02032;<\/mi><\/msup><msup><mi mathvariant=\"normal\">B<\/mi><mi>&#x02032;<\/mi><\/msup><\/mrow><\/math>은 일치한다.<\/div><\/div><\/p><div style=\"display:flex;flex-wrap:wrap;gap:6px 16px;margin:8px 0\" class=\"ochoices \"><span class=\"och\"><span style=\"margin-right:4px\" class=\"ocn\">①<\/span><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>60<\/mn><\/mrow><\/math><\/span><span class=\"och\"><span style=\"margin-right:4px\" class=\"ocn\">②<\/span><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>70<\/mn><\/mrow><\/math><\/span><span class=\"och\"><span style=\"margin-right:4px\" class=\"ocn\">③<\/span><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>80<\/mn><\/mrow><\/math><\/span><span class=\"och\"><span style=\"margin-right:4px\" class=\"ocn\">④<\/span><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>90<\/mn><\/mrow><\/math><\/span><span class=\"och\"><span style=\"margin-right:4px\" class=\"ocn\">⑤<\/span><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>100<\/mn><\/mrow><\/math><\/span><\/div><\/div>", "M": [{"질문": "이 문제가 결국 묻는 핵심은?", "선지": ["평행이동 후에도 같은 직선이려면 이동 방향이 그 직선과 평행해야 한다는 것", "평행이동하면 직선의 기울기가 바뀐다는 것", "내분점은 평행이동해도 좌표가 변하지 않는다는 것", "같은 직선이 되려면 이동 방향이 그 직선과 수직이어야 한다는 것", "대칭이동으로 두 점의 좌표를 서로 바꾸는 것"], "말": ["맞다. 평행이동하면 기울기는 늘 같으니, 겹치려면 이동 방향이 직선을 따라가야 한다.", "평행이동인데 기울기가 바뀐다고 본 거다. 직선을 통째로 미는데 기울어짐이 변할까?", "내분점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>4<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 이 고정값이라 그렇게 보였구나. 그 점은 이미 옮긴 A′, B′ 으로 만든 점이다.", "직선과 수직인 방향으로 밀어 보자. 원래 자리에 겹칠까?", "이 문제엔 대칭이동이 없다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축으로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m<\/mi><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>축으로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math> 만큼 미는 평행이동이다."], "풀이": "직선을 평행이동하면 기울기는 그대로라 늘 평행하다. 같은 직선까지 되려면 이동한 점이 원래 직선 위에 남아야 하고, 이건 이동 방향 (m, −1) 이 직선과 평행하다는 뜻이다. 이동 방향이 수직이면 직선이 옆으로 밀려 겹치지 않는다. (기울기가 이미 같으니 y절편을 비교해도 같은 식이 나온다.)", "보조": {"질문": "직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 를 어느 방향으로 평행이동하면 자기 자신과 겹칠까?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축으로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>축으로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축으로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>축으로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축으로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math> 만"], "말": ["맞다. 직선을 따라 미끄러지면 제자리다. 처음 질문에서 이 원리가 뭘 뜻하는지 보자.", "그 방향은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 와 수직이라 직선이 옆으로 밀려난다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축으로만 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math> 밀면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math> 이 되어 다른 직선이다."]}}, {"질문": "b=3 을 얻은 뒤, a 와 m 을 결정짓는 단계는?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi mathvariant=\"normal\">A<\/mi><mi>&#x02032;<\/mi><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002B;<\/mo><mi>m<\/mi><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mi>x<\/mi><mi>a<\/mi><\/mfrac><\/mstyle><mo>&#x0002B;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mi>y<\/mi><mn>3<\/mn><\/mfrac><\/mstyle><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math> 에 대입한다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><msup><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">&#x02032;<\/mi><\/msup><msup><mi mathvariant=\"normal\">B<\/mi><mi mathvariant=\"normal\">&#x02032;<\/mi><\/msup><\/mrow><\/mrow><\/mrow><\/math> 로 식을 세운다", "두 직선의 기울기 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>3<\/mn><mi>a<\/mi><\/mfrac><\/mstyle><\/mrow><\/math> 가 같다고 놓는다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi mathvariant=\"normal\">A<\/mi><mi>&#x02032;<\/mi><\/msup><\/mrow><\/math> 의 좌표를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x02212;<\/mo><mi>m<\/mi><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 로 쓴다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi mathvariant=\"normal\">A<\/mi><mi>&#x02032;<\/mi><\/msup><\/mrow><\/math> 이 x축 위에 있다고 놓는다"], "말": ["맞다. A′ 이 원래 직선 위에 있어야 두 직선이 겹친다. 이 식에서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003D;<\/mo><mn>6<\/mn><\/mrow><\/math> 이 나온다.", "길이가 같다는 건 맞다. 근데 평행이동이면 길이는 언제나 같다. 새 정보가 될까?", "기울기 비교는 자연스럽다. 그런데 두 기울기를 실제로 써 보면 어떤 식이 나오나?", "평행이동 방향을 다시 보자. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축으로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m<\/mi><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>축으로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math> 이다. 부호를 확인하자.", "A′ 의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>좌표는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math> 이라 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축 위가 아니다. 문제에 그런 조건도 없다."], "풀이": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi mathvariant=\"normal\">A<\/mi><mi>&#x02032;<\/mi><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mn>4<\/mn><mo>&#x0002B;<\/mo><mfrac><mn>2<\/mn><mn>3<\/mn><\/mfrac><mi>a<\/mi><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 을 대입하면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>4<\/mn><mi>a<\/mi><\/mfrac><\/mstyle><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>2<\/mn><mn>3<\/mn><\/mfrac><\/mstyle><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003D;<\/mo><mn>6<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math> 다. 길이가 같다는 건 평행이동이면 늘 성립해 정보가 없다. 기울기 비교도 늘 같아서 a 가 안 나온다.", "보조": {"질문": "두 직선 AB, A′B′ 이 이미 평행할 때, '일치한다'를 점 하나로 말하면?", "선지": ["A′ 이 직선 AB 위에 있다", "A′ 이 B 와 같은 점이다", "선분 A′B′ 의 중점이 A 다"], "말": ["맞다. 이제 A′ 의 좌표가 어떤 식에 들어가야 하는지 보면 처음 질문이 풀린다.", "점끼리 겹칠 필요는 없다. 직선만 같으면 된다.", "중점 조건은 문제 어디에도 없다. 두 직선이 이미 평행이라는 점을 떠올려 보자."]}}, {"질문": "조건 '<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mi>b<\/mi><mo>&#x02260;<\/mo><mn>0<\/mn><\/mrow><\/math>' 은 풀이에서 어떤 역할을 하나?", "선지": ["A, B 를 원점과 다른 점으로 두어 직선 AB 를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mi>x<\/mi><mi>a<\/mi><\/mfrac><\/mstyle><mo>&#x0002B;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mi>y<\/mi><mi>b<\/mi><\/mfrac><\/mstyle><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math> 로 쓰게 한다", "(가)의 y좌표 식에서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math> 을 끌어내는 isplay=\"inline\"><mrow><mi>m<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 이 나올 근거가 있을까? (가)의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>좌표 식에 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m<\/mi><\/mrow><\/math> 과 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math> 가 같이 묶여 있다."], "풀이": "(가)의 y좌표에서 b=3 은 그대로 나온다. x좌표에서는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m<\/mi><mo>&#x0002B;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mi>a<\/mi><mn>3<\/mn><\/mfrac><\/mstyle><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math> 한 식뿐이라 a, m 쌍이 무수히 많다. (나)가 있어야 식이 하나 더 생겨 a=6, m=2 로 정해진다.", "보조": {"질문": "식 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m<\/mi><mo>&#x0002B;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mi>a<\/mi><mn>3<\/mn><\/mfrac><\/mstyle><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math> 를 만족하는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>m<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 쌍은?", "선지": ["무수히 많다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>6<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 하나뿐이다", "없다"], "말": ["맞다. 식 하나에 미지수 둘이면 하나로 안 정해진다. 처음 질문으로 돌아가자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>6<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 도 맞지만 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>3<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 도 된다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>6<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 만 넣어 봐도 성립한다."]}}, {"질문": "어떤 학생이 (나)를 '두 직선의 기울기가 같다'로 식을 세웠더니 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>3<\/mn><mi>a<\/mi><\/mfrac><\/mstyle><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>3<\/mn><mi>a<\/mi><\/mfrac><\/mstyle><\/mrow><\/math> 만 나와 막혔다. 원인은?", "선지": ["평행이동한 직선은 원래 항상 평행이라 '일치'를 따로 써야 한다", "A′ 의 좌표에서 m 의 부호를 잘못 썼다", "내분점을 1 : 2 로 잘못 계산했다", "b=3 을 구하지 않고 시작했다", "직선 AB 의 방정식을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mi>x<\/mi><mi>a<\/mi><\/mfrac><\/mstyle><mo>&#x0002B;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mi>y<\/mi><mi>b<\/mi><\/mfrac><\/mstyle><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 으로 썼다"], "말": ["맞다. 평행이동한 직선은 늘 평행이라 기울기 식은 항등식이 된다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m<\/mi><\/mrow><\/math> 의 부호가 틀렸다면 엉뚱한 값이 나왔을 거다. 이 학생은 아예 값이 안 나왔다.", "내분점은 (가)에 쓰는 거다. 막힌 건 (나)를 식으로 옮기는 단계다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math> 을 몰라도 기울기 식은 양변이 똑같이 나온다. 막힌 원인이 거기일까?", "직선 식이 틀렸다면 기울기 값이 달라졌을 거다. 양변이 똑같은 이유를 보자."], "풀이": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><msup><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">&#x02032;<\/mi><\/msup><msup><mi mathvariant=\"normal\">B<\/mi><mi mathvariant=\"normal\">&#x02032;<\/mi><\/msup><\/mrow><\/mrow><\/math> 의 기울기는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>b<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mi>m<\/mi><mo>&#x02212;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002B;<\/mo><mi>m<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/mfrac><\/mstyle><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mi>b<\/mi><mi>a<\/mi><\/mfrac><\/mstyle><\/mrow><\/math> 로 AB 와 항상 같다. 그래서 기울기 비교는 아무 정보도 안 준다. '일치'는 A′ 이 직선 AB 위에 있다는 식으로 써야 한다.", "보조": {"질문": "직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><\/mrow><\/math> 을 평행이동한 직선의 기울기는?", "선지": ["항상 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><\/mrow><\/math>", "이동 방향에 따라 달라진다", "항상 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><\/mrow><\/math>"], "말": ["맞다. 기울기는 늘 같으니 기울기 비교로는 아무것도 안 나온다. 무엇을 따로 써야 할까?", "평행이동은 모양과 기울어짐을 그대로 둔다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 은 수직인 직선의 기울기다."]}}, {"질문": "다음 중 이 문제와 같은 핵심 개념으로 푸는 것을 모두 고르면?<br>ㄱ. 직선 도로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math> 위의 차가 동쪽으로 2, 남쪽으로 1 움직였을 때 여전히 도로 위인지 판단<br>ㄴ. 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><\/mrow><\/math> 을 x축 방향으로 1, y축 방향으로 k 만큼 평행이동해도 자기 자신일 때 k<br>ㄷ. 점 (2, 1) 을 x축 방향으로 m, y축 방향으로 −1 만큼 평행이동한 점이 원점일 때 m", "선지": ["ㄱ, ㄴ", "ㄴ", "ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "말": ["맞다. ㄱ, ㄴ 둘 다 이동 방향이 직선과 평행한지가 핵심이다.", "ㄴ은 잘 봤다. ㄱ은 차·도로 얘기지만 무엇을 묻는지 식으로 바꿔 보자.", "ㄷ은 평행이동이 보이지만 점 하나만 옮기면 끝난다. 직선이 겹치는지 묻는 건 아니다.", "ㄴ은 잘 봤다. ㄷ은 점 하나를 옮기는 계산뿐이다. ㄱ을 다시 보자.", "셋 다 '이동'이 나오지. 그중 직선이 제자리에 남는지를 묻는 게 어느 것인지 보자."], "풀이": "ㄱ 은 이동 방향 (2, −1) 이 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math> 와 평행해 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00028;<\/mo><mi>y<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>y<\/mi><\/mrow><\/math> 로 여전히 도로 위다. ㄴ 은 같은 원리로 기울기 2 와 이동 방향 (1, k) 가 맞아야 해 k=2 다. ㄷ 은 평행이동이라는 겉모습만 같고 좌표만 옮기면 끝나는(m=−2) 다른 상황이다.", "보조": {"질문": "직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math> 위의 점을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축으로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>축으로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math> 옮기면?", "선지": ["여전히 그 직선 위에 있다", "직선에서 벗어난다", "점에 따라 다르다"], "말": ["맞다. 이동 방향이 직선과 평행하기 때문이다. 이 원리가 보기 어디에 숨어 있는지 보자.", "옮긴 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>y<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>y<\/mi><\/mrow><\/math> 에 넣어 정리해 보자.", "식으로 정리하면 어느 점이든 결과가 같다."]}}], "H": {"질문": "이 문제, 첫 발은 뭐로 뗄까?", "선지": ["A′, B′ 의 좌표를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002B;<\/mo><mi>m<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>m<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>b<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 로 쓴다", "직선 AB 의 기울기부터 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mi>b<\/mi><mi>a<\/mi><\/mfrac><\/mstyle><\/mrow><\/math> 로 구한다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>b<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math> 을 먼저 세운다", "A′ 을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x02212;<\/mo><mi>m<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 로 쓴다", "내분점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>4<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 을 A, B 로 바로 계산한다"], "말": ["좋다. 옮긴 점의 좌표가 있어야 (가), (나)를 식으로 쓸 수 있다.", "기울기는 옮겨도 그대로라, 여기서 시작하면 정보가 늘지 않는다.", "그건 마지막에 쓸 식이다. 지금은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><\/mrow><\/math> 를 모른다.", "평행이동은 더하는 거다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축으로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m<\/mi><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>축으로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math> 의 부호를 다시 보자.", "내분점은 A, B 가 아니라 A′, B′ 으로 만든 점이다."], "힌트": ["(가), (나) 모두 A′, B′ 에 대한 조건이다. 먼저 옮긴 두 점의 좌표를 써 보자.", "A′<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002B;<\/mo><mi>m<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, B′<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>m<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>b<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 이다. (가)의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>좌표 식 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>2<\/mn><mo stretchy=\"false\">&#x00028;<\/mo><mi>b<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mstyle><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math> 에서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math> 이 나온다."]}}, {"id": "고림고 Ⅰ-12", "단원": "도형의 이동", "발문": "<div class=\"print\"><p class=\"first\">곡선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><\/math> 위의 서로 다른 두 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/math>가<\/p><p>직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math>에 대하여 대칭일 때, 선분 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/math>의 길이는?<\/p><p>(단, 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><\/math>의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>좌표는 음수이다.)<\/p><div class=\"fig\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAd0AAAIRCAIAAACAnfBrAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAEXoSURBVHhe7d15nE31H8fxOwszxlooIYoS0SJ7kX2PIkuIJEKWhiyRLNm3rNllS0N2okjWKKXIvlTKFj9jKVmj+X3O/XxcY8xyl3PO/Z5z3s8/etzzudcs957vq5k7957jigMAAJWgywAAa lay=\"inline\"><mrow><msqrt><mrow><mn>6<\/mn><\/mrow><\/msqrt><\/mrow><\/math><\/span><span class=\"och\"><span style=\"margin-right:4px\" class=\"ocn\">②<\/span><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><mn>7<\/mn><\/mrow><\/msqrt><\/mrow><\/math><\/span><span class=\"och\"><span style=\"margin-right:4px\" class=\"ocn\">③<\/span><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><msqrt><mrow><mn>2<\/mn><\/mrow><\/msqrt><\/mrow><\/math><\/span><span class=\"och\"><span style=\"margin-right:4px\" class=\"ocn\">④<\/span><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><\/mrow><\/math><\/span><span class=\"och\"><span style=\"margin-right:4px\" class=\"ocn\">⑤<\/span><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><mn>10<\/mn><\/mrow><\/msqrt><\/mrow><\/math><\/span><\/div><\/div>", "M": [{"질문": "이 문제가 결국 묻는 핵심은?", "선지": ["y=x 대칭인 두 점은 잇는 선분이 y=x 에 수직이고 중점이 y=x 위라는 것", "y=x 대칭인 두 점은 x좌표의 합이 0 이라는 것", "곡선과 직선 y=x 의 교점을 구하는 것", "곡선의 꼭짓점이 직선 y=x 위에 있다는 것", "두 점이 원점에 대하여 대칭이라는 것"], "말": ["맞다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 대칭은 '수직' 하나와 '중점' 하나, 두 조건으로 나뉜다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>좌표 합이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math> 인 건 대칭축이 다를 때다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 대칭이면 좌표가 어떻게 바뀌는지 보자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 가 나오니 교점이 떠오르지. 그런데 교점은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> '위'의 점이다. 대칭인 두 점과 같을까?", "꼭짓점 조건은 문제 어디에도 없다. 대칭인 건 곡선이 아니라 두 점이다.", "원점 대칭은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02192;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 다. 이 문제의 대칭축은 직선이다."], "풀이": "y=x 대칭은 '잇는 선분이 y=x 에 수직(기울기 −1)'과 '중점이 y=x 위' 두 조건이다. x좌표 합이 0 인 건 y축 대칭이다. 곡선과 y=x 의 교점은 대칭인 두 점이 아니라 y=x 위에 있는 점이다.", "보조": {"질문": "점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>3<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 을 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 에 대하여 대칭이동한 점은?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>3<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>"], "말": ["맞다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn> 8/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mn>2<\/mn><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 에서 나온 식이다. 교점과 대칭인 두 점을 구분하자.", "그 길이 식은 맞다. 하지만 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003B1;<\/mi><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003B2;<\/mi><\/mrow><\/math> 의 관계를 모르면 값이 안 나온다. 그 전 단계를 찾자."], "풀이": "포물선 위 두 점의 기울기는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003B1;<\/mi><mo>&#x0002B;<\/mo><mi>&#x003B2;<\/mi><\/mrow><\/math> 라서 기울기 −1 이 곧 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003B1;<\/mi><mo>&#x0002B;<\/mo><mi>&#x003B2;<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math> 이다. 여기에 중점 조건을 더해 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>&#x003B1;<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>&#x003B2;<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003B1;<\/mi><mi>&#x003B2;<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math> 이 나온다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mn>2<\/mn><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 를 푸는 건 y=x 와의 교점을 구하는 것이라 틀린 길이다. 마지막 길이 식은 맞지만 결정적 단계는 아니다.", "보조": {"질문": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><\/math> 위의 두 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>&#x003B1;<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><msup><mi>&#x003B1;<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mn>2<\/mn><m hML\" display=\"inline\"><mrow><mi>&#x003B1;<\/mi><mo>&#x0002B;<\/mo><mi>&#x003B2;<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math> 이 나온다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003B1;<\/mi><mi>&#x003B2;<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math> 의 부호를 정해 준다", "두 근 중 하나를 버려 답이 하나로 정해지게 한다", "A 가 제3사분면 위의 점임을 알려 준다"], "말": ["맞다. 두 근의 부호는 원래 반대라, 이 단서는 이름만 붙인다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003B1;<\/mi><mo>&#x0002B;<\/mo><mi>&#x003B2;<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math> 은 기울기 조건에서 나왔다. 부호 단서가 없어도 나온다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003B1;<\/mi><mi>&#x003B2;<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math> 은 중점 조건과 합에서 계산된 값이다. 부호 단서와는 상관없다.", "두 근은 각각 A, B 의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>좌표로 둘 다 쓰인다. 버릴 근이 있을까?", "A 의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>좌표 부호까지 계산해 보자. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>좌표가 음수라는 것만으로 사분면이 정해지진 않는다."], "풀이": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003B1;<\/mi><mo>&#x0002B;<\/mo><mi>&#x003B2;<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003B1;<\/mi><mi>&#x003B2;<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math> 은 대칭 조건만으로 나오고, 두 근 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><mi>&#x000B1;<\/mi><msqrt><mn>5<\/mn><\/msqrt><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mstyle><\/mrow><\/ http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/math> 가 나온다. 이 두 점은 y=x 위의 점이지 y=x 에 대칭인 두 점이 아니다. 대칭인 두 점은 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>y<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math> 위에 있다.", "보조": {"질문": "곡선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><\/math> 와 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 의 교점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 에 대하여 대칭이동하면?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 그대로", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>"], "말": ["맞다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 위의 점은 대칭이동해도 제자리다. 그럼 학생이 잡은 두 점은 서로 대칭일까?", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 은 또 다른 교점이다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math> 를 바꿔 보자.", "그건 원점에 대한 대칭이다."]}}, {"질문": "다음 중 이 문제와 같은 핵심 개념으로 푸는 것을 모두 고르면?<br>ㄱ. 곡선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><\/math> 위의 두 점이 y축에 대칭이고 거리가 4 일 때 두 점의 y좌표<br>ㄴ. 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>k<\/mi><\/mrow><\/math> 와 곡선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><\/math> 의 두 교점이 y=x 에 대칭일 때 k<br>ㄷ. 곡선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><\/math> 위의 점 A 를 y=x 에 대칭이동한 점이 다시 이 곡선 위에 있을 때 A 의 x좌표 (A 는 y=x 위가 아님)", "선지": ["ㄴ, ㄷ", "ㄴ", "ㄱ", "ㄱ, ㄴ", "ㄱ, ㄴ, ㄷ"], "말": ["맞다. ㄴ, ㄷ 모두 곡선 위 두 점이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 에 대칭인 상황이다.", "ㄴ은 잘 봤다. ㄷ의 A 와 그 대칭점이 어떤 두 점인지 보자.", "ㄱ은 겉모습이 닮았지만 대칭축이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>축이다.", "ㄴ은 잘 봤다. ㄱ의 대칭축을 다시 보자.", "셋 다 '대칭'이 나오지. 대칭축이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 인 게 어느 것인지 보자."], "풀이": "ㄴ 은 교점의 중점 x좌표가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 라 중점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><mo>&#x0002C;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><mo>&#x0002B;<\/mo><mi>k<\/mi><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/math> 이 y=x 위가 되도록 k=−1 이다. ㄷ 은 A 와 그 대칭점이 곡선 위에 있는 두 점이라 이 문제와 같은 상황이고 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 이 나온다. ㄱ 은 겉모습만 비슷한 y축 대칭이라 x좌표가 ±2, y좌표 2 로 끝난다.", "보조": {"질문": "곡선 위의 점 A 와, A 를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 에 대하여 대칭이동한 점이 둘 다 곡선 위에 있다. 이 두 점은?", "선지": ["곡선 위의, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 에 대칭인 두 점", "곡선과 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 의 두 교점", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>축에 대칭인 두 점"], "말": ["맞다. 이 문제와 같은 상황이다. 보기를 다시 가려 보자.", "A 가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y 02C;<\/mo><mtext>&#x000A0;<\/mtext><msup><mi>&#x003B1;<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, B<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>&#x003B2;<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><msup><mi>&#x003B2;<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 이면 직선 AB 의 기울기 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003B1;<\/mi><mo>&#x0002B;<\/mo><mi>&#x003B2;<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math> 이고, 중점이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 위에 있어야 한다."]}}, {"id": "고림고 Ⅰ-13", "단원": "도형의 이동", "발문": "<div class=\"print\"><p class=\"first\">직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>l<\/mi><mspace width=\"0.167em\" /><mi>:<\/mi><mspace width=\"0.167em\" /><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><\/mrow><\/math>를 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math>에 대하여 대칭이동한 직선을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m<\/mi><\/mrow><\/math>이라 하자. 곡선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><mo>&#x0002B;<\/mo><mi>a<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>b<\/mi><\/mrow><\/math>가 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>l<\/mi><\/mrow><\/math>과 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><\/math>에서 접하고, 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow> <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mfrac><mn>5<\/mn><mn>8<\/mn><\/mfrac><mo>&#x0002C;<\/mo><mo>&#x02212;<\/mo><mfrac><mn>1<\/mn><mn>4<\/mn><\/mfrac><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/math>).", "보조": {"질문": "곡선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mi>a<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>b<\/mi><\/mrow><\/math> 가 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><\/mrow><\/math> 에 접한다는 걸 식으로 옮기면?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x02212;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>b<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 의 판별식이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mi>a<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>b<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 의 판별식이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math>", "꼭짓점이 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><\/mrow><\/math> 위에 있다"], "말": ["맞다. 접하는 직선이 둘이면 이런 식도 둘이다. 처음 질문으로 돌아가자.", "그건 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축에 접하는 조건이다.", "꼭짓점이 직선 위에 있어도 두 점에서 만날 수 있다. <math xmlns=\"http://www.w3.org/199 ath/MathML\" display=\"inline\"><mrow><mi>p<\/mi><\/mrow><\/math> 는 여전히 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math> 이다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>3<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m<\/mi><\/mrow><\/math> 의 기울기다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><\/mrow><\/math> 는 세 꼭짓점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>좌표의 평균이다.", "부호를 바꿔도 마찬가지다. A, B 의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>좌표가 실제로 어떻게 되는지 보자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>3<\/mn><mn>8<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 은 바꾸기 전 A 의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>좌표다. 직선이 바뀌면 접점도 바뀐다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>16<\/mn><\/mrow><mrow><mn>27<\/mn><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math> 은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>q<\/mi><\/mrow><\/math> 쪽 값이다. 묻는 건 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><\/mrow><\/math> 다."], "풀이": "두 판별식을 빼면 a 는 두 기울기의 평균 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>3<\/mn><mo>&#x0002B;<\/mo><mfrac><mn>1<\/mn><mn>3<\/mn><\/mfrac><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math> 이 된다. 접점 x좌표는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>3<\/mn><mo>&#x02212;<\/mo><mi>a<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mfrac><mn>1<\/mn><mn>3<\/mn><\/mfrac><mo>&#x02212;<\/mo><mi>a<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math> 로 부호만 반대(<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x000B1;<\/mi><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>2<\/mn><mn>3<\/mn><\/mfrac><\/mstyle><\/mrow><\/math>)라 p=0 그대로다. 바뀌는 건 q 뿐이다(<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>16<\/mn><\/mrow><mrow><mn>27<\/mn><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math>).", "보조": {"질문": "삼각형 OAB 의 무게중심의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>좌표가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math> 이 되려면?", "선지": ["A, B 의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>좌표의 합이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math>", "A, B 의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>좌표의 곱이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math>", "A, B 의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>좌표의 합이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math>"], "말": ["맞다. 그럼 바꾼 문제에서 두 접점의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>좌표 합이 어떻게 되는지 보자.", "곱이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math> 이면 한 점이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>축 위라는 뜻이다. 무게중심과는 다르다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>좌표의 합은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>q<\/mi><\/mrow><\/math> 를 정한다."]}}, {"질문": "어떤 학생이 B 를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>3<\/mn><mn>4<\/mn><\/mfrac><\/mstyle><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>3<\/mn><mn>8<\/mn><\/mfrac><\/mstyle><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/math> 으로 잡아 답을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>3<\/mn><mn>4<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 로 적었다. 원인은?", "선지": ["곡선은 y=x 대칭이 아닌데 B 를 A 의 대칭점으로 잡았다", "직선 m 을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><mi>x<\/mi><\/mrow><\/math> 로 잘못 구했다", "판별식에서 4b 대신 2b 를 썼다", "무게중심을 세 좌표의 합으로 계산했다", "A 의 y좌표를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mi>a<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>b<\/mi><\/mrow><\/math> 에 넣어 잘못 구했다"], "말": ["맞다. 두 직선이 대칭이어도 곡선이 대칭이 아니라 접점도 대칭이 아니다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m<\/mi><\/mrow><\/math> 을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><mi>x<\/mi><\/mrow><\/math> 로 잡았다면 B 는 그 직선 위에 있어야 한다. 이 B 는 어느 직선 위의 점인지 보자.", "판별식이 틀렸다면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><\/mrow><\/math> 부터 달라진다. 이 B 는 A 와 어떤 관계인지 보자.", "세 좌표를 더하기만 했다면 값이 훨씬 커진다. B 를 어떻게 잡았는지 보자.", "A<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>3<\/mn><mn>8<\/mn><\/mfrac><\/mstyle><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>3<\/mn><mn>4<\/mn><\/mfrac><\/mstyle><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/math> 는 맞다. 이 B 가 어디서 나왔는지 따져 보자."], "풀이": "A 를 대칭이동한 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mfrac><mn>3<\/mn><mn>4<\/mn><\/mfrac><mo>&#x0002C;<\/mo><mfrac><mn>3<\/mn><mn>8<\/mn><\/mfrac><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/math> 으로 B 를 잡으면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mfrac><mn>3<\/mn><mn>8<\/mn><\/mfrac><mo>&#x0002B;<\/mo><mfrac><mn>3<\/mn><mn>4<\/mn><\/mfrac><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mstyle><mo>&#x000D7;<\/mo><mn>2<\/mn><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>3<\/mn><mn>4<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 가 나온다. 하지만 l 과 m 이 대칭이어도 포물선은 y=x 대칭이 아니라 접점도 대칭이 아니다. 실제 B 는 m 과의 중근으로 구한 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mfrac><mn>3<\/mn><mn>8<\/mn><\/mfrac><mo>&#x0002C;<\/mo><mo>&#x02212;<\/mo><mfrac><mn>3<\/mn><mrow><mn>16<\/mn><\/mrow><\/mfrac><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/math> 이다.", "보조": {"질문": "곡선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>5<\/mn><mn>4<\/mn><\/mfrac><\/mstyle><mi>x<\/mi><mo>&#x0002B;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>9<\/mn><mrow><mn>64<\/mn><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math> 은 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 에 대하여 대칭인가?", "선지": ["아니다 — 축이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>축과 평행한 포물선이다", "그렇다 — 접하는 두 직선이 대칭이다", "그렇다 — 꼭짓점이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 위에 있다"], "말": ["맞다. 곡선이 대칭이 아니면 두 접점도 대칭일 이유가 없다. 처음 질문으로 돌아가자.", "두 직선이 대칭이라고 그 둘에 접하는 곡선까지 대칭이 되진 않는다.", "꼭짓점은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>5<\/mn><mn>8<\/mn><\/mfrac><\/mstyle><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>4<\/mn><\/mfrac><\/mstyle><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/math> 이라 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 위가 아니다."]}}, {"질문": "다음 중 이 문제와 같은 핵심 개념으로 푸는 것을 모두 고르면?<br>ㄱ. 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x000 http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mi>a<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>b<\/mi><\/mrow><\/math> 가 두 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>4<\/mn><mi>x<\/mi><mo>&#x02212;<\/mo><mn>3<\/mn><\/mrow><\/math> 에 모두 접한다. 판별식은 몇 개 세우나?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><\/mrow><\/math> 개", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math> 개", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math> 개 — 대칭이동이 없으니까"], "말": ["맞다. 두 직선에 접하면 판별식 둘을 연립한다. 이 문제의 핵심과 같은 구조다.", "직선이 둘이면 접하는 조건도 둘이다.", "판별식은 대칭이동이 아니라 '접한다'에서 나온다."]}}], "H": {"질문": "이 문제, 첫 발은 뭐로 뗄까?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math> 를 바꿔 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m<\/mi><\/mrow><\/math> 의 방정식부터 구한다", "곡선의 꼭짓점을 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 위에 놓는다", "A, B 를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 에 대칭인 두 점으로 둔다", "곡선이 원점을 지난다고 보고 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 으로 둔다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m<\/mi><\/mrow><\/math> 을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><mi>x<\/mi><\/mrow><\/math> 로 놓고 판별식을 세운다"], "말": ["좋다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m<\/mi><mi>:<\/mi><mi>y<\/mi><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><mi>x<\/mi><\/mrow><\/math> 가 있어야 두 번째 접하는 조건을 쓸 수 있다.", "그런 조건은 문제에 없다. 주어진 건 두 직선에 접한다는 것이다.", "직선은 대칭이지만 곡선은 아니다. 접점이 대칭일 근거가 없다.", "곡선이 원점을 지난다는 말은 문제에 없다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 대칭은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math> 를 바꾸는 것이다. 부호를 바꾸는 게 아니다."], "힌트": ["직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m<\/mi><\/mrow><\/math> 이 뭔지부터 알아야 '<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m<\/mi><\/mrow><\/math> 과 접한다'를 식으로 쓸 수 있다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m<\/mi><mi>:<\/mi><mi>y<\/mi><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><mi>x<\/mi><\/mrow><\/math> 이다. 곡선과 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>l<\/mi><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m<\/mi><\/mrow><\/math> 을 각각 연립한 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x02212;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>b<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>, 조각을 가져다 쓴다.", "곡선과 직선이 나오니 판별식이 떠오르지. 그런데 묻는 건 넓이다.", "곡선이 두 개라 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 대칭이 떠올랐구나. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>2<\/mn><mo>&#x02212;<\/mo><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 에서 바뀐 건 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math> 의 부호다.", "포물선이라 최대·최소가 떠오르지. 이 문제는 값의 크기가 아니라 둘러싸인 부분을 묻는다.", "구하는 건 둘러싸인 부분의 넓이다. 점과 직선 사이 거리는 쓰이지 않는다."], "풀이": "두 곡선은 C 를 옮기고 뒤집은 것이라 모양이 같고, 넓이도 그대로다. 그래서 C 주변에서 미리 구한 조각 넓이를 옮겨 쓰면 계산 없이 넓이가 나온다. 판별식이나 최대·최소는 이 문제에 쓰이지 않는다.", "보조": {"질문": "곡선을 평행이동하거나 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축에 대하여 대칭이동하면, 그 곡선이 만드는 조각의 넓이는?", "선지": ["그대로다", "이동한 거리만큼 늘어난다", "대칭이동하면 부호가 바뀐다"], "말": ["맞다. 그래서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C<\/mi><\/mrow><\/math> 근처에서 구한 넓이를 그대로 옮겨 쓸 수 있다. 처음 질문을 다시 보자.", "평행이동은 모양을 그대로 옮긴다. 크기가 변할까?", "넓이는 음수가 없다. 뒤집어도 같은 모양이다."]}}, {"질문": "넓이를 결정짓는 단계는?", "선지": ["가운데 2×2 직사각형에 위아래 조각 각각 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mo>&#x02212;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>2<\/mn><mn>3<\/mn><\/mfrac><\/mstyle><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>4<\/mn><mn>3<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 을 더한다", "가운데 2×2 직사각형에 위아래 조각 각각 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>3<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 을 더한다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f
