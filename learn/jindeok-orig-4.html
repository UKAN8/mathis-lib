공통 범위를 구한다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math> 에 정수를 하나씩 넣어 끝까지 확인한다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C<\/mi><mo>&#x02282;<\/mo><mi>A<\/mi><\/mrow><\/math> 하나만 풀어 범위를 구한다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math> 가 양수라고 두고 시작한다"], "말": ["좋다. 그림에서 '어느 쪽이 더 오른쪽이어야 하나' 와 '끝점이 들어가나' 가 바로 보인다.", "공통 범위는 교집합이다. 여기서는 포함 관계를 따진다.", "넣어 보면 감은 오지만 범위를 놓치기 쉽다. 경계부터 식으로 잡자.", "그건 조건 일부만 쓴 거다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><\/mrow><\/math> 가 사이에 낀다는 것도 써야 한다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math> 의 부호는 따로 주어지지 않았다. 식에서 저절로 나온다."], "힌트": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C<\/mi><mo>&#x02282;<\/mo><mi>B<\/mi><\/mrow><\/math> 와 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><mo>&#x02282;<\/mo><mi>A<\/mi><\/mrow><\/math> 를 따로 본다. 각각 시작점 둘을 비교하고, 그 끝점이 들어가는지 확인하자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C<\/mi><mo>&#x02282;<\/mo><mi>B<\/mi><\/mrow><\/math> 는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>a<\/mi><mo>&#x0003E;<\/mo><mn>4<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><mo>&#x02282;<\/mo><mi>A<\/mi><\/mrow><\/math> 는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mi>a<\/mi><mn>2<\/mn><\/mfrac><\/mstyle><mo>&#x02264;<\/mo><mn>4<\/mn><\/mrow><\/math> 다. 등호가 왜 한쪽만 되는지 4 를 넣어 보자."]}}, {"id": "진덕고 #4-3", "단원": "집합", "발문": "<div class=\"print\"><p class=\"first\">집합 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x0007B;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>2<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>3<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>4<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>5<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>6<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>7<\/mn><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math>에 대하여 다음 조건을 만족시키는 집합 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><\/mrow><\/math>의 개수를 구하시오.<\/p><div class=\"bogi nolbl\"><div class=\"bl\">(가) <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><mo>&#x02282;<\/mo><mi>A<\/mi><\/mrow><\/math>이고 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>X<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02265;<\/mo><mn>3<\/mn><\/mrow><\/math>이다.<\/div><div class=\"bl\">(나) 집합 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><\/mrow><\/math>의 모든 원소의 곱은 홀수이다.<\/div><\/div><\/div>", "M": [{"질문": "이 문제가 결국 묻는 핵심은?", "선지": ["곱 조건을 '각 원소가 모두 홀수'로 바꿔 부분집합을 세는 것", "홀수 원소를 적어도 하나 포함하는 부분집합을 세는 것", "원소의 합이 홀수가 되는 부분집합을 세는 것", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><\/mrow><\/math> 의 모든 부분집합 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>2<\/mn><mn>7<\/mn><\/msup><\/mrow><\/math> 개에서 원소 3개 미만을 빼는 것", "원소가 3개인 부분집합만 조합으로 세는 것"], "말": ["맞다. 곱이 홀수면 원소가 전부 홀수라, 홀수만으로 된 집합을 세면 된다.", "'적어도 하나'로 읽으면 짝수가 섞인 집합도 들어온다. 그때 곱은 어떻게 될까?", "합의 홀짝과 곱의 홀짝은 규칙이 다르다. 묻는 건 곱이다.", "그건 (가)만 쓴 계산이다. (나)는 어디로 갔을까?", "원소가 4개인 집합도 조건을 만족할 수 있다. 3개만 세면 빠진다."], "풀이": "곱은 한 원소만 짝수여도 짝수가 된다. 그래서 곱이 홀수면 원소가 전부 홀수다. '적어도 하나'로 읽으면 짝수가 섞인 집합까지 세게 된다.", "보조": {"질문": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007B;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>2<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>3<\/mn><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math> 의 원소의 곱은?", "선지": ["짝수", "홀수", "알 수 없다"], "말": ["맞다. 짝수가 하나만 있어도 곱은 짝수다. 그럼 곱이 홀수인 집합은 어떤 모양일까?", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x000D7;<\/mo><mn>2<\/mn><mo>&#x000D7;<\/mo><mn>3<\/mn><mo>&#x0003D;<\/mo><mn>6<\/mn><\/mrow><\/math> 이다. 홀수가 둘이어도 짝수 하나가 섞였다.", "원소가 정해졌으니 곱도 정해진다. 직접 곱해 보자."]}}, {"질문": "'곱이 홀수' 조건이 실제로 쓰이는 단계는?", "선지": ["짝수가 하나라도 있으면 곱이 짝수 → <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><mo>&#x02282;<\/mo><mo stretchy=\"false\">&#x0007B;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mn>5<\/mn><mo>&#x0002C;<\/mo><mn>7<\/mn><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>X<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02265;<\/mo><mn>3<\/mn><\/mrow><\/math> 이므로 원소 3개, 4개인 경우로 나눈다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mrow /><mn>4<\/mn><\/msub><msub><mi mathvariant=\"normal\">C<\/mi><mn>3<\/mn><\/msub><mo>&#x0002B;<\/mo><msub><mrow /><mn>4<\/mn><\/msub><msub><mi mathvariant=\"normal\">C<\/mi><mn>4<\/mn><\/msub><mo>&#x0003D;<\/mo><mn>5<\/mn><\/mrow><\/math>", "홀수 원소가 하나라도 있으면 곱은 홀수다", "1은 곱에 영향이 없으므로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><\/mrow><\/math> 에서 뺀다"], "말": ["맞다. 곱 조건을 원소 하나하나의 조건으로 바꾼 순간이 핵심이다.", "그건 (가)를 처리하는 단계다. 곱 조건이 쓰이는 곳은 아니다.", "그 계산은 곱 조건을 이미 쓴 뒤의 세기다.", "홀수 하나만 있으면 될까? 짝수가 함께 있으면 곱이 어떻게 될지 보자.", "1 도 홀수다. 곱에 영향이 없다고 빼면 세어야 할 집합이 빠진다."], "풀이": "곱 조건을 원소 하나하나의 조건으로 바꾸는 순간이 핵심이다. 그 뒤 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mrow /><mn>4<\/mn><\/msub><msub><mi mathvariant=\"normal\">C<\/mi><mn>3<\/mn><\/msub><mo>&#x0002B;<\/mo><msub><mrow /><mn>4<\/mn><\/msub><msub><mi mathvariant=\"normal\">C<\/mi><mn>4<\/mn><\/msub><\/mrow><\/math> 는 개수 조건 처리일 뿐이다. 1도 홀수라 빼면 안 된다.", "보조": {"질문": "곱이 홀수인 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><\/mrow><\/math> 에 들어갈 수 없는 원소는?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>7<\/mn><\/mrow><\/math>"], "말": ["맞다. 짝수 2, 4, 6 은 다 빠진다. 남는 원소로 처음 질문을 다시 보자.", "1 은 홀수라 곱의 홀짝을 바꾸지 않는다. 넣어도 된다.", "7 은 홀수다. 넣어도 곱은 홀수로 남는다."]}}, {"질문": "(가)의 '<b><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>X<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02265;<\/mo><mn>3<\/mn><\/mrow><\/math><\/b>' 은 풀이에서 어떤 역할을 하나?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007B;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>3<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>5<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>7<\/mn><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math> 의 부분집합 중 원소가 3, 4개인 것만 남긴다", "곱이 홀수가 되도록 홀수를 세 개 이상 넣게 한다", "1 을 빼고 3 이상인 원소만 고르게 한다", "짝수를 하나 이상 넣게 한다", "답에는 영향이 없다 — 곱 조건만으로 5개가 정해진다"], "말": ["맞다. 홀수만의 부분집합 16개 중 개수 조건으로 3, 4개짜리를 고른다.", "곱이 홀수인지는 개수와 상관없다. 홀수 하나짜리 집합도 곱이 홀수다.", "'3 이상'은 원소의 개수 얘기다. 원소의 크기가 아니다.", "짝수가 들어가면 곱이 짝수가 된다. (나)와 부딪힌다.", "곱 조건만 있으면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007B;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>3<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>5<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>7<\/mn><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math> 의 부분집합이 전부 후보다. 그게 5개뿐일까?"], "풀이": "곱 조건으로 후보는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007B;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>3<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>5<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>7<\/mn><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math> 의 부분집합으로 좁혀진다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>X<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02265;<\/mo><mn>3<\/mn><\/mrow><\/math> 이 그중 원소가 3개, 4개인 것만 남겨 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mrow /><mn>4<\/mn><\/msub><msub><mi mathvariant=\"normal\">C<\/mi><mn>3<\/mn><\/msub><mo>&#x0002B;<\/mo><msub><mrow /><mn>4<\/mn><\/msub><msub><mi mathvariant=\"normal\">C<\/mi><mn>4<\/mn><\/msub><mo>&#x0003D;<\/mo><mn>5<\/mn><\/mrow><\/math> 가 된다. 이 조건이 없으면 원소가 1개, 2개인 것도 들어와 답이 커진다. '3 이상'은 원소의 크기가 아니라 개수다.", "보조": {"질문": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007B;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>3<\/mn><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math> 은 답에 들어가나?", "선지": ["아니다 — 원소가 2개뿐", "아니다 — 곱이 짝수", "그렇다 — 곱이 홀수"], "말": ["맞다. 곱은 홀수지만 개수에서 걸린다. 이 조건이 하는 일이 보인다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x000D7;<\/mo><mn>3<\/mn><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math> 은 홀수다. 곱은 문제없다.", "곱은 맞게 봤다. (가)를 하나 더 확인해 보자."]}}, {"질문": "(가)를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>X<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02265;<\/mo><mn>2<\/mn><\/mrow><\/math> 로 바꾸면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><\/mrow><\/math> 의 개수는?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>11<\/mn><\/mrow><\/math> — <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mrow /><mn>4<\/mn><\/msub><msub><mi mathvariant=\"normal\">C<\/mi><mn>2<\/mn><\/msub><mo>&#x0002B;<\/mo><msub><mrow /><mn>4<\/mn><\/msub><msub><mi mathvariant=\"normal\">C<\/mi><mn>3<\/mn><\/msub><mo>&#x0002B;<\/mo><msub><mrow /><mn>4<\/mn><\/msub><msub><mi mathvariant=\"normal\">C<\/mi><mn>4<\/mn><\/msub><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>5<\/mn><\/mrow><\/math> — 원소 개수 조건은 답에 영향이 없다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>6<\/mn><\/mrow><\/math> — <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mrow /><mn>4<\/mn><\/msub><msub><mi mathvariant=\"normal\">C<\/mi><mn>2<\/mn><\/msub><\/mrow><\/math> 만 더 생긴다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>15<\/mn><\/mrow><\/math> — 공집합만 빼면 된다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>10<\/mn><\/mrow><\/math> — <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mrow /><mn>4<\/mn><\/msub><msub><mi mathvariant=\"normal\">C<\/mi><mn>2<\/mn><\/msub><mo>&#x0002B;<\/mo><msub><mrow /><mn>4<\/mn><\/msub><msub><mi mathvariant=\"normal\">C<\/mi><mn>3<\/mn><\/msub><\/mrow><\/math>"], "말": ["맞다. 원소 2개짜리 6개가 더 생겨 11 이다.", "개수 조건이 느슨해지면 들어오는 집합이 늘어난다. 그대로일까?", "2개짜리가 생기는 건 맞다. 그런데 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007B;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>3<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>5<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>7<\/mn><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math> 에서 2개를 고르는 방법이 하나뿐일까?", "원소 1개짜리도 넣었다. 1개는 2 이상이 아니다.", "3개짜리만 더하고 4개짜리 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007B;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>3<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>5<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>7<\/mn><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math> 을 빠뜨렸다."], "풀이": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007B;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mn>5<\/mn><mo>&#x0002C;<\/mo><mn>7<\/mn><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math> 에서 2개 이상 고르면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>6<\/mn><mo>&#x0002B;<\/mo><mn>4<\/mn><mo>&#x0002B;<\/mo><mn>1<\/mn><mo>&#x0003D;<\/mo><mn>11<\/mn><\/mrow><\/math> 이다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>15<\/mn><\/mrow><\/math> 는 원소 1개짜리까지 넣은 값이다.", "보조": {"질문": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mrow /><mn>4<\/mn><\/msub><msub><mi mathvariant=\"normal\">C<\/mi><mn>2<\/mn><\/msub><\/mrow><\/math> 의 값은?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>6<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>12<\/mn><\/mrow><\/math>"], "말": ["맞다. 원래 5개에 이만큼 더해 보자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mrow /><mn>4<\/mn><\/msub><msub><mi mathvariant=\"normal\">C<\/mi><mn>2<\/mn><\/msub><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>4<\/mn><mo>&#x000D7;<\/mo><mn>3<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math> 이다.", "순서를 따지면 12 다. 집합은 순서가 없으니 2 로 나눈다."]}}, {"질문": "어떤 학생이 답을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>98<\/mn><\/mrow><\/math> 로 적었다. 원인은?", "선지": ["'곱이 홀수'를 '홀수 원소가 적어도 하나'로 읽었다", "1을 홀수가 아니라고 보고 뺐다", "원소 3개 이상인 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><\/mrow><\/math> 의 부분집합을 모두 셌다", "짝수만으로 된 부분집합을 셌다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>X<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02265;<\/mo><mn>3<\/mn><\/mrow><\/math> 을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>X<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math> 으로 읽었다"], "말": ["맞다. 홀수가 하나라도 있으면 되는 걸로 읽어 짝수 섞인 집합까지 셌다.", "1 을 빼면 오히려 셀 집합이 줄어 1개가 된다. 98 처럼 큰 수가 안 나온다.", "그러면 99 다. 98 은 그보다 딱 하나 적다.", "짝수만으로 3개 이상이면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007B;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>4<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>6<\/mn><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math> 하나뿐이다.", "그러면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mrow /><mn>4<\/mn><\/msub><msub><mi mathvariant=\"normal\">C<\/mi><mn>3<\/mn><\/msub><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math> 다. 98 처럼 커지지 않는다."], "풀이": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><\/mrow><\/math> 의 원소 3개 이상 부분집합은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>128<\/mn><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mn>7<\/mn><mo>&#x02212;<\/mo><mn>21<\/mn><mo>&#x0003D;<\/mo><mn>99<\/mn><\/mrow><\/math> 개다. 여기서 홀수가 없는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007B;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mn>4<\/mn><mo>&#x0002C;<\/mo><mn>6<\/mn><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math> 하나만 빼면 98 이다. 곱 조건을 '적어도 하나'로 읽은 결과다.", "보조": {"질문": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><\/mrow><\/math> 의 원소 3개 이상인 부분집합 중 홀수가 하나도 없는 것은?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007B;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>4<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>6<\/mn><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math> 하나", "없다", "3개"], "말": ["맞다. 99 에서 이것 하나를 빼면 98 이다. 학생이 무엇을 셌는지 보인다.", "짝수 2, 4, 6 을 모두 넣은 집합을 떠올려 보자.", "짝수는 3개뿐이라 3개 이상 고르는 방법은 하나다."]}}, {"질문": "이 문제와 같은 핵심 개념으로 푸는 것을 모두 고르면?<br>ㄱ. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007B;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mo>&#x022EF;<\/mo><mo>&#x0002C;<\/mo><mn>6<\/mn><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math> 의 공집합이 아닌 부분집합 중 원소의 곱이 5의 배수가 아닌 것의 개수<br>ㄴ. 1~5에서 중복을 허용해 순서 있는 세 수 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0002C;<\/mo><mi>b<\/mi><mo>&#x0002C;<\/mo><mi>c<\/mi><\/mrow><\/math> 를 고를 때 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mi>b<\/mi><mi>c<\/mi><\/mrow><\/math> 가 홀수인 경우의 수<br>ㄷ. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007B;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mo>&#x022EF;<\/mo><mo>&#x0002C;<\/mo><mn>6<\/mn><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math> 의 부분집합 중 원소의 합이 홀수인 것의 개수", "선지": ["ㄱ, ㄴ", "ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄱ, ㄴ, ㄷ"], "말": ["맞다. ㄱ, ㄴ 모두 곱 조건을 원소 하나하나의 조건으로 바꾼다.", "ㄱ은 잘 봤다. ㄴ은 집합이 아니어도 곱 조건이 똑같이 작동한다.", "ㄴ은 잘 봤다. ㄱ의 '5의 배수가 아님'도 원소 하나하나로 바꿀 수 있는지 보자.", "ㄱ은 잘 봤다. ㄷ의 '합'이 곱처럼 다루어지는지 보자.", "셋 다 홀짝·배수가 나온다. 곱 조건이 어느 것인지 하나씩 보자."], "풀이": "ㄱ은 5를 빼고 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>2<\/mn><mn>5<\/mn><\/msup><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math>, ㄴ은 세 수가 모두 홀수라 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>3<\/mn><mn>3<\/mn><\/msup><\/mrow><\/math> — 둘 다 '곱 조건 → 각 원소 조건'이다. ㄷ의 합의 홀짝은 홀수 원소의 개수로 정해져 다른 개념이다.", "보조": {"질문": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mi>b<\/mi><mi>c<\/mi><\/mrow><\/math> 가 홀수일 때 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>b<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>c<\/mi><\/mrow><\/math> 는?", "선지": ["셋 다 홀수", "적어도 하나는 홀수", "홀수가 짝수 개"], "말": ["맞다. 이 문제와 같은 번역이다. 보기를 다시 보자.", "하나라도 짝수면 곱은 짝수다.", "그건 합의 홀짝을 따질 때 쓰는 생각이다."]}}], "H": {"질문": "이 문제, 첫 발은 뭐로 뗄까?", "선지": ["'곱이 홀수' 를 원소에 대한 말로 바꿔 본다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><\/mrow><\/math> 의 부분집합 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>2<\/mn><mn>7<\/mn><\/msup><\/mrow><\/math> 개를 모두 나열한다", "원소 3개짜리 부분집합 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mrow /><mn>7<\/mn><\/msub><msub><mi mathvariant=\"normal\">C<\/mi><mn>3<\/mn><\/msub><\/mrow><\/math> 부터 센다", "짝수만 골라 곱을 계산한다", "합이 홀수인 경우부터 센다"], "말": ["좋다. 곱이 홀수면 어떤 원소가 들어갈 수 없는지 바로 보인다.", "128 개를 다 쓰면 너무 길다. 조건으로 먼저 좁히자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mrow /><mn>7<\/mn><\/msub><msub><mi mathvariant=\"normal\">C<\/mi><mn>3<\/mn><\/msub><\/mrow><\/math> 에는 곱이 짝수인 것도 섞인다. 곱 조건부터 쓰자.", "짝수가 들어가면 곱이 짝수다. 반대쪽부터 봤다.", "합과 곱의 홀짝은 다르다. 문제는 곱을 묻는다."], "힌트": ["짝수가 하나라도 들어가면 곱은 어떻게 될까? 들어갈 수 있는 원소만 남겨 보자.", "곱이 홀수 ⇔ 원소가 모두 홀수 이므로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><mo>&#x02282;<\/mo><mo stretchy=\"false\">&#x0007B;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>3<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>5<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>7<\/mn><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math> 이다. 여기서 원소 3개 이상을 센다."]}}, {"id": "진덕고 #4-4", "단원": "집합", "발문": "<div class=\"print\"><p class=\"first\">집합 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x0007B;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>2<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>3<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>4<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>5<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>6<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>7<\/mn><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math>의 공집합이 아닌 부분집합 중 다음 조건을 만족시키는 집합 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><\/mrow><\/math>의 개수를 구하시오.<\/p><div class=\"bogi nolbl\"><div class=\"bl\">(가) 집합 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><\/mrow><\/math>의 모든 원소의 곱이 짝수이다.<\/div><div class=\"bl\">(나) 집합 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><\/mrow><\/math>의 모든 원소의 합은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>24<\/mn><\/mrow><\/math> 이하이다.<\/div><\/div><\/div>", "M": [{"질문": "이 문제가 결국 묻는 핵심은?", "선지": ["'적어도 하나'는 없는 경우를 빼고, 큰 합은 빠진 원소로 세는 것", "짝수 원소만으로 이루어진 부분집합을 세는 것", "원소의 합이 24 이하인 경우를 원소 개수별로 모두 나열하는 것", "원소의 곱과 합 사이의 대소 관계를 이용하는 것", "부분집합의 개수 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>2<\/mn><mi>n<\/mi><\/msup><\/mrow><\/math> 에서 공집합 하나만 빼는 것"], "말": ["맞다. 짝수 없는 것을 빼고, 큰 합은 빠진 원소로 뒤집어 센다.", "짝수만으로 된 집합은 일부일 뿐이다. 홀수와 짝수가 섞여도 곱은 짝수다.", "나열하면 경우가 너무 많다. 반대쪽이 훨씬 적지 않을까?", "곱과 합 사이엔 쓸 만한 대소 관계가 없다. 두 조건은 따로 처리한다.", "공집합만 빼면 조건 (가), (나)는 어디서 쓰일까?"], "풀이": "짝수가 하나 이상인 집합은 직접 세기 어렵고 짝수가 없는 것을 빼면 쉽다. 합 24 이하도 합이 큰 몇 안 되는 경우를 빼는 게 빠르다. 하나씩 나열하는 건 핵심이 아니다.", "보조": {"질문": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007B;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x022EF;<\/mo><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>7<\/mn><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math> 의 부분집합 중 짝수가 하나도 없는 것은 몇 개?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>2<\/mn><mn>4<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>16<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>2<\/mn><mn>3<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>8<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>2<\/mn><mn>7<\/mn><\/msup><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0003D;<\/mo><mn>127<\/mn><\/mrow><\/math>"], "말": ["맞다. 이걸 빼면 '짝수가 적어도 하나'가 된다. 처음 질문을 다시 보자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>2<\/mn><mn>3<\/mn><\/msup><\/mrow><\/math> 은 짝수만으로 된 부분집합의 개수다.", "그건 공집합이 아닌 부분집합 전체다."]}}, {"질문": "'합 24 이하' 조건을 처리하는 결정적 단계는?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>28<\/mn><mo>&#x02212;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mtext>빠진&#x000A0;원소의&#x000A0;합<\/mtext><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02265;<\/mo><mn>25<\/mn><\/mrow><\/math> ⇔ 빠진 원소 합 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02264;<\/mo><mn>3<\/mn><\/mrow><\/math>", "빠진 원소의 합이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><\/mrow><\/math> 이하인 것을 뺀다", "합이 25 이상인 것은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><\/mrow><\/math> 자신 하나뿐이다", "짝수 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mo>&#x0002C;<\/mo><mn>4<\/mn><mo>&#x0002C;<\/mo><mn>6<\/mn><\/mrow><\/math> 의 합 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>12<\/mn><\/mrow><\/math> 를 먼저 뺀다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>128<\/mn><mo>&#x02212;<\/mo><mn>16<\/mn><mo>&#x0003D;<\/mo><mn>112<\/mn><\/mrow><\/math> 로 곱 조건을 먼저 정리한다"], "말": ["맞다. 전체 합 28 에서 빠진 것을 빼면 되니, 빠진 원소 합 3 이하만 세면 된다.", "24 '이하' 는 남기는 쪽이다. 빼야 할 건 25 이상이다. 경계를 다시 계산해 보자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><\/mrow><\/math> 자신 말고도 합이 25 이상인 집합이 있다. 원소 하나만 빠진 경우를 보자.", "짝수를 빼면 곱 조건이 깨진다. 합 조건과 섞였다.", "그건 (가)의 처리다. (나)를 처리하는 단계는 아니다."], "풀이": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><\/mrow><\/math> 의 합은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>28<\/mn><\/mrow><\/math> 이라 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><\/mrow><\/math> 의 합 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02265;<\/mo><mn>25<\/mn><\/mrow><\/math> 는 빠진 원소 합 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02264;<\/mo><mn>3<\/mn><\/mrow><\/math> 이다. 그런 경우는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02205;<\/mo><mo>&#x0002C;<\/mo><mo stretchy=\"false\">&#x0007B;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x0007D;<\/mo><mo>&#x0002C;<\/mo><mo stretchy=\"false\">&#x0007B;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x0007D;<\/mo><mo>&#x0002C;<\/mo><mo stretchy=\"false\">&#x0007B;<\/mo><mn>3<\/mn><mo stretchy=\"false\">&#x0007D;<\/mo><mo>&#x0002C;<\/mo><mo stretchy=\"false\">&#x0007B;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math> 5가지다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>112<\/mn><\/mrow><\/math> 는 맞는 계산이지만 (가)의 처리다.", "보조": {"질문": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007B;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x022EF;<\/mo><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>7<\/mn><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math> 에서 원소 1 만 뺀 집합의 원소의 합은?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>27<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>28<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>26<\/mn><\/mrow><\/math>"], "말": ["맞다. 빠진 원소만 보면 합이 바로 나온다. 25 이상이 되려면 빠진 합이 얼마 이하일까?", "28 은 전체 합이다. 1 을 빼야 한다.", "빠진 건 1 뿐이다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>28<\/mn><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math> 을 해 보자."]}}, {"질문": "'<b>공집합이 아닌<\/b> 부분집합 중' 이라는 조건은 답에 어떤 역할을 하나?", "선지": ["답에는 영향이 없다 — 공집합은 짝수 원소가 없어 (가)에서 이미 빠진다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>128<\/mn><\/mrow><\/math> 에서 1 을 더 빼게 해 답이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>106<\/mn><\/mrow><\/math> 이 된다", "빼는 16 개 중 공집합을 돌려놓아 15 개만 빼게 한다", "(나)에서 합이 0 인 경우를 따로 빼게 한다", "시작을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>2<\/mn><mn>7<\/mn><\/msup><\/mrow><\/math> 이 아니라 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>2<\/mn><mn>7<\/mn><\/msup><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math> 로 해서 답을 1 줄인다"], "말": ["맞다. 공집합은 짝수가 없어 (가)에서 이미 탈락한다.", "공집합을 또 빼면 같은 걸 두 번 지운 셈이다. 빼는 16개 안에 이미 무엇이 있을까?", "16개에서 공집합을 돌려놓으면 곱 조건을 못 지키는 공집합이 답에 들어온다.", "합이 0 인 건 공집합뿐이고, 그건 이미 (가)에서 빠졌다.", "시작을 바꾸면 공집합이 두 번 빠진다. 16개 안의 공집합을 떠올려 보자."], "풀이": "(가)는 짝수 원소가 적어도 하나 있다는 뜻이라 공집합은 처음부터 탈락한다. 실제로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>128<\/mn><mo>&#x02212;<\/mo><mn>16<\/mn><\/mrow><\/math> 에서 빼는 16 개에 공집합이 들어 있으니 이 조건이 없어도 답은 107 이다. 1 을 또 빼면 공집합을 두 번 지운 셈이다.", "보조": {"질문": "공집합은 '짝수 원소가 적어도 하나' 를 만족하나?", "선지": ["아니다 — 원소가 없다", "그렇다 — 거짓인 원소가 없다", "알 수 없다"], "말": ["맞다. 그러니 공집합은 (가)에서 이미 걸러진다. 처음 질문을 다시 보자.", "'적어도 하나'는 실제로 하나가 있어야 한다. 공집합엔 없다.", "원소가 없으니 짝수도 없다. 판단할 수 있다."]}}, {"질문": "(나)를 '합이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>25<\/mn><\/mrow><\/math> 이하' 로 바꾸면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><\/mrow><\/math> 의 개수는?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>109<\/mn><\/mrow><\/math> — 빠진 원소 합 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02264;<\/mo><mn>2<\/mn><\/mrow><\/math> 인 3가지만 뺀다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>107<\/mn><\/mrow><\/math> — 경계가 바뀌어도 그대로다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>108<\/mn><\/mrow><\/math> — 빠진 원소가 하나 덜 생긴다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>105<\/mn><\/mrow><\/math> — 빠진 원소 합 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02264;<\/mo><mn>4<\/mn><\/mrow><\/math> 인 것을 뺀다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>112<\/mn><\/mrow><\/math> — 합 조건이 사라진다"], "말": ["맞다. 경계가 하나 올라가 빼야 할 경우가 3가지로 준다.", "경계가 바뀌면 빼는 경우도 바뀐다. 빠진 원소 합의 경계를 다시 잡아 보자.", "방향은 맞다. 몇 가지가 빠지는지 직접 세어 보자.", "경계가 올라가면 빼는 경우가 늘까 줄까? 방향을 확인해 보자.", "합 조건은 여전히 있다. 25 보다 큰 집합은 빼야 한다."], "풀이": "합 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02265;<\/mo><mn>26<\/mn><\/mrow><\/math> ⇔ 빠진 원소 합 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02264;<\/mo><mn>2<\/mn><\/mrow><\/math> 로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02205;<\/mo><mo>&#x0002C;<\/mo><mo stretchy=\"false\">&#x0007B;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x0007D;<\/mo><mo>&#x0002C;<\/mo><mo stretchy=\"false\">&#x0007B;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math> 3가지다. 모두 짝수를 포함하므로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>112<\/mn><mo>&#x02212;<\/mo><mn>3<\/mn><mo>&#x0003D;<\/mo><mn>109<\/mn><\/mrow><\/math> 다.", "보조": {"질문": "합이 26 이상이 되려면 빠진 원소의 합은?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><\/mrow><\/math> 이하", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><\/mrow><\/math> 이하", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math> 이하"], "말": ["맞다. 이제 그런 경우를 세어 112 에서 빼 보자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>28<\/mn><mo>&#x02212;<\/mo><mn>3<\/mn><mo>&#x0003D;<\/mo><mn>25<\/mn><\/mrow><\/math> 다. 26 이상이면 하나 더 작아야 한다.", "빠진 합이 2 인 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007B;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math> 도 합이 26 이다."]}}, {"질문": "어떤 학생이 답을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>105<\/mn><\/mrow><\/math> 로 적었다. 원인은?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>28<\/mn><mo>&#x02212;<\/mo><mn>24<\/mn><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math> 를 보고 빠진 원소 합 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02264;<\/mo><mn>4<\/mn><\/mrow><\/math> 인 7가지를 뺐다", "홀수만의 부분집합에서 공집합을 빼 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>2<\/mn><mn>4<\/mn><\/msup><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math> 로 셌다", "합이 25 이상인 집합 중 짝수 없는 것을 따로 더했다", "전체를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>2<\/mn><mn>7<\/mn><\/msup><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0003D;<\/mo><mn>127<\/mn><\/mrow><\/math> 로 놓고 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>16<\/mn><\/mrow><\/math> 을 뺐다", "곱이 짝수인 것을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>2<\/mn><mn>3<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>8<\/mn><\/mrow><\/math> 개로 셌다"], "말": ["맞다. 경계 24 를 그대로 써서 합이 24 인 경우까지 지웠다.", "그러면 공집합을 한 번 덜 빼서 오히려 108 이 된다.", "합이 25 이상인 5가지는 모두 짝수를 가진다. 더할 게 없다.", "그러면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>111<\/mn><mo>&#x02212;<\/mo><mn>5<\/mn><mo>&#x0003D;<\/mo><mn>106<\/mn><\/mrow><\/math> 이다. 105 는 아니다.", "그러면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>128<\/mn><mo>&#x02212;<\/mo><mn>8<\/mn><\/mrow><\/math> 에서 시작해 답이 오히려 커진다."], "풀이": "빠진 합 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02264;<\/mo><mn>4<\/mn><\/mrow><\/math> 면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007B;<\/mo><mn>4<\/mn><mo stretchy=\"false\">&#x0007D;<\/mo><mo>&#x0002C;<\/mo><mo stretchy=\"false\">&#x0007B;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mn>3<\/mn><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math> 까지 7가지라 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>112<\/mn><mo>&#x02212;<\/mo><mn>7<\/mn><mo>&#x0003D;<\/mo><mn>105<\/mn><\/mrow><\/math> 가 된다. 합이 정확히 24인 것은 남겨야 하니 빠진 합은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><\/mrow><\/math> 이하다.", "보조": {"질문": "합이 정확히 24 인 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><\/mrow><\/math> 는 조건 (나)를 만족하나?", "선지": ["만족한다 — 24 이하", "만족하지 않는다", "곱에 따라 다르다"], "말": ["맞다. 그러니 빠진 합이 4 인 경우는 남겨야 한다. 학생이 몇 개를 더 지웠는지 보자.", "'이하'는 같은 값도 포함한다.", "(나)는 합만 본다. 곱은 (가)의 일이다."]}}, {"질문": "이 문제와 같은 핵심 개념으로 푸는 것을 모두 고르면?<br>ㄱ. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007B;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mo>&#x022EF;<\/mo><mo>&#x0002C;<\/mo><mn>5<\/mn><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math> 의 부분집합 중 원소의 합이 짝수인 것의 개수<br>ㄴ. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007B;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mo>&#x022EF;<\/mo><mo>&#x0002C;<\/mo><mn>5<\/mn><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math> 의 부분집합 중 홀수를 적어도 하나 포함하는 것의 개수<br>ㄷ. 0~9로 만든 네 자리 비밀번호 중 0이 적어도 한 번 나오는 것의 개수", "선지": ["ㄴ, ㄷ", "ㄴ", "ㄷ", "ㄱ, ㄴ", "ㄱ, ㄴ, ㄷ"], "말": ["맞다. ㄴ, ㄷ 모두 '없는 경우' 를 전체에서 뺀다.", "ㄴ은 잘 봤다. ㄷ의 '적어도 한 번'도 같은 방법이 통하는지 보자.", "ㄷ은 잘 봤다. ㄴ의 '적어도 하나'도 같은 꼴이다.", "ㄴ은 잘 봤다. ㄱ의 '합이 짝수'에 '적어도 하나'가 있었나?", "셋 다 세기 문제다. '없는 경우 빼기'를 쓰는 게 어느 것인지 하나씩 보자."], "풀이": "ㄴ은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>2<\/mn><mn>5<\/mn><\/msup><mo>&#x02212;<\/mo><msup><mn>2<\/mn><mn>2<\/mn><\/msup><\/mrow><\/math>, ㄷ은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>10<\/mn><mn>4<\/mn><\/msup><mo>&#x02212;<\/mo><msup><mn>9<\/mn><mn>4<\/mn><\/msup><\/mrow><\/math> 로 둘 다 '없는 경우를 빼기'다. ㄱ은 겉모습이 비슷하지만 홀수 원소의 개수 짝홀로 세는 다른 개념이다.", "보조": {"질문": "네 자리 비밀번호 중 0 이 한 번도 안 나오는 것은?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>9<\/mn><mn>4<\/mn><\/msup><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>10<\/mn><mn>4<\/mn><\/msup><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>9<\/mn><mo>&#x000D7;<\/mo><msup><mn>10<\/mn><mn>3<\/mn><\/msup><\/mrow><\/math>"], "말": ["맞다. 전체에서 이걸 빼면 '적어도 한 번'이다. 보기를 다시 보자.", "그건 전체 개수다.", "그건 첫 자리만 0 이 아닌 경우다. 네 자리 모두 0 이 아니어야 한다."]}}], "H": {"질문": "이 문제, 첫 발은 뭐로 뗄까?", "선지": ["짝수가 없는 부분집합의 개수부터 센다", "짝수를 하나, 둘, 셋 포함하는 경우로 나눈다", "합이 24 이하인 집합을 크기별로 나열한다", "원소 하나짜리부터 곱과 합을 계산해 본다", "전체 합 28 의 절반 14 를 기준으로 삼는다"], "말": ["좋다. '적어도 하나'는 반대쪽이 훨씬 세기 쉽다.", "가능은 하지만 경우가 많아진다. 반대쪽을 세는 길이 짧다.", "합 24 이하는 너무 많다. 큰 쪽이 몇 개 안 된다.", "하나씩 하면 끝이 안 난다. 조건을 반대로 뒤집어 보자.", "14 는 이 문제에 쓰일 데가 없다. 경계는 24 다."], "힌트": ["'짝수가 적어도 하나' 는 '짝수가 하나도 없음' 을 빼면 된다. 합 조건도 반대쪽(합이 큰 쪽)이 적다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>2<\/mn><mn>7<\/mn><\/msup><mo>&#x02212;<\/mo><msup><mn>2<\/mn><mn>4<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>112<\/mn><\/mrow><\/math> 다. 합 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02265;<\/mo><mn>25<\/mn><\/mrow><\/math> 는 전체 합 28 에서 빠진 원소의 합이 3 이하인 경우다."]}}, {"id": "진덕고 #4-5", "단원": "집합", "발문": "<div class=\"print\"><p class=\"first\">다음 조건을 만족시키는 전체집합 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>U<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x0007B;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>2<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>3<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>4<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>5<\/mn><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math>의 두 부분집합 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>B<\/mi><\/mrow><\/math>에 대하여 집합 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><\/mrow><\/math>의 모든 원소가 홀수일 때, 집합 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><\/mrow><\/math>의 모든 원소의 합의 최솟값을 구하시오.<\/p><div class=\"bogi nolbl\"><div class=\"bl\">(가) <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x0222A;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>5<\/mn><\/mrow><\/math>이고 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math>이다.<\/div><div class=\"bl\">(나) 두 집합 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><\/mrow><\/math>와 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><\/mrow><\/math>는 서로소이다.<\/div><\/div><\/div>", "M": [{"질문": "이 문제가 결국 묻는 핵심은?", "선지": ["서로소·합집합 조건으로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><\/mrow><\/math> 가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><\/mrow><\/math> 의 여집합임을 보고 합을 바꿔 보는 것", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><\/mrow><\/math> 에 가장 작은 수 세 개를 넣어 합을 최소로 하는 것", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x0222A;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>n<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mi>n<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mi>n<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 를 구하는 것", "홀수만으로 된 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>U<\/mi><\/mrow><\/math> 의 부분집합의 개수를 세는 것", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline <mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math> 일 때 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x0222A;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math><br>ㄷ. 4명이 동아리 P, Q에 가입하는데 P에 든 사람은 반드시 Q에도 든다. 가입 상태의 경우의 수", "선지": ["ㄱ, ㄷ", "ㄱ", "ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "말": ["맞다. ㄱ, ㄷ 모두 원소마다 갈 수 있는 영역을 정해 곱한다.", "ㄱ은 잘 봤다. ㄷ의 동아리 가입도 원소마다 영역을 고르는 꼴인지 보자.", "ㄷ은 잘 봤다. ㄱ의 식도 영역으로 바꿔 보자.", "ㄷ은 잘 봤다. ㄴ은 개수만 구하는 공식 문제다.", "셋 다 두 집합이 나온다. 원소마다 자리를 정하는 게 어느 것인지 보자."], "풀이": "ㄱ은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x02212;<\/mo><mi>B<\/mi><mo>&#x0003D;<\/mo><mo>&#x02205;<\/mo><\/mrow><\/math> 으로 정리하면 원소마다 3가지라 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>3<\/mn><mn>4<\/mn><\/msup><\/mrow><\/math>, ㄷ은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P<\/mi><mo>&#x02282;<\/mo><mi>Q<\/mi><\/mrow><\/math> 로 같은 구조다. ㄴ은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><mo>&#x0002B;<\/mo><mn>4<\/mn><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0003D;<\/mo><mn>6<\/mn><\/mrow><\/math>, 개수 공식이라 영역 배정과 다르다.", "보조": {"질문": "P 에 든 사람은 반드시 Q 에도 들 때, 한 사람이 고를 수 있는 상태는?", "선지": ["3가지", "4가지", "2가지"], "말": ["맞다. 둘 다, Q 만, 둘 다 안 함. 원소마다 영역을 고르는 구조다. 보기를 다시 보자.", "P 에만 든 상태는 막혀 있다.", "둘 다 안 드는 상태도 있다."]}}], "H": {"질문": "이 문제, 첫 발은 뭐로 뗄까?", "선지": ["주어진 식을 벤 다이어그램의 영역으로 바꿔 본다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>B<\/mi><\/mrow><\/math> 를 하나씩 나열해 조건을 확인한다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x0222A;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x000 th xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>U<\/mi><\/mrow><\/math> 로 봤다면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0222A;<\/mo><mi>B<\/mi><\/mrow><\/math> 의 합 37 이 나온다.", "보조": {"질문": "어떤 집합 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><\/mrow><\/math> 에 대해 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><mo>&#x02229;<\/mo><msup><mi>X<\/mi><mi>C<\/mi><\/msup><\/mrow><\/math> 는?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02205;<\/mo><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>U<\/mi><\/mrow><\/math>"], "말": ["맞다. 식이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><mo>&#x02229;<\/mo><msup><mi>X<\/mi><mi>C<\/mi><\/msup><\/mrow><\/math> 꼴이 되면 0 이 나온다. 학생이 어디서 그 꼴을 만들었을까?", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><\/mrow><\/math> 와 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>X<\/mi><mi>C<\/mi><\/msup><\/mrow><\/math> 는 겹치는 원소가 없다.", "그건 합집합 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>X<\/mi><mo>&#x0222A;<\/mo><msup><mi>X<\/mi><mi>C<\/mi><\/msup><\/mrow><\/math> 다."]}}, {"질문": "이 문제와 같은 핵심 개념으로 푸는 것을 모두 고르면?<br>ㄱ. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>C<\/mi><\/msup><mo>&#x02229;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x0222A;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 의 원소를 구하는 문제<br>ㄴ. 수학과 영어 중 정확히 한 과목만 좋아하는 학생 수를 구하는 문제<br>ㄷ. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x0222A;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02229;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x0222A;<\/mo><msup><mi>B<\/mi><mi>C<\/mi><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 를 간단히 하는 문제", "선지": ["ㄱ, ㄴ", "ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄱ, ㄴ, ㄷ"], "말": ["맞다. ㄱ은 같은 식, ㄴ은 '정확히 한쪽' 이라 같은 개념이다.", "ㄱ은 잘 봤다. ㄴ의 '정확히 한 과목' 을 집합으로 옮겨 보자.", "ㄴ은 잘 봤다. ㄱ의 식을 정리하면 어떻게 되는지 보자.", "ㄱ은 잘 봤다. ㄷ은 정리하면 무엇이 남는지 끝까지 계산해 보자.", "셋 다 비슷한 기호다. '한쪽에만' 이 나오는 게 어느 것인지 보자."], "풀이": "ㄱ은 같은 식을 순서만 바꾼 것, ㄴ은 '정확히 한쪽' 이라 대칭차다. ㄷ은 분배법칙으로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0222A;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mo>&#x02229;<\/mo><msup><mi>B<\/mi><mi>C<\/mi><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>A<\/mi><\/mrow><\/math> — 생김새만 비슷하다.", "보조": {"질문": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x0222A;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02229;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x0222A;<\/mo><msup><mi>B<\/mi><mi>C<\/mi><\/msup><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 를 간단히 하면?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x0222A;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>U<\/mi><\/mrow><\/math>"], "말": ["맞다. 생김새만 비슷할 뿐 결과는 <ma ><\/mrow><\/math> 의 원소의 합 55 에서 시작한다"], "말": ["좋다. 한 덩어리로 바꾸면 식이 '한쪽에만 있는 원소' 로 정리된다.", "그래도 답은 나오지만 원소가 많아 길다. 식을 먼저 줄이자.", "더하면 겹친 3, 7 이 오히려 늘어난다.", "3, 7 이 두 번 들어간다. 게다가 그것들은 빠져야 할 원소다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>U<\/mi><\/mrow><\/math> 에서 시작하면 뺄 게 너무 많다. 식부터 정리하자."], "힌트": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>A<\/mi><mi>C<\/mi><\/msup><mo>&#x0222A;<\/mo><msup><mi>B<\/mi><mi>C<\/mi><\/msup><\/mrow><\/math> 를 '어떤 집합의 여집합' 하나로 바꿀 수 있다. 드모르간 법칙을 떠올리자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>A<\/mi><mi>C<\/mi><\/msup><mo>&#x0222A;<\/mo><msup><mi>B<\/mi><mi>C<\/mi><\/msup><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>C<\/mi><\/msup><\/mrow><\/math> 이므로 식은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x0222A;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x0007B;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>7<\/mn><mo stretchy=\"false\">&#x0007D;<\/mo><\/mrow><\/math> 이다."]}}, {"id": "진덕고 #4-8", "단원": "집합", "발문": "<div class=\"print\"><p class=\"first\">어느 학교의 방과후학교에 개설된 세 강좌 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">A<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi mathvariant=\"normal\">B<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/math> 중 적어도 한 강좌를 수강한 학생 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>100<\/mn><\/mrow><\/math>명을 대상으로 방과후학교 수강 여부를 조사하였더니 강좌 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/math>를 수강한 학생은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>35<\/mn><\/mrow><\/math>명, 강좌 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/math>를 수강한 학생은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>39<\/mn><\/mrow><\/math>명, 강좌 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/math>를 수강한 학생은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>43<\/mn><\/mrow><\/math>명, 세 강좌 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">A<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi mathvariant=\"normal\">B<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/math>를 모두 수강한 학생은 없었다. 세 강좌 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">A<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi mathvariant=\"normal\">B<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/math> 중 한 강좌만 수강한 학생 수를 구하시오.<\/p><\/div>", "M": [{"질문": "이 문제가 결국 묻는 핵심은?", "선지": ["강좌별 인원을 더하면 학생이 듣는 강좌 수만큼 겹쳐 세어짐을 쓰는 것", "세 집합이 서로소라고 보고 인원을 그대로 더하는 것", "벤 다이어그램 7개 영역의 값을 각각 모두 구하는 것", "강좌별 인원의 평균으로 한 강좌 수강생을 추정하는 것", "가장 많은 강좌의 인원을 전체에서 빼는 것"], "말": ["맞다. 인원을 더하면 두 강좌 학생이 두 번 세어진다. 그 차이를 읽는 게 핵심이다.", "서로소면 합이 100 이어야 하는데 117 이다. 겹침이 있다는 뜻이다.", "영역 7개를 다 구하기엔 정보가 모자란다. 그럴 필요도 없다.", "평균은 쓸 데가 없다. 세어진 횟수를 보자.", "가장 많은 강좌 하나를 빼는 데엔 근거가 없다."], "풀이": "한 강좌 학생은 1번, 두 강좌 학생은 2번 세어진다. 그래서 인원 합 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>117<\/mn><\/mrow><\/math> 과 실제 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>100<\/mn><\/mrow><\/math> 의 차가 겹친 횟수다. 영역 7개를 다 구할 필요는 없다.", "보조": {"질문": "A, B 두 강좌만 듣는 학생은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>35<\/mn><mo>&#x0002B;<\/mo><mn>39<\/mn><mo>&#x0002B;<\/mo><mn>43<\/mn><\/mrow><\/math> 에서 몇 번 세어지나?", "선지": ["2번", "1번", "3번"], "말": ["맞다. 그래서 합 117 이 실제 인원 100 보다 많다. 처음 질문을 다시 보자.", "A 에서 한 번, B 에서 또 한 번이다.", "C 는 안 듣는다. 두 강좌만 듣는다."]}}, {"질문": "답을 결정짓는 단계는?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>117<\/mn><mo>&#x02212;<\/mo><mn>100<\/mn><mo>&#x0003D;<\/mo><mn>17<\/mn><\/mrow><\/math> 은 두 번 세어진, 두 강좌 수강생 수", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mi>n<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002B;<\/mo><mi>n<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>C<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>100<\/mn><\/mrow><\/math> 이다", "두 강좌씩 겹친 수는 각각 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>117<\/mn><mo>&#x000F7;<\/mo><mn>3<\/mn><mo>&#x0003D;<\/mo><mn>39<\/mn><\/mrow><\/math>", "세 강좌 모두 들은 학생이 없으니 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0002C;<\/mo><mi>B<\/mi><mo>&#x0002C;<\/mo><mi>C<\/mi><\/mrow><\/math> 는 서로소", "한 강좌만 들은 학생은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>100<\/mn><mo>&#x02212;<\/mo><mn>0<\/mn><mo>&#x0003D;<\/mo><mn>100<\/mn><\/mrow><\/math>"], "말": ["맞다. 세 강좌 학생이 없으니 117 과 100 의 차가 곧 두 강좌 학생 수다.", "합은 117 이다. 100 은 합집합의 인원이다.", "겹친 수가 세 쌍에 똑같이 나뉠 이유가 없다. 각 쌍을 따로 알 필요도 없다.", "세 강좌 공통이 없다고 두 강좌 겹침까지 없는 건 아니다.", "100 명 모두 한 강좌만 들었다면 합이 100 이어야 한다."], "풀이": "세 강좌 학생이 없으니 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>117<\/mn><mo>&#x02212;<\/mo><mn>100<\/mn><mo>&#x0003D;<\/mo><mn>17<\/mn><\/mrow><\/math> 이 곧 두 강좌만 들은 학생 수다. 한 강좌만은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>100<\/mn><mo>&#x02212;<\/mo><mn>17<\/mn><mo>&#x0003D;<\/mo><mn>83<\/mn><\/mrow><\/math> 이다. 세 강좌 공통이 없다고 두 강좌 겹침까지 없는 건 아니다.", "보조": {"질문": "한 강좌만 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><\/mrow><\/math> 명, 두 강좌만 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>q<\/mi><\/mrow><\/math> 명이면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>35<\/mn><mo>&#x0002B;<\/mo><mn>39<\/mn><mo>&#x0002B;<\/mo><mn>43<\/mn><\/mrow><\/math> 은?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>q<\/mi><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><mo>&#x0002B;<\/mo><mi>q<\/mi><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>p<\/mi><mo>&#x0002B;<\/mo><mi>q<\/mi><\/mrow><\/math>"], "말": ["맞다. 그리고 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><mo>&#x0002B;<\/mo><mi>q<\/mi><mo>&#x0003D;<\/mo><mn>100<\/mn><\/mrow><\/math> 이다. 두 식을 빼 보자.", "그건 실제 학생 수다. 강좌 인원 합에선 두 강좌 학생이 더 세어진다.", "두 번 세어지는 건 두 강좌 학생 쪽이다."]}}, {"질문": "'<b>적어도 한 강좌를 수강한<\/b> 학생 100명' 이라는 조건은 풀이에서 어떤 역할을 하나?", "선지": ["100 이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi mathvariant=\"normal\">A<\/mi><mo>&#x0222A;<\/mo><mi mathvariant=\"normal\">B<\/mi><mo>&#x0222A;<\/mo><mi mathvariant=\"normal\">C<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 임을 알려 준다", "100 이 전체 학생 수라 안 들은 학생 수를 따로 빼야 한다", "100명이 모두 정확히 한 강좌만 들었다는 뜻이다", "100 이 수강 인원의 합 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>35<\/mn><mo>&#x0002B;<\/mo><mn>39<\/mn><mo>&#x0002B;<\/mo><mn>43<\/mn><\/mrow><\/math> 과 같다는 뜻이다", "세 강좌를 모두 들은 학생이 없다는 것을 알려 준다"], "말": ["맞다. 조사 대상이 모두 한 강좌 이상이라 100 이 곧 합집합 인원이다.", "안 들은 학생은 처음부터 조사 대상이 아니다. 따로 뺄 사람이 없다.", "한 강좌만 들었다면 합이 100 이어야 한다. 117 과 맞지 않는다.", "합은 117 로 100 과 다르다. 그 차이가 바로 겹친 수강이다.", "세 강좌 수강자 없음은 문제에 따로 적힌 조건이다."], "풀이": "조사 대상이 모두 한 강좌 이상 들었으므로 100 은 세 집합의 합집합의 원소 수다. 그래서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>100<\/mn><mo>&#x0003D;<\/mo><mn>117<\/mn><mo>&#x02212;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mtext>두&#x000A0;강좌만&#x000A0;수강<\/mtext><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 으로 두 강좌만 들은 17명이 나온다. 수강 인원의 합은 117 로 100 과 다르고, 그 차이가 겹친 수강이다. 세 강좌 모두 수강자가 없다는 건 별도 조건이다.", "보조": {"질문": "'적어도 한 강좌를 수강' 을 집합 연산으로 나타내면?", "선지": ["합집합", "교집합", "여집합"], "말": ["맞다. 그러니 100 은 어느 집합의 원소 수일까? 처음 질문을 다시 보자.", "교집합은 '모두 수강' 이다.", "여집합은 '수강하지 않음' 이다."]}}, {"질문": "'세 강좌 모두 수강한 학생은 없었다' 를 '5명이었다' 로 바꾸면 한 강좌만 수강한 학생 수는?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>88<\/mn><\/mrow><\/math> — 두 강좌만 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>17<\/mn><mo>&#x02212;<\/mo><mn>10<\/mn><mo>&#x0003D;<\/mo><mn>7<\/mn><\/mrow><\/math> 명", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>83<\/mn><\/mrow><\/math> — 원래와 같다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>78<\/mn><\/mrow><\/math> — 5명만큼 줄어든다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>73<\/mn><\/mrow><\/math> — 두 강좌·세 강좌를 모두 뺀다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>95<\/mn><\/mrow><\/math> — 100에서 5만 뺀다"], "말": ["맞다. 세 강좌 학생이 겹침 17 중 10 을 차지해 두 강좌 학생은 7 명이다.", "세 강좌 학생이 생기면 두 강좌 학생 수가 달라진다. 그대로일까?", "5 명을 그냥 빼면 세 번 세어진 걸 놓친다. 세어진 횟수를 다시 보자.", "두 강좌 학생 수가 아직 17 인지 확인해 보자.", "두 강좌 학생도 빼야 한다."], "풀이": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><mo>&#x0002B;<\/mo><mi>q<\/mi><mo>&#x0002B;<\/mo><mi>r<\/mi><mo>&#x0003D;<\/mo><mn>100<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>q<\/mi><mo>&#x0002B;<\/mo><mn>3<\/mn><mi>r<\/mi><mo>&#x0003D;<\/mo><mn>117<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><mo>&#x0003D;<\/mo><mn>5<\/mn><\/mrow><\/math> 면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>q<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>r<\/mi><mo>&#x0003D;<\/mo><mn>17<\/mn><\/mrow><\/math> 이라 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>q<\/mi><mo>&#x0003D;<\/mo><mn>7<\/mn><\/mrow><\/math> 이다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><mo>&#x0003D;<\/mo><mn>100<\/mn><mo>&#x02212;<\/mo><mn>7<\/mn><mo>&#x02212;<\/mo><mn>5<\/mn><mo>&#x0003D;<\/mo><mn>88<\/mn><\/mrow><\/math> 이다. 세 강좌 학생은 3번 세어져 겹침 17 중 10을 차지한다.", "보조": {"질문": "세 강좌를 모두 듣는 학생은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>35<\/mn><mo>&#x0002B;<\/mo><mn>39<\/mn><mo>&#x0002B;<\/mo><mn>43<\/mn><\/mrow><\/math> 에서 몇 번 세어지나?", "선지": ["3번", "1번", "2번"], "말": ["맞다. 그럼 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>q<\/mi><mo>&#x0002B;<\/mo><mn>3<\/mn><mi>r<\/mi><mo>&#x0003D;<\/mo><mn>117<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><mo>&#x0002B;<\/mo><mi>q<\/mi><mo>&#x0002B;<\/mo><mi>r<\/mi><mo>&#x0003D;<\/mo><mn>100<\/mn><\/mrow><\/math> 이다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><mo>&#x0003D;<\/mo><mn>5<\/mn><\/mrow><\/math> 를 넣어 보자.", "강좌마다 한 번씩 세어진다.", "세 강좌를 듣는다."]}}, {"질문": "어떤 학생이 답을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>66<\/mn><\/mrow><\/math> 으로 적었다. 원인은?", "선지": ["두 강좌 수강생 17명을 두 번 세어 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>100<\/mn><mo>&#x02212;<\/mo><mn>34<\/mn><\/mrow><\/math> 로 뺐다", "두 강좌 수강생 수를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>117<\/mn><mo>&#x000F7;<\/mo><mn>3<\/mn><mo>&#x0003D;<\/mo><mn>39<\/mn><\/mrow><\/math> 로 구했다", "전체를 117명으로 놓고 17을 뺐다", "세 강좌 수강생을 17명으로 봤다", "강좌별 인원을 서로소로 보고 더했다"], "말": ["맞다. 강좌 합에서 두 번 세어진 것과 실제 인원을 헷갈렸다.", "그 숫자로는 66 이 만들어지지 않는다. 66 을 100 에서 무엇을 뺀 값으로 볼 수 있을까?", "그러면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>117<\/mn><mo>&#x02212;<\/mo><mn>17<\/mn><mo>&#x0003D;<\/mo><mn>100<\/mn><\/mrow><\/math> 이다.", "세 강좌 학생은 0 명이라고 주어졌다.", "서로소로 보면 겹침이 없어서 117 이 나와야 한다."], "풀이": "두 강좌 학생은 인원 합에서 두 번 세어졌지만, 100명 안에서는 한 번씩만 있다. 그래서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>100<\/mn><mo>&#x02212;<\/mo><mn>17<\/mn><mo>&#x0003D;<\/mo><mn>83<\/mn><\/mrow><\/math> 이고 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>100<\/mn><mo>&#x02212;<\/mo><mn>34<\/mn><mo>&#x0003D;<\/mo><mn>66<\/mn><\/mrow><\/math> 이 아니다.", "보조": {"질문": "두 강좌만 듣는 학생 17 명은 실제 100 명 안에 몇 번 들어 있나?", "선지": ["1번", "2번", "0번"], "말": ["맞다. 사람은 한 번씩만 있다. 100 에서 몇을 빼야 할지 보자.", "두 번 세어진 건 강좌 인원 합에서다. 사람 수에선 한 번이다.", "그들도 100 명 안에 있다."]}}, {"질문": "이 문제와 같은 핵심 개념으로 푸는 것을 모두 고르면?<br>ㄱ. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>35<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>39<\/mn><\/mrow><\/math> 일 때 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 의 최댓값<br>ㄴ. 30명이 각자 동아리 1개 또는 2개에 들고, 동아리 인원의 합이 42일 때 2개 든 학생 수<br>ㄷ. 40명 모두 사과·배 중 하나 이상 좋아하고, 사과 25명·배 22명일 때 둘 다 좋아하는 학생 수", "선지": ["ㄴ, ㄷ", "ㄴ", "ㄷ", "ㄱ, ㄴ", "ㄱ, ㄴ, ㄷ"], "말": ["맞다. ㄴ, ㄷ 모두 '합 − 전체' 로 겹친 수를 구한다.", "ㄴ은 잘 봤다. ㄷ도 두 집합 인원을 더하면 겹친 학생이 두 번 세어진다.", "ㄷ은 잘 봤다. ㄴ의 동아리도 같은 구조다.", "ㄴ은 잘 봤다. ㄱ은 전체 인원이 없어 같은 방법을 못 쓴다.", "셋 다 겹치는 인원이 나온다. 전체가 주어져 '합 − 전체' 를 쓸 수 있는 게 어느 것인지 보자."], "풀이": "ㄴ은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>42<\/mn><mo>&#x02212;<\/mo><mn>30<\/mn><mo>&#x0003D;<\/mo><mn>12<\/mn><\/mrow><\/math>, ㄷ은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>25<\/mn><mo>&#x0002B;<\/mo><mn>22<\/mn><mo>&#x02212;<\/mo><mn>40<\/mn><mo>&#x0003D;<\/mo><mn>7<\/mn><\/mrow><\/math> 로 '합 − 전체 = 겹친 수' 다. ㄱ은 겉모습은 같지만 포함 관계 극단(<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x02282;<\/mo><mi>B<\/mi><\/mrow><\/math>)으로 최댓값 35 를 찾는 문제다.", "보조": {"질문": "ㄱ에서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>A<\/mi><mo>&#x02229;<\/mo><mi>B<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 가 가장 클 때는?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x02282;<\/mo><mi>B<\/mi><\/mrow><\/math> 일 때", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0222A;<\/mo><mi>B<\/mi><\/mrow><\/math> 가 가장 클 때", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>A<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>B<\/mi><\/mrow><\/math> 가 서로소일 때"], "말": ["맞다. 이건 포함 관계 극단으로 푸는 다른 개념이다. 보기를 다시 보자.", "합집합이 커지면 오히려 겹침은 줄어든다.", "서로소면 겹침은 0 이다."]}}], "H": {"질문": "이 문제, 첫 발은 뭐로 뗄까?", "선지": ["한 강좌만, 두 강좌만 듣는 학생 수를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>q<\/mi><\/mrow><\/math> 로 둔다", "벤 다이어그램 7개 영역을 모두 문자로 둔다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>35<\/mn><mo>&#x0002B;<\/mo><mn>39<\/mn><mo>&#x0002B;<\/mo><mn>43<\/mn><\/mrow><\/math> 을 그대로 답으로 쓴다", "100 을 3 으로 나눠 강좌당 인원을 잡는다", "가장 큰 강좌 43 명을 100 에서 뺀다"], "말": ["좋다. 사람 수와 강좌 인원 합, 두 식이 바로 나온다.", "문자가 너무 많아 식이 모자란다. 묻는 건 묶음 수다.", "그건 겹친 사람까지 두 번 센 합이다.", "강좌마다 인원이 이미 주어져 있다.", "근거가 없다. 겹침을 세는 방법을 찾자."], "힌트": ["학생 한 명은 듣는 강좌 수만큼 강좌 인원 합에 세어진다. 사람 수와 인원 합을 따로 식으로 쓰자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><mo>&#x0002B;<\/mo><mi>q<\/mi><mo>&#x0003D;<\/mo><mn>100<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>q<\/mi><mo>&#x0003D;<\/mo><mn>35<\/mn><mo>&#x0002B;<\/mo><mn>39<\/mn><mo>&#x0002B;<\/mo><mn>43<\/mn><mo>&#x0003D;<\/mo><mn>117<\/mn><\/mrow><\/math> 이다."]}}];</script><script>
const NS=STEPNAME.length, ALL=[...Array(NS).keys()], SI=n=>STEPNAME.indexOf(n);
const WH=[['무엇을 묻는 문제인지부터 헷갈렸다',SI('무엇을 묻나')],['식을 어떻게 세울지 몰랐다',SI('어디서 쓰이나')],['조건을 놓쳤거나 잘못 읽었다',SI('조건의 역할')]]
  .concat(SI('원본↔변형')>=0?[['변형에서 바뀐 걸 어떻게 처리할지 몰랐다',SI('원본↔변형')]]:[])
  .concat([['계산하거나 답 고르다 틀렸다',SI('함정')],['잘 모르겠다',0]]);
const KEY='haebu-tree:'+META.id;
let S={pi:0,log:[]};
const $=s=>document.querySelector(s);
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function rnd(seed){let x=seed%2147483647;if(x<=0)x+=2147483646;return()=>(x=x*16807%2147483647)/2147483647;}
function hash(s){let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))%1000003;return h;}
function shuffled(n,tag){const r=rnd(hash(META.id+tag)+n);const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function scrollEnd(n){setTimeout(()=>n.scrollIntoView({behavior:'smooth',block:'start'}),60);}

/* 카드 하나: 질문 + 선지. onPick(원래 인덱스) */
function ask(box,lab,labc,q,opts,tag,locked,onPick){
  const b=el('div','bub q');b.appendChild(el('div','lab'+(labc?' '+labc:''),lab));b.appendChild(el('div','',q));
  const g=el('div','opts');const ord=(tag==='in'||tag==='wh')?[...opts.keys()]:shuffled(opts.length,tag);
  ord.forEach((k,i)=>{const o=el('button','op'+((locked||[]).includes(k)?' lock':''),'<b>'+'①②③④⑤⑥⑦⑧'[i]+'</b><span>'+opts[k]+'</span>');
    o.onclick=()=>{if(g.classList.contains('done'))return;
      g.querySelectorAll('.op').forEach(x=>x.classList.remove('pick'));o.classList.add('pick');sel=[k,o];
      ok.disabled=false;ok.textContent='이걸로 할게';};g.appendChild(o);});
  // (1009) 바로 넘어가지 않는다 — 고른 뒤 [이걸로 할게] 를 눌러야 확정. 잘못 터치하면 다른 걸 다시 고르면 된다.
  let sel=null;const ok=el('button','nx cf','하나 골라 봐');ok.disabled=true;
  ok.onclick=()=>{if(!sel||g.classList.contains('done'))return;g.classList.add('done');ok.remove();onPick(sel[0],sel[1],g);};
  b.appendChild(g);b.appendChild(ok);box.appendChild(b);scrollEnd(b);return g;
}
function say(box,cls,h){const b=el('div','bub say '+cls,h);box.appendChild(b);return b;}
function nextBtn(box,txt,fn){const n=el('button','nx',txt);n.onclick=()=>{n.remove();fn();};box.appendChild(n);scrollEnd(n);}

function runProblem(pi){
  const P=PROBS[pi];const root=$('#thread');root.innerHTML='';
  const card=$('#prob');card.innerHTML='';card.className='prob';
  card.appendChild(el('div','ph',(pi+1)+' / '+PROBS.length+' · '+P.id+(P.단원?' · '+P.단원:'')));
  card.appendChild(el('div','stem',P.발문));
  const tog=el('button','tog','문제 접기');tog.onclick=()=>{card.classList.toggle('fold');tog.textContent=card.classList.contains('fold')?'문제 펼치기':'문제 접기';};card.appendChild(tog);
  const dots=el('div','dots');for(let k=0;k<NS;k++)dots.appendChild(el('i'));card.appendChild(dots);
  const res=Array(NS).fill(null);   // 'o' | 't' | 'x'
  const rec={id:P.id,입구:null,갈림:null,첫발:null,스텝:[]};
  const paint=cur=>dots.querySelectorAll('i').forEach((d,k)=>d.className=res[k]||(k===cur?'cur':''));

  // ① 입구
  ask(root,'먼저','', META.입구,
    ['맞혔고, 왜 그런지 설명도 할 수 있다','맞히긴 했는데 감으로 풀었다','풀었는데 틀렸다','손도 못 댔다'],'in',[],k=>{
      rec.입구=k;
      if(k<=1){say(root,'',k===0?'좋아. 그럼 진짜 설명할 수 있는지 하나씩 확인해 보자.':'감으로 맞힌 건 다음엔 틀릴 수 있다. 근거를 하나씩 세워 보자.');go(ALL);}
      else if(k===2){
        ask(root,'어디서','', '어디서 갈렸던 것 같아?',
          WH.map(x=>x[0]),'wh',[],j=>{
            rec.갈림=j;const first=WH[j][1];
            say(root,'','그럼 거기부터 보자. 나머지도 이어서 짚는다.');
            go([first,...ALL.filter(x=>x!==first)]);});
      } else firstStep(()=>go(ALL));
    });

  function firstStep(done){
    const H=P.H;let tries=0;const locked=[];
    const once=()=>ask(root,'첫 발','h',H.질문,H.선지,'H'+tries,locked,(k,o)=>{
      if(k===0){o.classList.add('right');say(root,'ok',H.말[0]);rec.첫발=tries;nextBtn(root,'이제 문제를 뜯어보자',done);}
      else{o.classList.add('wrong');locked.push(k);say(root,'no',H.말[k]);
        if(tries===0){tries=1;say(root,'sol','💡 '+H.힌트[0]);nextBtn(root,'다시 골라 볼게',once);}
        else{say(root,'sol','💡 '+H.힌트[1]);rec.첫발=2;nextBtn(root,'이제 문제를 뜯어보자',done);}}
    });
    once();
  }

  function go(order){
    let i=0;
    const step=()=>{
      if(i>=order.length)return finish();
      const s=order[i++];paint(s);const M=P.M[s];const locked=[];
      const lab='STEP '+(s+1)+' · '+STEPNAME[s];
      ask(root,lab,'',M.질문,M.선지,'M'+s,locked,(k,o)=>{
        if(k===0){o.classList.add('right');say(root,'ok',M.말[0]);res[s]='o';rec.스텝[s]={결과:'o',고른것:[k]};paint(-1);nextBtn(root,i<order.length?'다음':'정리 보기',step);return;}
        o.classList.add('wrong');locked.push(k);say(root,'no',M.말[k]);const picks=[k];
        // 보조 → 재도전
        nextBtn(root,'작은 것부터 확인',()=>{
          const B=M.보조;
          ask(root,'디딤돌','sub',B.질문,B.선지,'B'+s,[],(j,o2)=>{
            o2.classList.add(j===0?'right':'wrong');say(root,j===0?'ok':'no',B.말[j]);
            if(j!==0)say(root,'sol','디딤돌 답: '+B.선지[0]);
            nextBtn(root,'처음 질문 다시',()=>{
              ask(root,lab+' · 다시','',M.질문,M.선지,'M'+s+'r',locked,(k2,o3)=>{
                picks.push(k2);
                if(k2===0){o3.classList.add('right');say(root,'ok','다시 잡았다. '+M.말[0]);res[s]='t';}
                else{o3.classList.add('wrong');say(root,'no',M.말[k2]);say(root,'sol','<b>정리</b> '+M.풀이);res[s]='x';}
                rec.스텝[s]={결과:res[s],고른것:picks,디딤돌:j};paint(-1);
                nextBtn(root,i<order.length?'다음':'정리 보기',step);
              });
            });
          });
        });
      });
    };
    step();
  }

  function finish(){
    paint(-1);S.log[pi]=rec;save();
    const sm=el('div','sum');sm.appendChild(el('h3','',P.id+' 정리'));
    const mk={o:['○','o','한 번에'],t:['△','t','디딤돌 뒤'],x:['✕','x','다시 볼 것']};
    for(let k=0;k<NS;k++){const r=res[k];const m=r?mk[r]:['–','s','건너뜀'];
      const row=el('div','row');row.appendChild(el('span','','STEP '+(k+1)+' '+STEPNAME[k]));row.appendChild(el('span','mk '+m[1],m[0]+' '+m[2]));sm.appendChild(row);}
    const weak=ALL.filter(k=>res[k]==='x'||res[k]==='t');
    sm.appendChild(el('div','weak',weak.length?'<b>여기가 약한 곳</b> · '+weak.map(k=>STEPNAME[k]).join(', ')+(rec.입구<=1&&weak.length>=2?'<br>맞힌 문제였는데도 여기서 걸렸다 — 답을 외운 건 아닌지 다시 보자.':''):'<b>'+NS+'군데 다 한 번에 통과.</b> 이 문제는 진짜 네 거다.'));
    root.appendChild(sm);
    if(pi+1<PROBS.length)nextBtn(root,'다음 문제 →',()=>{S.pi=pi+1;save();window.scrollTo(0,0);runProblem(pi+1);});
    else root.appendChild(el('div','bub say ok','오늘 세트 끝. 수고했다.'));
    scrollEnd(sm);
  }
}
try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.log)S=d;}catch(e){}
runProblem(Math.min(S.pi||0,PROBS.length-1));
</script></body></html>
