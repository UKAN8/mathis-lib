원 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C<\/mi><\/mrow><\/math>와 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>축의 교점을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">P<\/mi><\/mrow><\/math>, 두 원 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C<\/mi><\/mrow><\/math>와 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>D<\/mi><\/mrow><\/math>의 교점을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">Q<\/mi><\/mrow><\/math>, 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\"normal\">Q<\/mi><\/mrow><\/mrow><\/math>와 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축의 교점을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">R<\/mi><\/mrow><\/math>이라 하자. 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">R<\/mi><\/mrow><\/math>의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>좌표를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>r<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>라 할 때, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><msub><mo>lim<\/mo><mrow><mi>r<\/mi><mo>&#x02192;<\/mo><mn>0<\/mn><mo>&#x0002B;<\/mo><\/mrow><\/msub><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>r<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mstyle><\/mrow><\/math>의 값을 구하시오. (단, 두 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">P<\/mi><\/mrow><\/math>와 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">Q<\/mi><\/mrow><\/math>의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>좌표는 양수이다.)<br>※ 그림 생략 — 원 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C<\/mi><\/mrow><\/math>: <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><msup><mi>r<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>, 원 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>D<\/mi><\/mrow><\/math>: <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math><\/div>", "M": [{"질문": "이 문제가 결국 묻는 것은?", "선지": ["점 R의 좌표를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><\/mrow><\/math>의 식으로 놓고 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>0<\/mn><mn>0<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 꼴 극한을 정리해 구하는 것", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><mo>&#x02192;<\/mo><mn>0<\/mn><mo>&#x0002B;<\/mo><\/mrow><\/math> 이면 세 점이 원점에 모이니 R도 원점이라고 보는 것", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 을 계산해 극한값으로 쓰는 것", "두 원이 접할 때의 접점 좌표를 구하는 것", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mo>&#x0221E;<\/mo><\/mrow><mrow><mo>&#x0221E;<\/mo><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math> 꼴에서 최고차항의 계수를 비교하는 것"], "말": ["맞다. 그림이 작아질 때 R이 어디로 가는지를 식으로 따라가는 문제다.", "P, Q는 원점으로 모이지만 R까지 따라간다는 근거는 없다. 직선의 방향이 어떻게 되는지 생각해 보자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 이면 원 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C<\/mi><\/mrow><\/math> 자체가 없다. 극한은 그 점의 값이 아니라 다가가는 값이다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><\/mrow><\/math> 은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><\/mrow><\/math>보다 작아서 두 원은 늘 두 점에서 만난다. 접하는 상황은 묻지 않는다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><mo>&#x02192;<\/mo><mn>0<\/mn><mo>&#x0002B;<\/mo><\/mrow><\/math> 이다. 무한대로 가는 변수가 있는지 다시 보자."], "풀이": "P, Q, R의 좌표를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><\/mrow><\/math>로 나타내면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>r<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><msup><mi>r<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>2<\/mn><mo>&#x02212;<\/mo><msqrt><mrow><mn>4<\/mn><mo>&#x02212;<\/mo><msup><mi>r<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msqrt><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math> 이고, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><mo>&#x02192;<\/mo><mn>0<\/mn><mo>&#x0002B;<\/mo><\/mrow><\/math> 에서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>0<\/mn><mn>0<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 꼴이다. 유리화해서 극한을 구하는 것이 핵심이다. 'R도 원점'은 직선 PQ가 점점 어느 방향으로 기우는지 무시한 생각이다.", "보조": {"질문": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><\/mrow><\/math> 이 아주 작을 때 직선 PQ와 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축의 교점 R은 어떻게 되나?", "선지": ["식으로 따져 봐야 안다 — 그림만으론 모른다", "P, Q와 같이 원점으로 간다", "무한히 멀어진다"], "말": ["맞다. P, Q가 모여도 직선의 기울기에 따라 R은 어디든 갈 수 있다. 처음 질문으로.", "P, Q가 가까워지면 직선 PQ의 방향이 문제다. R이 꼭 따라오진 않는다.", "그럴 수도 있어 보이지만 근거가 없다. 계산해 봐야 한다."]}}, {"질문": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>r<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 을 구한 뒤 극한값이 실제로 나오는 단계는?", "선지": ["분모를 유리화해 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>r<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>2<\/mn><mo>&#x0002B;<\/mo><msqrt><mrow><mn>4<\/mn><mo>&#x02212;<\/mo><msup><mi>r<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msqrt><\/mrow><\/math> 로 정리한다", "두 원의 식을 빼서 Q의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>좌표 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><msup><mi>r<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math> 를 얻는다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><msup><mi>r<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>2<\/mn><mo>&#x02212;<\/mo><msqrt><mrow><mn>4<\/mn><mo>&#x02212;<\/mo><msup><mi>r<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msqrt><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math> 에 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 을 넣어 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displa <\/mo><mn>1<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><\/mrow><\/math> 는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math>. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math>: <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><\/mrow><\/math> 는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><\/mrow><\/math> 는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>1<\/mn><\/mrow><\/math>. 이제 곱하고 더하자."]}}];</script><script>
const NS=STEPNAME.length, ALL=[...Array(NS).keys()], SI=n=>STEPNAME.indexOf(n);
const WH=[['무엇을 묻는 문제인지부터 헷갈렸다',SI('무엇을 묻나')],['식을 어떻게 세울지 몰랐다',SI('어디서 쓰이나')],['조건을 놓쳤거나 잘못 읽었다',SI('조건의 역할')]]
  .concat(SI('원본↔변형')>=0?[['변형에서 바뀐 걸 어떻게 처리할지 몰랐다',SI('원본↔변형')]]:[])
  .concat([['계산하거나 답 고르다 틀렸다',SI('함정')],['잘 모르겠다',0]]);
const KEY='haebu-tree:'+META.id;
let S={pi:0,log:[],att:{}};
/* (1010) 진행 기록 → DB haebu_log (schema_v37). 포털에서 ?t=<토큰> 으로 열었을 때만. 실패는 조용히. */
const TOK=new URLSearchParams(location.search).get('t')||'';
function sync(P,rec,res,done){
  if(!TOK||!DB.url) return;
  const body={skey:META.skey,pan:META.pan,id:P.id,unit:P.단원||'',try:rec.try||1,in:rec.입구,wh:rec.갈림,h:rec.첫발,

  try{fetch(DB.url+'/rest/v1/rpc/haebu_submit',{method:'POST',keepalive:true,
    headers:{'Content-Type':'application/json','apikey':DB.anon,'Authorization':'Bearer '+DB.anon},
    body:JSON.stringify({tok:TOK,rec:body})}).catch(()=>{});}catch(e){}
}
const $=s=>document.querySelector(s);

function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function rnd(seed){let x=seed%2147483647;if(x<=0)x+=2147483646;return()=>(x=x*16807%2147483647)/2147483647;}

// (1011) 문항마다 다른 순서 — 전엔 세트 id 로만 섞어 같은 스텝 정답 위치가 문항마다 같았다(학생이 위치를 외워 통과)
function shuffled(n,tag){const r=rnd(hash(META.id+'|'+CURID+'|'+tag)+n);const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function scrollEnd(n){setTimeout(()=>n.scrollIntoView({behavior:'smooth',block:'start'}),60);}

/* 카드 하나: 질문 + 선지. onPick(원래 인덱스) */
function ask(box,lab,labc,q,opts,tag,locked,onPick){
  const b=el('div','bub q');b.appendChild(el('div','lab'+(labc?' '+labc:''),lab));b.appendChild(el('div','',q));
  const g=el('div','opts');const ord=(tag==='in'||tag==='wh')?[...opts.keys()]:shuffled(opts.length,tag);

    o.onclick=()=>{if(g.classList.contains('done'))return;
      g.querySelectorAll('.op').forEach(x=>x.classList.remove('pick'));o.classList.add('pick');sel=[k,o];

}
function say(box,cls,h){const b=el('div','bub say '+cls,h);box.appendChild(b);return b;}
function nextBtn(box,txt,fn){const n=el('button','nx',txt);n.onclick=()=>{n.remove();fn();};box.appendChild(n);scrollEnd(n);}

function runProblem(pi){

  const dots=el('div','dots');for(let k=0;k<NS;k++)dots.appendChild(el('i'));card.appendChild(dots);

            rec.갈림=j;const first=WH[j][1];

    });

  function firstStep(done){
    const H=P.H;let tries=0;const locked=[];
    const once=()=>ask(root,'첫 발','h',H.질문,H.선지,'H'+tries,locked,(k,o)=>{

      else{o.classList.add('wrong');locked.push(k);say(root,'no',H.말[k]);
        if(tries===0){tries=1;say(root,'sol','💡 '+H.힌트[0]);nextBtn(root,'다시 골라 볼게',once);}
        else{say(root,'sol','💡 '+H.힌트[1]);rec.첫발=2;nextBtn(root,'이제 문제를 뜯어보자',done);}}
    });
    once();
  }

  function go(order){
    let i=0;
    const step=()=>{
      if(i>=order.length)return finish();
      const s=order[i++];paint(s);const M=P.M[s];const locked=[];
      const lab='STEP '+(s+1)+' · '+STEPNAME[s];
      ask(root,lab,'',M.질문,M.선지,'M'+s,locked,(k,o)=>{

      const row=el('div','row');row.appendChild(el('span','','STEP '+(k+1)+' '+STEPNAME[k]));row.appendChild(el('span','mk '+m[1],m[0]+' '+m[2]));sm.appendChild(row);}
    const weak=ALL.filter(k=>res[k]==='x'||res[k]==='t');
    sm.appendChild(el('div','weak',weak.length?'<b>여기가 약한 곳</b> · '+weak.map(k=>STEPNAME[k]).join(', ')+(rec.입구<=1&&weak.length>=2?'<br>맞힌 문제였는데도 여기서 걸렸다 — 답을 외운 건 아닌지 다시 보자.':''):'<b>'+NS+'군데 다 한 번에 통과.</b> 이 문제는 진짜 네 거다.'));
    root.appendChild(sm);
    if(pi+1<PROBS.length)nextBtn(root,'다음 문제 →',()=>{S.pi=pi+1;save();window.scrollTo(0,0);runProblem(pi+1);});
    else root.appendChild(el('div','bub say ok','오늘 세트 끝. 수고했다.'));
    scrollEnd(sm);
  }
}
try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.log){S=d;S.att=S.att||{};}}catch(e){}
runProblem(Math.min(S.pi||0,PROBS.length-1));
</script></body></html>
