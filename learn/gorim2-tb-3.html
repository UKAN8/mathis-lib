<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>고림고 고2 교과서 · 네 정리(사잇값·최대최소·롤·평균값)</title><style>

/* (0908) 학교프린트 원문 조각 — hwpx2html 산출을 그대로 담는다 */
.print{font-size:15px;line-height:1.7}

.print .tbl.grid td{border:none}

.disp{margin:14px 0;text-align:center;font-size:17px;overflow-x:auto}
.field{margin-top:16px}
.flabel{font-size:13px;color:var(--mute);margin-bottom:6px;display:block}
.row{display:flex;gap:8px;align-items:stretch}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:17px;padding:13px 14px;
 border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--key)}
input[type=text]:disabled{background:var(--soft);color:var(--mute)}
button{font:inherit;cursor:pointer;border:none}
.btn{padding:13px 20px;border-radius:10px;background:var(--ink);color:#fff;font-weight:700;
 font-size:15px;white-space:nowrap}
.btn:disabled{background:#CFCFCF;cursor:default}
.btn.wide{width:100%;padding:16px;font-size:16px}
.choices{display:grid;gap:8px;margin-top:8px}
.ch{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);
 border-radius:10px;font-size:14.5px;background:#fff;text-align:left;color:var(--ink);line-height:1.5}
.ch b{color:var(--mute);font-weight:700;flex-shrink:0}
.ch.sel{border-color:var(--key);background:var(--tint)}
.ch:disabled{opacity:1}
.ch.ans{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.ch.ans b{color:var(--ok)}
.ch.miss{border-color:var(--no);background:var(--nobg);color:var(--no)}
.ch.idk{border-style:dashed;color:var(--mute);background:var(--soft);font-size:13px;padding:9px 14px}
.ch.idk.sel{border-color:var(--warn);background:var(--warnbg);color:var(--warn)}
.ch.miss b{color:var(--no)}
.ch.dim{opacity:.45}
.steps{margin-top:8px;border-left:2px solid var(--tint);padding-left:14px}
.step{margin-bottom:18px}.step:last-child{margin-bottom:4px}
.sk{font-size:13px;font-weight:700;color:var(--deep);margin-bottom:7px}

.verdict.show{display:block}
.verdict.ok{background:var(--okbg);color:var(--ok)}
.verdict.no{background:var(--nobg);color:var(--no)}
.verdict .vt{font-weight:800;font-size:15px;margin-bottom:6px}
.sol{margin-top:12px;padding-top:12px;border-top:1px solid rgba(0,0,0,.08);color:var(--ink);font-size:14px}
.sol .sl{font-weight:700;font-size:12.5px;color:var(--mute);margin-bottom:6px}
.sol p{margin:0 0 7px}
.result{padding:26px 20px 34px;display:none;scroll-margin-top:132px}
.result.show{display:block}
.score{text-align:center;padding:18px 0 14px}
.score .n{font-size:46px;font-weight:800;color:var(--deep);line-height:1}
.score .l{font-size:13px;color:var(--mute);margin-top:6px}
.rsec{margin-top:20px}
.rsec .rh{font-size:12px;font-weight:800;color:var(--deep);letter-spacing:.04em;margin-bottom:2px}

.ri{display:flex;justify-content:space-between;gap:12px;padding:11px 2px;
 border-bottom:1px solid var(--line);font-size:14px}
.ri span:first-child{color:var(--mute);flex:1}
.ri .o{color:var(--ok);font-weight:700}.ri .x{color:var(--no);font-weight:700}
.next{margin-top:22px;background:var(--tint);border-radius:12px;padding:16px 18px;font-size:14px}
.next b{display:block;color:var(--deep);font-size:14.5px;margin-bottom:7px}
.next .nl{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.next .nl em{font-style:normal;color:var(--deep);font-weight:700;font-size:13px;white-space:nowrap}
.next .nl em.done{color:var(--ok)}
.next .nl em.zero{color:var(--no)}
.next .nn{margin-top:10px;padding-top:10px;border-top:1px solid rgba(192,82,78,.22);color:var(--deep);font-size:13px;font-weight:700}
details.dev{border-top:10px solid #F1F1F1;padding:18px 20px;background:#FAFAFA}

pre{background:#2E2E2E;color:#E8E8E8;padding:14px;border-radius:10px;overflow-x:auto;
 font-size:11.5px;line-height:1.6;font-family:ui-monospace,Menlo,Consolas,monospace}

 color:var(--ink);background:#fff;text-align:left}

 background:var(--ink);color:#fff;font-weight:700}

/* 제출 상태 바 (0907) — 학생이 '냈다'고 믿는 것과 서버에 남은 것이 어긋나던 사고.
   전송 성공·실패·남은 문항을 화면 아래에 항상 띄운다. */
.sbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;
 gap:10px;padding:11px 16px;font-size:13.5px;font-weight:700;line-height:1.45;
 background:#2E2E2E;color:#fff;box-shadow:0 -2px 10px rgba(0,0,0,.14)}
.sbar.ok{background:var(--ok)}
.sbar.no{background:var(--no)}
.sbar .st{flex:1}

 background:#fff;color:var(--ink);font-weight:800;cursor:pointer;white-space:nowrap}
.card{margin:2px 20px 6px;padding:18px 18px 16px;background:var(--tint);border-radius:14px}
.card .cl{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--deep)}
.card .ct{font-size:17.5px;font-weight:800;margin:4px 0 12px;color:var(--ink);letter-spacing:-.01em}

.card h4:first-of-type{margin-top:0}
.card p{margin:0 0 6px;font-size:14.5px;line-height:1.7}
.card .eq{margin:10px 0;text-align:center;font-size:16.5px;overflow-x:auto}
.card .key{margin-top:13px;padding:12px 14px;background:#fff;border-radius:10px;
 font-size:14px;font-weight:700;color:var(--deep);line-height:1.6}
.ov{border-top:1.15px solid currentColor;padding-top:1px;margin:0 .06em;
 font-family:'Cambria Math','Times New Roman',Georgia,serif;font-style:normal;white-space:nowrap}
.ov+sup{font-style:normal;font-family:'Cambria Math','Times New Roman',Georgia,serif}
.card .fig{margin:12px 0 14px;text-align:center;line-height:0}
.card .fig svg{max-width:100%;height:auto;display:inline-block}

/* (0911) 되짚기(사후평가) — 풀지 않는다. 내 답·정답 한 줄 + 상태·원인 두 묶음 */
.pe-meta{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 2px;font-size:13.5px;color:var(--mute)}

   (0926) <details>/<summary> 를 버리고 버튼+클래스로 — 일부 폰 브라우저에서 summary 탭이 안 먹힌다는 신고. 버튼은 어디서나 먹는다 */
.peek{margin:8px 0 2px}
.peek>.pk{display:inline-flex;align-items:center;gap:5px;cursor:pointer;background:#fff;

 padding:7px 12px;user-select:none;-webkit-appearance:none;appearance:none}
.peek>.pk::before{content:'＋';font-weight:400}
.peek.open>.pk::before{content:'－'}

.peek.open>.stem{display:block}
math{font-family:'Cambria Math','STIX Two Math','Latin Modern Math','Times New Roman',serif;font-size:1.06em}

.tw{padding:0 16px 90px;box-sizing:border-box}

.opts{display:grid;gap:8px;margin-top:10px}
.op{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid #e5e7eb;background:#fff;border-radius:12px;padding:11px 12px;font:inherit;font-size:15px;line-height:1.5;color:inherit;cursor:pointer}

.nx.cf{margin-top:12px}.nx.cf:disabled{background:#d1d5db;cursor:default}
.nx{display:block;width:100%;margin:12px 0 4px;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:700;background:#111827;color:#fff;cursor:pointer}

.mk{font-weight:800}.mk.o{color:#059669}.mk.t{color:#d97706}.mk.x{color:#dc2626}.mk.s{color:#9ca3af}

.dots i{flex:1;height:5px;border-radius:3px;background:#e5e7eb}
.dots i.cur{background:#111827}.dots i.o{background:#10b981}.dots i.t{background:#f59e0b}.dots i.x{background:#ef4444}

\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>2.5<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 에 있다.", "출발할 때와 도착할 때 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>h<\/mi><\/mrow><\/math> 값을 직접 넣어 보자. 같은가?", "두 기차의 속력은 모른다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>h<\/mi><\/mrow><\/math> 가 증가하는지는 알 수 없다.", "출발 순간 두 기차는 서로 다른 역에 있다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><\/mrow><\/math> 는 부산에서 서울로 오니 서울역에서의 거리가 줄어든다. 그리고 증가 여부는 필요 없다."], "풀이": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>: 첫날은 서울역(<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>), 둘째 날은 부산역(<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><mo>&#x0003D;<\/mo><mi>L<\/mi><\/mrow><\/math>) → <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>h<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mi>L<\/mi><\/mrow><\/math>. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo>&#x0003D;<\/mo><mn>2.5<\/mn><\/mrow><\/math>: <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo>&#x0003D;<\/mo><mi>L<\/mi><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> → <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>h<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>2.5<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>L<\/mi><\/mrow><\/math>. 위치는 연속이므로 사잇값 정리로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>h<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>c<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>.", "보조": {"질문": "출발 순간(<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>) <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>h<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 은?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x02212;<\/mo><mi>L<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mi>L<\/mi><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>L<\/mi><mo>&#x02212;<\/mo><mn>0<\/mn><mo>&#x0003D;<\/mo><mi>L<\/mi><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math>"], "말": ["맞다. 도착 순간엔 부호가 반대다. 그럼 어떤 정리를 쓰는지 보자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 에 첫날 윤서는 서울역, 즉 거리 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math> 이다.", "출발 순간 두 날의 윤서는 서로 다른 역에 있다."]}}, {"질문": "'기차의 위치는 시간에 따라 연속적으로 변한다(순간이동이 없다)'는 가정의 역할은?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>h<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 가 연속이라 사잇값 정리를 쓸 수 있게 한다", "기차가 도중에 멈추지 않았음을 보장한다", "기차의 속력이 일정함을 보장한다", "답에는 영향이 없다 — 당연한 사실일 뿐이다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>h<\/mi><\/mrow><\/math> 가 미분가능해 롤의 정리를 쓰게 한다"], "말": ["맞다. 연속이 없으면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>h<\/mi><\/mrow><\/math> 가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math> 을 건너뛸 수 있다.", "멈춰도 위치는 이어져 있다. 이 가정은 멈춤과 상관없다.", "속력이 일정할 필요는 없다. 이 가정이 주는 건 다른 것이다.", "당연해 보여도 정리를 쓰는 근거다. 이게 없으면 결론이 무너진다.", "이 풀이에 롤의 정리는 안 쓴다."], "풀이": "사잇값 정리는 연속함수에만 쓸 수 있다. 위치 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><\/mrow><\/math> 가 연속이라 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>h<\/mi><mo>&#x0003D;<\/mo><mi>f<\/mi><mo>&#x02212;<\/mo><mi>g<\/mi><\/mrow><\/math> 도 연속이 되고, 그래서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>h<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003C;<\/mo><mn>0<\/mn><mo>&#x0003C;<\/mo><mi>h<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>2.5<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 에서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>h<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>c<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 이 나온다.", "보조": {"질문": "기차가 도중에 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>10<\/mn><\/mrow><\/math> 분 멈춰 서 있었다면 결론은?", "선지": ["그대로 성립한다 — 멈춰도 위치는 연속", "성립하지 않는다", "멈춘 시간만큼 늦게 만난다"], "말": ["맞다. 멈춤은 연속을 깨지 않는다. 그럼 연속이라는 가정이 무슨 일을 하는지 다시 보자.", "멈춰 있는 동안에도 위치는 끊기지 않는다.", "정리는 '언제'를 말해 주지 않는다. 있다는 것만 말한다."]}}, {"질문": "둘째 날 오후 8시에 부산역을 출발해 오후 10시 30분에 서울역에 도착했다면? (시계 시각 기준)", "선지": ["그래도 있다 — 8시~9시 30분에 부호가 바뀐다", "출발 시각이 달라 그런 순간은 반드시 없다", "있을 수도 있고 없을 수도 있다", "도착 시각까지 같아야만 성립한다", "평균속력이 달라져 판단할 수 없다"], "말": ["맞다. 8시엔 첫날 기차가 중간, 둘째 날은 부산 → <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>h<\/mi><mo>&#x0003C;<\/mo><mn>0<\/mn><\/mrow><\/math>. 9시 30분엔 첫날이 부산, 둘째 날은 중간 → <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>h<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>.", "두 기차가 동시에 달리는 시간대가 있다. 그 시간대 양 끝을 보자.", "두 기차가 함께 달리는 시간대의 양 끝에서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>h<\/mi><\/mrow><\/math> 의 부호를 직접 따져 보자.", "필요한 건 어떤 구간의 양 끝에서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>h<\/mi><\/mrow><\/math> 의 부호가 다르다는 것뿐이다.", "속력은 이 판단과 상관없다. 위치만 보면 된다."], "풀이": "오후 8시: 첫날 기차는 서울–부산 사이(<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x0003C;<\/mo><mi>f<\/mi><mo>&#x0003C;<\/mo><mi>L<\/mi><\/mrow><\/math>), 둘째 날은 부산(<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><mo>&#x0003D;<\/mo><mi>L<\/mi><\/mrow><\/math>) → <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>h<\/mi><mo>&#x0003C;<\/mo><mn>0<\/mn><\/mrow><\/math>. 오후 9시 30분: 첫날은 부산(<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo>&#x0003D;<\/mo><mi>L<\/mi><\/mrow><\/math>), 둘째 날은 사이(<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><mo>&#x0003C;<\/mo><mi>L<\/mi><\/mrow><\/math>) → <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>h<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>. 이 구간에서 사잇값 정리.", "보조": {"질문": "오후 8시에 첫날 기차는 어디 있었나?", "선지": ["서울과 부산 사이 어딘가", "부산역", "서울역"], "말": ["맞다. 그 순간 둘째 날 기차는 부산역이다. 두 위치의 차의 부호를 보자.", "첫날 부산 도착은 9시 30분이다.", "첫날은 7시에 서울역을 떠났다."]}}, {"질문": "어떤 학생이 '두 날 평균속력이 같으니 평균값 정리로 속력이 같은 순간이 있고, 그때 같은 곳을 지난다'고 썼다. 문제는?", "선지": ["속력이 같다고 위치가 같은 건 아니다", "미분가능해야 해서 쓸 수 없다", "평균속력이 사실은 서로 다르다", "평균값 정리는 최댓값을 말한다", "논리는 맞고 표현만 다르다"], "말": ["맞다. 같은 속력으로 나란히 달려도 간격은 있을 수 있다. 필요한 건 위치의 차다.", "기차 위치는 미분가능하다고 봐도 된다. 문제는 결론이 무엇에 대한 것이냐다.", "같은 거리를 같은 시간에 갔으니 평균속력은 같다. 다른 곳을 보자.", "평균값 정리는 미분계수에 대한 정리다. 그게 위치와 무슨 관계인지 보자.", "속력이 같은 순간과 같은 곳에 있는 순간이 같은 말인지 따져 보자."], "풀이": "평균값 정리는 속력(미분계수)에 대한 결론을 준다. '같은 곳'은 위치(함숫값)가 같다는 것이라 사잇값 정리가 맞는 도구다. 게다가 날마다 따로 쓴 평균값 정리의 두 순간이 같은 시각이라는 보장도 없다.", "보조": {"질문": "같은 방향으로 나란히 달리는 두 기차가 같은 속력이면 반드시 같은 곳에 있나?", "선지": ["아니다 — 간격을 두고 달릴 수 있다", "그렇다", "속력이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math> 일 때만 그렇다"], "말": ["맞다. 속력과 위치는 다른 정보다. 그 학생의 논리를 다시 보자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>100<\/mn><mspace width=\"0.167em\" /><mi mathvariant=\"normal\">m<\/mi><\/mrow><\/math> 떨어져 같은 속력으로 달리는 두 기차를 떠올려 보자.", "둘 다 멈춰 있어도 다른 곳에 있을 수 있다."]}}, {"질문": "이 문제와 같은 개념으로 푸는 것을 모두 고르면?<br>ㄱ. 오전 6시~정오에 산을 오른 등산객이 다음 날 같은 시각에 같은 길로 내려오면, 같은 시각 같은 지점을 지난다<br>ㄴ. 연속함수 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><\/mrow><\/math> 가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 이면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>c<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>c<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 인 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>c<\/mi><\/mrow><\/math> 가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>1<\/mn><mo stretchy=\"false\">]<\/mo><\/mrow><\/math> 에 있다<br>ㄷ. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><\/mrow><\/math> 시간 동안 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>120<\/mn><mspace width=\"0.167em\" /><mrow><mi mathvariant=\"normal\">k<\/mi><mi mathvariant=\"normal\">m<\/mi><\/mrow><\/mrow><\/math> 를 달린 차는 어느 순간 시속 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>60<\/mn><mspace width=\"0.167em\" /><mrow><mi mathvariant=\"normal\">k<\/mi><mi mathvariant=\"normal\">m<\/mi><\/mrow><\/mrow><\/math> 였다", "선지": ["ㄱ, ㄴ", "ㄱ", "ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "말": ["맞다. 둘 다 '두 값이 같다'를 차의 함수로 만들어 사잇값 정리. ㄷ은 평균값 정리다.", "ㄱ 은 잘 봤다. 식으로 된 보기에도 같은 구조가 숨어 있다.", "ㄴ 은 잘 봤다. 이야기로 된 보기도 이 문제와 똑같은 구조다.", "ㄷ 의 결론은 순간속력이다. 위치인가 속력인가?", "ㄷ 이 묻는 건 위치가 아니라 속력이다."], "풀이": "ㄱ: 이 문제와 똑같은 구조. ㄴ: <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 로 두면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 이라 사잇값 정리. ㄷ: 평균속력 = 순간속력, 평균값 정리.", "보조": {"질문": "ㄴ 에서 만들 보조함수는?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msup><mi>f<\/mi><mi>&#x02032;<\/mi><\/msup><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>"], "말": ["맞다. '두 값이 같다'를 차가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math> 으로 — 기차 문제의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>h<\/mi><\/mrow><\/math> 와 같다. 보기를 다시 보자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>c<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mi>c<\/mi><\/mrow><\/math> 꼴이면 그걸 쓴다. 여기서 같아야 하는 두 값은 뭘까?", "미분은 필요 없다. 연속함수 문제다."]}}], "H": {"질문": "이 문제, 첫 발은 뭐로 뗄까?", "선지": ["두 날의 위치를 함수로 두고 차를 본다", "두 날의 평균속력부터 계산한다", "서울–부산 실제 거리를 찾아본다", "기차의 최고 속력을 가정해 본다", "중간역 시각표를 비교해 본다"], "말": ["좋다. 말로 된 상황을 함수로 옮기는 게 첫 발이다.", "평균속력은 같다는 것까지만 준다. 위치 이야기로 가야 한다.", "거리를 몰라도 된다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>L<\/mi><\/mrow><\/math> 로 두면 충분하다.", "속력 정보는 필요 없다.", "시각표는 주어지지 않았다. 함수로 일반화하자."], "힌트": ["사잇값 정리는 '어떤 함수의 값이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><\/mrow><\/math> 가 된다'를 말한다. '같은 곳'을 어떤 함수의 값 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math> 으로 바꿔 보자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>h<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><\/mrow><\/math>(첫날 위치)<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><\/mrow><\/math>(둘째 날 위치) 로 두면 출발 때 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>h<\/mi><mo>&#x0003C;<\/mo><mn>0<\/mn><\/mrow><\/math>, 도착 때 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>h<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math>."]}}, {"id": "교과서 최대최소-중단원04", "단원": "함수의 연속 · 최대·최소 정리", "발문": "<div class=\"print\">닫힌구간 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>4<\/mn><mo stretchy=\"false\">]<\/mo><\/mrow><\/math>에서 함수 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mi>x<\/mi><\/mrow><mrow><mi>x<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math>의 최댓값과 최솟값을 구하시오.<\/div>", "M": [{"질문": "이 문제가 결국 묻는 것은?", "선지": ["닫힌구간 연속함수의 최대·최소 — 끝점도 후보", "극값만 구해 서로 비교하는 것", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x02192;<\/mo><mo>&#x0221E;<\/mo><\/mrow><\/math> 일 때의 극한값을 구하는 것", "점근선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math> 의 위치를 찾는 것", "사잇값 정리로 방정식의 근을 찾는 것"], "말": ["맞다. 최대·최소 정리가 '있다'를 보장하고, 값은 후보(끝점 포함)를 비교해 찾는다.", "극값만 보면 놓치는 후보가 있다. 최대·최소는 어디서 나올 수 있을까?", "구간이 /mrow><\/math> 에 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>h<\/mi><mo stretchy=\"false\">]<\/mo><\/mrow><\/math> 평균값 정리", "양변을 이항정리로 전개한다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>h<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math> 을 대입해 확인한다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>n<\/mi><mi>x<\/mi><\/mrow><\/math> 를 미분해 본다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>h<\/mi><\/mrow><\/math> 로 나눠 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>h<\/mi><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/math> 극한을 본다"], "말": ["좋다. 차 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>h<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>n<\/mi><\/msup><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math> 을 미분계수로 바꾸는 게 핵심이다.", "그것도 방법이지만 이 문제는 평균값 정리를 쓰라고 한다.", "값 하나로는 증명이 안 된다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>n<\/mi><mi>x<\/mi><\/mrow><\/math> 의 미분은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><\/mrow><\/math> — 비교 대상일 뿐이다.", "극한은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>h<\/mi><mo>&#x02192;<\/mo><mn>0<\/mn><\/mrow><\/math> 일 때만 말해 준다."], "힌트": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>h<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>n<\/mi><\/msup><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math> 은 어떤 함수의 두 함숫값의 차다. 차를 미분계수로 바꾸는 정리가 뭐였지?", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mi>n<\/mi><\/msup><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>h<\/mi><mo stretchy=\"false\">]<\/mo><\/mrow><\/math>: <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>h<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mi>n<\/mi><\/msup><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><mrow><mi>h<\/mi><\/mrow><\/mfrac><\/mstyle><mo>&#x0003D;<\/mo><mi>n<\/mi><msup><mi>c<\/mi><mrow><mi>n<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mtext>&#x000A0;<\/mtext><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0003C;<\/mo><mi>c<\/mi><mo>&#x0003C;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>h<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>c<\/mi><mo>&#x0003E;<\/mo><mn>1<\/mn><\/mrow><\/math> 이라 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n<\/mi><msup><mi>c<\/mi><mrow><mi>n<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msup><mo>&#x0003E;<\/mo><mi>n<\/mi><\/mrow><\/math>."]}}];</script><script>
const NS=STEPNAME.length, ALL=[...Array(NS).keys()], SI=n=>STEPNAME.indexOf(n);
const WH=[['무엇을 묻는 문제인지부터 헷갈렸다',SI('무엇을 묻나')],['식을 어떻게 세울지 몰랐다',SI('어디서 쓰이나')],['조건을 놓쳤거나 잘못 읽었다',SI('조건의 역할')]]
  .concat(SI('원본↔변형')>=0?[['변형에서 바뀐 걸 어떻게 처리할지 몰랐다',SI('원본↔변형')]]:[])
  .concat([['계산하거나 답 고르다 틀렸다',SI('함정')],['잘 모르겠다',0]]);
const KEY='haebu-tree:'+META.id;
let S={pi:0,log:[],att:{}};
/* (1010) 진행 기록 → DB haebu_log (schema_v37). 포털에서 ?t=<토큰> 으로 열었을 때만. 실패는 조용히. */
const TOK=new URLSearchParams(location.search).get('t')||'';
function sync(P,rec,res,done){
  if(!TOK||!DB.url) return;
  const body={skey:META.skey,pan:META.pan,id:P.id,unit:P.단원||'',try:rec.try||1,in:rec.입구,wh:rec.갈림,h:rec.첫발,
    res:res.map(r=>r||'-').join(''),pk:rec.스텝.map(x=>x?{r:x.결과,p:x.고른것,b:(x.디딤돌==null?null:x.디딤돌)}:null),done:!!done,ms:Date.now()-rec.t0};
  try{fetch(DB.url+'/rest/v1/rpc/haebu_submit',{method:'POST',keepalive:true,
    headers:{'Content-Type':'application/json','apikey':DB.anon,'Authorization':'Bearer '+DB.anon},
    body:JSON.stringify({tok:TOK,rec:body})}).catch(()=>{});}catch(e){}
}
const $=s=>document.querySelector(s);
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function rnd(seed){let x=seed%2147483647;if(x<=0)x+=2147483646;return()=>(x=x*16807%2147483647)/2147483647;}
function hash(s){let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))%1000003;return h;}
let CURID='';
// (1011) 문항마다 다른 순서 — 전엔 세트 id 로만 섞어 같은 스텝 정답 위치가 문항마다 같았다(학생이 위치를 외워 통과)
function shuffled(n,tag){const r=rnd(hash(META.id+'|'+CURID+'|'+tag)+n);const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function scrollEnd(n){setTimeout(()=>n.scrollIntoView({behavior:'smooth',block:'start'}),60);}

/* 카드 하나: 질문 + 선지. onPick(원래 인덱스) */
function ask(box,lab,labc,q,opts,tag,locked,onPick){
  const b=el('div','bub q');b.appendChild(el('div','lab'+(labc?' '+labc:''),lab));b.appendChild(el('div','',q));
  const g=el('div','opts');const ord=(tag==='in'||tag==='wh')?[...opts.keys()]:shuffled(opts.length,tag);
  ord.forEach((k,i)=>{const o=el('button','op'+((locked||[]).includes(k)?' lock':''),'<b>'+'①②③④⑤⑥⑦⑧'[i]+'</b><span>'+opts[k]+'</span>');
    o.onclick=()=>{if(g.classList.contains('done'))return;
      g.querySelectorAll('.op').forEach(x=>x.classList.remove('pick'));o.classList.add('pick');sel=[k,o];
      ok.disabled=false;ok.textContent='이걸로 할게';};g.appendChild(o);});
  // (1009) 바로 넘어가지 않는다 — 고른 뒤 [이걸로 할게] 를 눌러야 확정. 잘못 터치하면 다른 걸 다시 고르면 된다.
  let sel=null;const ok=el('button','nx cf','하나 골라 봐');ok.disabled=true;
  ok.onclick=()=>{if(!sel||g.classList.contains('done'))return;g.classList.add('done');ok.remove();onPick(sel[0],sel[1],g);};
  b.appendChild(g);b.appendChild(ok);box.appendChild(b);scrollEnd(b);return g;
}
function say(box,cls,h){const b=el('div','bub say '+cls,h);box.appendChild(b);return b;}
function nextBtn(box,txt,fn){const n=el('button','nx',txt);n.onclick=()=>{n.remove();fn();};box.appendChild(n);scrollEnd(n);}

function runProblem(pi){
  const P=PROBS[pi];CURID=P.id;const root=$('#thread');root.innerHTML='';
  const card=$('#prob');card.innerHTML='';card.className='prob';
  card.appendChild(el('div','ph',(pi+1)+' / '+PROBS.length+' · '+P.id+(P.단원?' · '+P.단원:'')));

  const tog=el('button','tog','문제 접기');tog.onclick=()=>{card.classList.toggle('fold');tog.textContent=card.classList.contains('fold')?'문제 펼치기':'문제 접기';};card.appendChild(tog);
  const dots=el('div','dots');for(let k=0;k<NS;k++)dots.appendChild(el('i'));card.appendChild(dots);
  const res=Array(NS).fill(null);   // 'o' | 't' | 'x'
  const A=S.att[P.id]||(S.att[P.id]={n:0,done:true});if(A.done){A.n++;A.done=false;}save();
  const rec={id:P.id,입구:null,갈림:null,첫발:null,스텝:[],try:A.n,t0:Date.now()};
  const paint=cur=>dots.querySelectorAll('i').forEach((d,k)=>d.className=res[k]||(k===cur?'cur':''));

  // ① 입구
  ask(root,'먼저','', META.입구,
    ['맞혔고, 왜 그런지 설명도 할 수 있다','맞히긴 했는데 감으로 풀었다','풀었는데 틀렸다','손도 못 댔다'],'in',[],k=>{
      rec.입구=k;sync(P,rec,res,false);
      if(k<=1){say(root,'',k===0?'좋아. 그럼 진짜 설명할 수 있는지 하나씩 확인해 보자.':'감으로 맞힌 건 다음엔 틀릴 수 있다. 근거를 하나씩 세워 보자.');go(ALL);}
      else if(k===2){
        ask(root,'어디서','', '어디서 갈렸던 것 같아?',
          WH.map(x=>x[0]),'wh',[],j=>{
            rec.갈림=j;const first=WH[j][1];
            say(root,'','그럼 거기부터 보자. 나머지도 이어서 짚는다.');
            go([first,...ALL.filter(x=>x!==first)]);});
      } else firstStep(()=>go(ALL));
    });

  function firstStep(done){
    const H=P.H;let tries=0;const locked=[];
    const once=()=>ask(root,'첫 발','h',H.질문,H.선지,'H'+tries,locked,(k,o)=>{
      if(k===0){o.classList.add('right');say(root,'ok',H.말[0]);rec.첫발=tries;nextBtn(root,'이제 문제를 뜯어보자',done);}
      else{o.classList.add('wrong');locked.push(k);say(root,'no',H.말[k]);
        if(tries===0){tries=1;say(root,'sol','💡 '+H.힌트[0]);nextBtn(root,'다시 골라 볼게',once);}
        else{say(root,'sol','💡 '+H.힌트[1]);rec.첫발=2;nextBtn(root,'이제 문제를 뜯어보자',done);}}
    });
    once();
  }

  function go(order){
    let i=0;
    const step=()=>{
      if(i>=order.length)return finish();
      const s=order[i++];paint(s);const M=P.M[s];const locked=[];
      const lab='STEP '+(s+1)+' · '+STEPNAME[s];
      ask(root,lab,'',M.질문,M.선지,'M'+s,locked,(k,o)=>{
        if(k===0){o.classList.add('right');say(root,'ok',M.말[0]);res[s]='o';rec.스텝[s]={결과:'o',고른것:[k]};paint(-1);sync(P,rec,res,false);nextBtn(root,i<order.length?'다음':'정리 보기',step);return;}
        o.classList.add('wrong');locked.push(k);say(root,'no',M.말[k]);const picks=[k];
        // 보조 → 재도전
        nextBtn(root,'작은 것부터 확인',()=>{
          const B=M.보조;
          ask(root,'디딤돌','sub',B.질문,B.선지,'B'+s,[],(j,o2)=>{
            o2.classList.add(j===0?'right':'wrong');say(root,j===0?'ok':'no',B.말[j]);
            if(j!==0)say(root,'sol','디딤돌 답: '+B.선지[0]);
            nextBtn(root,'처음 질문 다시',()=>{
              ask(root,lab+' · 다시','',M.질문,M.선지,'M'+s+'r',locked,(k2,o3)=>{
                picks.push(k2);
                if(k2===0){o3.classList.add('right');say(root,'ok','다시 잡았다. '+M.말[0]);res[s]='t';}
                else{o3.classList.add('wrong');say(root,'no',M.말[k2]);say(root,'sol','<b>정리</b> '+M.풀이);res[s]='x';}
                rec.스텝[s]={결과:res[s],고른것:picks,디딤돌:j};paint(-1);sync(P,rec,res,false);

              });
            });
          });

      });

  function finish(){

    const mk={o:['○','o','한 번에'],t:['△','t','디딤돌 뒤'],x:['✕','x','다시 볼 것']};
    for(let k=0;k<NS;k++){const r=res[k];const m=r?mk[r]:['–','s','건너뜀'];
      const row=el('div','row');row.appendChild(el('span','','STEP '+(k+1)+' '+STEPNAME[k]));row.appendChild(el('span','mk '+m[1],m[0]+' '+m[2]));sm.appendChild(row);}
    const weak=ALL.filter(k=>res[k]==='x'||res[k]==='t');
    sm.appendChild(el('div','weak',weak.length?'<b>여기가 약한 곳</b> · '+weak.map(k=>STEPNAME[k]).join(', ')+(rec.입구<=1&&weak.length>=2?'<br>맞힌 문제였는데도 여기서 걸렸다 — 답을 외운 건 아닌지 다시 보자.':''):'<b>'+NS+'군데 다 한 번에 통과.</b> 이 문제는 진짜 네 거다.'));
    root.appendChild(sm);
    if(pi+1<PROBS.length)nextBtn(root,'다음 문제 →',()=>{S.pi=pi+1;save();window.scrollTo(0,0);runProblem(pi+1);});
    else root.appendChild(el('div','bub say ok','오늘 세트 끝. 수고했다.'));
    scrollEnd(sm);
  }
}
try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.log){S=d;S.att=S.att||{};}}catch(e){}
runProblem(Math.min(S.pi||0,PROBS.length-1));
</script></body></html>
