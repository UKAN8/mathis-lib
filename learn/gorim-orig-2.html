<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>고림고 프린트 해부 · 원의 방정식</title><style>
:root{--key:#EA9090;--deep:#C0524E;--ink:#333;--mute:#8A8A8A;--tint:#FAE3E1;
 --soft:#F6F6F6;--line:#E6E6E6;--ok:#3E8E6E;--okbg:#E9F4EF;--no:#C0524E;--nobg:#FBEDEC;
 --warn:#B26A00;--warnbg:#FFF3E0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Paperlogy','Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
 background:#EFEFEF;color:var(--ink);font-size:16px;line-height:1.65;padding-bottom:64px}
.wrap{max-width:560px;margin:0 auto;background:#fff;min-height:100vh}
header{padding:22px 20px 16px;background:#2E2E2E;color:#fff;position:sticky;top:0;z-index:20}
.brand{font-size:12px;letter-spacing:.08em;color:var(--key);font-weight:700}
h1{margin:6px 0 2px;font-size:21px;font-weight:800;letter-spacing:-.01em}
.meta{font-size:12.5px;color:#B9B9B9}
.bar{display:flex;gap:5px;margin-top:14px}
.bar i{flex:1;height:4px;border-radius:2px;background:#4A4A4A;transition:background .25s}
.bar i.done{background:var(--key)}
.bar i.wrong{background:#7A4B49}
.guide{margin:0;padding:15px 20px;background:var(--tint);color:var(--deep);font-size:13.5px;line-height:1.6}
.guide b{display:block;font-size:14.5px;margin-bottom:3px}
.part{padding:22px 20px 4px}
.part .pl{font-size:12px;font-weight:800;color:var(--deep);letter-spacing:.04em}
.part .pt{font-size:17px;font-weight:800;margin-top:3px}
.part .pd{font-size:13px;color:var(--mute);margin-top:3px}
.q{padding:20px 20px 24px;border-bottom:10px solid #F1F1F1}
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.qno{font-size:13px;font-weight:800;color:var(--deep)}
.tag{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--tint);color:var(--deep);font-weight:600}
.tag.grey{background:var(--soft);color:var(--mute)}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.pct{background:#EDEDED;color:#6E6E6E}
.stem{font-size:15.5px;margin:0 0 4px}
/* (0908) 학교프린트 원문 조각 — hwpx2html 산출을 그대로 담는다 */
.print{font-size:15px;line-height:1.7}
.print p{margin:0 0 2px}
.print .lead,.print .box{background:var(--soft);border-left:3px solid #555;padding:6px 10px;margin:8px 0}
.print .bogi{border:1px solid #444;padding:12px 10px 6px;margin:12px 2px 8px;position:relative}
.print .bogi .lbl{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:#fff;padding:0 6px;font-weight:700;font-size:13px}
.print .bl{margin:0 0 2px}
.print .fig{text-align:center;margin:8px 0}
.print img{max-width:100%;height:auto}
.print .fl{float:right;margin:0 0 4px 8px;max-width:48%}
.print .fl.left{float:left;margin:0 8px 4px 0}
.print .pcs{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 10px;margin-top:10px;clear:both}
.print .pcs.c1{grid-template-columns:1fr}
.print .pch{display:flex;gap:4px;align-items:baseline}
.print .pcn{color:var(--mute);flex-shrink:0}
.print .tbl{border-collapse:collapse;margin:4px auto;font-size:14px}
.print .tbl td{border:1px solid #444;padding:2px 6px;text-align:center}
.print .tbl.grid td{border:none}
.print .tab{display:inline-block;width:14px}
.print .missing{color:var(--no)}
.disp{margin:14px 0;text-align:center;font-size:17px;overflow-x:auto}
.field{margin-top:16px}
.flabel{font-size:13px;color:var(--mute);margin-bottom:6px;display:block}
.row{display:flex;gap:8px;align-items:stretch}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:17px;padding:13px 14px;
 border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--key)}
input[type=text]:disabled{background:var(--soft);color:var(--mute)}
button{font:inherit;cursor:pointer;border:none}
.btn{padding:13px 20px;border-radius:10px;background:var(--ink);color:#fff;font-weight:700;
 font-size:15px;white-space:nowrap}
.btn:disabled{background:#CFCFCF;cursor:default}
.btn.wide{width:100%;padding:16px;font-size:16px}
.choices{display:grid;gap:8px;margin-top:8px}
.ch{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);
 border-radius:10px;font-size:14.5px;background:#fff;text-align:left;color:var(--ink);line-height:1.5}
.ch b{color:var(--mute);font-weight:700;flex-shrink:0}
.ch.sel{border-color:var(--key);background:var(--tint)}
.ch:disabled{opacity:1}
.ch.ans{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.ch.ans b{color:var(--ok)}
.ch.miss{border-color:var(--no);background:var(--nobg);color:var(--no)}
.ch.idk{border-style:dashed;color:var(--mute);background:var(--soft);font-size:13px;padding:9px 14px}
.ch.idk.sel{border-color:var(--warn);background:var(--warnbg);color:var(--warn)}
.ch.miss b{color:var(--no)}
.ch.dim{opacity:.45}
.steps{margin-top:8px;border-left:2px solid var(--tint);padding-left:14px}
.step{margin-bottom:18px}.step:last-child{margin-bottom:4px}
.sk{font-size:13px;font-weight:700;color:var(--deep);margin-bottom:7px}
.verdict{margin-top:16px;border-radius:12px;padding:14px 16px;font-size:14.5px;display:none}
.verdict.show{display:block}
.verdict.ok{background:var(--okbg);color:var(--ok)}
.verdict.no{background:var(--nobg);color:var(--no)}
.verdict .vt{font-weight:800;font-size:15px;margin-bottom:6px}
.sol{margin-top:12px;padding-top:12px;border-top:1px solid rgba(0,0,0,.08);color:var(--ink);font-size:14px}
.sol .sl{font-weight:700;font-size:12.5px;color:var(--mute);margin-bottom:6px}
.sol p{margin:0 0 7px}
.result{padding:26px 20px 34px;display:none;scroll-margin-top:132px}
.result.show{display:block}
.score{text-align:center;padding:18px 0 14px}
.score .n{font-size:46px;font-weight:800;color:var(--deep);line-height:1}
.score .l{font-size:13px;color:var(--mute);margin-top:6px}
.rsec{margin-top:20px}
.rsec .rh{font-size:12px;font-weight:800;color:var(--deep);letter-spacing:.04em;margin-bottom:2px}
.rlist{border-top:1px solid var(--line)}
.ri{display:flex;justify-content:space-between;gap:12px;padding:11px 2px;
 border-bottom:1px solid var(--line);font-size:14px}
.ri span:first-child{color:var(--mute);flex:1}
.ri .o{color:var(--ok);font-weight:700}.ri .x{color:var(--no);font-weight:700}
.next{margin-top:22px;background:var(--tint);border-radius:12px;padding:16px 18px;font-size:14px}
.next b{display:block;color:var(--deep);font-size:14.5px;margin-bottom:7px}
.next .nl{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.next .nl em{font-style:normal;color:var(--deep);font-weight:700;font-size:13px;white-space:nowrap}
.next .nl em.done{color:var(--ok)}
.next .nl em.zero{color:var(--no)}
.next .nn{margin-top:10px;padding-top:10px;border-top:1px solid rgba(192,82,78,.22);color:var(--deep);font-size:13px;font-weight:700}
details.dev{border-top:10px solid #F1F1F1;padding:18px 20px;background:#FAFAFA}
details.dev summary{font-size:13px;font-weight:700;color:var(--mute);cursor:pointer}
pre{background:#2E2E2E;color:#E8E8E8;padding:14px;border-radius:10px;overflow-x:auto;
 font-size:11.5px;line-height:1.6;font-family:ui-monospace,Menlo,Consolas,monospace}
.flag{margin-top:12px;text-align:right}
.flag .fl{font-size:12px;color:#BDBDBD;text-decoration:underline;cursor:pointer;
 background:none;border:none;padding:2px 0}
.flag textarea{width:100%;font:inherit;font-size:14.5px;padding:11px 12px;line-height:1.5;
 border:1.5px solid var(--line);border-radius:10px;margin-top:8px;resize:vertical;
 color:var(--ink);background:#fff;text-align:left}
.flag textarea:focus{outline:none;border-color:var(--key)}
.flag .sm{padding:9px 16px;font-size:13.5px;margin-top:7px;border-radius:9px;
 background:var(--ink);color:#fff;font-weight:700}
.flag .sent{font-size:12.5px;color:var(--ok);font-weight:700}
.foot{text-align:center;padding:22px;color:#B5B5B5;font-size:11.5px}
/* 제출 상태 바 (0907) — 학생이 '냈다'고 믿는 것과 서버에 남은 것이 어긋나던 사고.
   전송 성공·실패·남은 문항을 화면 아래에 항상 띄운다. */
.sbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;
 gap:10px;padding:11px 16px;font-size:13.5px;font-weight:700;line-height:1.45;
 background:#2E2E2E;color:#fff;box-shadow:0 -2px 10px rgba(0,0,0,.14)}
.sbar.ok{background:var(--ok)}
.sbar.no{background:var(--no)}
.sbar .st{flex:1}
.sbar button{padding:8px 14px;font:inherit;font-size:13px;border:none;border-radius:9px;
 background:#fff;color:var(--ink);font-weight:800;cursor:pointer;white-space:nowrap}
.card{margin:2px 20px 6px;padding:18px 18px 16px;background:var(--tint);border-radius:14px}
.card .cl{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--deep)}
.card .ct{font-size:17.5px;font-weight:800;margin:4px 0 12px;color:var(--ink);letter-spacing:-.01em}
.card h4{margin:15px 0 5px;font-size:14px;font-weight:800;color:var(--deep)}
.card h4:first-of-type{margin-top:0}
.card p{margin:0 0 6px;font-size:14.5px;line-height:1.7}
.card .eq{margin:10px 0;text-align:center;font-size:16.5px;overflow-x:auto}
.card .key{margin-top:13px;padding:12px 14px;background:#fff;border-radius:10px;
 font-size:14px;font-weight:700;color:var(--deep);line-height:1.6}
.ov{border-top:1.15px solid currentColor;padding-top:1px;margin:0 .06em;
 font-family:'Cambria Math','Times New Roman',Georgia,serif;font-style:normal;white-space:nowrap}
.ov+sup{font-style:normal;font-family:'Cambria Math','Times New Roman',Georgia,serif}
.card .fig{margin:12px 0 14px;text-align:center;line-height:0}
.card .fig svg{max-width:100%;height:auto;display:inline-block}
.card .fig .cap{display:block;line-height:1.5;margin-top:5px;font-size:12px;color:var(--mute)}
.card .cwarn{margin-top:9px;padding:11px 14px;background:var(--warnbg);color:var(--warn);
 border-radius:10px;font-size:13.5px;font-weight:700;line-height:1.6}
/* (0911) 되짚기(사후평가) — 풀지 않는다. 내 답·정답 한 줄 + 상태·원인 두 묶음 */
.pe-meta{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 2px;font-size:13.5px;color:var(--mute)}
.pe-meta b{color:var(--ink);font-weight:700}
.pe-meta .no{color:var(--no)}
.pe-meta .yes{color:var(--ok)}
.pe .choices{gap:6px}
.pe .ch{padding:10px 13px;font-size:14px}
.pe .ch.sel:disabled{border-color:var(--key);background:var(--tint)}
/* (0913 유강) 문제 자세히보기 — 어떤 문제였는지 기억 안 나는 애들이 있다. 기본은 접힘(8문항이면 페이지가 길다)
   (0926) <details>/<summary> 를 버리고 버튼+클래스로 — 일부 폰 브라우저에서 summary 탭이 안 먹힌다는 신고. 버튼은 어디서나 먹는다 */
.peek{margin:8px 0 2px}
.peek>.pk{display:inline-flex;align-items:center;gap:5px;cursor:pointer;background:#fff;
 font-size:13px;font-weight:700;font-family:inherit;line-height:1.3;color:var(--key);border:1px solid var(--line);border-radius:9px;
 padding:7px 12px;user-select:none;-webkit-appearance:none;appearance:none}
.peek>.pk::before{content:'＋';font-weight:400}
.peek.open>.pk::before{content:'－'}
.peek>.stem{display:none;margin-top:9px;padding:11px 13px;background:var(--soft);border-radius:10px}
.peek.open>.stem{display:block}
math{font-family:'Cambria Math','STIX Two Math','Latin Modern Math','Times New Roman',serif;font-size:1.06em}
.disp math{font-size:1.18em}
.stem math,.ch math,.sk math,.sol math{vertical-align:-0.1em}

.tw{padding:0 16px 90px;box-sizing:border-box}
.bub,.nx,.sum,.prob{scroll-margin-top:150px}
.prob{background:var(--card,#fff);border:1px solid var(--line,#e5e7eb);border-radius:14px;padding:14px 14px 10px;margin:14px 0}
.prob .ph{font-size:12px;color:#6b7280;margin-bottom:6px;font-weight:600}
.prob .stem{font-size:15px;line-height:1.7}
.prob .fig img{max-width:100%;height:auto}
.prob.fold .stem{max-height:5.2em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent)}
.prob .tog{font-size:12px;color:#6b7280;background:none;border:0;padding:4px 0;cursor:pointer}
.thread{margin-top:6px}
.bub{border-radius:14px;padding:12px 14px;margin:10px 0;line-height:1.65;font-size:15px;animation:up .25s ease}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bub.q{background:#fff;border:1px solid #e5e7eb}
.bub.q .lab{font-size:11px;font-weight:700;letter-spacing:.04em;color:#b45309;margin-bottom:4px}
.bub.q .lab.sub{color:#2563eb}
.bub.q .lab.h{color:#7c3aed}
.bub.say{background:#f3f4f6;border-left:3px solid #9ca3af}
.bub.say.ok{background:#ecfdf5;border-left-color:#10b981}
.bub.say.no{background:#fff7ed;border-left-color:#f97316}
.bub.say.sol{background:#eff6ff;border-left-color:#3b82f6}
.opts{display:grid;gap:8px;margin-top:10px}
.op{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid #e5e7eb;background:#fff;border-radius:12px;padding:11px 12px;font:inherit;font-size:15px;line-height:1.5;color:inherit;cursor:pointer}
.op b{flex:none;color:#9ca3af;font-weight:600}
.op:active{background:#f9fafb}
.op.pick{border-color:#111827;background:#f9fafb}
.op.right{border-color:#10b981;background:#ecfdf5}
.op.wrong{border-color:#f97316;background:#fff7ed}
.op.lock{opacity:.38;pointer-events:none;text-decoration:line-through}
.opts.done .op{pointer-events:none}
.opts.done .op:not(.pick):not(.right){opacity:.45}
.nx.cf{margin-top:12px}.nx.cf:disabled{background:#d1d5db;cursor:default}
.nx{display:block;width:100%;margin:12px 0 4px;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:700;background:#111827;color:#fff;cursor:pointer}
.sum{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin:14px 0}
.sum h3{margin:0 0 8px;font-size:15px}
.sum .row{display:flex;justify-content:space-between;padding:6px 0;border-top:1px dashed #e5e7eb;font-size:14px}
.sum .row:first-of-type{border-top:0}
.mk{font-weight:800}.mk.o{color:#059669}.mk.t{color:#d97706}.mk.x{color:#dc2626}.mk.s{color:#9ca3af}
.sum .weak{margin-top:10px;font-size:14px;background:#fff7ed;border-radius:10px;padding:10px}
.dots{display:flex;gap:6px;margin:10px 0 0}
.dots i{flex:1;height:5px;border-radius:3px;background:#e5e7eb}
.dots i.cur{background:#111827}.dots i.o{background:#10b981}.dots i.t{background:#f59e0b}.dots i.x{background:#ef4444}
.stem math,.op math,.bub math{vertical-align:-0.1em}
</style></head><body><div class="wrap tw"><header><div class="brand">수학은유강 · TARGET TRAINING</div><h1>고림고 프린트 해부 · 원의 방정식</h1><div class="meta">원본 문제를 다시 푸는 게 아니다 · 고른 뒤 [이걸로 할게]를 누르면 반응하고, 답에 따라 다음 질문이 바뀐다 · 5문항</div></header><div id="prob" class="prob"></div><div id="thread" class="thread"></div></div><script>const META={"id": "tree-고림고Ⅰ6-고림고Ⅰ7-고림고Ⅰ8-고림고Ⅰ9-고림고Ⅰ10", "제목": "고림고 프린트 해부 · 원의 방정식"};const STEPNAME=["무엇을 묻나", "어디서 쓰이나", "조건의 역할", "조건을 바꾸면", "함정", "같은 개념"];const PROBS=[{"id": "고림고 Ⅰ-6", "단원": "원의 방정식", "발문": "<div class=\"print\"><p class=\"first\">그림과 같이 중심이 함수 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x0007C;<\/mo><mspace width=\"0.167em\" /><mi>x<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><mspace width=\"0.167em\" /><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x02212;<\/mo><mn>4<\/mn><\/mrow><\/math>의 그래프 위에 있고<\/p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축과 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>축에 동시에 접하는 네 원의 중심을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mi mathvariant=\"normal\">D<\/mi><\/mrow><\/mrow><\/math>라 할 때,<\/p><p>사각형 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">D<\/mi><\/mrow><\/mrow><\/mrow><\/m ght:4px\" class=\"ocn\">③<\/span><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>6<\/mn><\/mrow><\/math><\/span><span class=\"och\"><span style=\"margin-right:4px\" class=\"ocn\">④<\/span><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>8<\/mn><\/mrow><\/math><\/span><span class=\"och\"><span style=\"margin-right:4px\" class=\"ocn\">⑤<\/span><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>10<\/mn><\/mrow><\/math><\/span><\/div><\/div>", "M": [{"질문": "이 문제가 결국 묻는 것은?", "선지": ["중심과 직선 사이 거리가 반지름 이하인 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math> 의 범위를 구해 합치는 것", "원이 두 직선에 동시에 접하는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math> 를 구하는 것", "연립한 이차방정식의 판별식이 양수인 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math> 를 구하는 것", "중심 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>2<\/mn><mi>a<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 가 두 직선 사이에 있는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math> 를 구하는 것", "원이 두 직선의 교점을 지나는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math> 를 구하는 것"], "말": ["맞다. '만난다' 는 거리 ≤ 반지름, '적어도 한 직선' 은 합집합이다.", "동시에 접하는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math> 가 실제로 있긴 하다. 그런데 묻는 건 '적어도 한 직선과 만나는' <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math> 전체다.", "판별식도 한 방법이다. 그런데 '양수' 로만 두면 접할 때는 어떻게 될까?", "중심이 두 직선 바깥이어도 원이 한쪽 직선에 닿을 수 있다.", "두 직선은 기울기가 같다. 교점이 있을까?"], "풀이": "'만난다' 는 '거리 ≤ 반지름' 이고 접하는 경우도 포함한다. 판별식을 양수로만 두면 접할 때가 빠져 최댓값·최솟값이 없어진 ", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>3<\/mn><mo>&#x02264;<\/mo><mi>a<\/mi><mo>&#x02264;<\/mo><mn>5<\/mn><\/mrow><\/math>", "공집합"], "말": ["맞다. '모두' 는 교집합이다. 처음 질문에 그대로 적용하자.", "그건 합집합이다.", "두 범위는 끝점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math> 을 함께 가진다."]}}, {"질문": "어떤 학생이 ② <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><\/mrow><\/math> 를 골랐다. 원인은?", "선지": ["두 직선 중 한 직선과 만나는 범위만 구했다", "합집합 대신 교집합을 취했다", "거리 공식에서 분모 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/math> 를 빠뜨렸다", "중심을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mi>a<\/mi><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mi>a<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 로 바꿔 놓았다", "접하는 경우를 빼서 등호를 없앴다"], "말": ["맞다. 한 직선만 보면 범위 길이가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><\/mrow><\/math> 다. '적어도 한 직선' 을 놓쳤다.", "교집합이면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math> 하나라 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>M<\/mi><mo>&#x02212;<\/mo><mi>m<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 이다.", "분모를 빼면 범위 끝에 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/math> 가 섞인다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><\/mrow><\/math> 같은 정수가 나올까?", "그렇게 둬도 범위 끝만 바뀌고 차는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><\/mrow><\/math> 가 안 된다. 직접 계산해 보자.", "등호를 빼면 최댓값·최솟값이 아예 없어진다."], "풀이": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x02212;<\/mo><mi>y<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 만 보면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>3<\/mn><mo>&#x02264;<\/mo><mi>a<\/mi><mo>&#x02264;<\/mo><mn>1<\/mn><\/mrow><\/math>, 다른 직선만 보면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x02264;<\/mo><mi>a<\/mi><mo>&#x02264;<\/mo><mn>5<\/mn><\/mrow><\/math> 라 어느 쪽이든 차가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><\/mrow><\/math> 다. '적어도 한 직선' 을 놓친 것이다. 교집합이면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math>, 분모 실수면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><mo>&#x0002B;<\/mo><mn>2<\/mn><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/math> 라 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><\/mrow><\/math> 가 안 나온다.", "보조": {"질문": "직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x02212;<\/mo><mi>y<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 하나와 만나는 범위가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>3<\/mn><mo>&#x02264;<\/mo><mi>a<\/mi><mo>&#x02264;<\/mo><mn>1<\/mn><\/mrow><\/math> 일 때, 최댓값 − 최솟값은?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>8<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><\/mrow><\/math>"], "말": ["맞다. 학생 답 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><\/mrow><\/math> 와 같다. 학생이 무엇을 빠뜨렸는지 보이지?", "그건 두 범위를 합친 길이다. 이 범위 하나만 보면?", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x02212;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>3<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 을 다시 계산해 보자."]}}, {"질문": "이 문제와 같은 핵심 개념으로 푸는 것을 모두 고르면?<br>ㄱ. 원 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math> 와 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>k<\/mi><\/mrow><\/math> 가 만나는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><\/mrow><\/math> 의 범위<br>ㄴ. 두 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x02212;<\/mo><mi>y<\/mi><mo>&#x0002B;<\/mo><mn>3<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x02212;<\/mo><mi>y<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 사이의 거리<br>ㄷ. 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>4<\/mn><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>k<\/mi><\/mrow><\/math> 가 원 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math> 에 접하는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><\/mrow><\/math>", "선지": ["ㄱ, ㄷ", "ㄱ", "ㄴ", "ㄱ, ㄴ", "ㄱ, ㄴ, ㄷ"], "말": ["맞다. ㄱ, ㄷ 모두 중심–직선 거리와 반지름을 비교한다.", "ㄱ 은 잘 봤다. '접한다' 도 같은 비교로 푸는지 보자.", "ㄴ 은 같은 두 직선이 나와서 끌렸다. 그런데 거기에 원이 있나?", "ㄱ 은 잘 봤다. ㄴ 에서 반지름과 비교할 거리가 있는지 보자.", "셋 다 거리 공식을 쓴다. 그런데 '원과 직선' 의 위치를 묻는 게 어느 것인지 보자."], "풀이": "ㄱ 은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>k<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><mrow><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/mfrac><\/mstyle><mo>&#x02264;<\/mo><mn>2<\/mn><\/mrow><\/math>, ㄷ 은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>k<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><mrow><mn>5<\/mn><\/mrow><\/mfrac><\/mstyle><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math> 로 '중심–직선 거리 vs 반지름' 을 비교한다. 같은 개념이다. ㄴ 은 같은 두 직선이 나오지만 원 없이 평행선 사이 거리만 구한다.", "보조": {"질문": "직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>4<\/mn><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>k<\/mi><\/mrow><\/math> 가 원 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math> 에 접할 조건은?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>k<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><mrow><mn>5<\/mn><\/mrow><\/mfrac><\/mstyle><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>k<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><mrow><mn>5<\/mn><\/mrow><\/mfrac><\/mstyle><mo>&#x0003C;<\/mo><mn>1<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>k<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mn>4<\/mn><mo>&#x000D7;<\/mo><mn>3<\/mn><mo>&#x000D7;<\/mo><mn>4<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>"], "말": ["맞다. 중심–직선 거리 = 반지름, 이 문제와 같은 도구다. 보기를 다시 보자.", "그건 두 점에서 만날 때다. 접하면 거리가 반지름과 같다.", "판별식은 연립한 이차방정식에 써야 한다. 계수를 그냥 넣으면 안 된다."]}}], "H": {"질문": "이 문제, 첫 발은 뭐로 뗄까?", "선지": ["원의 중심과 각 직선 사이 거리를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math> 로 쓴다", "원과 직선을 연립해 판별식 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>D<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math> 을 쓴다", "두 직선의 교점부터 구한다", "중심이 두 직선 사이에 있다고 놓는다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 을 넣어 원을 그려 본다"], "말": ["좋다. 원과 직선이 만나는지는 중심–직선 거리 하나로 판정된다.", "연립도 되지만 계산이 무겁고, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>D<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math> 이면 접할 때가 빠진다.", "두 직선은 기울기가 같아 평행하다. 교점이 없다.", "중심이 바깥이어도 원은 한 직선에 닿을 수 있다.", "값 하나로는 범위가 안 나온다."], "힌트": ["원과 직선이 만난다 ⇔ 중심과 직선 사이 거리 ≤ 반지름. 두 직선 각각에 대해 쓰자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>a<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><mrow><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/mfrac><\/mstyle><mo>&#x02264;<\/mo><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mn>3<\/mn><mo>&#x02212;<\/mo><mi>a<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><mrow><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/mfrac><\/mstyle><mo>&#x02264;<\/mo><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/math> 를 각각 풀고, '적어도 한' 이니 합집합을 취하자."]}}, {"id": "고림고 Ⅰ-8", "단원": "원의 방정식", "발문": "<div class=\"print\"><p class=\"first\">그림과 같이 중심이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>7<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math> 로 읽는다.<\/p><\/div>", "M": [{"질문": "이 문제가 결국 묻는 핵심은?", "선지": ["두 원이 공유하는 두 점으로 중심이 놓인 직선을 정하고, 접선과의 거리로 중심을 찾는 것", "두 원의 방정식을 빼서 공통현의 방정식을 구하는 것", "두 원의 중심 사이 거리와 반지름의 합을 비교하는 것", "원 밖의 한 점에서 그은 접선의 길이를 구하는 것", "직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><\/mrow><\/math> 위의 접점을 먼저 구해 중심을 찾는 것"], "말": ["맞다. P, Q 를 지나는 원의 중심은 PQ 의 수직이등분선 위고, 접선까지 거리가 반지름이다.", "공통현은 두 원의 식을 알 때 쓰는 도구다. 지금은 원의 식부터 모른다.", "두 원의 위치 관계는 '두 점에서 만난다' 로 이미 정해졌다. 따로 비교할 게 있을까?", "원 밖의 점에서 접선을 긋는 상황이 아니다. 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><\/mrow><\/math> 가 이미 주어져 있다.", "접점은 중심을 알아야 정해진다. 순서가 거꾸로다."], "풀이": "P, Q 를 둘 다 지나는 원의 중심은 PQ 의 수직이등분선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 위에 있다. 여기에 '직선에 접함 ⇔ 중심과 직선 사이 거리 = 반지름'을 걸면 중심이 정해진다. 공통현의 방정식이나 두 원의 위치 관계는 이 문제에서 쓰이지 않는다.", "보조": {"질문": "두 점 P, Q 를 모두 지나는 원의 중심은 어디에 있나?", "선지": ["선분 PQ 의 수직이등분선 위", "직선 PQ 위", "선분 PQ 의 중점"], "말": ["맞다. 두 원 모두 그 직선 위에 중심이 있다. 여기에 접선 조건을 더하면?", "직선 PQ 위의 점은 대부분 P, Q 중 한쪽에 더 가깝다. 같은 거리인 점들의 자취를 떠올리자.", "중점도 그중 하나지만 그것 하나뿐은 아니다."]}}, {"질문": "중심을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mi>a<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 로 둔 뒤, 두 중심을 한꺼번에 결정짓는 단계는?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mn>5<\/mn><\/mrow><\/mfrac><\/mstyle><mo>&#x0003D;<\/mo><msup><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>7<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><mo>&#x02212;<\/mo><mi>a<\/mi><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mo>&#x02212;<\/mo><mi>a<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><\/mrow><\/math> 의 두 근이 곧 A, B 의 x좌표", "중심과 P 사이 거리 = 중심과 Q 사이 거리로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math> 를 구한다", "중심과 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><\/mrow><\/math> 사이 거리를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>3<\/mn><mi>a<\/mi><\/mrow><mrow><msqrt><mn>5<\/mn><\/msqrt><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math> 로 놓는다", "두 원의 방정식을 뺀 직선이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><\/mrow><\/math> 와 평행하다", "중심의 y좌표가 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><\/mrow><\/math> 위 접점의 y좌표와 같다"], "말": ["맞다. 이 이차방정식의 두 근이 곧 두 중심이라, 근과 계수의 관계로 합이 바로 나온다.", "중심이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 위면 P, Q 까지 거리는 저절로 같다. 새 정보가 없다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mn>2<\/mn><mi>a<\/mi><mo>&#x02212;<\/mo><mi>a<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 를 다시 계산해 보자. 직선을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>x<\/mi><mo>&#x02212;<\/mo><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 으로 옮겼나?", "공통현을 쓰려면 두 원의 식이 필요하다. 아직 모른다.", "중심과 접점은 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><\/mrow><\/math> 에 수직인 선분으로 이어진다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>좌표가 같을 이유가 없다."], "풀이": "중심 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mi>a<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 와 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>x<\/mi><mo>&#x02212;<\/mo><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 사이 거리는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mi>a<\/mi><\/mrow><mrow><msqrt><mn>5<\/mn><\/msqrt><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math>, 이것이 P 까지 거리와 같다. 정리한 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>36<\/mn><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mn>260<\/mn><mi>a<\/mi><mo>&#x0002B;<\/mo><mn>425<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 의 두 근이 A, B 이므로 합은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>260<\/mn><\/mrow><mrow><mn>36<\/mn><\/mrow><\/mfrac><\/mstyle><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>65<\/mn><\/mrow><mrow><mn>9<\/mn><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math> 다. P, Q 까지 거리가 같다는 건 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 위에서 이미 자동으로 성립해 새 정보가 없다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mn>2<\/mn><mi>a<\/mi><mo>&#x0002B;<\/mo><mi>a<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 로 쓰면 직선을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 으로 착각한 것이다.", "보조": {"질문": "점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mi>a<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 와 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>x<\/mi><mo>&#x02212;<\/mo><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 사이의 거리는?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mi>a<\/mi><\/mrow><mrow><msqrt><mn>5<\/mn><\/msqrt><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>3<\/mn><mi>a<\/mi><\/mrow><mrow><msqrt><mn>5<\/mn><\/msqrt><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mi>a<\/mi><\/mrow><mrow><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math>"], "말": ["맞다. 이게 P 까지 거리와 같다는 식이 두 중심을 한꺼번에 정한다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mn>2<\/mn><mi>a<\/mi><mo>&#x0002B;<\/mo><mi>a<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 로 계산했다. 직선 식의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math> 계수 부호를 보자.", "분모는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><msup><mn>2<\/mn><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><\/mrow><\/msqrt><\/mrow><\/math> 이다."]}}, {"질문": "조건 '(단, 점 A 의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>좌표는 점 B 의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>좌표보다 작다.)' 는 풀이에서 어떤 역할을 하나?", "선지": ["답에는 영향이 없다 — 두 중심 중 어느 쪽을 A 라 부를지 정할 뿐이다", "두 중심 후보 중 하나를 버리게 한다", "두 중심이 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 위에 있음을 알려 준다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mi>a<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 와 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><\/mrow><\/math> 사이 거리의 절댓값을 풀게 한다", "두 원이 서로 다른 두 점에서 만남을 보장한다"], "말": ["맞다. 두 근이 둘 다 중심이고 묻는 건 합이라, 이름을 바꿔도 답이 같다.", "두 근 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>5<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>85<\/mn><\/mrow><mrow><mn>18<\/mn><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math> 이 다 양수다. 버릴 이유가 있는지 보자.", "중심이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 위라는 건 'P, Q 에서 만난다' 에서 나온다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math> 이라 절댓값은 그냥 풀린다. 이름 붙이기와는 상관없다.", "두 점에서 만난다는 건 발문에 이미 있다."], "풀이": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>36<\/mn><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mn>260<\/mn><mi>a<\/mi><mo>&#x0002B;<\/mo><mn>425<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 의 두 근 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>5<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>85<\/mn><\/mrow><mrow><mn>18<\/mn><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math> 이 둘 다 중심이 되고 묻는 것은 그 합 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>65<\/mn><\/mrow><mn>9<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 다. 그래서 어느 쪽을 A 라 불러도 답은 같다. 중심이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 위에 있는 것은 두 원이 P, Q 에서 만난다는 조건에서 나온다. 버리는 근도 없다.", "보조": {"질문": "두 중심의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>좌표가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>5<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>85<\/mn><\/mrow><mrow><mn>18<\/mn><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math> 일 때, A 와 B 를 바꿔 부르면 합은?", "선지": ["그대로다", "부호가 바뀐다", "구할 수 없다"], "말": ["맞다. 합은 순서와 상관없다. 그럼 이 단서는 무슨 일을 할까?", "덧셈은 순서를 바꿔도 같다.", "두 값이 다 있으니 바로 더할 수 있다."]}}, {"질문": "직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><\/mrow><\/math> 대신 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 에 동시에 접한다고 바꾸면?", "선지": ["그런 원은 없다 — 중심이 접선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 위에 놓여 거리가 0 이 된다", "x좌표 합은 그대로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>65<\/mn><\/mrow><mrow><mn>9<\/mn><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math> 이다", "두 원이 하나로 겹쳐 중심이 하나뿐이다", "조건을 만족하는 원이 무수히 많다", "두 중심의 x좌표 합이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>13<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math> 이 된다"], "말": ["맞다. 중심이 접선 위에 놓이면 반지름이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math> 이라 원이 안 된다.", "중심의 자취 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 는 그대로지만 접선이 바뀌었다. 거리 식부터 다시 세워 보자.", "겹친다는 건 같은 원이 된다는 뜻이다. 거리 조건을 넣어 직접 확인해 보자.", "조건이 바뀌어도 제약이 줄진 않았다. 거리 식이 어떻게 되는지 보자.", "값이 나오는지부터 확인하자. 중심 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mi>a<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 와 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 사이 거리는?"], "풀이": "PQ 의 수직이등분선은 그대로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 라 중심도 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 위다. 그런데 접선이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 면 중심과 접선 사이 거리가 0, 즉 반지름이 0 이어야 한다. 원이 될 수 없으니 그런 원은 없다.", "보조": {"질문": "점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mi>a<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 와 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 사이의 거리는?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mi>a<\/mi><\/mrow><mrow><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math>"], "말": ["맞다. 그런데 이 원은 P 를 지나야 하니 반지름이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math> 이면 안 된다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>a<\/mi><mo>&#x02212;<\/mo><mi>a<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 를 다시 계산해 보자.", "점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mi>a<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 는 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 위의 점이다."]}}, {"질문": "어떤 학생이 그림을 보고 중심 A 를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>2<\/mn><mi>a<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 로 두었더니 반지름이 0 이 나와 막혔다. 원인은?", "선지": ["접하는 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><\/mrow><\/math> 위에 중심이 있다고 착각했다", "점과 직선 사이 거리 공식의 분모를 잘못 썼다", "P 와 Q 의 좌표를 서로 바꿔 넣었다", "양변을 제곱하는 과정에서 근이 하나 사라졌다", "A 의 x좌표가 B 보다 작다는 조건을 빠뜨렸다"], "말": ["맞다. 접선 위에 중심을 두면 거리가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math> 이 된다. 중심은 다른 직선 위다.", "공식을 틀리면 이상한 값이 나오지, 딱 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math> 이 나오진 않는다.", "P, Q 를 바꿔도 반지름이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math> 이 될 이유는 없다.", "제곱하면 근이 늘 수는 있어도 반지름이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math> 이 되진 않는다.", "대소 조건은 마지막 이름 붙이기다. 막힌 건 그보다 앞이다."], "풀이": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>2<\/mn><mi>a<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 는 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><\/mrow><\/math> 위의 점이라 이 직선까지 거리가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mn>2<\/mn><mi>a<\/mi><mo>&#x02212;<\/mo><mn>2<\/mn><mi>a<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 이다. 반지름이 0 이 되니 식이 성립할 수 없다. 중심은 접선 위가 아니라 PQ 의 수직이등분선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 위에 있다.", "보조": {"질문": "점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>2<\/mn><mi>a<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 는 어느 직선 위의 점인가?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math>", "PQ 의 수직이등분선"], "말": ["맞다. 그 직선이 바로 접선이다. 학생이 어디서 착각했는지 보이지?", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 위의 점이라면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mi>a<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 꼴이다.", "PQ 의 수직이등분선은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 다."]}}, {"질문": "다음 중 이 문제와 같은 핵심 개념으로 푸는 것을 모두 고르면?<br>ㄱ. 두 점 (1, 0), (0, 1) 을 지나고 x축에 접하는 원의 중심 구하기<br>ㄴ. 두 원 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mn>3<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math> 의 공통현의 길이 구하기<br>ㄷ. 두 점 (0, 2), (2, 0) 에서 같은 거리에 있고, 그 거리가 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math> 까지의 거리와 같은 점 찾기", "선지": ["ㄱ, ㄷ", "ㄱ", "ㄴ", "ㄱ, ㄴ", "ㄱ, ㄴ, ㄷ"], "말": ["맞다. 둘 다 '수직이등분선 위 + 거리 = 직선까지 거리' 로 푼다.", "ㄱ 은 잘 봤다. '원' 이란 말이 없어도 같은 구조인 보기가 있는지 보자.", "ㄴ 은 두 원의 교점이 나와서 끌렸다. 그런데 거기서 구하는 건 공통현이다.", "ㄱ 은 잘 봤다. ㄴ 은 어떤 도구로 푸는지 다시 보자.", "셋 다 두 점이 나온다. 수직이등분선과 직선까지 거리를 함께 쓰는 게 어느 것인지 보자."], "풀이": "ㄱ 은 중심이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 위, x축까지 거리 = (1, 0) 까지 거리로 중심 (1, 1) 이 나온다. ㄷ 은 원이란 말은 없지만 '두 점에서 같은 거리 → 수직이등분선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 위, 그 거리 = 직선까지 거리'로 똑같다(점 (2, 2), (−6, −6)). ㄴ 은 두 원의 교점이라는 겉모습만 같고, 두 식을 빼 공통현을 구하는 다른 개념이다.", "보조": {"질문": "ㄷ 에서 두 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 에서 같은 거리인 점은 어느 직선 위에 있나?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math>"], "말": ["맞다. 그 거리가 직선까지 거리와 같다는 조건까지 이 문제와 똑같다. 보기를 다시 보자.", "그건 두 점을 지나는 직선이다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math> 위의 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>5<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 는 두 점까지 거리가 다르다."]}}], "H": {"질문": "이 문제, 첫 발은 뭐로 뗄까?", "선지": ["두 원이 지나는 P, Q 로 중심이 놓인 직선부터 찾는다", "원을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mi>A<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>B<\/mi><mi>y<\/mi><mo>&#x0002B;<\/mo><mi>C<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 으로 두고 P, Q 를 넣는다", "중심을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>2<\/mn><mi>a<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 로 둔다", "두 원의 식을 빼서 공통현을 구한다", "직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><\/mrow><\/math> 위의 접점을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>t<\/mi><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>2<\/mn><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 로 두고 시작한다"], "말": ["좋다. PQ 의 수직이등분선이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 라 중심을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mi>a<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 한 문자로 둘 수 있다.", "미지수가 셋이라 식이 무겁다. 중심의 위치를 먼저 좁히자.", "그건 접선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mi>x<\/mi><\/mrow><\/math> 위의 점이다. 중심이 접선 위에 있을 수 있을까?", "두 원의 식을 아직 모른다.", "할 수는 있지만 문자가 늘어난다. 중심 쪽을 먼저 좁히는 게 가볍다."], "힌트": ["두 점 P, Q 를 지나는 원의 중심은 선분 PQ 의 수직이등분선 위다. 그 직선을 구하자.", "중심은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 위라 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mi>a<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 로 둔다. 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>x<\/mi><mo>&#x02212;<\/mo><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 까지 거리 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mi>a<\/mi><\/mrow><mrow><msqrt><mn>5<\/mn><\/msqrt><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math> 가 P 까지 거리와 같다."]}}, {"id": "고림고 Ⅰ-9", "단원": "원의 방정식", "발문": "<div class=\"print\"><p class=\"first\">원 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><mo>&#x0003D;<\/mo><mn>9<\/mn><\/mrow><\/math> 위의 제<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>사분면에 있는<\/p><p>점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mi mathvariant=\"normal\">P<\/mi><\/mrow><\/mrow><\/math>에서의 접선이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>축과 만나는 점을 각각 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/math>라 하자<\/p><p>. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><\/mrow><mo>&#x0003C;<\/mo><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/mrow><\/math>이고 삼각형 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/math>의 넓이가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>27<\/mn><\/mrow><mrow><mn>4<\/mn><\/mrow><\/mfrac><\/mstyle><msqrt><mrow><mn>2<\/mn><\/mrow><\/msqrt><\/mrow><\/math>일 때,<\/p><p>점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><\/math>의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>좌표는? (단, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mi mathvariant=\"normal\">O<\/mi><\/mrow><\/mrow><\/math>는 원점이다.)<\/p><div style=\"display:flex;flex-wrap:wrap;gap:6px 16px;margin:8px 0\" class=\"ochoices \"><span class=\"och\"><span style=\"margin-right:4px\" class=\"ocn\">①<\/span><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><mn>6<\/mn><\/mrow><\/msqrt><\/mrow><\/math><\/span><span class=\"och\"><span style=\"margin-right:4px\" class=\"ocn\">②<\/span><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>3<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mstyle><msqrt><mrow><mn>6<\/mn><\/mrow><\/msqrt><\/mrow><\/math><\/span><span class=\"och\"><span style=\"margin-right:4px\" class=\"ocn\">③<\/span><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><msqrt><mrow><mn>6<\/mn><\/mrow><\/msqrt><\/mrow><\/math><\/span><span class=\"och\"><span style=\"margin-right:4px\" class=\"ocn\">④<\/span><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>5<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mstyle><msqrt><mrow><mn>6<\/mn><\/mrow><\/msqrt><\/mrow><\/math><\/span><span class=\"och\"><span style=\"margin-right:4px\" class=\"ocn\">⑤<\/span><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><msqrt><mrow><mn>6<\/mn><\/mrow><\/msqrt><\/mrow><\/math><\/span><\/div><\/div>", "M": [{"질문": "이 문제가 결국 묻는 핵심은?", "선지": ["원 위의 점에서의 접선 공식으로 두 절편을 접점 좌표로 나타내는 것", "원 밖의 점에서 그은 접선의 기울기를 판별식으로 구하는 것", "점과 직선 사이 거리로 원과 직선의 위치 관계를 판정하는 것", "삼각형 OAB 의 외접원의 중심을 구하는 것", "두 점 사이의 거리로 접선의 길이를 구하는 것"], "말": ["맞다. P 가 원 위의 점이라 접선이 공식으로 바로 나오고, 두 절편이 A, B 다.", "판별식은 접점을 모를 때 쓰는 방법이다. 여기선 접점이 원 위의 P 다.", "위치 관계 판정은 직선이 주어졌을 때 하는 일이다. 여기선 접선을 직접 만든다.", "외접원은 이 문제에 안 나온다. 묻는 건 절편 하나다.", "접선의 길이는 원 밖의 점에서 쓰는 개념이다."], "풀이": "P 가 원 위의 점이라 접선은 공식 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>b<\/mi><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>9<\/mn><\/mrow><\/math> 로 바로 나오고, 두 절편이 A, B 다. 여기에 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>b<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>9<\/mn><\/mrow><\/math> 와 넓이 조건을 연립한다. 판별식으로 기울기를 구하는 건 원 밖의 점에서 접선을 그을 때 쓰는 방법이다.", "보조": {"질문": "원 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><m tp://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/math>라 하자. 사각형 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mrow><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/math>의 넓이가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>8<\/mn><\/mrow><\/math>일 때,<\/p><p>두 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mrow><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mrow><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/math> 및 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>축으로 둘러싸인 부분의 넓이는?<\/p><p>(단, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mi mathvariant=\"normal\">O<\/mi><\/mrow><\/mrow><\/math>는 원점이고, 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><\/math>의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>좌표는 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/math>의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>좌표보다 작다.)<\/p><div style=\"display:flex;flex-wrap:wrap;gap:6px 16px;margin:8px 0\" class=\"ochoices \"><span class=\"och\"><span style=\"margin-right:4px\" class=\"ocn\">①<\/span><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>10<\/mn><\/mrow><\/math><\/span><span class=\"och\"><span style=\"margin-right:4px\" class=\"ocn\">②<\/span><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>31<\/mn><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math><\/span><span class=\"och\"><span style=\"margin-right:4px\" class=\"ocn\">③<\/span><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>32<\/mn><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math><\/span><span class=\"och\"><span style=\"margin-right:4px\" class=\"ocn\">④<\/span><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>11<\/mn><\/mrow><\/math><\/span><span class=\"och\"><span style=\"margin-right:4px\" class=\"ocn\">⑤<\/span><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>34<\/mn><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math><\/span><\/div><\/div>", "M": [{"질문": "이 문제가 결국 묻는 핵심은?", "선지": ["접점에서 반지름과 접선이 수직이라 PAOB 를 두 직각삼각형으로 보는 것", "두 접선이 서로 수직이라 PAOB 가 정사각형임을 쓰는 것", "두 접선 사이의 거리를 점과 직선 사이 거리로 구하는 것", "원과 직선의 교점을 판별식으로 구해 넓이를 계산하는 것", "원의 중심이 두 접선의 교점과 같은 직선 위에 있음을 쓰는 것"], "말": ["맞다. OA⊥PA 라 PAOB 는 합동인 직각삼각형 두 개고, 넓이가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><mo>&#x000D7;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><\/mrow><\/math> 다.", "그림이 정사각형처럼 보일 수 있다. 그런데 두 접선이 수직이라는 조건이 있었나?", "두 접선은 P 에서 만난다. 평행선 사이 거리가 아니다.", "판별식은 무겁고, 넓이로 바로 이어지지 않는다.", "O, P 를 잇는 직선은 늘 있다. 그 사실만으론 수가 안 정해진다."], "풀이": "OA⊥PA, OB⊥PB 이고 PA=PB 라 PAOB 는 합동인 직각삼각형 두 개다. 그래서 넓이가 곧 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><mo>&#x000D7;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><\/mrow><\/math> 다. 두 접선이 수직이라는 조건은 없다. 정사각형으로 보면 PA=2 가 되어 넓이 4 밖에 안 나온다.", "보조": {"질문": "접점 A 에서 반지름 OA 와 접선 PA 는?", "선지": ["서로 수직이다", "서로 평행하다", "길이가 같다"], "말": ["맞다. 그래서 삼각형 OAP 는 직각삼각형이다. 사각형 PAOB 를 다시 보자.", "두 선분은 A 에서 만난다. 평행할 수 없다.", "OA 는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><\/mrow><\/math> 이고 PA 는 P 위치에 따라 달라진다."]}}, {"질문": "점 P 를 확정하는 결정적 단계는?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><mo>&#x000D7;<\/mo><mn>2<\/mn><mo>&#x0003D;<\/mo><mn>8<\/mn><\/mrow><\/math> 에서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math>, 따라서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>b<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>20<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><mo>&#x000D7;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\" \/mn><\/mrow><\/msqrt><\/mrow><\/mfrac><\/mstyle><mo>&#x0003C;<\/mo><mn>2<\/mn><\/mrow><\/math> 로 접선이 아니다. 사실 이 직선은 두 접점 A(0, 2), B<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>8<\/mn><mn>5<\/mn><\/mfrac><\/mstyle><mo>&#x0002C;<\/mo><mo>&#x02212;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>6<\/mn><mn>5<\/mn><\/mfrac><\/mstyle><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/math> 를 잇는 직선이다.", "보조": {"질문": "직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math> 와 원점 사이의 거리는?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>2<\/mn><\/mrow><mrow><msqrt><mn>5<\/mn><\/msqrt><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>4<\/mn><\/mrow><mrow><msqrt><mn>5<\/mn><\/msqrt><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math>"], "말": ["맞다. 반지름 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><\/mrow><\/math> 보다 작으니 원을 뚫고 지나간다. 접선이 아니다. 학생이 무슨 공식을 썼을까?", "거리 공식으로 계산해 보자. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x02212;<\/mo><mn>4<\/mn><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><mrow><msqrt><mrow><msup><mn>4<\/mn><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mn>2<\/mn><mn>2<\/mn><\/msup><\/mrow><\/msqrt><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math> 이다.", "분모 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><mn>20<\/mn><\/mrow><\/msqrt><mo>&#x0003D;<\/mo><mn>2<\/mn><msqrt><mn>5<\/mn><\/msqrt><\/mrow><\/math> 로 다시 약분해 보자."]}}, {"질문": "다음 중 이 문제와 같은 핵심 개념으로 푸는 것을 모두 고르면?<br>ㄱ. 원 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math> 위의 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><msqrt><mn>2<\/mn><\/msqrt><mo>&#x0002C;<\/mo><msqrt><mn>2<\/mn><\/msqrt><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 에서의 접선의 방정식 구하기<br>ㄴ. 점 (3, 4) 에서 원 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>9<\/mn><\/mrow><\/math> 에 그은 접선의 길이 구하기<br>ㄷ. 반지름 5 인 원판의 중심에서 13 떨어진 기둥에서 원판 가장자리에 팽팽히 건 줄의 길이", "선지": ["ㄴ, ㄷ", "ㄴ", "ㄱ", "ㄱ, ㄴ", "ㄱ, ㄴ, ㄷ"], "말": ["맞다. ㄴ, ㄷ 모두 반지름⊥접선 직각삼각형으로 접선 길이를 구한다.", "ㄴ 은 잘 봤다. '원' 이란 말이 없어도 같은 그림인 보기가 있는지 보자.", "ㄱ 은 '접선' 이란 말이 같아서 끌렸다. 그런데 그 점은 원 위일까, 밖일까?", "ㄴ 은 잘 봤다. ㄱ 의 점이 원 위인지 확인해 보자.", "셋 다 접선이 나온다. 원 밖의 점에서 그은 접선이 어느 것인지 보자."], "풀이": "ㄴ 은 반지름⊥접선 직각삼각형에서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><mn>25<\/mn><mo>&#x02212;<\/mo><mn>9<\/mn><\/mrow><\/msqrt><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math> 다. ㄷ 은 원이란 말은 없지만 같은 직각삼각형으로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><mn>169<\/mn><mo>&#x02212;<\/mo><mn>25<\/mn><\/mrow><\/msqrt><mo>&#x0003D;<\/mo><mn>12<\/mn><\/mrow><\/math> 다. ㄱ 은 '접선'이라는 말만 같고 원 위의 점이라 공식 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mn>2<\/mn><\/msqrt><mi>x<\/mi><mo>&#x0002B;<\/mo><msqrt><mn>2<\/mn><\/msqrt><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math> 로 끝나는 다른 개념이다.", "보조": {"질문": "ㄷ 에서 줄, 원판의 반지름, 기둥–중심 선분이 만드는 도형은?", "선지": ["줄과 반지름이 수직인 직각삼각형", "정삼각형", "이등변삼각형"], "말": ["맞다. 이 문제의 OAP 와 같은 삼각형이다. 보기를 다시 보자.", "세 변이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>5<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>12<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>13<\/mn><\/mrow><\/math> 이라 정삼각형이 아니다.", "길이가 같은 두 변이 없다."]}}], "H": {"질문": "이 문제, 첫 발은 뭐로 뗄까?", "선지": ["반지름 OA 와 접선 PA 가 수직임을 써서 넓이를 PA 로 쓴다", "접선을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>b<\/mi><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math> 로 쓴다", "두 접선이 수직이라 보고 PAOB 를 정사각형으로 둔다", "P 를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>4<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 로 짐작해 넣어 본다", "접선의 기울기를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m<\/mi><\/mrow><\/math> 으로 두고 판별식부터 쓴다"], "말": ["좋다. 넓이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>8<\/mn><\/mrow><\/math> 이 접선 길이 PA 를 정하고, 그게 OP 를 정한다.", "그 공식은 원 위의 점에서만 접선이다. P 는 원 밖이다.", "두 접선이 수직이라는 조건은 없다.", "짐작이 맞을 수는 있어도 근거가 필요하다. 넓이 조건부터 쓰자.", "P 를 모르는 채 기울기부터 잡으면 문자가 너무 많다."], "힌트": ["접점에서 반지름과 접선은 수직이다. 사각형 PAOB 를 직각삼각형 두 개로 나눠 보자.", "넓이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0003D;<\/mo><mn>2<\/mn><mo>&#x000D7;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><mo>&#x000D7;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><mo>&#x000D7;<\/mo><mn>2<\/mn><mo>&#x0003D;<\/mo><mn>8<\/mn><\/mrow><\/math> 이라 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">P<\/mi><\/mrow><\/mrow><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>4<\/mn><mo>&#x0002B;<\/mo><mn>16<\/mn><mo>&#x0003D;<\/mo><mn>20<\/mn><\/mrow><\/math> 이다."]}}];</script><script>
const KEY='haebu-tree:'+META.id;
let S={pi:0,log:[]};
const $=s=>document.querySelector(s);
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function rnd(seed){let x=seed%2147483647;if(x<=0)x+=2147483646;return()=>(x=x*16807%2147483647)/2147483647;}
function hash(s){let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))%1000003;return h;}
function shuffled(n,tag){const r=rnd(hash(META.id+tag)+n);const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function scrollEnd(n){setTimeout(()=>n.scrollIntoView({behavior:'smooth',block:'start'}),60);}

/* 카드 하나: 질문 + 선지. onPick(원래 인덱스) */
function ask(box,lab,labc,q,opts,tag,locked,onPick){
  const b=el('div','bub q');b.appendChild(el('div','lab'+(labc?' '+labc:''),lab));b.appendChild(el('div','',q));
  const g=el('div','opts');const ord=shuffled(opts.length,tag);
  ord.forEach((k,i)=>{const o=el('button','op'+((locked||[]).includes(k)?' lock':''),'<b>'+'①②③④⑤'[i]+'</b><span>'+opts[k]+'</span>');
    o.onclick=()=>{if(g.classList.contains('done'))return;
      g.querySelectorAll('.op').forEach(x=>x.classList.remove('pick'));o.classList.add('pick');sel=[k,o];
      ok.disabled=false;ok.textContent='이걸로 할게';};g.appendChild(o);});
  // (1009) 바로 넘어가지 않는다 — 고른 뒤 [이걸로 할게] 를 눌러야 확정. 잘못 터치하면 다른 걸 다시 고르면 된다.
  let sel=null;const ok=el('button','nx cf','하나 골라 봐');ok.disabled=true;
  ok.onclick=()=>{if(!sel||g.classList.contains('done'))return;g.classList.add('done');ok.remove();onPick(sel[0],sel[1],g);};
  b.appendChild(g);b.appendChild(ok);box.appendChild(b);scrollEnd(b);return g;
}
function say(box,cls,h){const b=el('div','bub say '+cls,h);box.appendChild(b);return b;}
function nextBtn(box,txt,fn){const n=el('button','nx',txt);n.onclick=()=>{n.remove();fn();};box.appendChild(n);scrollEnd(n);}

function runProblem(pi){
  const P=PROBS[pi];const root=$('#thread');root.innerHTML='';
  const card=$('#prob');card.innerHTML='';card.className='prob';
  card.appendChild(el('div','ph',(pi+1)+' / '+PROBS.length+' · '+P.id+(P.단원?' · '+P.단원:'')));
  card.appendChild(el('div','stem',P.발문));
  const tog=el('button','tog','문제 접기');tog.onclick=()=>{card.classList.toggle('fold');tog.textContent=card.classList.contains('fold')?'문제 펼치기':'문제 접기';};card.appendChild(tog);
  const dots=el('div','dots');for(let k=0;k<6;k++)dots.appendChild(el('i'));card.appendChild(dots);
  const res=Array(6).fill(null);   // 'o' | 't' | 'x'
  const rec={id:P.id,입구:null,갈림:null,첫발:null,스텝:[]};
  const paint=cur=>dots.querySelectorAll('i').forEach((d,k)=>d.className=res[k]||(k===cur?'cur':''));

  // ① 입구
  ask(root,'먼저','', '이 문제, 풀어 봤을 때 어땠어?',
    ['맞혔고, 왜 그런지 설명도 할 수 있다','맞히긴 했는데 감으로 풀었다','풀었는데 틀렸다','손도 못 댔다'],'in',[],k=>{
      rec.입구=k;
      if(k<=1){say(root,'',k===0?'좋아. 그럼 진짜 설명할 수 있는지 하나씩 확인해 보자.':'감으로 맞힌 건 다음엔 틀릴 수 있다. 근거를 하나씩 세워 보자.');go([0,1,2,3,4,5]);}
      else if(k===2){
        ask(root,'어디서','', '어디서 갈렸던 것 같아?',
          ['무엇을 묻는 문제인지부터 헷갈렸다','식을 어떻게 세울지 몰랐다','조건을 놓쳤거나 잘못 읽었다','계산하거나 답 고르다 틀렸다','잘 모르겠다'],'wh',[],j=>{
            rec.갈림=j;const first=[0,1,2,4,0][j];
            say(root,'','그럼 거기부터 보자. 나머지도 이어서 짚는다.');
            go([first,...[0,1,2,3,4,5].filter(x=>x!==first)]);});
      } else firstStep(()=>go([0,1,2,3,4,5]));
    });

  function firstStep(done){
    const H=P.H;let tries=0;const locked=[];
    const once=()=>ask(root,'첫 발','h',H.질문,H.선지,'H'+tries,locked,(k,o)=>{
      if(k===0){o.classList.add('right');say(root,'ok',H.말[0]);rec.첫발=tries;nextBtn(root,'이제 문제를 뜯어보자',done);}
      else{o.classList.add('wrong');locked.push(k);say(root,'no',H.말[k]);
        if(tries===0){tries=1;say(root,'sol','💡 '+H.힌트[0]);nextBtn(root,'다시 골라 볼게',once);}
        else{say(root,'sol','💡 '+H.힌트[1]);rec.첫발=2;nextBtn(root,'이제 문제를 뜯어보자',done);}}
    });
    once();
  }

  function go(order){
    let i=0;
    const step=()=>{
      if(i>=order.length)return finish();
      const s=order[i++];paint(s);const M=P.M[s];const locked=[];
      const lab='STEP '+(s+1)+' · '+STEPNAME[s];
      ask(root,lab,'',M.질문,M.선지,'M'+s,locked,(k,o)=>{
        if(k===0){o.classList.add('right');say(root,'ok',M.말[0]);res[s]='o';rec.스텝[s]={결과:'o',고른것:[k]};paint(-1);nextBtn(root,i<order.length?'다음':'정리 보기',step);return;}
        o.classList.add('wrong');locked.push(k);say(root,'no',M.말[k]);const picks=[k];
        // 보조 → 재도전
        nextBtn(root,'작은 것부터 확인',()=>{
          const B=M.보조;
          ask(root,'디딤돌','sub',B.질문,B.선지,'B'+s,[],(j,o2)=>{
            o2.classList.add(j===0?'right':'wrong');say(root,j===0?'ok':'no',B.말[j]);
            if(j!==0)say(root,'sol','디딤돌 답: '+B.선지[0]);
            nextBtn(root,'처음 질문 다시',()=>{
              ask(root,lab+' · 다시','',M.질문,M.선지,'M'+s+'r',locked,(k2,o3)=>{
                picks.push(k2);
                if(k2===0){o3.classList.add('right');say(root,'ok','다시 잡았다. '+M.말[0]);res[s]='t';}
                else{o3.classList.add('wrong');say(root,'no',M.말[k2]);say(root,'sol','<b>정리</b> '+M.풀이);res[s]='x';}
                rec.스텝[s]={결과:res[s],고른것:picks,디딤돌:j};paint(-1);
                nextBtn(root,i<order.length?'다음':'정리 보기',step);
              });
            });
          });
        });
      });
    };
    step();
  }

  function finish(){
    paint(-1);S.log[pi]=rec;save();
    const sm=el('div','sum');sm.appendChild(el('h3','',P.id+' 정리'));
    const mk={o:['○','o','한 번에'],t:['△','t','디딤돌 뒤'],x:['✕','x','다시 볼 것']};
    for(let k=0;k<6;k++){const r=res[k];const m=r?mk[r]:['–','s','건너뜀'];
      const row=el('div','row');row.appendChild(el('span','','STEP '+(k+1)+' '+STEPNAME[k]));row.appendChild(el('span','mk '+m[1],m[0]+' '+m[2]));sm.appendChild(row);}
    const weak=[...Array(6).keys()].filter(k=>res[k]==='x'||res[k]==='t');
    sm.appendChild(el('div','weak',weak.length?'<b>여기가 약한 곳</b> · '+weak.map(k=>STEPNAME[k]).join(', ')+(rec.입구<=1&&weak.length>=2?'<br>맞힌 문제였는데도 여기서 걸렸다 — 답을 외운 건 아닌지 다시 보자.':''):'<b>여섯 군데 다 한 번에 통과.</b> 이 문제는 진짜 네 거다.'));
    root.appendChild(sm);
    if(pi+1<PROBS.length)nextBtn(root,'다음 문제 →',()=>{S.pi=pi+1;save();window.scrollTo(0,0);runProblem(pi+1);});
    else root.appendChild(el('div','bub say ok','오늘 세트 끝. 수고했다.'));
    scrollEnd(sm);
  }
}
try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.log)S=d;}catch(e){}
runProblem(Math.min(S.pi||0,PROBS.length-1));
</script></body></html>
