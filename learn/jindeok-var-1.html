<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>진덕고 프린트 해부 · 평면좌표와 직선의 방정식 · 원본+변형</title><style>
:root{--key:#EA9090;--deep:#C0524E;--ink:#333;--mute:#8A8A8A;--tint:#FAE3E1;
 --soft:#F6F6F6;--line:#E6E6E6;--ok:#3E8E6E;--okbg:#E9F4EF;--no:#C0524E;--nobg:#FBEDEC;
 --warn:#B26A00;--warnbg:#FFF3E0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Paperlogy','Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
 background:#EFEFEF;color:var(--ink);font-size:16px;line-height:1.65;padding-bottom:64px}
.wrap{max-width:560px;margin:0 auto;background:#fff;min-height:100vh}
header{padding:22px 20px 16px;background:#2E2E2E;color:#fff;position:sticky;top:0;z-index:20}
.brand{font-size:12px;letter-spacing:.08em;color:var(--key);font-weight:700}
h1{margin:6px 0 2px;font-size:21px;font-weight:800;letter-spacing:-.01em}
.meta{font-size:12.5px;color:#B9B9B9}
.bar{display:flex;gap:5px;margin-top:14px}
.bar i{flex:1;height:4px;border-radius:2px;background:#4A4A4A;transition:background .25s}
.bar i.done{background:var(--key)}
.bar i.wrong{background:#7A4B49}
.guide{margin:0;padding:15px 20px;background:var(--tint);color:var(--deep);font-size:13.5px;line-height:1.6}
.guide b{display:block;font-size:14.5px;margin-bottom:3px}
.part{padding:22px 20px 4px}
.part .pl{font-size:12px;font-weight:800;color:var(--deep);letter-spacing:.04em}
.part .pt{font-size:17px;font-weight:800;margin-top:3px}
.part .pd{font-size:13px;color:var(--mute);margin-top:3px}
.q{padding:20px 20px 24px;border-bottom:10px solid #F1F1F1}
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.qno{font-size:13px;font-weight:800;color:var(--deep)}
.tag{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--tint);color:var(--deep);font-weight:600}
.tag.grey{background:var(--soft);color:var(--mute)}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.pct{background:#EDEDED;color:#6E6E6E}
.stem{font-size:15.5px;margin:0 0 4px}
/* (0908) 학교프린트 원문 조각 — hwpx2html 산출을 그대로 담는다 */
.print{font-size:15px;line-height:1.7}
.print p{margin:0 0 2px}
.print .lead,.print .box{background:var(--soft);border-left:3px solid #555;padding:6px 10px;margin:8px 0}
.print .bogi{border:1px solid #444;padding:12px 10px 6px;margin:12px 2px 8px;position:relative}
.print .bogi .lbl{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:#fff;padding:0 6px;font-weight:700;font-size:13px}
.print .bl{margin:0 0 2px}
.print .fig{text-align:center;margin:8px 0}
.print img{max-width:100%;height:auto}
.print .fl{float:right;margin:0 0 4px 8px;max-width:48%}
.print .fl.left{float:left;margin:0 8px 4px 0}
.print .pcs{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 10px;margin-top:10px;clear:both}
.print .pcs.c1{grid-template-columns:1fr}
.print .pch{display:flex;gap:4px;align-items:baseline}
.print .pcn{color:var(--mute);flex-shrink:0}
.print .tbl{border-collapse:collapse;margin:4px auto;font-size:14px}
.print .tbl td{border:1px solid #444;padding:2px 6px;text-align:center}
.print .tbl.grid td{border:none}
.print .tab{display:inline-block;width:14px}
.print .missing{color:var(--no)}
.disp{margin:14px 0;text-align:center;font-size:17px;overflow-x:auto}
.field{margin-top:16px}
.flabel{font-size:13px;color:var(--mute);margin-bottom:6px;display:block}
.row{display:flex;gap:8px;align-items:stretch}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:17px;padding:13px 14px;
 border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--key)}
input[type=text]:disabled{background:var(--soft);color:var(--mute)}
button{font:inherit;cursor:pointer;border:none}
.btn{padding:13px 20px;border-radius:10px;background:var(--ink);color:#fff;font-weight:700;
 font-size:15px;white-space:nowrap}
.btn:disabled{background:#CFCFCF;cursor:default}
.btn.wide{width:100%;padding:16px;font-size:16px}
.choices{display:grid;gap:8px;margin-top:8px}
.ch{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);
 border-radius:10px;font-size:14.5px;background:#fff;text-align:left;color:var(--ink);line-height:1.5}
.ch b{color:var(--mute);font-weight:700;flex-shrink:0}
.ch.sel{border-color:var(--key);background:var(--tint)}
.ch:disabled{opacity:1}
.ch.ans{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.ch.ans b{color:var(--ok)}
.ch.miss{border-color:var(--no);background:var(--nobg);color:var(--no)}
.ch.idk{border-style:dashed;color:var(--mute);background:var(--soft);font-size:13px;padding:9px 14px}
.ch.idk.sel{border-color:var(--warn);background:var(--warnbg);color:var(--warn)}
.ch.miss b{color:var(--no)}
.ch.dim{opacity:.45}
.steps{margin-top:8px;border-left:2px solid var(--tint);padding-left:14px}
.step{margin-bottom:18px}.step:last-child{margin-bottom:4px}
.sk{font-size:13px;font-weight:700;color:var(--deep);margin-bottom:7px}
.verdict{margin-top:16px;border-radius:12px;padding:14px 16px;font-size:14.5px;display:none}
.verdict.show{display:block}
.verdict.ok{background:var(--okbg);color:var(--ok)}
.verdict.no{background:var(--nobg);color:var(--no)}
.verdict .vt{font-weight:800;font-size:15px;margin-bottom:6px}
.sol{margin-top:12px;padding-top:12px;border-top:1px solid rgba(0,0,0,.08);color:var(--ink);font-size:14px}
.sol .sl{font-weight:700;font-size:12.5px;color:var(--mute);margin-bottom:6px}
.sol p{margin:0 0 7px}
.result{padding:26px 20px 34px;display:none;scroll-margin-top:132px}
.result.show{display:block}
.score{text-align:center;padding:18px 0 14px}
.score .n{font-size:46px;font-weight:800;color:var(--deep);line-height:1}
.score .l{font-size:13px;color:var(--mute);margin-top:6px}
.rsec{margin-top:20px}
.rsec .rh{font-size:12px;font-weight:800;color:var(--deep);letter-spacing:.04em;margin-bottom:2px}
.rlist{border-top:1px solid var(--line)}
.ri{display:flex;justify-content:space-between;gap:12px;padding:11px 2px;
 border-bottom:1px solid var(--line);font-size:14px}
.ri span:first-child{color:var(--mute);flex:1}
.ri .o{color:var(--ok);font-weight:700}.ri .x{color:var(--no);font-weight:700}
.next{margin-top:22px;background:var(--tint);border-radius:12px;padding:16px 18px;font-size:14px}
.next b{display:block;color:var(--deep);font-size:14.5px;margin-bottom:7px}
.next .nl{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.next .nl em{font-style:normal;color:var(--deep);font-weight:700;font-size:13px;white-space:nowrap}
.next .nl em.done{color:var(--ok)}
.next .nl em.zero{color:var(--no)}
.next .nn{margin-top:10px;padding-top:10px;border-top:1px solid rgba(192,82,78,.22);color:var(--deep);font-size:13px;font-weight:700}
details.dev{border-top:10px solid #F1F1F1;padding:18px 20px;background:#FAFAFA}
details.dev summary{font-size:13px;font-weight:700;color:var(--mute);cursor:pointer}
pre{background:#2E2E2E;color:#E8E8E8;padding:14px;border-radius:10px;overflow-x:auto;
 font-size:11.5px;line-height:1.6;font-family:ui-monospace,Menlo,Consolas,monospace}
.flag{margin-top:12px;text-align:right}
.flag .fl{font-size:12px;color:#BDBDBD;text-decoration:underline;cursor:pointer;
 background:none;border:none;padding:2px 0}
.flag textarea{width:100%;font:inherit;font-size:14.5px;padding:11px 12px;line-height:1.5;
 border:1.5px solid var(--line);border-radius:10px;margin-top:8px;resize:vertical;
 color:var(--ink);background:#fff;text-align:left}
.flag textarea:focus{outline:none;border-color:var(--key)}
.flag .sm{padding:9px 16px;font-size:13.5px;margin-top:7px;border-radius:9px;
 background:var(--ink);color:#fff;font-weight:700}
.flag .sent{font-size:12.5px;color:var(--ok);font-weight:700}
.foot{text-align:center;padding:22px;color:#B5B5B5;font-size:11.5px}
/* 제출 상태 바 (0907) — 학생이 '냈다'고 믿는 것과 서버에 남은 것이 어긋나던 사고.
   전송 성공·실패·남은 문항을 화면 아래에 항상 띄운다. */
.sbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;
 gap:10px;padding:11px 16px;font-size:13.5px;font-weight:700;line-height:1.45;
 background:#2E2E2E;color:#fff;box-shadow:0 -2px 10px rgba(0,0,0,.14)}
.sbar.ok{background:var(--ok)}
.sbar.no{background:var(--no)}
.sbar .st{flex:1}
.sbar button{padding:8px 14px;font:inherit;font-size:13px;border:none;border-radius:9px;
 background:#fff;color:var(--ink);font-weight:800;cursor:pointer;white-space:nowrap}
.card{margin:2px 20px 6px;padding:18px 18px 16px;background:var(--tint);border-radius:14px}
.card .cl{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--deep)}
.card .ct{font-size:17.5px;font-weight:800;margin:4px 0 12px;color:var(--ink);letter-spacing:-.01em}
.card h4{margin:15px 0 5px;font-size:14px;font-weight:800;color:var(--deep)}
.card h4:first-of-type{margin-top:0}
.card p{margin:0 0 6px;font-size:14.5px;line-height:1.7}
.card .eq{margin:10px 0;text-align:center;font-size:16.5px;overflow-x:auto}
.card .key{margin-top:13px;padding:12px 14px;background:#fff;border-radius:10px;
 font-size:14px;font-weight:700;color:var(--deep);line-height:1.6}
.ov{border-top:1.15px solid currentColor;padding-top:1px;margin:0 .06em;
 font-family:'Cambria Math','Times New Roman',Georgia,serif;font-style:normal;white-space:nowrap}
.ov+sup{font-style:normal;font-family:'Cambria Math','Times New Roman',Georgia,serif}
.card .fig{margin:12px 0 14px;text-align:center;line-height:0}
.card .fig svg{max-width:100%;height:auto;display:inline-block}
.card .fig .cap{display:block;line-height:1.5;margin-top:5px;font-size:12px;color:var(--mute)}
.card .cwarn{margin-top:9px;padding:11px 14px;background:var(--warnbg);color:var(--warn);
 border-radius:10px;font-size:13.5px;font-weight:700;line-height:1.6}
/* (0911) 되짚기(사후평가) — 풀지 않는다. 내 답·정답 한 줄 + 상태·원인 두 묶음 */
.pe-meta{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 2px;font-size:13.5px;color:var(--mute)}
.pe-meta b{color:var(--ink);font-weight:700}
.pe-meta .no{color:var(--no)}
.pe-meta .yes{color:var(--ok)}
.pe .choices{gap:6px}
.pe .ch{padding:10px 13px;font-size:14px}
.pe .ch.sel:disabled{border-color:var(--key);background:var(--tint)}
/* (0913 유강) 문제 자세히보기 — 어떤 문제였는지 기억 안 나는 애들이 있다. 기본은 접힘(8문항이면 페이지가 길다)
   (0926) <details>/<summary> 를 버리고 버튼+클래스로 — 일부 폰 브라우저에서 summary 탭이 안 먹힌다는 신고. 버튼은 어디서나 먹는다 */
.peek{margin:8px 0 2px}
.peek>.pk{display:inline-flex;align-items:center;gap:5px;cursor:pointer;background:#fff;
 font-size:13px;font-weight:700;font-family:inherit;line-height:1.3;color:var(--key);border:1px solid var(--line);border-radius:9px;
 padding:7px 12px;user-select:none;-webkit-appearance:none;appearance:none}
.peek>.pk::before{content:'＋';font-weight:400}
.peek.open>.pk::before{content:'－'}
.peek>.stem{display:none;margin-top:9px;padding:11px 13px;background:var(--soft);border-radius:10px}
.peek.open>.stem{display:block}
math{font-family:'Cambria Math','STIX Two Math','Latin Modern Math','Times New Roman',serif;font-size:1.06em}
.disp math{font-size:1.18em}
.stem math,.ch math,.sk math,.sol math{vertical-align:-0.1em}

.tw{padding:0 16px 90px;box-sizing:border-box}
.bub,.nx,.sum,.prob{scroll-margin-top:150px}
.prob{background:var(--card,#fff);border:1px solid var(--line,#e5e7eb);border-radius:14px;padding:14px 14px 10px;margin:14px 0}
.prob .ph{font-size:12px;color:#6b7280;margin-bottom:6px;font-weight:600}
.prob .stem{font-size:15px;line-height:1.7}
.prob .fig img{max-width:100%;height:auto}
.prob.fold .stem{max-height:5.2em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent)}
.prob .tog{font-size:12px;color:#6b7280;background:none;border:0;padding:4px 0;cursor:pointer}
.thread{margin-top:6px}
.bub{border-radius:14px;padding:12px 14px;margin:10px 0;line-height:1.65;font-size:15px;animation:up .25s ease}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bub.q{background:#fff;border:1px solid #e5e7eb}
.bub.q .lab{font-size:11px;font-weight:700;letter-spacing:.04em;color:#b45309;margin-bottom:4px}
.bub.q .lab.sub{color:#2563eb}
.bub.q .lab.h{color:#7c3aed}
.bub.say{background:#f3f4f6;border-left:3px solid #9ca3af}
.bub.say.ok{background:#ecfdf5;border-left-color:#10b981}
.bub.say.no{background:#fff7ed;border-left-color:#f97316}
.bub.say.sol{background:#eff6ff;border-left-color:#3b82f6}
.opts{display:grid;gap:8px;margin-top:10px}
.op{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid #e5e7eb;background:#fff;border-radius:12px;padding:11px 12px;font:inherit;font-size:15px;line-height:1.5;color:inherit;cursor:pointer}
.op b{flex:none;color:#9ca3af;font-weight:600}
.op:active{background:#f9fafb}
.op.pick{border-color:#111827;background:#f9fafb}
.op.right{border-color:#10b981;background:#ecfdf5}
.op.wrong{border-color:#f97316;background:#fff7ed}
.op.lock{opacity:.38;pointer-events:none;text-decoration:line-through}
.opts.done .op{pointer-events:none}
.opts.done .op:not(.pick):not(.right){opacity:.45}
.nx.cf{margin-top:12px}.nx.cf:disabled{background:#d1d5db;cursor:default}
.nx{display:block;width:100%;margin:12px 0 4px;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:700;background:#111827;color:#fff;cursor:pointer}
.sum{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin:14px 0}
.sum h3{margin:0 0 8px;font-size:15px}
.sum .row{display:flex;justify-content:space-between;padding:6px 0;border-top:1px dashed #e5e7eb;font-size:14px}
.sum .row:first-of-type{border-top:0}
.mk{font-weight:800}.mk.o{color:#059669}.mk.t{color:#d97706}.mk.x{color:#dc2626}.mk.s{color:#9ca3af}
.sum .weak{margin-top:10px;font-size:14px;background:#fff7ed;border-radius:10px;padding:10px}
.dots{display:flex;gap:6px;margin:10px 0 0}
.dots i{flex:1;height:5px;border-radius:3px;background:#e5e7eb}
.dots i.cur{background:#111827}.dots i.o{background:#10b981}.dots i.t{background:#f59e0b}.dots i.x{background:#ef4444}
.stem math,.op math,.bub math{vertical-align:-0.1em}
</style></head><body><div class="wrap tw"><header><div class="brand">수학은유강 · TARGET TRAINING</div><h1>진덕고 프린트 해부 · 평면좌표와 직선의 방정식 · 원본+변형</h1><div class="meta">원본 문제를 다시 푸는 게 아니다 · 고른 뒤 [이걸로 할게]를 누르면 반응하고, 답에 따라 다음 질문이 바뀐다 · 8문항</div></header><div id="prob" class="prob"></div><div id="thread" class="thread"></div></div><script>const META={"id": "treeV-진덕고11-진덕고12-진덕고13-진덕고14-진덕고15-진덕고16-진덕고17-진덕고18", "제목": "진덕고 프린트 해부 · 평면좌표와 직선의 방정식 · 원본+변형", "입구": "원본이랑 변형 문제, 풀어 봤을 때 어땠어?"};const STEPNAME=["무엇을 묻나", "어디서 쓰이나", "조건의 역할", "원본↔변형", "조건을 바꾸면", "함정", "같은 개념"];const PROBS=[{"id": "진덕고 #1-1", "단원": "평면좌표와 직선의 방정식", "발문": "<div class=\"print\"><p class=\"first\">점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">A<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><msqrt><mrow><mn>3<\/mn><\/mrow><\/msqrt><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>과 제<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>사분면 위의 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">B<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>k<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>에 대하여 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/math>일 때, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><mrow><mn>2<\/mn><\/mrow><\/msup><\/mrow><\/math>의 값을 구하시오. (단, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">O<\/mi><\/mrow><\/math>는 원점이다.)<\/p><\/div>", "M": [{"질문": "이 문제가 결국 묻는 핵심은?", "선지": ["거리 식을 세워 두 후보를 위치 조건으로 거르는 것", "선분 OB의 중점을 구해 점 A와 비교하는 것", "직선 OA의 기울기로 점 B의 위치를 정하는 것", "선분 AB를 일정한 비로 내분하는 점을 구하는 것", "삼각형 OAB가 직각삼각형이 되는 조건을 찾는 것"], "말": ["맞다. 거리 식에서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><\/mrow><\/math> 후보가 둘 나오고, 제1사분면 조건이 하나를 버린다.", "OA = AB 를 보고 A 가 OB 의 가운데처럼 느껴졌구나. 근데 O, A, B 가 한 직선 위에 있을까?", "기울기는 방향을 정할 때 쓴다. 이 문제는 길이가 같다는 조건이다. 길이를 식으로 옮기는 도구가 뭘까?", "내분은 비가 주어질 때 쓴다. 여기엔 비가 없고, 길이가 같다는 조건뿐이다.", "삼각형 OAB 가 보이니 직각을 의심한 거다. 근데 직각이라는 조건은 어디에도 없다."], "풀이": "두 점 사이 거리로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi>k<\/mi><mo>&#x02212;<\/mo><msqrt><mn>3<\/mn><\/msqrt><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 을 세우면 k 후보가 둘 나온다. 사분면 조건이 하나를 버리는 게 이 문제의 전부다. 중점·기울기·내분은 쓰이지 않는다.", "보조": {"질문": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/math> 를 식으로 옮기려면 무엇을 쓸까?", "선지": ["두 점 사이의 거리 공식", "중점 공식", "직선의 기울기"], "말": ["맞다. 거리 공식으로 두 길이를 쓰면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><\/mrow><\/math> 에 대한 식이 나온다. 그 식의 해가 몇 개인지 보자.", "중점 공식은 점의 좌표를 구할 때 쓴다. 길이가 같다는 걸 나타내진 않는다.", "기울기가 같다는 건 방향이 같다는 뜻이다. 길이와는 다르다."]}}, {"질문": "답을 결정짓는 단계는?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>k<\/mi><mo>&#x02212;<\/mo><msqrt><mn>3<\/mn><\/msqrt><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math> 의 두 해 중 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math> 인 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mo>&#x0002B;<\/mo><msqrt><mn>3<\/mn><\/msqrt><\/mrow><\/math> 을 택한다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><msqrt><mrow><mn>1<\/mn><mo>&#x0002B;<\/mo><mn>3<\/mn><\/mrow><\/msqrt><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math> 를 계산한다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>k<\/mi><mo>&#x02212;<\/mo><msqrt><mn>3<\/mn><\/msqrt><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><\/mrow><\/math> 으로 놓는다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><msup><mi>k<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math> 으로 놓는다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><mo>&#x0003D;<\/mo><msqrt><mn>3<\/mn><\/msqrt><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><\/math> 를 택한다"], "말": ["맞다. 두 해 중 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math> 인 것만 남기는 순간 B 가 하나로 정해진다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math> 는 맞는 계산이다. 다만 아직 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><\/mrow><\/math> 는 하나도 안 정해졌다.", "A, B 의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>좌표를 다시 보자. 둘 다 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math> 이면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>좌표 차가 얼마일까?", "맞는 식이지만 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><\/mrow><\/math> 를 모르는 채로는 값이 안 나온다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><\/mrow><\/math> 가 정해지는 순간이 언제일까?", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mn>3<\/mn><\/msqrt><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><\/math> 도 식의 해는 맞다. 그런데 그 값의 부호를 B 의 위치와 맞춰 보자."], "풀이": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><mo>&#x0003D;<\/mo><msqrt><mn>3<\/mn><\/msqrt><mi>&#x000B1;<\/mi><mn>2<\/mn><\/mrow><\/math> 중 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mn>3<\/mn><\/msqrt><mo>&#x02212;<\/mo><mn>2<\/mn><mo>&#x0003C;<\/mo><mn>0<\/mn><\/mrow><\/math> 이라 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mo>&#x0002B;<\/mo><msqrt><mn>3<\/mn><\/msqrt><\/mrow><\/math> 만 남는다. OA=2 계산은 맞지만 준비 단계다. A, B 는 x좌표가 같아 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><mn>2<\/mn><\/msup><\/mrow><\/math> 에 1이 붙지 않는다.", "보조": {"질문": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>k<\/mi><mo>&#x02212;<\/mo><msqrt><mn>3<\/mn><\/msqrt><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math> 의 해는?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><mo>&#x0003D;<\/mo><msqrt><mn>3<\/mn><\/msqrt><mo>&#x0002B;<\/mo><mn>2<\/mn><\/mrow><\/math> 또는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><mo>&#x0003D;<\/mo><msqrt><mn>3<\/mn><\/msqrt><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><mo>&#x0003D;<\/mo><msqrt><mn>3<\/mn><\/msqrt><mo>&#x0002B;<\/mo><mn>2<\/mn><\/mrow><\/math> 하나뿐", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mo>&#x02212;<\/mo><msqrt><mn>3<\/mn><\/msqrt><\/mrow><\/math> 또는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><mo>&#x02212;<\/mo><msqrt><mn>3<\/mn><\/msqrt><\/mrow><\/math>"], "말": ["맞다. 해가 둘이다. 이 중 B 가 제1사분면에 오게 하는 건 어느 쪽일까?", "절댓값 식은 보통 해가 둘이다. 안쪽이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><\/math> 인 경우도 있다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><mo>&#x02212;<\/mo><msqrt><mn>3<\/mn><\/msqrt><mo>&#x0003D;<\/mo><mi>&#x000B1;<\/mi><mn>2<\/mn><\/mrow><\/math> 에서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mn>3<\/mn><\/msqrt><\/mrow><\/math> 을 옮길 때 부호를 다시 보자."]}}, {"질문": "B의 x좌표가 A와 같은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math> 이라는 조건은 풀이에서 어떤 역할을 하나?", "선지": ["AB가 y축에 평행해 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x0007C;<\/mo><mi>k<\/mi><mo>&#x02212;<\/mo><msqrt><mn>3<\/mn><\/msqrt><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 로 바로 쓰인다", "OA와 AB가 수직이라 피타고라스 정리를 쓰게 한다", "B가 제1사분면에 있음을 보장해 k의 부호를 정한다", "OB가 OA의 2배임을 알려 줘 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math> 가 된다", "답에는 영향이 없다 — 그림을 그리기 쉽게 할 뿐이다"], "말": ["맞다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>좌표가 같으니 AB 길이는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>좌표 차만으로 쓴다.", "직각삼각형이 떠올랐을 수 있다. OA 의 기울기 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mn>3<\/mn><\/msqrt><\/mrow><\/math> 과 AB 의 방향을 비교해 보자. 정말 수직일까?", "B 의 위치는 따로 주어진 '제1사분면' 조건이 정한다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>좌표 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math> 은 다른 일을 한다.", "길이 관계는 OA = AB 하나뿐이다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>좌표에서 길이의 비가 나오진 않는다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>좌표를 모르면 B 를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>p<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>k<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 로 두어야 해서 문자가 하나 늘어난다. 정말 영향이 없을까?"], "풀이": "A, B의 x좌표가 같으니 AB는 y축에 평행한 선분이고, 길이는 y좌표 차 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>k<\/mi><mo>&#x02212;<\/mo><msqrt><mn>3<\/mn><\/msqrt><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 이다. 그래서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>k<\/mi><mo>&#x02212;<\/mo><msqrt><mn>3<\/mn><\/msqrt><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math> 라는 한 문자 방정식이 된다. OA와 AB는 수직이 아니고, B가 제1사분면에 있다는 건 x좌표가 아니라 따로 주어진 조건이다.", "보조": {"질문": "두 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>5<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 사이의 거리는?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><mn i><\/mrow><\/mrow><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mn>2<\/mn><msqrt><mn>5<\/mn><\/msqrt><\/mrow><\/math> 를 줬다. B<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 를 찾을 때 결정적인 한 수는?", "선지": ["두 거리 식을 빼서 이차항을 지우고 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><mo>&#x0003D;<\/mo><mn>10<\/mn><mo>&#x02212;<\/mo><mn>3<\/mn><mi>a<\/mi><\/mrow><\/math> 를 얻는다", "B 의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>좌표를 A 와 같은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><\/mrow><\/math> 으로 두고 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>b<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 로 푼다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mn>2<\/mn><msqrt><mn>5<\/mn><\/msqrt><\/mrow><\/math> 하나만으로 B 를 하나로 정한다", "선분 OB 의 중점이 A 라고 보고 중점 공식을 쓴다", "두 거리 식을 더해서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>b<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math> 을 먼저 구한다"], "말": ["맞다. 빼면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>&#x0002C;<\/mo><mtext>&#x entColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\"normal\">Q<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/math> 이다"], "말": ["맞다. 두 점에서 같은 거리인 점은 모두 AB 의 수직이등분선 위에 있다. P, Q 는 그 직선이 축과 만나는 점이다.", "중점도 같은 거리인 점이긴 하다. 근데 중점은 하나뿐인데 P, Q 는 둘이다.", "원점은 이 문제의 기준이 아니다. 같은 거리의 기준은 A, B 다.", "직선 AB 위에서 A, B 와 같은 거리인 점은 하나뿐이다. P, Q 둘 다 그럴 수 있을까?", "PQ 와 AB 의 길이를 비교하는 조건은 문제에 없다."], "풀이": "두 점에서 같은 거리인 점은 AB의 수직이등분선 위에 있다. 그 직선은 중점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/math> 을 지나고 기울기 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><\/math> 인 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><mi>x<\/mi><mo>&#x0002B;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 이고, 축과 만나는 점이 바로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>4<\/mn><\/mfrac><\/mstyle><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>0<\/mn><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/math> 이다. AB의 중점은 하나뿐이라 P, Q 둘 다일 수 없고, 원점까지 거리 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>4<\/mn><\/mfrac><\/mstyle><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 도 서로 다르다.", "보조": {"질문": "두 점 A, B 에서 같은 거리에 있는 점들을 모으면 어떤 모양?", "선지": ["선분 AB 의 수직이등분선", "선분 AB 를 지름으로 하는 원", "직선 AB"], "말": ["맞다. 그 직선 위 점은 모두 '같은 거리'를 만족한다. P, Q 는 그중 어떤 점일까?", "그 원 위의 점은 AB 를 직각으로 바라보는 점이다. 같은 거리와는 다르다.", "직선 AB 위에서 같은 거리인 점은 하나뿐이다. 모아도 점 하나다."]}}, {"질문": "고급변형에서는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">B<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>5<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 이고, x축 위의 점이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 으로 주어지고 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">A<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>3<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math> 를 몰랐다(<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003C;<\/mo><mn>2<\/mn><\/mrow><\/math>). 그래서 풀이에서 달라진 것은?", "선지": ["미지수가 A 쪽이라 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x02212;<\/mo><mn>2<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math> 로 해가 둘, 조건으로 하나를 고른다", "원본처럼 이차항이 지워져 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math> 가 바로 하나 나온다", "P 가 선분 AB 의 중점이라 중점 공식으로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math> 를 구한다", "Q 는 A 의 좌표를 몰라도 바로 구해진다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003C;<\/mo><mn>2<\/mn><\/mrow><\/math> 조건이 없어도 Q 는 하나로 정해진다"], "말": ["맞다. 같은 '거리 제곱 같게 놓기'인데 미지수 자리가 바뀌니 이차항이 살아남는다.", "원본에선 P 의 좌표가 미지수라 양변의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math> 이 지워졌다. 이번엔 미지수가 어느 점에 붙어 있지?", "같은 거리에 있다고 중점은 아니다. P 는 x축 위 점이고 A, B 와 한 직선 위라는 말도 없다.", "Q 도 A, B 로부터 같은 거리다. A 를 모르는 채로 그 식을 세울 수 있을까?", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math> 후보가 둘이다. 각각으로 Q 를 구해 보면 같은 점이 나올까?"], "풀이": "P 가 고정이고 A 가 미지수라 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x02212;<\/mo><mn>2<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mn>9<\/mn><mo>&#x0003D;<\/mo><mn>10<\/mn><\/mrow><\/math>, 즉 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x02212;<\/mo><mn>2<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math> 로 이차항이 남는다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x y=\"inline\"><mrow><mi>b<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 을 먼저 쓰면 훨씬 가볍다.", "A, B 를 지나는 원은 무수히 많다. 어느 원을 그릴지 정할 수 없다."], "힌트": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축 위의 점은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>좌표가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math> 이다. P 까지의 두 거리를 같게 놓자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 이면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mn>1<\/mn><\/mrow><\/math> 이다. Q 도 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>d<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 로 두고 같은 방법이다."]}}, {"id": "진덕고 #1-3", "단원": "평면좌표와 직선의 방정식", "발문": "<div class=\"print\"><p class=\"first\">좌표평면 위의 서로 다른 다섯 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">A<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">B<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>4<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">C<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>6<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>8<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">D<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>3<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">P<\/mi><\/mrow><\/math>에 대하여 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><mo>&#x0002B;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><mo>&#x0002B;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><mo>&#x0002B;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\"normal\">D<\/mi><\/mrow><\/mrow><\/mrow><\/math>의 최솟값을 구하시오.<\/p><\/div>", "M": [{"질문": "이 문제가 결국 묻는 핵심은?", "선지": ["거리의 합을 두 쌍으로 묶어 각각 선분 길이 이상임을 쓰는 것", "네 점의 무게중심에서 합이 최소가 되는 것", "거리의 제곱의 합을 전개해 이차식의 최솟값을 구하는 것", "사각형 둘레의 절반이 최솟값이 되는 것", "P가 네 점 중 하나일 때의 합들을 비교하는 것"], "말": ["맞다. 두 점씩 묶으면 각 쌍의 합이 선분 길이 이상이 된다.", "네 점의 '가운데'가 떠오르는 건 자연스럽다. 근데 무게중심이 최소를 만드는 건 거리의 제곱 합이다.", "제곱 합이면 전개가 통한다. 이 식은 루트가 붙은 거리를 그대로 더한 거다.", "그럴듯한 숫자지만 근거가 없다. 둘레와 거리 합을 잇는 성질이 있을까?", "꼭짓점에 놓아 보는 건 좋은 시작이다. 다만 꼭짓점 말고 더 작은 곳이 있을 수 있다."], "풀이": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><mo>&#x0002B;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><mo>&#x02265;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><\/mrow><\/math> 처럼 두 점씩 묶어 하한을 만드는 문제다. 무게중심은 거리의 제곱 합을 최소로 하는 점이라 다르다. 둘레의 절반은 근거가 없다.", "보조": {"질문": "점 P 와 두 점 A, C 에 대해 항상 성립하는 것은?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><mo>&#x0002B;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><mo>&#x02265;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><mo>&#x0002B;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><mo>&#x02264;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><\/mrow><\/math>"], "말": ["맞다. 등호는 P 가 선분 AC 위일 때다. 네 점을 이렇게 두 쌍으로 묶으면 어떨까?", "P 가 AC 밖으로 나가면 돌아가는 길이라 더 길어진다.", "그건 P 가 AC 의 수직이등분선 위일 때만이다."]}}, {"질문": "최솟값 15를 확정하는 단계는?", "선지": ["선분 AC와 BD가 한 점에서 만나 두 등호가 같이 성립한다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mn>10<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">B<\/mi><mi mathvariant=\"normal\">D<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mn>5<\/mn><\/mrow><\/math> 를 계산한다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><mo>&#x0002B;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><mo>&#x02265;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math> 로 묶는다", "P를 네 점의 무게중심으로 놓는다", "P=A 일 때 합 17과 비교한다"], "말": ["맞다. 하한 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>10<\/mn><mo>&#x0002B;<\/mo><mn>5<\/mn><\/mrow><\/math> 에 실제로 닿을 수 있어야 최솟값이다. 두 대각선이 만나니 닿는다.", "맞는 계산이지만 아직 하한일 뿐이다. 15 에 실제로 닿는 P 가 있는지가 남았다.", "변끼리 묶어도 부등식은 맞다. 그런데 그 하한에 닿는 P 가 있는지 보자.", "무게중심은 제곱 합의 최소점이다. 거리 합과는 다르다.", "꼭짓점들끼리 비교해도 그보다 작은 점이 남아 있을 수 있다."], "풀이": "하한 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>10<\/mn><mo>&#x0002B;<\/mo><mn>5<\/mn><\/mrow><\/math> 가 실제 최솟값이 되려면 P가 두 선분 위에 동시에 있어야 한다. AC, BD 가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>36<\/mn><\/mrow><mrow><mn>25<\/mn><\/mrow><\/mfrac><\/mstyle><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>48<\/mn><\/mrow><mrow><mn>25<\/mn><\/mrow><\/mfrac><\/mstyle><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/math> 에서 만나서 된다. 길이 계산은 맞지만 그것만으로는 최솟값이라 말할 수 없다.", "보조": {"질문": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><mo>&#x0002B;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><\/mrow><\/math> 가 되려면 P 는 어디에?", "선지": ["선분 AC 위", "선분 AC 의 수직이등분선 위", "A, C 를 지나는 원 위"], "말": ["맞다. 두 등호가 동시에 되려면 P 가 AC 위이면서 BD 위여야 한다. 그런 점이 있을까?", "수직이등분선 위면 두 거리가 같을 뿐이다. 중점 말고는 합이 AC 보다 크다.", "원 위라고 합이 AC 와 같아지진 않는다."]}}, {"질문": "'서로 다른 다섯 점' (P가 A, B, C, D와 다르다)은 답에 어떤 영향을 주나?", "선지": ["답에는 영향이 없다 — 최소가 되는 교점이 네 점과 다르다", "P가 꼭짓점일 때 최소가 되는 경우를 막는다", "P가 사각형 밖에 있어야 한다는 뜻이다", "등호가 성립하지 않아 최솟값이 15보다 커진다", "P가 대각선 AC 위에 있을 수 없다는 뜻이다"], "말": ["맞다. 최소가 되는 교점은 A, B, C, D 어느 것과도 다르니 이 조건은 답을 안 바꾼다.", "꼭짓점에서 최소일 거라 생각한 거다. P 가 꼭짓점일 때 합을 하나만 계산해 보자.", "'다르다'는 겹치지 않는다는 뜻뿐이다. 안·밖 위치는 말하지 않는다.", "등호가 되는 점이 네 점 중 하나였다면 그랬을 거다. 그 교점이 꼭짓점인지 보자.", "P 가 A, C 와 다를 뿐, 선분 AC 위의 다른 점은 얼마든지 된다."], "풀이": "최소는 AC와 BD의 교점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>36<\/mn><\/mrow><mrow><mn>25<\/mn><\/mrow><\/mfrac><\/mstyle><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>48<\/mn><\/mrow><mrow><mn>25<\/mn><\/mrow><\/mfrac><\/mstyle><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/math> 에서 나오고, 이 점은 A, B, C, D 어느 것과도 다르다. 그래서 이 조건은 답 15를 바꾸지 않는다. 실제로 P를 꼭짓점에 두면 합이 A에서 17, D에서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>8<\/mn><mo>&#x0002B;<\/mo><msqrt><mrow><mn>61<\/mn><\/mrow><\/msqrt><\/mrow><\/math> 처럼 모두 15보다 크다. P가 AC 위에 오는 건 금지가 아니라 최소의 필수 조건이다.", "보조": {"질문": "P 가 꼭짓점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">A<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 일 때 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><mo>&#x0002B;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><mo>&#x0002B;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><mo>&#x0002B;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\"normal\">D<\/mi><\/mrow><\/mrow><\/mrow><\/math> 는?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>17<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>15<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>13<\/mn><\/mrow><\/math>"], "말": ["맞다. 꼭짓점에선 15 보다 크다. 그럼 15 가 되는 점이 꼭짓점과 겹치는지 보자.", "15 는 두 대각선의 교점에서 나오는 값이다. A 에서는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x0002B;<\/mo><mn>4<\/mn><mo>&#x0002B;<\/mo><mn>10<\/mn><mo>&#x0002B;<\/mo><mn>3<\/mn><\/mrow><\/math> 이다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mn>10<\/mn><\/mrow><\/math> 을 다시 넣어 더해 보자."]}}, {"질문": "고급변형은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">A<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">B<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>12<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>9<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">C<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>8<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">D<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>6<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 이라 이름 순서가 꼭짓점 순서가 아니었다. 그래서 먼저 해야 할 일은?", "선지": ["어느 두 점이 대각선인지(AB, CD) 판단해 묶는다", "원본처럼 AC, BD 로 묶으면 그대로 된다", "네 점이 사각형 순서가 아니니 최솟값이 없다고 본다", "네 점의 무게중심을 최소점으로 잡는다", "네 변 길이 합의 절반을 최솟값으로 잡는다"], "말": ["맞다. 등호가 동시에 서려면 두 선분이 서로 만나야 하니, 만나는 쌍을 먼저 찾는 거다.", "AC 는 x축 위 선분, BD 는 그 위쪽 선분이다. 두 선분이 만나는지 그려 보자.", "순서가 섞였을 뿐 네 점은 볼록사각형을 이룬다. 꼭짓점을 둘레 순서로 다시 읽어 보자.", "무게중심은 평균이고, 이 문제는 거리의 합이다. 삼각부등식의 등호는 어디서 성립했지?", "하한은 두 선분 길이의 합에서 나왔다. 변의 길이가 아니라 어떤 선분이었는지 떠올려 보자."], "풀이": "둘레 순서가 A→C→B→D 라 대각선은 AB, CD 다. AC, BD 로 묶으면 두 선분이 안 만나 등호가 동시에 서지 않는다. AB, CD 로 묶으면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>15<\/mn><mo>&#x0002B;<\/mo><mn>10<\/mn><mo>&#x0003D;<\/mo><mn>25<\/mn><\/mrow><\/math> 이고, 교점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>4<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>3<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 에서 최소가 된다.", "보조": {"질문": "선분 AC (<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">A<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">C<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>8<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>) 와 선분 BD (<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">B<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>12<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>9<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">D<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>6<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>) 는 만나나?", "선지": ["만나지 않는다 — BD 위의 점은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x02265;<\/mo><mn>6<\/mn><\/mrow><\/math> 이다", "한 점에서 만난다", "두 점에서 만난다"], "말": ["맞다. 묶은 두 선분이 만나야 두 등호가 한 점에서 함께 선다. 네 점 중 만나는 두 선분을 찾아보자.", "AC 는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축 위에 있다. BD 위의 점들의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>좌표 범위를 보자.", "두 선분은 많아야 한 점에서 만난다. 그리고 AC 는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 위에 있다."]}}, {"질문": "'점 P 는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축 위에 있다'는 조건을 더하면 최솟값은?", "선지": ["15보다 커진다 — 대각선 교점이 x축 위에 없다", "그대로 15 — 하한 AC + BD 는 그대로다", "15보다 작아진다 — P의 범위가 좁아졌다", "P=B 일 때 최소라 그대로 15다", "x축 위에서는 최솟값이 존재하지 않는다"], "말": ["맞다. 15 를 만드는 점은 대각선 교점 하나뿐인데, 그 점이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축 위에 없다.", "하한 15 는 그대로 맞다. 근데 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축 위에서 그 하한에 닿을 수 있을까?", "고를 수 있는 점이 줄었는데 최솟값이 더 작아질 수 있을까?", "P=B 일 때 합을 직접 계산해 보자. 15 가 나오는지 보자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축 위에서 P 를 움직이면 합이 연속으로 변하고, 멀리 가면 커진다. 가장 작은 곳이 있다."], "풀이": "합이 15가 되는 점은 대각선 교점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>36<\/mn><\/mrow><mrow><mn>25<\/mn><\/mrow><\/mfrac><\/mstyle><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>48<\/mn><\/mrow><mrow><mn>25<\/mn><\/mrow><\/mfrac><\/mstyle><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/math> 하나뿐인데 x축 위가 아니다. 하한 15는 그대로지만 도달하지 못하니 최솟값은 15보다 크다. 범위를 좁히면 최솟값은 작아질 수 없다.", "보조": {"질문": "대각선 교점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>36<\/mn><\/mrow><mrow><mn>25<\/mn><\/mrow><\/mfrac><\/mstyle><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>48<\/mn><\/mrow><mrow><mn>25<\/mn><\/mrow><\/mfrac><\/mstyle><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/math> 은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축 위에 있나?", "선지": ["없다 — <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>좌표가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math> 이 아니다", "있다 — <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>좌표가 양수다", "있다 — B 와 가깝다"], "말": ["맞다. 15 에 닿는 유일한 점을 쓸 수 없다. 그럼 최솟값은?", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축 위의 점은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>좌표가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math> 이어야 한다.", "가깝다고 같은 직선 위인 건 아니다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>좌표를 보자."]}}, {"질문": "어떤 학생이 최솟값을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><mo>&#x0002B;<\/mo><msqrt><mrow><mn>61<\/mn><\/mrow><\/msqrt><\/mrow><\/math> 로 적었다. 원인은?", "선지": ["변 AB, CD로 묶어 등호 성립을 확인 안 했다", "대각선 AC의 길이를 잘못 계산했다", "P를 네 점의 무게중심으로 놓았다", "거리 대신 거리의 제곱을 더했다", "대각선 교점의 좌표를 잘못 구했다"], "말": ["맞다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><mo>&#x0002B;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">D<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mn>4<\/mn><mo>&#x0002B;<\/mo><msqrt><mrow><mn>61<\/mn><\/mrow><\/msqrt><\/mrow><\/math> 이다. 근데 AB, CD 는 안 만나서 그 값에 못 닿는다.", "AC 를 잘못 구했다면 답에 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><mn>61<\/mn><\/mrow><\/msqrt><\/mrow><\/math> 이 나올 이유가 없다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><mn>61<\/mn><\/mrow><\/msqrt><\/mrow><\/math> 은 어느 두 점 사이 거리일까?", "무게중심에서 합을 계산하면 이렇게 깔끔한 꼴이 안 나온다.", "제곱을 더했다면 루트가 없는 정수가 나온다.", "교점 좌표가 틀려도 하한 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>10<\/mn><mo>&#x0002B;<\/mo><mn>5<\/mn><\/mrow><\/math> 는 그대로다. 이 답은 다른 두 길이의 합이다."], "풀이": "AB=4, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">D<\/mi><\/mrow><mo>&#x0003D;<\/mo><msqrt><mrow><mn>36<\/mn><mo>&#x0002B;<\/mo><mn>25<\/mn><\/mrow><\/msqrt><mo>&#x0003D;< 쪽인지 보자.", "길이만 보면 원이 떠오른다. 근데 C 는 한 직선 위에 묶여 있다.", "기울기로 방향은 잡히지만 얼마나 가는지는 따로 정해야 한다. 더 가벼운 길이 있다."], "풀이": "A, B, C 가 이 순서로 한 직선 위고 AB=BC 이니 B가 AC의 중점이다. 중점 공식을 거꾸로 풀어 C를 얻는다. C가 AB의 중점이면 '연장선 위'가 아니다.", "보조": {"질문": "세 점 A, B, C 가 이 순서로 한 직선 위에 있고 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">B<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><\/mrow><\/math> 이면?", "선지": ["B 는 선분 AC 의 중점", "C 는 선분 AB 의 중점", "A 는 선분 BC 의 중점"], "말": ["맞다. 그럼 중점 공식을 거꾸로 쓰면 C 가 나온다.", "C 가 AB 의 중점이면 순서가 A, C, B 가 된다.", "A 가 가운데면 순서가 B, A, C 다."]}}, {"질문": "C의 좌표를 결정짓는 식은?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mo>&#x02212;<\/mo><mn>4<\/mn><mo>&#x0002B;<\/mo><mi>a<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mstyle><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>3<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>5<\/mn><mo>&#x0002B;<\/mo><mi>b<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mstyle><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>37<\/mn><\/mrow><\/math> 이므로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvarian \"true\" scriptlevel=\"0\"><mfrac><mrow><mn>5<\/mn><mo>&#x0002B;<\/mo><mi>b<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mstyle><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">C<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mn>7<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 이다. 거리 37만 맞추면 원 위의 점이 다 후보라 C가 안 정해진다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mo>&#x02212;<\/mo><mn>3<\/mn><mo>&#x0002B;<\/mo><mi>a<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mstyle><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>4<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mi>b<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mstyle><mo>&#x0003D;<\/mo><mn>5<\/mn><\/mrow><\/math> 는 A를 중점으로 둔 반대쪽 점이다.", "보조": {"질문": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">B<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">A<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>4<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>5<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 와 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">C<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 의 중점이면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>좌표 식은?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mo>&#x02212;<\/mo><mn>4<\/mn><mo>&#x0002B;<\/mo><mi>a<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mstyle><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>3<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mo>&#x02212;<\/mo><mn>3<\/mn><mo>&#x0002B;<\/mo><mi>a<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mstyle><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>4<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mo>&#x02212;<\/mo><mn>4<\/mn><mo>&#x02212;<\/mo><mn>3<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mstyle><mo>&#x0003D;<\/mo><mi>a<\/mi><\/mrow><\/math>"], "말": ["맞다. 양 끝 A, C 의 평균이 가운데 B 다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>좌표도 같은 식으로 쓰면 된다.", "그건 A 가 가운데일 때 식이다.", "그건 A, B 의 중점을 C 로 둔 식이다."]}}, {"질문": "C가 '선분 AB의 연장선 위' 에 있다는 조건이 없고 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">B<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><\/mrow><\/math> 만 있다면?", "선지": ["C는 B 중심, 반지름 AB인 원 위 어디든 되어 하나로 안 정해진다", "C는 그대로 하나로 정해진다 — 길이 조건만으로 충분하다", "C는 A와 같은 점이 된다", "C는 두 개로 정해진다 — 직선 AB 위의 두 점", "C는 선분 AB의 중점이 된다"], "말": ["맞다. 길이 조건만으로는 C 가 B 둘레의 원 위 어디든 된다.", "길이 하나로 점 하나가 정해질까? B 에서 같은 거리인 점이 몇 개인지 보자.", "A 도 B 에서 같은 거리라 후보이긴 하다. 그런데 후보가 A 하나뿐일까?", "두 점으로 좁혀지려면 C 가 어떤 선 위에 묶여 있어야 한다. 그 정보가 지금 남아 있나?", "C 가 AB 의 중점이면 BC 는 AB 의 절반이라 같지 않다."], "풀이": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">B<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><\/mrow><\/math> 만으로는 C가 B에서 일정한 거리에 있다는 것뿐이라, 원 위의 무수히 많은 점이 된다. 연장선 조건이 C를 직선 AB 위로 묶어야 B가 AC의 중점이 되어 C가 정해진다. 직선 위 두 점으로 좁히는 것도 연장선(직선) 조건이 있어야 가능하다.", "보조": {"질문": "점 B 에서 거리가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><mn>37<\/mn><\/mrow><\/msqrt><\/mrow><\/math> 인 점들을 모으면?", "선지": ["B 가 중심인 원", "B 를 지나는 직선", "점 두 개"], "말": ["맞다. 그 원 위의 점은 모두 AB = BC 를 만족한다. 그럼 C 가 하나로 정해질까?", "직선 위의 점은 B 에서 거리가 제각각이다.", "평면에서는 같은 거리인 점이 두 개로 끝나지 않는다."]}}, {"질문": "고급변형은 '연장선 위' 대신 '세 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">A<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>5<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">B<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, C 가 한 직선 위'이고 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">B<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mn>2<\/mn><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/math>, C 는 제2사분면이었다. 그래서 달라진 것은?", "선지": ["C 가 B 쪽인지 A 쪽인지 두 경우로 나눠 사분면으로 고른다", "연장선과 같은 말이라 B 쪽만 보면 된다", "C 가 선분 AB 위인 경우까지 세 경우가 모두 답이 된다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">B<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mn>2<\/mn><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/math> 이므로 B 가 AC 의 중점이다", "B 가 선분 AC 를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>:<\/mi><mn>1<\/mn><\/mrow><\/math> 로 내분한다"], "말": ["맞다. '연장선'이 빠지니 C 가 놓일 방향이 둘이 되고, 사분면 조건이 그중 하나를 고른다.", "'선분 AB 의 연장선'과 '직선 AB'는 같은 말일까? 직선은 A 쪽으로도 뻗어 있다.", "C 가 선분 AB 위라면 BC 가 AB 보다 짧다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">B<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mn>2<\/mn><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/math> 가 될 수 있을까?", "중점이면 BA 와 BC 가 같아야 한다. 길이가 두 배라는 조건과 맞는지 보자.", "내분 비율을 다시 세 보자. AB 와 BC 중 어느 쪽이 더 길지?"], "풀이": "'한 직선 위'면 C 가 A 쪽일 수도 있다. B 쪽이면 B 가 AC 를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mi>:<\/mi><mn>2<\/mn><\/mrow><\/math> 로 내분해 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>5<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mn>7<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 이고, A 쪽이면 A 가 BC 의 중점이라 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>9<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 다. 제2사분면은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>9<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 라 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mi>b<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>27<\/mn><\/mrow><\/math> 이다.", "보조": {"질문": "C 가 A 쪽에 있고 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">B<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mn>2<\/mn><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/math> 이면 A 는 선분 BC 의 어떤 점인가?", "선지": ["중점", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mi>:<\/mi><mn>2<\/mn><\/mrow><\/math> 내분점", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>:<\/mi><mn>1<\/mn><\/mrow><\/math> 외분점"], "말": ["맞다. 그래서 C 는 B 를 A 에 대해 대칭이동한 점이다. 좌표를 구해 사분면을 확인해 보자.", "BA 는 BC 의 절반이다. 그러면 A 에서 B, C 까지 거리는 어떻게 되나?", "A 는 B 와 C 사이에 있다. 사이에 있는 점은 외분점이 아니다."]}}, {"질문": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">B<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><\/mrow><\/math> 대신 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><\/mrow><\/math> 라 하면 (C 는 여전히 B 쪽 연장선 위)?", "선지": ["그런 C는 없다 — B 쪽 연장선이면 AC가 AB보다 길다", "B가 AC의 중점 그대로라 ab=14", "A가 BC의 중점이 되어 C(−5, 11)", "C가 무수히 많다", "C는 A에서 거리 √37 인 점 두 개다"], "말": ["맞다. C 가 B 너머에 있으면 AC 는 AB 보다 BC 만큼 더 길다.", "조건이 바뀌었는데 B 가 여전히 중점일지 따져 보자.", "A 가 중점이려면 C 가 A 쪽에 있어야 한다. 이 C 는 B 쪽이다.", "한 방향 반직선 위에서 A 까지 거리가 정해진 점은 많아야 하나다.", "A 에서 거리 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><mn>37<\/mn><\/mrow><\/msqrt><\/mrow><\/math> 인 점은 원 위에 있다. 그 원이 B 너머 연장선과 만나는지 보자."], "풀이": "C가 B 너머에 있으면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><mo>&#x0002B;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">B<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><mo>&#x0003E;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/math> 다. 그래서 AC=AB 는 불가능하다. A가 중점이 되는 건 C가 A 쪽에 있을 때 얘기다.", "보조": {"질문": "A, B, C 가 이 순서로 한 직선 위에 있을 때 항상 성립하는 것은?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><mo>&#x0002B;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">B<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><mo>&#x02212;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">B<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/math>"], "말": ["맞다. 그럼 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow
