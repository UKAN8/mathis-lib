ㄱ, ㄷ", "ㄱ", "ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "말": ["맞다. ㄱ 은 대각선의 중점, ㄷ 은 대칭의 중심을 중점으로 보고 끝점을 거꾸로 구한다.", "ㄱ 은 잘 봤다. '점에 대하여 대칭'도 중점 이야기라는 걸 떠올려 보자.", "ㄷ 은 잘 봤다. 평행사변형의 두 대각선이 서로 어떻게 만나는지 보자.", "ㄷ 은 잘 봤다. ㄴ 은 같은 두 점이 나오지만 '같은 거리'를 식으로 쓰는 문제다.", "점들이 겹쳐 보이지. ㄴ 은 중점이 아니라 거리 식을 쓴다."], "풀이": "ㄱ은 두 대각선의 중점이 같다는 식을 거꾸로 풀어 D를 구한다. ㄷ은 (1, 2)가 두 점의 중점이라 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 이다. 둘 다 중점 공식으로 끝점을 찾는 같은 개념이다. ㄴ은 같은 점이 나오지만 거리 제곱을 같게 놓는 문제다.", "보조": {"질문": "점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>5<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 를 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 에 대하여 대칭이동한 점을 Q 라 하면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 는?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>5<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 와 Q 의 중점", "Q 와 원점의 중점", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>5<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 와 원점의 중점"], "말": ["맞다. 중점 공식을 거꾸로 써서 끝점 Q 를 구한다. 이 문제와 같은 일이다.", "원점은 이 대칭과 상관없다. 대칭의 중심과 두 점의 관계를 보자.", "원점은 이 대칭과 상관없다. 대칭의 중심과 두 점의 관계를 보자."]}}], "H": {"질문": "이 문제, 첫 발은 뭐로 뗄까?", "선지": ["A, B, C 의 순서를 보고 B 를 AC 의 중점으로 본다", "B 를 중심으로 반지름 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><mn>37<\/mn><\/mrow><\/msqrt><\/mrow><\/math> 인 원을 그린다", "직선 AB 의 방정식부터 구한다", "C 를 선분 AB 의 중점으로 놓는다", "A 를 선분 BC 의 중점으로 놓는다"], "말": ["좋다. 그러면 중점 공식을 거꾸로 써서 C 가 바로 나온다.", "원 위 점은 다 후보라 하나로 안 좁혀진다.", "직선 식을 쓰면 길이 조건까지 연립해야 해서 무겁다. 더 짧은 길이 있다.", "C 가 AB 의 중점이면 연장선 위가 아니다.", "그건 C 가 A 쪽으로 뻗었을 때다. '선분 AB 의 연장선'의 방향을 보자."], "힌트": ["C 는 A 에서 B 쪽으로 가다 B 를 지나 나간 곳에 있다. 세 점의 순서와 AB = BC 를 같이 보자.", "A, B, C 순서이고 AB = BC 이므로 B 가 AC 의 중점: <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mo>&#x02212;<\/mo><mn>4<\/mn><mo>&#x0002B;<\/mo><mi>a<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mstyle><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>3<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>5<\/mn><mo>&#x0002B;<\/mo><mi>b<\/mi><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mstyle><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math>."]}}, {"id": "진덕고 #1-6", "단원": "평면좌표와 직선의 방정식", "발문": "<div class=\"print\"><p class=\"first\">세 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x02212;<\/mo><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>x<\/mi><mo>&#x02212;<\/mo><mi>y<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>y<\/mi><mo>&#x02212;<\/mo><mn>4<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>이 삼각형을 이루지 않도록 하는 모든 실수 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math>의 값의 합을 구하시오.<\/p><\/div>", "M": [{"질문": "이 문제가 결국 묻는 핵심은?", "선지": ["평행한 경우와 한 점에서 만나는 경우를 모두 찾는 것", "세 직선이 모두 서로 평행한 경우만 찾는 것", "세 교점이 한 직선 위에 놓이는 경우를 찾는 것", "두 직선이 서로 수직이 되는 경우를 찾는 것", "세 직선의 기울기의 합이 0이 되는 경우를 찾는 것"], "말": ["맞다. 평행인 둘이 있거나, 셋이 한 점을 지나면 삼각형이 안 생긴다.", "셋 다 평행이면 물론 안 생긴다. 근데 둘만 평행해도 그렇지 않을까?", "세 교점이 서로 다르면 한 직선 위에 놓일 수 없다. 그림으로 경우를 나눠 보자.", "수직이어도 나머지 직선과 만나 삼각형이 생긴다. 직각삼각형도 삼각형이다.", "기울기의 합은 삼각형이 생기는지와 상관없다."], "풀이": "세 직선이 삼각형을 못 만드는 건 어느 둘이 평행이거나 셋이 한 점을 지날 때다. 셋 다 평행일 필요는 없다. 수직은 삼각형을 만드는 데 아무 지장이 없다.", "보조": {"질문": "세 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><\/mrow><\/math> 는 삼각형을 이룰까?", "선지": ["못 이룬다 — 두 직선이 평행이다", "이룬다 — 세 직선이 서로 다르다", "이룬다 — 수직인 쌍이 있다"], "말": ["맞다. 둘만 평행해도 꼭짓점이 셋 안 생긴다. 다른 경우도 있을까?", "서로 달라도 평행한 두 직선은 만나지 않는다.", "수직은 상관없다. 평행한 쌍이 있는지가 문제다."]}}, {"질문": "가장 빠뜨리기 쉬운, 답을 완성하는 단계는?", "선지": ["교점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 을 대입해 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mi>a<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mn>4<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>5<\/mn><\/mrow><\/math>", "기울기 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mi>a<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math> 에서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x02212;<\/mo><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 과 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>x<\/mi><mo>&#x02212;<\/mo><mi>y<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 이 평행한지 확인", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mi>a<\/mi><mo>&#x000D7;<\/mo><mn>1<\/mn><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math> 로 수직인 a를 찾는다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mi>a<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mi>a<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math> 를 동시에 만족하는 a를 찾는다"], "말": ["맞다. 평행만 세면 이 경우를 놓치기 쉽다. 교점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 을 넣어 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>5<\/mn><\/mrow><\/math>.", "평행 한 경우는 맞다. 그건 기울기만 보면 바로 나오는 쪽이다.", "확인은 필요하지만 기울기가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><\/mrow><\/math> 라 평행이 아니다. 답에 <math xmlns "H": {"질문": "이 문제, 첫 발은 뭐로 뗄까?", "선지": ["삼각형이 안 생기는 경우를 평행과 한 점으로 나눈다", "세 직선의 교점을 모두 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math> 로 구한다", "세 직선이 모두 평행해지는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math> 를 찾는다", "셋째 직선이 다른 직선과 수직이 되는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math> 를 찾는다", "넓이가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math> 이 되는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math> 를 넓이 공식으로 구한다"], "말": ["좋다. 경우를 나눴으면 평행은 기울기로, 한 점은 교점 대입으로 하나씩 구하면 된다.", "교점을 다 구해도 결국 같은 경우 나누기로 돌아온다. 먼저 경우를 나누자.", "앞 두 직선이 평행하지 않으니 셋 다 평행은 불가능하다.", "수직이어도 삼각형은 생긴다.", "넓이로 가면 식이 무겁다. 넓이가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math> 이 되는 상황을 말로 먼저 나누자."], "힌트": ["삼각형이 안 생기려면 어느 둘이 평행이거나, 셋이 한 점을 지나야 한다.", "셋째 직선의 기울기는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mi>a<\/mi><\/mrow><\/math> 다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mi>a<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mi>a<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math> 와, 앞 두 직선의 교점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 을 지나는 경우를 본다."]}}, {"id": "진덕고 #1-7", "단원": "평면좌표와 직선의 방정식", "발문": "<div class=\"print\"><p class=\"first\">두 양수 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>b<\/mi><\/mrow><\/math>에 대하여 두 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>x<\/mi><mo>&#x02212;<\/mo><mi>y<\/mi><mo>&#x0002B;<\/mo><mi>a<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>y<\/mi><mo>&#x0002B;<\/mo><mi>b<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>의 교점을 지나고 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x02212;<\/mo><mn>3<\/mn><mi>y<\/mi><mo>&#x0002B;<\/mo><mn>5<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>과 평행한 직선이 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>5<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>을 지난다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>a<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><mo>&#x0002B;<\/mo><msup><mi>b<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><mo>&#x0003D;<\/mo><mn>10<\/mn><\/mrow><\/math>일 때, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0002B;<\/mo><mi>b<\/mi><\/mrow><\/math>의 값을 구하시오.<\/p><\/div>", "M": [{"질문": "이 문제가 결국 묻는 핵심은?", "선지": ["교점을 지나는 직선을 한 문자 k로 묶어 평행 조건으로 k를 정하는 것", "두 직선이 서로 수직이 되는 조건을 쓰는 것", "점과 직선 사이의 거리 공식을 쓰는 것", "두 직선의 교점이 점 (5, 1)이 되게 하는 것", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>b<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>10<\/mn><\/mrow><\/math> 을 원으로 보고 접선을 구하는 것"], "말": ["맞다. 교점 좌표를 몰라도 직선 묶음 하나로 다룰 수 있다.", "구하는 직선은 주어진 직선과 '평행'이다. 수직 조건은 쓰이지 않는다.", "거리가 주어진 조건은 없다. 직선이 지나는 점과 방향만 있다.", "(5, 1) 은 교점이 아니라 그 평행선이 지나는 다른 점이다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup>  이제 평행 조건으로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><\/mrow><\/math> 를 정하면 직선이 거의 완성된다.", "가능하지만 분수가 섞여 무겁다. 교점을 안 구하고 가는 길이 있다.", "후보가 무수히 많다. 다른 조건으로 관계식을 먼저 얻어야 한다.", "(5, 1) 은 두 직선이 아니라 구하는 평행선 위의 점이다.", "발문은 '평행'이다."], "힌트": ["교점을 직접 구하지 말고, 교점을 지나는 직선 전체를 문자 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><\/mrow><\/math> 하나로 나타내 보자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>x<\/mi><mo>&#x02212;<\/mo><mi>y<\/mi><mo>&#x0002B;<\/mo><mi>a<\/mi><mo>&#x0002B;<\/mo><mi>k<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>y<\/mi><mo>&#x0002B;<\/mo><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x02212;<\/mo><mn>3<\/mn><mi>y<\/mi><mo>&#x0002B;<\/mo><mn>5<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 과 평행하려면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mi>k<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><\/mrow><mrow><mn>1<\/mn><\/mrow><\/mfrac><\/mstyle><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>2<\/mn><mi>k<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><mrow><mo>&#x02212;<\/mo><mn>3<\/mn><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math>, 즉 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math> 이다."]}}, {"id": "진덕고 #1-8", "단원": "평면좌표와 직선의 방정식", "발문": "<div class=\"print\"><p class=\"first\">세 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">A<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">B<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>4<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">C<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>를 꼭짓점으로 하는 삼각형 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><\/math>의 내접원이 변 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/math>와 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">D<\/mi><\/mrow><\/math>에서 접할 때, 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">D<\/mi><\/mrow><\/math>의 좌표를 구하시오.<\/p><\/div>", "M": [{"질문": "이 문제가 결국 묻는 핵심은?", "선지": ["세 변 길이로 이등변임을 보고 대칭을 이용해 접점을 찾는 것", "내접원의 중심이 무게중심이라는 성질을 쓰는 것", "내접원은 어느 삼각형에서나 각 변의 중점에서 접하는 것", "외접원의 중심을 구해 변 AB에 내리는 것", "변 AB를 2:1로 내분하는 점을 구하는 것"], "말": ["맞다. CA = CB 라 대칭축이 있고, 밑변의 접점은 그 축 위에 온다.", "내심과 무게중심은 보통 다른 점이다. 정삼각형일 때만 겹친다.", "늘 중점이면 편하겠지만 아니다. 변 길이가 다르면 접점이 한쪽으로 치우친다.", "외심은 외접원의 중심이다. 이 문제는 내접원이다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>:<\/mi><mn>1<\/mn><\/mrow><\/math> 은 무게중심이 중선을 나누는 비다. 접점과는 상관없다."], "풀이": "CA=CB 인 이등변이라 대칭축 위에 내심이 있고, 밑변 AB와의 접점은 축과 AB가 만나는 점, 즉 중점이다. 접점이 늘 중점인 건 아니다. 내심은 무게중심도 아니다.", "보조": {"질문": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><mn>2<\/mn><\/msup><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">B<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><mn>2<\/mn><\/msup><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><mn>2<\/mn><\/msup><\/mrow><\/math> 을 차례로 구하면?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>40<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>20<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>20<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>40<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>20<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>40<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>40<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>40<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>20<\/mn><\/mrow><\/math>"], "말": ["맞다. 두 변이 같은 이등변삼각형이다. 그럼 대칭을 쓸 수 있다.", "CA 를 다시 계산해 보자. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo>&#x0002B;<\/mo><mn>2<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo>&#x02212;<\/mo><mn>0<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><\/mrow><\/math> 이다.", "BC 를 다시 계산해 보자. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>4<\/mn><mo>&#x02212;<\/mo><mn>2<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><mo>&#x02212;<\/mo><mn>2<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><\/mrow><\/math> 이다."]}}, {"질문": "D가 (1, −1)임을 확정하는 근거는?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><msup><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>20<\/mn><\/mrow><\/math> 이라 내심이 C에서 AB로 내린 수선 위", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>40<\/mn><\/mrow><\/math> 이므로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mn>2<\/mn><msqrt><mrow><mn>10<\/mn><\/mrow><\/msqrt><\/mrow><\/math>", "무게중심이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>4<\/mn><mn>3<\/mn><\/mfrac><\/mstyle><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>0<\/mn><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/math> 이다", "넓이와 둘레로 내접원의 반지름을 구한다", "직선 AB의 기울기가 −1/3 이다"], "말": ["맞다. 두 변이 같다는 사실이 접점 위치를 정한다. 반지름은 몰라도 된다.", "맞는 길이지만 '어디서' 접하는지는 길이로 안 정해진다.", "무게중심은 맞게 구했다. 그런데 내접원의 중심은 무게중심이 아니다.", "반지름은 원의 크기만 알려 준다. 접점의 위치는 다른 데서 온다.", "AB 의 방향은 맞다. 그 위 어디서 접하는지는 아직이다."], "풀이": "두 변의 길이가 같다는 사실이 접점 위치를 정한다. 그래서 반지름을 몰라도 D=(1, −1)이다. AB 길이나 반지름 계산은 맞지만 위치를 정하지 못한다.", "보조": {"질문": "이등변삼각형에서 꼭짓점 C 에서 밑변 AB 에 내린 수선은?", "선지": ["AB 의 중점을 지나는 대칭축이다", "AB 를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>:<\/mi><mn>1<\/mn><\/mrow><\/math> 로 나눈다", "AB 와 평행하다"], "말": ["맞다. 내심도 대칭축 위에 있으니, 내접원이 AB 와 만나는 점도 그 축 위다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>:<\/mi><mn>1<\/mn><\/mrow><\/math> 은 무게중심이 중선을 나누는 비다.", "수선은 AB 와 수직이다."]}}, {"질문": "삼각형 ABC가 C에서 직각이라는 사실은 접점 D를 구하는 데 어떤 역할을 하나?", "선지": ["필요 없다 — <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/math> 만으로 D는 AB의 중점이다", "직각이어야 내심이 AB의 수직이등분선 위에 와 D가 중점이 된다", "직각이라 내접원 반지름이 AB의 절반이 되어 D가 정해진다", "직각이라 D와 C의 x좌표가 같아 D를 바로 읽을 수 있다", "직각 꼭짓점 C가 내접원 위에 있어 CD가 지름이 된다"], "말": ["맞다. 직각이 아닌 이등변삼각형이어도 D 는 AB 의 중점이다.", "직각이 눈에 띄니 꼭 필요해 보인다. 직각이 아니어도 C 에서 내린 축이 AB 를 반으로 가를까?", "내접원 반지름은 삼각형 안에 들어갈 만큼 작다. AB 의 절반 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><mn>10<\/mn><\/mrow><\/msqrt><\/mrow><\/math> 과 비교해 보자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">D<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">C<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>좌표를 비교해 보자.", "C 는 꼭짓점이라 내접원 밖에 있다. 내접원은 변에 닿을 뿐 꼭짓점을 지나지 않는다."], "풀이": "D가 AB의 중점인 이유는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/math> 라 C에서 AB로 내린 대칭축에 내심이 있기 때문이다. 직각이 아닌 이등변삼각형이어도 같은 결론이다. 내접원 반지름은 AB의 절반보다 훨씬 작고, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">D<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 과 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">C<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 는 x좌표도 다르다.", "보조": {"질문": "꼭지각이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>40<\/mn><mo>&#x02218;<\/mo><\/msup><\/mrow><\/math> 인 이등변삼각형에서 내접원이 밑변과 접하는 점은?", "선지": ["밑변의 중점", "밑변을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mi>:<\/mi><mn>2<\/mn><\/mrow><\/math> 로 나누는 점", "꼭지각에 따라 달라 알 수 없다"], "말": ["맞다. 직각이 아니어도 대칭축이 밑변을 반으로 가른다. 그럼 직각은 어떤 일을 할까?", "대칭인 도형에서 한쪽으로 치우칠 이유가 없다.", "꼭지각이 몇 도든 이등변이면 대칭축이 있다."]}}, {"질문": "고급변형은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">A<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">B<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>7<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>9<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">C<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>7<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 이었다. 원본 풀이에서 이 삼각형에 그대로 가져올 수 없는 단계는?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/math> 대칭으로 D 를 AB 의 중점으로 잡는 단계", "세 변의 길이를 두 점 사이 거리로 구하는 단계", "내접원의 중심이 각 변에서 같은 거리에 있다는 단계", "D 가 내심에서 AB 에 내린 수선의 발이라는 단계", "직선 AB 의 방정식을 세우는 단계"], "말": ["맞다. 변이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>6<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>8<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>10<\/mn><\/mrow><\/math> 이라 대칭축이 없다. 이제는 내심을 직접 구해 AB 에 수선을 내려야 한다.", "변 길이는 어느 삼각형이든 거리 공식으로 구한다. 이번에도 그 계산부터 해야 모양을 안다.", "내심이 세 변에서 같은 거리라는 건 모든 삼각형에서 참이다.", "접점이 수선의 발이라는 건 접선과 반지름이 수직이라서다. 삼각형 모양과 무관하다.", "AB 의 방정식은 오히려 이번에 수선의 발을 구하려면 꼭 필요하다."], "풀이": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mn>6<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">B<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mn>8<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mn>10<\/mn><\/mrow><\/math> 이라 이등변이 아니어서 D 가 중점이 아니다. C 에서 직각이고 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>6<\/mn><mo>&#x0002B;<\/mo><mn>8<\/mn><mo>&#x02212;<\/mo><mn>10<\/mn><\/mrow><mn>2<\/mn><\/mfrac><\/mstyle><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math> 라 내심은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>5<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>3<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 이다. AB: <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><mi>x<\/mi><mo>&#x02212;<\/mo><mn>3<\/mn><mi>y<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 에 수선의 발을 내리면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">D<\/mi><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>17<\/mn><\/mrow><mn>5<\/mn><\/mfrac><\/mstyle><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>21<\/mn><\/mrow><mn>5<\/mn><\/mfrac><\/mstyle><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/math> 이고 중점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>4<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>5<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 와 다르다.", "보조": {"질문": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">A<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">B<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>7<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>9<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">C<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>7<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 에서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/math> 는?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>6<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>8<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>8<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>8<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>6<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>6<\/mn><\/mrow><\/math>"], "말": ["맞다. 두 변이 다르니 C 에서 내린 대칭축이 없다. 그래서 중점 논리가 깨진다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><\/mrow><\/math> 는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>좌표 차 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>7<\/mn><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math> 이다. 다시 세 보자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/math> 는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>좌표 차 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>9<\/mn><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math> 이다."]}}, {"질문": "이 삼각형에서 내접원이 변 CA 와 접하는 점은?", "선지": ["CA의 중점이 아니다 — CA는 대칭축이 수직으로 지나는 변이 아니다", "CA의 중점이다 — 이등변이라 모든 변에서 중점", "꼭짓점 C 자신이다", "AB의 중점과 같은 점이다", "CA를 2:1로 내분하는 점이다"], "말": ["맞다. 대칭축이 수직으로 반 가르는 변은 밑변 AB 뿐이다.", "이등변이라 다 중점일 것 같지. 근데 대칭축이 CA 를 반으로 가르나?", "내접원은 꼭짓점이 아니라 변의 안쪽에서 접한다.", "AB 의 중점은 AB 위의 점이다. CA 위에 있을 수 없다.", "비를 접선 길이로 확인해 보자. 꼭 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>:<\/mi><mn>1<\/mn><\/mrow><\/math> 일 이유가 있을까?"], "풀이": "접선의 길이로 보면 A 에서 접점까지는 (둘레의 절반)<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">B<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><msqrt><mrow><mn>10<\/mn><\/mrow><\/msqrt><\/mrow><\/math> 인데, CA 의 절반은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mn>5<\/mn><\/msqrt><\/mrow><\/math> 라 다르다. 대칭축이 수직이등분하는 변은 밑변 AB 하나뿐이다. 그래서 다른 두 변의 접점은 중점이 아니다.", "보조": {"질문": "꼭짓점 A 에서 내접원에 그은 두 접선의 길이는?", "선지": ["서로 같다", "AB, AC 의 길이에 비례한다", "각각 그 변의 절반이다"], "말": ["맞다. A 에서 AB 쪽 접점까지가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><mn>10<\/mn><\/mrow><\/msqrt><\/mrow><\/math> 이니 CA 쪽도 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><mn>10<\/mn><\/mrow><\/msqrt><\/mrow><\/math> 이다. CA 의 절반과 비교해 보자.", "원 밖의 한 점에서 그은 두 접선의 길이는 늘 같다.", "절반이면 모든 접점이 중점이어야 한다."]}}, {"질문": "다른 삼각형 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">A<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">B<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>7<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>9<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">C<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>7<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 에서 AB 위 접점 D 를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mstyle displaystyle=\"true\" scriptleve row><mn>7<\/mn><\/mrow><\/math> 은 어떤 비에서 나왔을까?", "그러면 AD <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0003D;<\/mo><mn>6<\/mn><\/mrow><\/math> 이라 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>23<\/mn><\/mrow><mrow><mn>5<\/mn><\/mrow><\/mfrac><\/mstyle><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>29<\/mn><\/mrow><mrow><mn>5<\/mn><\/mrow><\/mfrac><\/mstyle><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/math> 이다."], "풀이": "각 C의 이등분선은 AB를 CA:CB=3:4 로 나눠 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>25<\/mn><\/mrow><mrow><mn>7<\/mn><\/mrow><\/mfrac><\/mstyle><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>31<\/mn><\/mrow><mrow><mn>7<\/mn><\/mrow><\/mfrac><\/mstyle><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/math> 이 정확히 나온다. 접점은 AD=(둘레의 절반)<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">B<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mn>12<\/mn><mo>&#x02212;<\/mo><mn>8<\/mn><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math> 인 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>17<\/mn><\/mrow><mrow><mn>5<\/mn><\/mrow><\/mfrac><\/mstyle><mo>&#x0002C;<\/mo><mtext>&#       g.querySelectorAll('.op').forEach(x=>x.classList.remove('pick'));o.classList.add('pick');sel=[k,o];
      ok.disabled=false;ok.textContent='이걸로 할게';};g.appendChild(o);});
  // (1009) 바로 넘어가지 않는다 — 고른 뒤 [이걸로 할게] 를 눌러야 확정. 잘못 터치하면 다른 걸 다시 고르면 된다.
  let sel=null;const ok=el('button','nx cf','하나 골라 봐');ok.disabled=true;
  ok.onclick=()=>{if(!sel||g.classList.contains('done'))return;g.classList.add('done');ok.remove();onPick(sel[0],sel[1],g);};
  b.appendChild(g);b.appendChild(ok);box.appendChild(b);scrollEnd(b);return g;
}
function say(box,cls,h){const b=el('div','bub say '+cls,h);box.appendChild(b);return b;}
function nextBtn(box,txt,fn){const n=el('button','nx',txt);n.onclick=()=>{n.remove();fn();};box.appendChild(n);scrollEnd(n);}

function runProblem(pi){
  const P=PROBS[pi];const root=$('#thread');root.innerHTML='';
  const card=$('#prob');card.innerHTML='';card.className='prob';
  card.appendChild(el('div','ph',(pi+1)+' / '+PROBS.length+' · '+P.id+(P.단원?' · '+P.단원:'')));
  card.appendChild(el('div','stem',P.발문));
  const tog=el('button','tog','문제 접기');tog.onclick=()=>{card.classList.toggle('fold');tog.textContent=card.classList.contains('fold')?'문제 펼치기':'문제 접기';};card.appendChild(tog);
  const dots=el('div','dots');for(let k=0;k<NS;k++)dots.appendChild(el('i'));card.appendChild(dots);
  const res=Array(NS).fill(null);   // 'o' | 't' | 'x'
  const rec={id:P.id,입구:null,갈림:null,첫발:null,스텝:[]};
  const paint=cur=>dots.querySelectorAll('i').forEach((d,k)=>d.className=res[k]||(k===cur?'cur':''));

  // ① 입구
  ask(root,'먼저','', META.입구,
    ['맞혔고, 왜 그런지 설명도 할 수 있다','맞히긴 했는데 감으로 풀었다','풀었는데 틀렸다','손도 못 댔다'],'in',[],k=>{
      rec.입구=k;
      if(k<=1){say(root,'',k===0?'좋아. 그럼 진짜 설명할 수 있는지 하나씩 확인해 보자.':'감으로 맞힌 건 다음엔 틀릴 수 있다. 근거를 하나씩 세워 보자.');go(ALL);}
      else if(k===2){
        ask(root,'어디서','', '어디서 갈렸던 것 같아?',
          WH.map(x=>x[0]),'wh',[],j=>{
            rec.갈림=j;const first=WH[j][1];
            say(root,'','그럼 거기부터 보자. 나머지도 이어서 짚는다.');
            go([first,...ALL.filter(x=>x!==first)]);});
      } else firstStep(()=>go(ALL));
    });

  function firstStep(done){
    const H=P.H;let tries=0;const locked=[];
    const once=()=>ask(root,'첫 발','h',H.질문,H.선지,'H'+tries,locked,(k,o)=>{
      if(k===0){o.classList.add('right');say(root,'ok',H.말[0]);rec.첫발=tries;nextBtn(root,'이제 문제를 뜯어보자',done);}
      else{o.classList.add('wrong');locked.push(k);say(root,'no',H.말[k]);
        if(tries===0){tries=1;say(root,'sol','💡 '+H.힌트[0]);nextBtn(root,'다시 골라 볼게',once);}
        else{say(root,'sol','💡 '+H.힌트[1]);rec.첫발=2;nextBtn(root,'이제 문제를 뜯어보자',done);}}
    });
    once();
  }

  function go(order){
    let i=0;
    const step=()=>{
      if(i>=order.length)return finish();
      const s=order[i++];paint(s);const M=P.M[s];const locked=[];
      const lab='STEP '+(s+1)+' · '+STEPNAME[s];
      ask(root,lab,'',M.질문,M.선지,'M'+s,locked,(k,o)=>{
        if(k===0){o.classList.add('right');say(root,'ok',M.말[0]);res[s]='o';rec.스텝[s]={결과:'o',고른것:[k]};paint(-1);nextBtn(root,i<order.length?'다음':'정리 보기',step);return;}
        o.classList.add('wrong');locked.push(k);say(root,'no',M.말[k]);const picks=[k];
        // 보조 → 재도전
        nextBtn(root,'작은 것부터 확인',()=>{
          const B=M.보조;
          ask(root,'디딤돌','sub',B.질문,B.선지,'B'+s,[],(j,o2)=>{
            o2.classList.add(j===0?'right':'wrong');say(root,j===0?'ok':'no',B.말[j]);
            if(j!==0)say(root,'sol','디딤돌 답: '+B.선지[0]);
            nextBtn(root,'처음 질문 다시',()=>{
              ask(root,lab+' · 다시','',M.질문,M.선지,'M'+s+'r',locked,(k2,o3)=>{
                picks.push(k2);
                if(k2===0){o3.classList.add('right');say(root,'ok','다시 잡았다. '+M.말[0]);res[s]='t';}
                else{o3.classList.add('wrong');say(root,'no',M.말[k2]);say(root,'sol','<b>정리</b> '+M.풀이);res[s]='x';}
                rec.스텝[s]={결과:res[s],고른것:picks,디딤돌:j};paint(-1);
                nextBtn(root,i<order.length?'다음':'정리 보기',step);
              });
            });
          });
        });
      });
    };
    step();
  }

  function finish(){
    paint(-1);S.log[pi]=rec;save();
    const sm=el('div','sum');sm.appendChild(el('h3','',P.id+' 정리'));
    const mk={o:['○','o','한 번에'],t:['△','t','디딤돌 뒤'],x:['✕','x','다시 볼 것']};
    for(let k=0;k<NS;k++){const r=res[k];const m=r?mk[r]:['–','s','건너뜀'];
      const row=el('div','row');row.appendChild(el('span','','STEP '+(k+1)+' '+STEPNAME[k]));row.appendChild(el('span','mk '+m[1],m[0]+' '+m[2]));sm.appendChild(row);}
    const weak=ALL.filter(k=>res[k]==='x'||res[k]==='t');
    sm.appendChild(el('div','weak',weak.length?'<b>여기가 약한 곳</b> · '+weak.map(k=>STEPNAME[k]).join(', ')+(rec.입구<=1&&weak.length>=2?'<br>맞힌 문제였는데도 여기서 걸렸다 — 답을 외운 건 아닌지 다시 보자.':''):'<b>'+NS+'군데 다 한 번에 통과.</b> 이 문제는 진짜 네 거다.'));
    root.appendChild(sm);
    if(pi+1<PROBS.length)nextBtn(root,'다음 문제 →',()=>{S.pi=pi+1;save();window.scrollTo(0,0);runProblem(pi+1);});
    else root.appendChild(el('div','bub say ok','오늘 세트 끝. 수고했다.'));
    scrollEnd(sm);
  }
}
try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.log)S=d;}catch(e){}
runProblem(Math.min(S.pi||0,PROBS.length-1));
</script></body></html>
