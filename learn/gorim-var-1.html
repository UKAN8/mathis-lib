\"><mrow><mi>t<\/mi><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 는 기울기가 없어 따로 확인해야 한다.", "넓이 식을 살리고 싶은 마음은 알겠다. 그런데 이번엔 넓이 값이 없다. 직각을 식으로 옮기는 도구는 뭘까?", "닮음이 떠오를 수 있다. 하지만 직각이 되는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math> 가 하나뿐이라는 보장이 있을까? 식을 세워 근의 개수를 보자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 에서 직각인 건 맞다. 그런데 그게 유일할까? 나머지 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math> 도 식으로 확인해 보자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x0003C;<\/mo><mi>t<\/mi><mo>&#x0003C;<\/mo><mn>1<\/mn><\/mrow><\/math> 이면 세 점은 여전히 변 위의 내분점이다. 좌표를 다시 잡을 이유가 있을까?"], "풀이": "P<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>4<\/mn><mi>t<\/mi><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, Q<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>4<\/mn><mo>&#x02212;<\/mo><mn>4<\/mn><mi>t<\/mi><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>2<\/mn><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, R<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>2<\/mn><mo>&#x02212;<\/mo><mn>2<\/mn><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 는 원본 그대로다. 기울기 곱 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math> 을 정리하면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mi>t<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>5<\/mn><mi>t<\/mi><mo>&#x02212;<\/mo><mn>4<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 이지만, 기울기 식은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo>&#x02260;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 일 때만 쓸 수 있다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 는 QP 가 세로선, QR 가 가로선이라 따로 확인하면 직각이 맞다. 그래서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>4<\/mn><mn>5<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 로 합 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>13<\/mn><\/mrow><mrow><mn>10<\/mn><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math> 이다. '하나뿐' 은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>4<\/mn><mn>5<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 를 놓친 것이다.", "보조": {"질문": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 일 때 직선 QP 의 기울기는?", "선지": ["없다 — QP 가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>축에 평행하다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math> — QP 가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축에 평행하다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math> — QP 가 OA 와 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>45<\/mn><mo>&#x02218;<\/mo><\/msup><\/mrow><\/math> 를 이룬다"], "말": ["맞다. 기울기가 없으니 곱 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math> 식에 넣을 수 없다. 이 경우를 어떻게 처리할지 처음 질문에서 고르자.", "가로선이 되는 건 QR 쪽이다. P, Q 의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>좌표를 비교해 보자.", "P<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, Q<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 을 기울기 식에 직접 넣어 보자. 분모가 어떻게 되나?"]}}, {"질문": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mn>6<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math> 으로 바꾸고 '넓이 2' 를 '삼각형 OAB 넓이의 절반' 으로 바꾸면 모든 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math> 의 곱은?", "선지": ["그대로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>6<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> — 넓이 비가 같으면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 식이 같다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>2<\/mn><mn>9<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> — 삼각형이 커지면 곱도 바뀐다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>3<\/mn><mn>8<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> — 넓이가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>9<\/mn><mn>4<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 배라 곱도 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>9<\/mn><mn>4<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 배다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>2<\/mn><\/mrow><mrow><mn>27<\/mn><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math> — 변이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>3<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 배라 곱은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>2<\/mn><mn>3<\/mn><\/mfrac><\/mstyle><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><mn>2<\/mn><\/msup><\/mrow><\/math> 배다", "직각삼각형 모양이 달라져 구할 수 없다"], "말": ["맞다. 귀퉁이 하나가 늘 전체의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 배라서 비율이 같으면 식도 같다.", "삼각형이 커지니 답도 바뀔 것 같은 직관이다. 그런데 넓이 조건도 '절반' 이라는 비율로 바뀌었다.", "넓이가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>9<\/mn><mn>4<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 배인 건 맞다. 근데 조건도 비율로 주어졌다. 곱해야 할 이유가 남아 있을까?", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math> 는 길이가 아니라 내분 비율이다. 변이 커질 때 비율까지 바뀔까?", "모양은 그대로 직각삼각형이고 크기만 커졌다. 좌표로 놓으면 똑같이 풀린다."], "풀이": "귀퉁이 하나는 전체 넓이의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 배라서 PQR 는 전체의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x02212;<\/mo><mn>3<\/mn><mi>t<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 배다. 절반이면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>6<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 으로 원래 문제와 같은 식이다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>2<\/mn><mn>9<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 는 PQR 가 전체의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>3<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 일 때 나오는 값이다.", "보조": {"질문": "원래 문제에서 삼각형 OPR 의 넓이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><mi>t<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 는 삼각형 OAB 넓이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><\/mrow><\/math> 의 몇 배인가?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 배", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math> 배", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><mi>t<\/mi><\/mrow><\/math> 배"], "말": ["맞다. 귀퉁이는 삼각형 크기와 상관없이 전체의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 배다. 이걸로 바뀐 삼각형을 다시 보자.", "밑변만 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math> 배가 된 게 아니라 높이도 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 배가 됐다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><mi>t<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x000F7;<\/mo><mn>4<\/mn><\/mrow><\/math> 를 다시 계산해 보자."]}}, {"질문": "어떤 학생이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>12<\/mn><msup><mi>t<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mn>12<\/mn><mi>t<\/mi><mo>&#x0002B;<\/mo><mn>4<\/mn><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math> 까지 맞게 세우고 ② <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>3<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 을 골랐다. 원인은?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><\/mrow><\/math> 를 이항하지 않고 상수항 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><\/mrow><\/math> 로 곱 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>4<\/mn><mrow><mn>12<\/mn><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math> 를 계산했다", "세 귀퉁이 중 하나를 빼먹었다", "두 근의 합과 곱을 바꿔 썼다", "범위 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><mo>&#x0003C;<\/mo><mi>t<\/mi><mo>&#x0003C;<\/mo><mn>1<\/mn><\/mrow><\/math> 밖의 근을 버렸다", "삼각형 OAB 의 넓이를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>8<\/mn><\/mrow><\/math> 로 잡았다"], "말": ["맞다. 근과 계수의 관계는 우변을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math> 으로 만든 뒤에 쓴다.", "귀퉁이를 빼먹으면 식 자체가 달라진다. 이 학생은 식까지는 맞게 세웠다.", "두 근의 합은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math> 이라 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>3<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 이 안 나온다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>3<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 이 어디서 왔는지 역추적해 보자.", "근을 버렸다면 곱이 아니라 근 하나가 답이 된다. 게다가 두 근 다 범위 안이다.", "OAB 넓이는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><\/mrow><\/math> 이고, 이 학생 식의 상수항 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><\/mrow><\/math> 도 맞다."], "풀이": "근과 계수의 관계는 우변을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math> 으로 만든 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>12<\/mn><msup><mi>t<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mn>12<\/mn><mi>t<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 에서 써야 곱이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>2<\/mn><mrow><mn>12<\/mn><\/mrow><\/mfrac><\/mstyle><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>6<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 이다. 이항 전 상수항 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><\/mrow><\/math> 를 쓰면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>3<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 이 된다. 귀퉁이 하나를 빼면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 하나만 나와 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>3<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 이 아니다.", "보조": {"질문": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>12<\/mn><msup><mi>t<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mn>12<\/mn><mi>t<\/mi><mo>&#x0002B;<\/mo><mn>4<\/mn><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math> 에서 두 근의 곱을 구하려면 먼저 할 일은?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><\/mrow><\/math> 를 이항해 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>12<\/mn><msup><mi>t<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mn>12<\/mn><mi>t<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 으로 만든다", "양변을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><\/mrow><\/math> 로 나눈다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>12<\/mn><mi>t<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>t<\/mi><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><\/math> 로 묶는다"], "말": ["맞다. 이제 곱은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mi>c<\/mi><\/mrow><mrow><mi>a<\/mi><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math> 로 읽힌다. 학생이 이 단계에서 뭘 놓쳤는지 보이지?", "나눠도 우변이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math> 이 아니면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mi>c<\/mi><mi>a<\/mi><\/mfrac><\/mstyle><\/mrow><\/math> 를 바로 쓸 수 없다.", "인수분해 꼴처럼 보여도 우변이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math> 이 아니라 근이 안 나온다."]}}, {"질문": "이 문제와 같은 핵심 개념으로 푸는 것을 모두 고르면?<br>ㄱ. 삼각형 OAB 에서 빗변 AB 위를 움직이는 점 P 에 대하여 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">P<\/mi><\/mrow><\/mrow><\/mrow><\/math> 의 최솟값<br>ㄴ. 평행사변형의 네 변을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mi>:<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 로 내분한 네 점이 만드는 사각형의 넓이가 원래의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>5<\/mn><mn>8<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 일 때 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math><br>ㄷ. 두 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>3<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>5<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 을 잇는 선분의 수직이등분선", "선지": ["ㄴ", "ㄱ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "말": ["맞다. ㄴ 도 '전체 − 귀퉁이' 로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math> 의 식을 세운다.", "같은 삼각형이 나와서 끌렸다. 그런데 ㄱ 에서 구하는 게 넓이일까, 거리일까?", "같은 삼각형이 나와서 ㄱ 까지 넣었다. ㄱ 이 실제로 무엇을 구하는지 보자.", "ㄷ 은 수직이등분선 문제다. 내분점이나 넓이 식이 들어갈 자리가 있을까?", "셋 다 좌표 문제라 같아 보인다. 각각 무엇으로 푸는지 하나씩 따져 보자."], "풀이": "ㄴ 은 겉모습이 다르지만 귀퉁이 넓이가 각각 전체의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><mi>t<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 배라 '전체 − 귀퉁이' 로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math> 식을 세운다. 같은 개념이다. ㄱ 은 같은 삼각형, 빗변 위의 점이지만 O 와 직선 AB 사이의 거리 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>4<\/mn><\/mrow><mrow><msqrt><mn>5<\/mn><\/msqrt><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math> 를 구하는 문제다. ㄷ 은 수직이등분선 문제다.", "보조": {"질문": "이 문제의 핵심 도구는?", "선지": ["넓이 = 전체 − 귀퉁이 로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math> 의 식 세우기", "점과 직선 사이의 거리", "두 점에서 같은 거리인 점의 자취"], "말": ["맞다. 보기 중 이 도구로 식을 세우는 게 어느 것인지 다시 보자.", "그건 최솟값을 묻는 ㄱ 같은 문제의 도구다. 이 문제에서 거리를 쓴 적이 있나?", "수직이등분선 얘기다. 이 문제에서 같은 거리를 따진 적이 있나?"]}}], "H": {"질문": "이 문제, 첫 발은 뭐로 뗄까?", "선지": ["O 를 원점으로 좌표를 잡고 P, Q, R 을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math> 로 쓴다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 을 넣어 넓이부터 계산해 본다", "닮음비 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math> 로 PQR 의 넓이를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><msup><mi>t<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math> 이라 둔다", "빗변 AB 의 길이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><msqrt><mn>5<\/mn><\/msqrt><\/mrow><\/math> 부터 구한다", "삼각형 PQR 의 세 변의 길이를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math> 로 쓴다"], "말": ["좋다. 직각인 꼭짓점 O 를 원점에 두면 내분점이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math> 식으로 깔끔하게 나온다.", "값 하나 넣어 보는 건 감 잡기엔 좋다. 하지만 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math> 를 구하려면 일반식이 필요하다.", "PQR 와 OAB 는 닮음이 아니다. 닮음비로 넓이를 잡을 수 없다.", "빗변 길이는 이 풀이에 쓰이지 않는다.", "세 변 길이로 넓이를 구하면 계산이 너무 무겁다. 더 가벼운 길이 있다."], "힌트": ["직각인 꼭짓점을 원점에 놓고 세 내분점을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math> 로 나타낸 뒤, 넓이를 '큰 삼각형 − 귀퉁이 셋' 으로 보자.", "A<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>4<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, B<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 이면 P<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>4<\/mn><mi>t<\/mi><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, Q<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>4<\/mn><mo>&#x02212;<\/mo><mn>4<\/mn><mi>t<\/mi><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>2<\/mn><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, R<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>2<\/mn><mo>&#x02212;<\/mo><mn>2<\/mn><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 이고, 귀퉁이 OPR 의 넓이는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><mi>t<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x02212;<\/mo><mi>t<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 다."]}}, {"id": "고림고 Ⅰ-3", "단원": "평면좌표와 직선의 방정식", "발문": "<div class=\"print\"><p class=\"first\">제<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>사분면 위의 서로 다른 두 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/math>가<\/p><p>다음 조건을 만족시킨다.<\/p><p><div class=\"box\"><div class=\"bl\">(가) 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><\/math>는 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mstyle><mi>x<\/mi><\/mrow><\/math> 위의 점이다.<\/div><div class=\"bl\">(나) 삼각형 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/math>는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02220;<\/mo><mrow><mi mathvariant=\"normal\">A<\/mi><\/mrow><mo>&#x0003D;<\/mo><msup><mn>90<\/mn><mrow><mo>&#x02218;<\/mo><\/mrow><\/msup><\/mrow><\/math>인 직각이등변삼각형이다.<\/div><div class=\"bl\">(다) 삼각형 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/math>의 외심과 내심 사이의 거리는<\/div><div class=\"bl\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><msqrt><mrow><mn>5<\/mn><\/mrow><\/msqrt><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mstyle><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mn>2<\/mn><mo>&#x02212;<\/mo><msqrt><mrow><mn>2<\/mn><\/mrow><\/msqrt><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/math>이다.<\/div><\/div><\/p><p>삼각형 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/math>의 무게중심의 좌표가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>p<\/mi><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mi>q<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>일 때<\/p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>6<\/mn><mo stretchy=\"false\">&#x00028;<\/mo><mi>p<\/mi><mo>&#x0002B;<\/mo><mi>q<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>의 값을 구하시오. (단, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mi mathvariant=\"normal\">O<\/mi><\/mrow><\/mrow><\/math>는 원점이다.)<\/p><\/div>", "M": [{"질문": "이 문제가 결국 묻는 것은?", "선지": ["외심–내심 거리가 내접원의 반지름임을 써서 변의 길이를 정하는 것", "외심과 내심이 한 점에서 일치함을 쓰는 것", "외심이 곧 무게중심이므로 무게중심을 바로 구하는 것", "내심이 직각의 꼭짓점 A 와 일치함을 쓰는 것", "외접원의 반지름이 (다)의 거리와 같음을 쓰는 것"], "말": ["맞다. 외심은 빗변 중점이고 내접원이 빗변에 닿는 점도 거기라, 그 거리가 곧 반지름이다.", "이등변이라 외심·내심이 겹칠 것 같았던 거다. 그런데 두 점 사이 거리가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math> 이 아니라고 주어졌다.", "외심과 무게중심은 정삼각형에서나 겹친다. 직각이등변삼각형의 외심은 어디 있지?", "내심은 세 변에서 같은 거리인 점이라 삼각형 안쪽에 있다. 꼭짓점일 수 있을까?", "외접원 반지름은 외심에서 꼭짓점까지 거리다. (다)는 외심에서 어디까지 거리인지 보자."], "풀이": "직각이등변삼각형에서 외심은 빗변의 중점이고, 내접원이 빗변에 닿는 점도 그 중점이다. 그래서 외심–내심 거리 = 내접원 반지름이다. 외심을 무게중심으로 보거나 외접원 반지름으로 읽으면 변의 길이가 틀어진다.", "보조": {"질문": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02220;<\/mo><mi mathvariant=\"normal\">A<\/mi><mo>&#x0003D;<\/mo><msup><mn>90<\/mn><mo>&#x02218;<\/mo><\/msup><\/mrow><\/math> 인 직각이등변삼각형 OAB 의 외심은 어디인가?", "선지": ["빗변 OB 의 중점", "꼭짓점 A", "삼각형의 무게중심"], "말": ["맞다. 그런데 내접원이 빗변 OB 에 닿는 점도 바로 그 중점이다. 그럼 (다)의 거리는 뭘까?", "A 는 직각의 꼭짓점이다. 외심은 세 꼭짓점에서 같은 거리인 점이다.", "무게중심은 중선의 교점이다. 직각삼각형의 외심은 따로 정해진 자리가 있다."]}}, {"질문": "답을 결정짓는 단계는?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><msup><mi>t<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><mo>&#x000B7;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><msqrt><mn>5<\/mn><\/msqrt><\/mrow><mrow><mn>2<\/mn><\/mrow><\/mfrac><\/mstyle><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo>&#x02212;<\/mo><msqrt><mn>2<\/mn><\/msqrt><mo stretchy=\"false\">&#x00029;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo>&#x0002B;<\/mo><msqrt><mn>2<\/mn><\/msqrt><mo stretchy=\"false\">&#x00029;<\/mo><mi>t<\/mi><\/mrow><\/math> 에서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo>&#x0003D;<\/mo><msqrt><mn>5<\/mn><\/msqrt><\/mrow><\/math>", "A 를 지나고 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><mi>x<\/mi><\/mrow><\/math> 에 수직인 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>5<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>5<\/mn><mn>4<\/mn><\/mfrac><\/mstyle><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>5<\/mn><\/mrow><\/math> 에서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">A<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>b<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mn>4<\/mn><mi>b<\/mi><mo>&#x0002B;<\/mo><mn>3<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 에서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math> 또는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math>", "무게중심 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>0<\/mn><mo>&#x0002B;<\/mo><mn>2<\/mn><mo>&#x0002B;<\/mo><mn>1<\/mn><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mstyle><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>0<\/mn><mo>&#x0002B;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mn>3<\/mn><\/mrow><mrow><mn>3<\/mn><\/mrow><\/mfrac><\/mstyle><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/math>"], "말": ["맞다. (다)가 실제로 쓰이는 곳이 여기다. 이 한 줄로 변의 길이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mn>5<\/mn><\/msqrt><\/mrow><\/math> 가 정해진다.", "수직인 직선은 B 를 찾는 길이다. 그런데 그 전에 길이를 먼저 알아야 한다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math> 는 길이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mn>5<\/mn><\/msqrt><\/mrow><\/math> 를 알아야 나온다. 그 길이는 어디서 왔지?", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><\/mrow><\/math> 의 두 값 중 고르기는 사분면 확인이다. 값이 처음 정해지는 곳은 더 앞이다.", "무게중심은 마지막 계산이다. 답을 '결정짓는' 건 더 앞 단계다."], "풀이": "넓이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><mi>r<\/mi><mo>&#x000D7;<\/mo><\/mrow><\/math>둘레 에 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><\/mrow><\/math> 을 넣어 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo>&#x0003D;<\/mo><msqrt><mn>5<\/mn><\/msqrt><\/mrow><\/math> 가 나오는 단계에서 (다)가 쓰인다. 나머지는 이 길이로 좌표를 찾는 계산이다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>3<\/mn><\/mrow><\/math> 중 고르기는 사분면 확인일 뿐이다.", "보조": {"질문": "내접원의 반지름이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><\/mrow><\/math>, 둘레가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>L<\/mi><\/mrow><\/math> 인 삼각형의 넓이는?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><mi>r<\/mi><mi>L<\/mi><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><mi>L<\/mi><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>&#x003C0;<\/mi><msup><mi>r<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math>"], "말": ["맞다. 직각이등변삼각형의 넓이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><msup><mi>t<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math> 과 이 식을 같게 놓으면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math> 가 나온다.", "내심에서 세 변으로 쪼갠 삼각형 셋의 넓이를 더하면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 이 붙는다.", "그건 내접원의 넓이다. 삼각형 넓이와는 다르다."]}}, {"질문": "(나)의 '<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02220;<\/mo><mi mathvariant=\"normal\">A<\/mi><mo>&#x0003D;<\/mo><msup><mn>90<\/mn><mo>&#x02218;<\/mo><\/msup><\/mrow><\/math>' 는 점 B 를 찾을 때 어떻게 쓰이나?", "선지": ["A 를 지나고 직선 OA 에 수직인 직선 위에서 B 를 찾게 한다", "O 를 지나고 직선 OA 에 수직인 직선 위에서 B 를 찾게 한다", "선분 OA 의 수직이등분선 위에서 B 를 찾게 한다", "원점이 중심이고 반지름이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><\/mrow><\/math> 인 원 위에서 B 를 찾게 한다", "직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><mi>x<\/mi><\/mrow><\/math> 위에서 B 를 찾게 한다"], "말": ["맞다. 직각인 꼭짓점이 A 라서 AB 가 OA 에 수직이다.", "직각을 O 에 둔 그림이다. (나)에서 직각인 꼭짓점이 어디였는지 다시 보자.", "수직이등분선은 O, A 에서 같은 거리인 점들이다. 이 삼각형에서 같은 길이는 어느 두 변이지?", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><\/mrow><\/math> 로 읽은 거다. 이등변에서 같은 두 변이 어느 것인지 확인하자.", "그 직선 위에 있는 건 A 다. B 까지 같은 직선 위면 삼각형이 안 생긴다."], "풀이": "직각의 꼭짓점이 A 라서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><mi>&#x027C2;<\/mi><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><\/math> 이고, B 는 A<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 를 지나는 기울기 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><\/math> 의 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>5<\/mn><\/mrow><\/math> 위에 있다. 빗변은 OB 다. 직각을 O 에 두면 O 를 지나는 수직선 위에서 찾게 되는데, 그건 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02220;<\/mo><mi mathvariant=\"normal\">O<\/mi><mo>&#x0003D;<\/mo><msup><mn>90<\/mn><mo>&#x02218;<\/mo><\/msup><\/mrow><\/math> 인 다른 삼각형이다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><\/mrow><\/math> 로 읽으면 이등변의 두 변을 잘못 잡은 것이다.", "보조": {"질문": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02220;<\/mo><mi mathvariant=\"normal\">A<\/mi><mo>&#x0003D;<\/mo><msup><mn>90<\/mn><mo>&#x02218;<\/mo><\/msup><\/mrow><\/math> 일 때 서로 수직인 두 변은?", "선지": ["AO 와 AB", "OA 와 OB", "OB 와 AB"], "말": ["맞다. 그럼 B 는 A 에서 OA 와 수직으로 뻗은 직선 위에 있다.", "그건 O 에서 직각일 때다. 각 A 는 A 에서 만나는 두 변이 이룬다.", "그 두 변은 B 에서 만난다. 각 A 를 이루는 두 변이 아니다."]}}, {"질문": "고급변형은 (가)를 '점 B 는 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><mi>x<\/mi><\/mrow><\/math> 위', (다)를 '내접원의 넓이가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>30<\/mn><mo>&#x02212;<\/mo><mn>20<\/mn><msqrt><mn>2<\/mn><\/msqrt><mo stretchy=\"false\">&#x00029;<\/mo><mi>&#x003C0;<\/mi><\/mrow><\/math>' 로 바꿨다. 원본 풀이에서 달라지는 것은?", "선지": ["빗변 OB 를 먼저 정하고, A 는 OB 의 수직이등분선 위에서 찾는다", "A 를 지나 OA 에 수직인 직선 위에서 B 를 찾는 과정이 그대로다", "내접원 넓이가 주어져 반지름 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><\/mrow><\/math> 을 구할 필요가 없다", "B 가 직각의 꼭짓점이 되어 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><mi>&#x027C2;<\/mi><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/math> 를 쓴다", "외심이 원점이 되어 O 에서 거리를 잰다"], "말": ["맞다. 직선 위의 점이 빗변 끝 B 라서 OB 부터 정하고, 직각 꼭짓점 A 는 OB 의 수직이등분선 위에서 찾는다.", "원본에선 그 순서였다. 그런데 이번에 직선 위에 놓인 점은 A 가 아니다. 어느 점부터 정해질까?", "내접원 넓이에서 반지름이 바로 나오지만, 그 반지름으로 변의 길이를 정한다. 필요 없다고 할 수 있을까?", "(나)는 그대로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02220;<\/mo><mi mathvariant=\"normal\">A<\/mi><mo>&#x0003D;<\/mo><msup><mn>90<\/mn><mo>&#x02218;<\/mo><\/msup><\/mrow><\/math> 다. B 가 직선 위로 옮겨 갔다고 직각 꼭짓점이 바뀌지는 않는다.", "직각삼각형의 외심은 빗변의 중점이다. 원점 O 가 빗변의 중점일 수 있을까?"], "풀이": "(다)에서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><msqrt><mn>5<\/mn><\/msqrt><mo>&#x02212;<\/mo><msqrt><mrow><mn>10<\/mn><\/mrow><\/msqrt><\/mrow><\/math> 이고, 변 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><msqrt><mn>5<\/mn><\/msqrt><\/mrow><\/math>, 빗변 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mn>2<\/mn><msqrt><mrow><mn>10<\/mn><\/mrow><\/msqrt><\/mrow><\/math> 이 나온다. B 가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><mi>x<\/mi><\/mrow><\/math> 위라 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">B<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>6<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 이 먼저 정해진다. A 는 직각의 꼭짓점이라 OB 의 중점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>3<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 에서 수직 방향으로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><mn>10<\/mn><\/mrow><\/msqrt><\/mrow><\/math> 떨어진 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>4<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 다(다른 후보 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>4<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 는 제2사분면). 직각 꼭짓점은 여전히 A 다.", "보조": {"질문": "'B 는 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><mi>x<\/mi><\/mrow><\/math> 위' 라는 조건은 어느 단계에 쓰이나?", "선지": ["빗변 길이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><msqrt><mrow><mn>10<\/mn><\/mrow><\/msqrt><\/mrow><\/math> 과 함께 B 의 좌표를 정하는 단계", "내접원의 반지름 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><\/mrow><\/math> 을 구하는 단계", "A 의 두 후보 중 하나를 고르는 단계"], "말": ["맞다. B 가 먼저 정해지면 A 는 어디서 찾을지, 처음 질문으로 돌아가 보자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><\/mrow><\/math> 은 (다)의 넓이만으로 나온다. 직선은 아직 필요 없다.", "A 의 후보를 고르는 건 '제1사분면' 조건이다. 직선 조건은 그보다 앞에서 쓰인다."]}}, {"질문": "(나), (다)는 그대로 두고 (가)의 직선만 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><mi>x<\/mi><\/mrow><\/math> 에서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 로 바꾸면?", "선지": ["B 가 좌표축 위에 놓여 조건을 만족하는 B 가 없다", "B 는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><msqrt><mrow><mn>10<\/mn><\/mrow><\/msqrt><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 으로 그대로 존재한다", "B 가 제1사분면에 두 개 생겨 답이 두 개다", "변의 길이가 바뀌어 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo>&#x0003D;<\/mo><msqrt><mrow><mn>10<\/mn><\/mrow><\/msqrt><\/mrow><\/math> 이 된다", "답 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>6<\/mn><mo stretchy=\"false\">&#x00028;<\/mo><mi>p<\/mi><mo>&#x0002B;<\/mo><mi>q<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 는 그대로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>14<\/mn><\/mrow><\/math> 다"], "말": ["맞다. 빗변 OB 는 OA 와 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>45<\/mn><mo>&#x02218;<\/mo><\/msup><\/mrow><\/math> 를 이루니, OA 가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>45<\/mn><mo>&#x02218;<\/mo><\/msup><\/mrow><\/math> 면 OB 는 축 위로 간다.", "그 점은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>축 위다. 축 위의 점이 제1사분면에 속할까?", "직선을 바꿔도 삼각형 모양은 그대로다. B 의 후보가 어디에 생기는지 그려 보자.", "변의 길이는 (다)만으로 정해졌다. (가)의 직선이 그 길이에 끼어들까?", "점이 정해져야 무게중심도 나온다. 먼저 B 가 존재하는지부터 보자."], "풀이": "빗변 OB 는 OA 와 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>45<\/mn><mo>&#x02218;<\/mo><\/msup><\/mrow><\/math> 를 이룬다. OA 가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 이면 OB 는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>축이나 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축 방향이라 B 가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><msqrt><mrow><mn>10<\/mn><\/mrow><\/msqrt><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 또는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><msqrt><mrow><mn>10<\/mn><\/mrow><\/msqrt><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 이다. 축 위의 점은 제1사분면이 아니다. 변의 길이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><mo>&#x0003D;<\/mo><msqrt><mn>5<\/mn><\/msqrt><\/mrow><\/math> 는 직선과 무관하다.", "보조": {"질문": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02220;<\/mo><mi mathvariant=\"normal\">A<\/mi><mo>&#x0003D;<\/mo><msup><mn>90<\/mn><mo>&#x02218;<\/mo><\/msup><\/mrow><\/math> 인 직각이등변삼각형 OAB 에서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02220;<\/mo><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/math> 는?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>45<\/mn><mo>&#x02218;<\/mo><\/msup><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>90<\/mn><mo>&#x02218;<\/mo><\/msup><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>60<\/mn><mo>&#x02218;<\/mo><\/msup><\/mrow><\/math>"], "말": ["맞다. OA 가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축과 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>45<\/mn><mo>&#x02218;<\/mo><\/msup><\/mrow><\/math> 라면 OB 는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축과 몇 도가 될지 따져 보자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>90<\/mn><mo>&#x02218;<\/mo><\/msup><\/mrow><\/math> 는 A 의 각이다. 한 삼각형에 직각이 둘일 수는 없다.", "정삼각형의 각이다. 직각이등변삼각형의 나머지 두 각은 서로 같다."]}}, {"질문": "어떤 학생이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>6<\/mn><mo stretchy=\"false\">&#x00028;<\/mo><mi>p<\/mi><mo>&#x0002B;<\/mo><mi>q<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0003D;<\/mo><mn>10<\/mn><\/mrow><\/math> 이라고 답했다. 원인은?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math> 을 골라 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">B<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 로 무게중심을 구했다", "외심–내심 거리를 외접원 반지름으로 봤다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/math> 를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mn>2<\/mn><\/msqrt><mi>t<\/mi><\/mrow><\/math> 가 아니라 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>t<\/mi><\/mrow><\/math> 로 잡았다", "무게중심에서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><\/mrow><\/math> 으로 나누지 않았다", "A 의 좌표를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 로 바꿔 잡았다"], "말": ["맞다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">B<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 은 제4사분면이라 걸렀어야 했다.", "그랬다면 변의 길이부터 달라져 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>10<\/mn><\/mrow><\/math> 같은 깔끔한 수가 나오기 어렵다. B 후보 둘로 직접 계산해 보자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/math> 를 잘못 잡으면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math> 부터 틀어진다. 이 학생 답은 더 뒤에서 갈렸다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><\/mrow><\/math> 으로 안 나누면 답이 세 배쯤 커진다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>10<\/mn><\/mrow><\/math> 은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>14<\/mn><\/mrow><\/math> 보다 작다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><mi>x<\/mi><\/mrow><\/math> 위에 있는지 보자. (가)와 어긋난다."], "풀이": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math> 이면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">B<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 은 제4사분면이다. 무게중심 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>5<\/mn><mn>3<\/mn><\/mfrac><\/mstyle><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>0<\/mn><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/math> 에서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>6<\/mn><mo>&#x000D7;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>5<\/mn><mn>3<\/mn><\/mfrac><\/mstyle><mo>&#x0003D;<\/mo><mn>10<\/mn><\/mrow><\/math> 이 나온다. 제1사분면 조건으로 걸렀어야 한다.", "보조": {"질문": "B 의 후보 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>3<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 중 문제 조건에 맞는 것은?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>3<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>", "둘 다 된다"], "말": ["맞다. 다른 후보로 무게중심을 구해 보면 학생의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>10<\/mn><\/mrow><\/math> 이 어디서 왔는지 보인다.", "발문 첫 줄을 다시 보자. 두 점이 어디에 있다고 했지?", "발문 첫 줄에 두 점의 위치가 정해져 있다."]}}, {"질문": "이 문제와 같은 핵심 개념으로 푸는 것을 모두 고르면?<br>ㄱ. 빗변의 길이가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><\/mrow><\/math> 인 직각이등변삼각형의 내접원의 반지름<br>ㄴ. 넓이가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>6<\/mn><\/mrow><\/math>, 둘레가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>12<\/mn><\/mrow><\/math> 인 삼각형의 내접원의 반지름<br>ㄷ. 한 변이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>6<\/mn><\/mrow><\/math> 인 정삼각형의 외심과 내심 사이의 거리", "선지": ["ㄱ, ㄴ", "ㄱ", "ㄷ", "ㄱ, ㄷ", "ㄱ, ㄴ, ㄷ"], "말": ["맞다. ㄱ, ㄴ 은 넓이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><mi>r<\/mi><mo>&#x000D7;<\/mo><\/mrow><\/math>둘레 로 반지름을 구한다.", "ㄱ 은 잘 봤다. 직각이등변이 아니어도 같은 공식이 통하는 보기가 있는지 보자.", "ㄷ 은 '외심과 내심' 이란 말이 같아서 끌렸다. 정삼각형에서 두 점은 어디 있지?", "ㄱ 은 잘 봤다. ㄷ 에서 계산할 거리가 실제로 있는지 따져 보자.", "셋 다 내심이 나온다. 각각 실제로 무슨 계산을 하는지 하나씩 보자."], "풀이": "ㄱ, ㄴ 은 넓이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><mi>r<\/mi><mo>&#x000D7;<\/mo><\/mrow><\/math>둘레 로 반지름을 구한다(ㄱ <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><msqrt><mn>2<\/mn><\/msqrt><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><\/math>, ㄴ <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>). 같은 개념이다. ㄷ 은 문구가 같지만 정삼각형은 외심과 내심이 일치해 거리 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math> 이다. 계산할 게 없다.", "보조": {"질문": "한 변이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>6<\/mn><\/mrow><\/math> 인 정삼각형의 외심과 내심 사이의 거리는?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mn>3<\/mn><\/msqrt><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><msqrt><mn>3<\/mn><\/msqrt><\/mrow><\/math>"], "말": ["맞다. 정삼각형은 두 점이 겹쳐 계산할 게 없다. 이걸로 보기를 다시 가려 보자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mn>3<\/mn><\/msqrt><\/mrow><\/math> 은 내접원 반지름이다. 외심과 내심의 위치부터 보자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><msqrt><mn>3<\/mn><\/msqrt><\/mrow><\/math> 은 외접원 반지름이다. 외심과 내심의 위치부터 보자."]}}], "H": {"질문": "이 문제, 첫 발은 뭐로 뗄까?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mi>t<\/mi><\/mrow><\/math> 로 두고 (다)로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math> 부터 구한다", "A, B 를 모두 문자로 두고 좌표부터 쓴다", "외심을 원점 O 로 놓는다", "외심과 내심을 좌표로 구해 거리 공식을 쓴다", "무게중심을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>p<\/mi><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mi>q<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 로 두고 식을 세운다"], "말": ["좋다. 모양이 정해진 삼각형이니 크기만 정하면 된다. (다)가 크기를 정해 준다.", "길이를 모르는 채 문자를 늘리면 식이 엉킨다. 크기부터 정하자.", "O 는 꼭짓점이다. 외심은 빗변 위에 있다.", "할 수는 있지만 문자가 많아 무겁다. (다)의 거리가 무엇인지 알면 훨씬 짧다.", "무게중심은 세 꼭짓점을 다 알아야 나온다. 마지막에 할 일이다."], "힌트": ["직각이등변삼각형은 모양이 정해져 있다. 크기, 즉 한 변의 길이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>t<\/mi><\/mrow><\/math> 를 (다)로 먼저 정하자.", "외심(빗변 중점)과 내심 사이 거리는 내접원 반지름 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r<\/mi><\/mrow><\/math> 이다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><msup><mi>t<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><mi>r<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo>&#x0002B;<\/mo><msqrt><mn>2<\/mn><\/msqrt><mo stretchy=\"false\">&#x00029;<\/mo><mi>t<\/mi><\/mrow><\/math> 를 풀자."]}}, {"id": "고림고 Ⅰ-4", "단원": "평면좌표와 직선의 방정식", "발문": "<div class=\"print\"><p class=\"first\">그림과 같이 좌표평면 위의 네 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mi mathvariant=\"normal\">O<\/mi><\/mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mi mathvariant=\"normal\">A<\/mi><\/mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mi mathvariant=\"normal\">B<\/mi><\/mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>4<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mi mathvariant=\"normal\">C<\/mi><\/mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>4<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>를 꼭짓점으로 하는 직사각형 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><\/mrow><\/math>의 내부에 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">P<\/mi><\/mrow><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">P<\/mi><\/mrow><\/mrow><\/mrow><mi>&#x027C2;<\/mi><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">P<\/mi><\/mrow><\/mrow><\/mrow><\/mrow><\/math>인 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mi mathvariant=\"normal\">P<\/mi><\/mrow><\/mrow><\/math>가 있다. 선분 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/math>가 두 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">P<\/mi><\/mrow><\/mrow><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mrow><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">P<\/mi><\/mrow><\/mrow><\/mrow><\/math>와 만나는 점을 각각 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mi mathvariant=\"normal\">Q<\/mi><\/mrow><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mi mathvariant=\"normal\">R<\/mi><\/mrow><\/mrow><\/math>이라 하고 삼각형 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mrow><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\"normal\">R<\/mi><mi mathvariant=\"normal\">Q<\/mi><\/mrow><\/mrow><\/mrow><\/math>의 무게중심을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mi mathvariant=\"normal\">G<\/mi><\/mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>라 할 때, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0002B;<\/mo><mi>b<\/mi><\/mrow><\/math>의 값은?<\/p><div class=\"fig\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAcgAAAIhCAIAAABFYL1qAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAENaSURBVHhe7d17YNtlvT/wMtp0SZo0XdMtlbENxgq6bq4DxnJYYQxYkdtxAyJ3wQUZXkApgkauotBzKFcRVMpFccqRFdkQBSToPCqblwxFYP7OoYgg3qminCGg/b3zfT6NWZpkaS5Pvs/3+379UfL5JmVtnifvPJ88ab4NY0REVFUMViKiKmOwEhFVGYOViKjKGKxERFXGYCUiqjIGKxFRlTFYiYiqjMFKRFRlDFYioipjsBIRVRmDlYioyhisRERVxmAlIqoyBisRUZUxWImIqozBSkRUZQxWIqIqY7ASEVUZg5WIqMoYrJW65MLzlh/ce83Nd0o97tXR3331vgekGHfUUUc98cQTUhCRQzFYK3L4gYt//IsXcKGhoeGmuzeqg8rb3jIVB6WwjIyMNDY29vf3S01EDsVgLd9j99120X/cZl38JzL0naeea10WODJrwTIpLIODgzNmzAgEAlITkUMxWMs3d2ZEXXjk3tsRo7es+7oq4akffBNHPnzZtVJbwuHw3Llz/X5/MpmUQ0TkRAzW8t1882fUhSVd03O6/oHE+3Hke0+mXyVQUqlUS0vL/Pnzg8FgLBaTo0TkRAzWir3+R2To4cevkdISfdtbcqK2v78fRxCs+JpzFRE5DB/hlfr8NRcjKB/83pNSW3Bkr/0OlcLi8/lwUAWrx+MZHh6WK4jIcRislVp5wD45K9Dntm7CkYuuulnqsbFkMun3+zPBCr29vXIdET 까?", "빗변을 지름으로 하는 원은 외접원이다. 묻는 건 어느 원일까?"], "풀이": "직각삼각형 OPC 에서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mn>6<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">P<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math> 이라 P<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>3<\/mn><msqrt><mn>3<\/mn><\/msqrt><\/mrow><mn>2<\/mn><\/mfrac><\/mstyle><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>3<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/math>, Q<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><msqrt><mn>3<\/mn><\/msqrt><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, R<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>6<\/mn><mo>&#x02212;<\/mo><mn>3<\/mn><msqrt><mn>3<\/mn><\/msqrt><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 은 원본처럼 구한다. 새로 필요한 건 세 변의 길이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\"normal\">Q<\/mi><\/mrow><\/mrow><mo>&#x0003D;< ow><\/math> 를 읽는다. 둘 다 같은 개념이다. ㄴ 은 같은 직사각형 그림이지만 중점 공식 문제다.", "보조": {"질문": "직사각형 OABC 의 두 대각선의 교점은 어떻게 구하나?", "선지": ["대각선 OB 의 중점을 구한다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02220;<\/mo><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/math> 를 특수각으로 읽는다", "OB 와 AC 의 기울기 곱 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math> 을 쓴다"], "말": ["맞다. ㄴ 은 중점 공식으로 끝난다. 이걸로 보기를 다시 가려 보자.", "직사각형 대각선이 늘 특수각을 이루진 않는다. 대각선은 서로를 이등분한다.", "직사각형의 두 대각선은 보통 수직이 아니다."]}}], "H": {"질문": "이 문제, 첫 발은 뭐로 뗄까?", "선지": ["직각삼각형 OPC 의 변의 비로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02220;<\/mo><mrow><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">O<\/mi><mi mathvariant=\"normal\">P<\/mi><\/mrow><\/mrow><\/math> 부터 읽는다", "P 를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mi>y<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 로 두고 Q, R 좌표부터 쓴다", "P 가 대각선 OB 위에 있다고 놓는다", "Q, R 을 AB 의 삼등분점으로 둔다", "직선 OP 의 기울기를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><\/mrow><\/math> 로 놓는다"], "말": ["좋다. 빗변 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><\/mrow><\/math>, 한 변 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><\/mrow><\/math> 라 특수각이 바로 보인다. 그 각이 P 를 정한다.", "문자 둘로 시작하면 식이 길어진다. P 를 정하는 조건부터 쓰자.", "그림에선 그럴듯해도 근거가 없다. 주어진 길이 조건을 먼저 쓰자.", "삼등분점이라는 조건은 어디에도 없다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><\/mrow><\/math> 는 대각선 OB 의 기울기다. OP 와 같다는 근거가 없다."], "힌트": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-t : "외심이 가진 성질은?", "선지": ["세 꼭짓점에서 거리가 같다", "세 변에서 거리가 같다", "세 중선을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>:<\/mi><mn>1<\/mn><\/mrow><\/math> 로 나눈다"], "말": ["맞다. 두 점에서 거리가 같은 점은 수직이등분선 위에 있다. 이제 처음 질문을 다시 보자.", "그건 내심의 성질이다. 외접원은 세 꼭짓점을 지난다.", "그건 무게중심의 성질이다."]}}, {"질문": "외심의 성질이 실제로 쓰이는 단계는?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><mi>x<\/mi><mo>&#x0002B;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>5<\/mn><mn>4<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 와 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>5<\/mn><\/mrow><\/math> 를 연립한다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>2<\/mn><mn>3<\/mn><\/mfrac><\/mstyle><msup><mi>k<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>6<\/mn><\/mrow><\/math> 에서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math>", "세 점의 평균 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>2<\/mn><mn>3<\/mn><\/mfrac><\/mstyle><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>8<\/mn><mn>3<\/mn><\/mfrac><\/mstyle><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/math> 을 구한다", "OA 의 기울기가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><\/math> 이므로 수직이등분선 기울기도 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><\/math>", "AB 의 중점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mn>4<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 를 외심으로 둔다"], "말": ["맞다. 두 수직이등분선을 연립하는 순간 외심이 나온다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math> 은 꼭 필요한 준비다. 하지만 외심의 성질은 아직 안 쓰였다.", "세 점의 평균은 무게중심이다. 외심의 성질과는 다르다.", "수직이등분선은 OA 에 수직이어야 한다. 기울기가 같으면 수직일까?", "AB 의 중점이 외심이 되려면 O 에서 직각이어야 한다."], "풀이": "두 수직이등분선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>5<\/mn><\/mrow><\/math> 와 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><mi>x<\/mi><mo>&#x0002B;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>5<\/mn><mn>4<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 를 연립해 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>5<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><mo>&#x0002C;<\/mo><mspace width=\"0.167em\" /><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>5<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/math> 이 나온다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math> 은 꼭짓점을 정하는 준비 단계다. 수직이등분선 기울기는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfra   ord.forEach((k,i)=>{const o=el('button','op'+((locked||[]).includes(k)?' lock':''),'<b>'+'①②③④⑤⑥⑦⑧'[i]+'</b><span>'+opts[k]+'</span>');
    o.onclick=()=>{if(g.classList.contains('done'))return;
      g.querySelectorAll('.op').forEach(x=>x.classList.remove('pick'));o.classList.add('pick');sel=[k,o];
      ok.disabled=false;ok.textContent='이걸로 할게';};g.appendChild(o);});
  // (1009) 바로 넘어가지 않는다 — 고른 뒤 [이걸로 할게] 를 눌러야 확정. 잘못 터치하면 다른 걸 다시 고르면 된다.
  let sel=null;const ok=el('button','nx cf','하나 골라 봐');ok.disabled=true;
  ok.onclick=()=>{if(!sel||g.classList.contains('done'))return;g.classList.add('done');ok.remove();onPick(sel[0],sel[1],g);};
  b.appendChild(g);b.appendChild(ok);box.appendChild(b);scrollEnd(b);return g;
}
function say(box,cls,h){const b=el('div','bub say '+cls,h);box.appendChild(b);return b;}
function nextBtn(box,txt,fn){const n=el('button','nx',txt);n.onclick=()=>{n.remove();fn();};box.appendChild(n);scrollEnd(n);}

function runProblem(pi){
  const P=PROBS[pi];const root=$('#thread');root.innerHTML='';
  const card=$('#prob');card.innerHTML='';card.className='prob';
  card.appendChild(el('div','ph',(pi+1)+' / '+PROBS.length+' · '+P.id+(P.단원?' · '+P.단원:'')));
  card.appendChild(el('div','stem',P.발문));
  const tog=el('button','tog','문제 접기');tog.onclick=()=>{card.classList.toggle('fold');tog.textContent=card.classList.contains('fold')?'문제 펼치기':'문제 접기';};card.appendChild(tog);
  const dots=el('div','dots');for(let k=0;k<NS;k++)dots.appendChild(el('i'));card.appendChild(dots);
  const res=Array(NS).fill(null);   // 'o' | 't' | 'x'
  const rec={id:P.id,입구:null,갈림:null,첫발:null,스텝:[]};
  const paint=cur=>dots.querySelectorAll('i').forEach((d,k)=>d.className=res[k]||(k===cur?'cur':''));

  // ① 입구
  ask(root,'먼저','', META.입구,
    ['맞혔고, 왜 그런지 설명도 할 수 있다','맞히긴 했는데 감으로 풀었다','풀었는데 틀렸다','손도 못 댔다'],'in',[],k=>{
      rec.입구=k;
      if(k<=1){say(root,'',k===0?'좋아. 그럼 진짜 설명할 수 있는지 하나씩 확인해 보자.':'감으로 맞힌 건 다음엔 틀릴 수 있다. 근거를 하나씩 세워 보자.');go(ALL);}
      else if(k===2){
        ask(root,'어디서','', '어디서 갈렸던 것 같아?',
          WH.map(x=>x[0]),'wh',[],j=>{
            rec.갈림=j;const first=WH[j][1];
            say(root,'','그럼 거기부터 보자. 나머지도 이어서 짚는다.');
            go([first,...ALL.filter(x=>x!==first)]);});
      } else firstStep(()=>go(ALL));
    });

  function firstStep(done){
    const H=P.H;let tries=0;const locked=[];
    const once=()=>ask(root,'첫 발','h',H.질문,H.선지,'H'+tries,locked,(k,o)=>{
      if(k===0){o.classList.add('right');say(root,'ok',H.말[0]);rec.첫발=tries;nextBtn(root,'이제 문제를 뜯어보자',done);}
      else{o.classList.add('wrong');locked.push(k);say(root,'no',H.말[k]);
        if(tries===0){tries=1;say(root,'sol','💡 '+H.힌트[0]);nextBtn(root,'다시 골라 볼게',once);}
        else{say(root,'sol','💡 '+H.힌트[1]);rec.첫발=2;nextBtn(root,'이제 문제를 뜯어보자',done);}}
    });
    once();
  }

  function go(order){
    let i=0;
    const step=()=>{
      if(i>=order.length)return finish();
      const s=order[i++];paint(s);const M=P.M[s];const locked=[];
      const lab='STEP '+(s+1)+' · '+STEPNAME[s];
      ask(root,lab,'',M.질문,M.선지,'M'+s,locked,(k,o)=>{
        if(k===0){o.classList.add('right');say(root,'ok',M.말[0]);res[s]='o';rec.스텝[s]={결과:'o',고른것:[k]};paint(-1);nextBtn(root,i<order.length?'다음':'정리 보기',step);return;}
        o.classList.add('wrong');locked.push(k);say(root,'no',M.말[k]);const picks=[k];
        // 보조 → 재도전
        nextBtn(root,'작은 것부터 확인',()=>{
          const B=M.보조;
          ask(root,'디딤돌','sub',B.질문,B.선지,'B'+s,[],(j,o2)=>{
            o2.classList.add(j===0?'right':'wrong');say(root,j===0?'ok':'no',B.말[j]);
            if(j!==0)say(root,'sol','디딤돌 답: '+B.선지[0]);
            nextBtn(root,'처음 질문 다시',()=>{
              ask(root,lab+' · 다시','',M.질문,M.선지,'M'+s+'r',locked,(k2,o3)=>{
                picks.push(k2);
                if(k2===0){o3.classList.add('right');say(root,'ok','다시 잡았다. '+M.말[0]);res[s]='t';}
                else{o3.classList.add('wrong');say(root,'no',M.말[k2]);say(root,'sol','<b>정리</b> '+M.풀이);res[s]='x';}
                rec.스텝[s]={결과:res[s],고른것:picks,디딤돌:j};paint(-1);
                nextBtn(root,i<order.length?'다음':'정리 보기',step);
              });
            });
          });
        });
      });
    };
    step();
  }

  function finish(){
    paint(-1);S.log[pi]=rec;save();
    const sm=el('div','sum');sm.appendChild(el('h3','',P.id+' 정리'));
    const mk={o:['○','o','한 번에'],t:['△','t','디딤돌 뒤'],x:['✕','x','다시 볼 것']};
    for(let k=0;k<NS;k++){const r=res[k];const m=r?mk[r]:['–','s','건너뜀'];
      const row=el('div','row');row.appendChild(el('span','','STEP '+(k+1)+' '+STEPNAME[k]));row.appendChild(el('span','mk '+m[1],m[0]+' '+m[2]));sm.appendChild(row);}
    const weak=ALL.filter(k=>res[k]==='x'||res[k]==='t');
    sm.appendChild(el('div','weak',weak.length?'<b>여기가 약한 곳</b> · '+weak.map(k=>STEPNAME[k]).join(', ')+(rec.입구<=1&&weak.length>=2?'<br>맞힌 문제였는데도 여기서 걸렸다 — 답을 외운 건 아닌지 다시 보자.':''):'<b>'+NS+'군데 다 한 번에 통과.</b> 이 문제는 진짜 네 거다.'));
    root.appendChild(sm);
    if(pi+1<PROBS.length)nextBtn(root,'다음 문제 →',()=>{S.pi=pi+1;save();window.scrollTo(0,0);runProblem(pi+1);});
    else root.appendChild(el('div','bub say ok','오늘 세트 끝. 수고했다.'));
    scrollEnd(sm);
  }
}
try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.log)S=d;}catch(e){}
runProblem(Math.min(S.pi||0,PROBS.length-1));
</script></body></html>
