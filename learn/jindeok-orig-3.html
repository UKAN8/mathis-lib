로 편다", "두 번 대칭이동해 편다"], "말": ["맞다. 꺾인 곳이 없으면 대칭이 필요 없다. 이걸로 보기를 다시 가려 보자.", "펼 꺾은선이 없다. 점에서 직선까지는 한 번에 간다.", "꺾이는 지점이 하나도 없는데 두 번 펼 일은 없다."]}}], "H": {"질문": "이 문제, 첫 발은 뭐로 뗄까?", "선지": ["P 를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축에, C 를 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math> 에 대칭이동한다", "Q, R 을 각 변의 중점에 놓고 길이를 잰다", "P 에서 C 까지 직선으로 잇는다", "Q, R 을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>q<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>r<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 로 두고 세 거리를 전개한다", "직사각형의 대각선 OB 의 길이를 구한다"], "말": ["좋다. 꺾이는 변마다 끝점을 넘기면 꺾은선이 펴질 준비가 된다.", "중점은 쉽지만 가장 짧다는 근거가 없다.", "그 선분은 Q, R 을 거치지 않는다. 경로가 두 변에 닿아야 한다.", "문자 두 개짜리 근호 세 개라 손으로 최소를 찾기 어렵다. 그림으로 펴는 길을 찾자.", "대각선은 경로가 두 변을 거쳐야 한다는 조건을 무시한다."], "힌트": ["Q 는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축 위, R 은 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math> 위에 있다. 각 선 건너편으로 끝점을 옮기면 길이는 그대로인 채 꺾인 곳이 펴진다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">P<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02192;<\/mo><mrow><msup><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\"normal\">&#x02032;<\/mi><\/msup><\/mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">C<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x02192;<\/mo><mrow><msup><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">&#x02032;<\/mi><\/msup><\/mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>6<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>2<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 이면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\"normal\">Q<\/mi><\/mrow><\/mrow><mo>&#x0002B;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">Q<\/mi><mi mathvariant=\"normal\">R<\/mi><\/mrow><\/mrow><mo>&#x0002B;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">R<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><msup><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\"normal\">&#x02032;<\/mi><\/msup><mi mathvariant=\"normal\">Q<\/mi><\/mrow><\/mrow><mo>&#x0002B;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">Q<\/mi><mi mathvariant=\"normal\">R<\/mi><\/mrow><\/mrow><mo>&#x0002B;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">R<\/mi><msup><mi mathvariant=\"normal\">C<\/mi><mi mathvariant=\"normal\">&#x02032;<\/mi><\/msup><\/mrow><\/mrow><\/mrow><\/math> 이다."]}}];</script><script>
const NS=STEPNAME.length, ALL=[...Array(NS).keys()], SI=n=>STEPNAME.indexOf(n);
const WH=[['무엇을 묻는 문제인지부터 헷갈렸다',SI('무엇을 묻나')],['식을 어떻게 세울지 몰랐다',SI('어디서 쓰이나')],['조건을 놓쳤거나 잘못 읽었다',SI('조건의 역할')]]
  .concat(SI('원본↔변형')>=0?[['변형에서 바뀐 걸 어떻게 처리할지 몰랐다',SI('원본↔변형')]]:[])
  .concat([['계산하거나 답 고르다 틀렸다',SI('함정')],['잘 모르겠다',0]]);
const KEY='haebu-tree:'+META.id;
let S={pi:0,log:[],att:{}};
/* (1010) 진행 기록 → DB haebu_log (schema_v37). 포털에서 ?t=<토큰> 으로 열었을 때만. 실패는 조용히. */
const TOK=new URLSearchParams(location.search).get('t')||'';
function sync(P,rec,res,done){
  if(!TOK||!DB.url) return;
  const body={skey:META.skey,pan:META.pan,id:P.id,unit:P.단원||'',try:rec.try||1,in:rec.입구,wh:rec.갈림,h:rec.첫발,
    res:res.map(r=>r||'-').join(''),pk:rec.스텝.map(x=>x?{r:x.결과,p:x.고른것,b:(x.디딤돌==null?null:x.디딤돌)}:null),done:!!done,ms:Date.now()-rec.t0};
  try{fetch(DB.url+'/rest/v1/rpc/haebu_submit',{method:'POST',keepalive:true,
    headers:{'Content-Type':'application/json','apikey':DB.anon,'Authorization':'Bearer '+DB.anon},
    body:JSON.stringify({tok:TOK,rec:body})}).catch(()=>{});}catch(e){}
}
const $=s=>document.querySelector(s);
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function rnd(seed){let x=seed%2147483647;if(x<=0)x+=2147483646;return()=>(x=x*16807%2147483647)/2147483647;}
function hash(s){let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))%1000003;return h;}
function shuffled(n,tag){const r=rnd(hash(META.id+tag)+n);const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function scrollEnd(n){setTimeout(()=>n.scrollIntoView({behavior:'smooth',block:'start'}),60);}

/* 카드 하나: 질문 + 선지. onPick(원래 인덱스) */
function ask(box,lab,labc,q,opts,tag,locked,onPick){
  const b=el('div','bub q');b.appendChild(el('div','lab'+(labc?' '+labc:''),lab));b.appendChild(el('div','',q));
  const g=el('div','opts');const ord=(tag==='in'||tag==='wh')?[...opts.keys()]:shuffled(opts.length,tag);
  ord.forEach((k,i)=>{const o=el('button','op'+((locked||[]).includes(k)?' lock':''),'<b>'+'①②③④⑤⑥⑦⑧'[i]+'</b><span>'+opts[k]+'</span>');
    o.onclick=()=>{if(g.classList.contains('done'))return;
      g.querySelectorAll('.op').forEach(x=>x.classList.remove('pick'));o.classList.add('pick');sel=[k,o];
      ok.disabled=false;ok.textContent='이걸로 할게';};g.appendChild(o);});
  // (1009) 바로 넘어가지 않는다 — 고른 뒤 [이걸로 할게] 를 눌러야 확정. 잘못 터치하면 다른 걸 다시 고르면 된다.
  let sel=null;const ok=el('button','nx cf','하나 골라 봐');ok.disabled=true;
  ok.onclick=()=>{if(!sel||g.classList.contains('done'))return;g.classList.add('done');ok.remove();onPick(sel[0],sel[1],g);};
  b.appendChild(g);b.appendChild(ok);box.appendChild(b);scrollEnd(b);return g;
}
function say(box,cls,h){const b=el('div','bub say '+cls,h);box.appendChild(b);return b;}
function nextBtn(box,txt,fn){const n=el('button','nx',txt);n.onclick=()=>{n.remove();fn();};box.appendChild(n);scrollEnd(n);}

function runProblem(pi){
  const P=PROBS[pi];const root=$('#thread');root.innerHTML='';
  const card=$('#prob');card.innerHTML='';card.className='prob';
  card.appendChild(el('div','ph',(pi+1)+' / '+PROBS.length+' · '+P.id+(P.단원?' · '+P.단원:'')));
  card.appendChild(el('div','stem',P.발문));
  const tog=el('button','tog','문제 접기');tog.onclick=()=>{card.classList.toggle('fold');tog.textContent=card.classList.contains('fold')?'문제 펼치기':'문제 접기';};card.appendChild(tog);
  const dots=el('div','dots');for(let k=0;k<NS;k++)dots.appendChild(el('i'));card.appendChild(dots);
  const res=Array(NS).fill(null);   // 'o' | 't' | 'x'
  const A=S.att[P.id]||(S.att[P.id]={n:0,done:true});if(A.done){A.n++;A.done=false;}save();
  const rec={id:P.id,입구:null,갈림:null,첫발:null,스텝:[],try:A.n,t0:Date.now()};
  const paint=cur=>dots.querySelectorAll('i').forEach((d,k)=>d.className=res[k]||(k===cur?'cur':''));

  // ① 입구
  ask(root,'먼저','', META.입구,
    ['맞혔고, 왜 그런지 설명도 할 수 있다','맞히긴 했는데 감으로 풀었다','풀었는데 틀렸다','손도 못 댔다'],'in',[],k=>{
      rec.입구=k;sync(P,rec,res,false);
      if(k<=1){say(root,'',k===0?'좋아. 그럼 진짜 설명할 수 있는지 하나씩 확인해 보자.':'감으로 맞힌 건 다음엔 틀릴 수 있다. 근거를 하나씩 세워 보자.');go(ALL);}
      else if(k===2){
        ask(root,'어디서','', '어디서 갈렸던 것 같아?',
          WH.map(x=>x[0]),'wh',[],j=>{
            rec.갈림=j;const first=WH[j][1];
            say(root,'','그럼 거기부터 보자. 나머지도 이어서 짚는다.');
            go([first,...ALL.filter(x=>x!==first)]);});
      } else firstStep(()=>go(ALL));
    });

  function firstStep(done){
    const H=P.H;let tries=0;const locked=[];
    const once=()=>ask(root,'첫 발','h',H.질문,H.선지,'H'+tries,locked,(k,o)=>{
      if(k===0){o.classList.add('right');say(root,'ok',H.말[0]);rec.첫발=tries;nextBtn(root,'이제 문제를 뜯어보자',done);}
      else{o.classList.add('wrong');locked.push(k);say(root,'no',H.말[k]);
        if(tries===0){tries=1;say(root,'sol','💡 '+H.힌트[0]);nextBtn(root,'다시 골라 볼게',once);}
        else{say(root,'sol','💡 '+H.힌트[1]);rec.첫발=2;nextBtn(root,'이제 문제를 뜯어보자',done);}}
    });
    once();
  }

  function go(order){
    let i=0;
    const step=()=>{
      if(i>=order.length)return finish();
      const s=order[i++];paint(s);const M=P.M[s];const locked=[];
      const lab='STEP '+(s+1)+' · '+STEPNAME[s];
      ask(root,lab,'',M.질문,M.선지,'M'+s,locked,(k,o)=>{
        if(k===0){o.classList.add('right');say(root,'ok',M.말[0]);res[s]='o';rec.스텝[s]={결과:'o',고른것:[k]};paint(-1);sync(P,rec,res,false);nextBtn(root,i<order.length?'다음':'정리 보기',step);return;}
        o.classList.add('wrong');locked.push(k);say(root,'no',M.말[k]);const picks=[k];
        // 보조 → 재도전
        nextBtn(root,'작은 것부터 확인',()=>{
          const B=M.보조;
          ask(root,'디딤돌','sub',B.질문,B.선지,'B'+s,[],(j,o2)=>{
            o2.classList.add(j===0?'right':'wrong');say(root,j===0?'ok':'no',B.말[j]);
            if(j!==0)say(root,'sol','디딤돌 답: '+B.선지[0]);
            nextBtn(root,'처음 질문 다시',()=>{
              ask(root,lab+' · 다시','',M.질문,M.선지,'M'+s+'r',locked,(k2,o3)=>{
                picks.push(k2);
                if(k2===0){o3.classList.add('right');say(root,'ok','다시 잡았다. '+M.말[0]);res[s]='t';}
                else{o3.classList.add('wrong');say(root,'no',M.말[k2]);say(root,'sol','<b>정리</b> '+M.풀이);res[s]='x';}
                rec.스텝[s]={결과:res[s],고른것:picks,디딤돌:j};paint(-1);sync(P,rec,res,false);
                nextBtn(root,i<order.length?'다음':'정리 보기',step);
              });
            });
          });
        });
      });
    };
    step();
  }

  function finish(){
    paint(-1);S.log[pi]=rec;A.done=true;save();sync(P,rec,res,true);
    const sm=el('div','sum');sm.appendChild(el('h3','',P.id+' 정리'));
    const mk={o:['○','o','한 번에'],t:['△','t','디딤돌 뒤'],x:['✕','x','다시 볼 것']};
    for(let k=0;k<NS;k++){const r=res[k];const m=r?mk[r]:['–','s','건너뜀'];
      const row=el('div','row');row.appendChild(el('span','','STEP '+(k+1)+' '+STEPNAME[k]));row.appendChild(el('span','mk '+m[1],m[0]+' '+m[2]));sm.appendChild(row);}
    const weak=ALL.filter(k=>res[k]==='x'||res[k]==='t');
    sm.appendChild(el('div','weak',weak.length?'<b>여기가 약한 곳</b> · '+weak.map(k=>STEPNAME[k]).join(', ')+(rec.입구<=1&&weak.length>=2?'<br>맞힌 문제였는데도 여기서 걸렸다 — 답을 외운 건 아닌지 다시 보자.':''):'<b>'+NS+'군데 다 한 번에 통과.</b> 이 문제는 진짜 네 거다.'));
    root.appendChild(sm);
    if(pi+1<PROBS.length)nextBtn(root,'다음 문제 →',()=>{S.pi=pi+1;save();window.scrollTo(0,0);runProblem(pi+1);});
    else root.appendChild(el('div','bub say ok','오늘 세트 끝. 수고했다.'));
    scrollEnd(sm);
  }
}
try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.log){S=d;S.att=S.att||{};}}catch(e){}
runProblem(Math.min(S.pi||0,PROBS.length-1));
</script></body></html>
