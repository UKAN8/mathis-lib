<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>진덕고 프린트 해부 · 도형의 이동</title><style>
:root{--key:#EA9090;--deep:#C0524E;--ink:#333;--mute:#8A8A8A;--tint:#FAE3E1;
 --soft:#F6F6F6;--line:#E6E6E6;--ok:#3E8E6E;--okbg:#E9F4EF;--no:#C0524E;--nobg:#FBEDEC;
 --warn:#B26A00;--warnbg:#FFF3E0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Paperlogy','Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
 background:#EFEFEF;color:var(--ink);font-size:16px;line-height:1.65;padding-bottom:64px}
.wrap{max-width:560px;margin:0 auto;background:#fff;min-height:100vh}
header{padding:22px 20px 16px;background:#2E2E2E;color:#fff;position:sticky;top:0;z-index:20}
.brand{font-size:12px;letter-spacing:.08em;color:var(--key);font-weight:700}
h1{margin:6px 0 2px;font-size:21px;font-weight:800;letter-spacing:-.01em}
.meta{font-size:12.5px;color:#B9B9B9}
.bar{display:flex;gap:5px;margin-top:14px}
.bar i{flex:1;height:4px;border-radius:2px;background:#4A4A4A;transition:background .25s}
.bar i.done{background:var(--key)}
.bar i.wrong{background:#7A4B49}
.guide{margin:0;padding:15px 20px;background:var(--tint);color:var(--deep);font-size:13.5px;line-height:1.6}
.guide b{display:block;font-size:14.5px;margin-bottom:3px}
.part{padding:22px 20px 4px}
.part .pl{font-size:12px;font-weight:800;color:var(--deep);letter-spacing:.04em}
.part .pt{font-size:17px;font-weight:800;margin-top:3px}
.part .pd{font-size:13px;color:var(--mute);margin-top:3px}
.q{padding:20px 20px 24px;border-bottom:10px solid #F1F1F1}
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.qno{font-size:13px;font-weight:800;color:var(--deep)}
.tag{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--tint);color:var(--deep);font-weight:600}
.tag.grey{background:var(--soft);color:var(--mute)}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.pct{background:#EDEDED;color:#6E6E6E}
.stem{font-size:15.5px;margin:0 0 4px}
/* (0908) 학교프린트 원문 조각 — hwpx2html 산출을 그대로 담는다 */
.print{font-size:15px;line-height:1.7}
.print p{margin:0 0 2px}
.print .lead,.print .box{background:var(--soft);border-left:3px solid #555;padding:6px 10px;margin:8px 0}
.print .bogi{border:1px solid #444;padding:12px 10px 6px;margin:12px 2px 8px;position:relative}
.print .bogi .lbl{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:#fff;padding:0 6px;font-weight:700;font-size:13px}
.print .bl{margin:0 0 2px}
.print .fig{text-align:center;margin:8px 0}
.print img{max-width:100%;height:auto}
.print .fl{float:right;margin:0 0 4px 8px;max-width:48%}
.print .fl.left{float:left;margin:0 8px 4px 0}
.print .pcs{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 10px;margin-top:10px;clear:both}
.print .pcs.c1{grid-template-columns:1fr}
.print .pch{display:flex;gap:4px;align-items:baseline}
.print .pcn{color:var(--mute);flex-shrink:0}
.print .tbl{border-collapse:collapse;margin:4px auto;font-size:14px}
.print .tbl td{border:1px solid #444;padding:2px 6px;text-align:center}
.print .tbl.grid td{border:none}
.print .tab{display:inline-block;width:14px}
.print .missing{color:var(--no)}
.disp{margin:14px 0;text-align:center;font-size:17px;overflow-x:auto}
.field{margin-top:16px}
.flabel{font-size:13px;color:var(--mute);margin-bottom:6px;display:block}
.row{display:flex;gap:8px;align-items:stretch}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:17px;padding:13px 14px;
 border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--key)}
input[type=text]:disabled{background:var(--soft);color:var(--mute)}
button{font:inherit;cursor:pointer;border:none}
.btn{padding:13px 20px;border-radius:10px;background:var(--ink);color:#fff;font-weight:700;
 font-size:15px;white-space:nowrap}
.btn:disabled{background:#CFCFCF;cursor:default}
.btn.wide{width:100%;padding:16px;font-size:16px}
.choices{display:grid;gap:8px;margin-top:8px}
.ch{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);
 border-radius:10px;font-size:14.5px;background:#fff;text-align:left;color:var(--ink);line-height:1.5}
.ch b{color:var(--mute);font-weight:700;flex-shrink:0}
.ch.sel{border-color:var(--key);background:var(--tint)}
.ch:disabled{opacity:1}
.ch.ans{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.ch.ans b{color:var(--ok)}
.ch.miss{border-color:var(--no);background:var(--nobg);color:var(--no)}
.ch.idk{border-style:dashed;color:var(--mute);background:var(--soft);font-size:13px;padding:9px 14px}
.ch.idk.sel{border-color:var(--warn);background:var(--warnbg);color:var(--warn)}
.ch.miss b{color:var(--no)}
.ch.dim{opacity:.45}
.steps{margin-top:8px;border-left:2px solid var(--tint);padding-left:14px}
.step{margin-bottom:18px}.step:last-child{margin-bottom:4px}
.sk{font-size:13px;font-weight:700;color:var(--deep);margin-bottom:7px}
.verdict{margin-top:16px;border-radius:12px;padding:14px 16px;font-size:14.5px;display:none}
.verdict.show{display:block}
.verdict.ok{background:var(--okbg);color:var(--ok)}
.verdict.no{background:var(--nobg);color:var(--no)}
.verdict .vt{font-weight:800;font-size:15px;margin-bottom:6px}
.sol{margin-top:12px;padding-top:12px;border-top:1px solid rgba(0,0,0,.08);color:var(--ink);font-size:14px}
.sol .sl{font-weight:700;font-size:12.5px;color:var(--mute);margin-bottom:6px}
.sol p{margin:0 0 7px}
.result{padding:26px 20px 34px;display:none;scroll-margin-top:132px}
.result.show{display:block}
.score{text-align:center;padding:18px 0 14px}
.score .n{font-size:46px;font-weight:800;color:var(--deep);line-height:1}
.score .l{font-size:13px;color:var(--mute);margin-top:6px}
.rsec{margin-top:20px}
.rsec .rh{font-size:12px;font-weight:800;color:var(--deep);letter-spacing:.04em;margin-bottom:2px}
.rlist{border-top:1px solid var(--line)}
.ri{display:flex;justify-content:space-between;gap:12px;padding:11px 2px;
 border-bottom:1px solid var(--line);font-size:14px}
.ri span:first-child{color:var(--mute);flex:1}
.ri .o{color:var(--ok);font-weight:700}.ri .x{color:var(--no);font-weight:700}
.next{margin-top:22px;background:var(--tint);border-radius:12px;padding:16px 18px;font-size:14px}
.next b{display:block;color:var(--deep);font-size:14.5px;margin-bottom:7px}
.next .nl{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.next .nl em{font-style:normal;color:var(--deep);font-weight:700;font-size:13px;white-space:nowrap}
.next .nl em.done{color:var(--ok)}
.next .nl em.zero{color:var(--no)}
.next .nn{margin-top:10px;padding-top:10px;border-top:1px solid rgba(192,82,78,.22);color:var(--deep);font-size:13px;font-weight:700}
details.dev{border-top:10px solid #F1F1F1;padding:18px 20px;background:#FAFAFA}
details.dev summary{font-size:13px;font-weight:700;color:var(--mute);cursor:pointer}
pre{background:#2E2E2E;color:#E8E8E8;padding:14px;border-radius:10px;overflow-x:auto;
 font-size:11.5px;line-height:1.6;font-family:ui-monospace,Menlo,Consolas,monospace}
.flag{margin-top:12px;text-align:right}
.flag .fl{font-size:12px;color:#BDBDBD;text-decoration:underline;cursor:pointer;
 background:none;border:none;padding:2px 0}
.flag textarea{width:100%;font:inherit;font-size:14.5px;padding:11px 12px;line-height:1.5;
 border:1.5px solid var(--line);border-radius:10px;margin-top:8px;resize:vertical;
 color:var(--ink);background:#fff;text-align:left}
.flag textarea:focus{outline:none;border-color:var(--key)}
.flag .sm{padding:9px 16px;font-size:13.5px;margin-top:7px;border-radius:9px;
 background:var(--ink);color:#fff;font-weight:700}
.flag .sent{font-size:12.5px;color:var(--ok);font-weight:700}
.foot{text-align:center;padding:22px;color:#B5B5B5;font-size:11.5px}
/* 제출 상태 바 (0907) — 학생이 '냈다'고 믿는 것과 서버에 남은 것이 어긋나던 사고.
   전송 성공·실패·남은 문항을 화면 아래에 항상 띄운다. */
.sbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;
 gap:10px;padding:11px 16px;font-size:13.5px;font-weight:700;line-height:1.45;
 background:#2E2E2E;color:#fff;box-shadow:0 -2px 10px rgba(0,0,0,.14)}
.sbar.ok{background:var(--ok)}
.sbar.no{background:var(--no)}
.sbar .st{flex:1}
.sbar button{padding:8px 14px;font:inherit;font-size:13px;border:none;border-radius:9px;
 background:#fff;color:var(--ink);font-weight:800;cursor:pointer;white-space:nowrap}
.card{margin:2px 20px 6px;padding:18px 18px 16px;background:var(--tint);border-radius:14px}
.card .cl{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--deep)}
.card .ct{font-size:17.5px;font-weight:800;margin:4px 0 12px;color:var(--ink);letter-spacing:-.01em}
.card h4{margin:15px 0 5px;font-size:14px;font-weight:800;color:var(--deep)}
.card h4:first-of-type{margin-top:0}
.card p{margin:0 0 6px;font-size:14.5px;line-height:1.7}
.card .eq{margin:10px 0;text-align:center;font-size:16.5px;overflow-x:auto}
.card .key{margin-top:13px;padding:12px 14px;background:#fff;border-radius:10px;
 font-size:14px;font-weight:700;color:var(--deep);line-height:1.6}
.ov{border-top:1.15px solid currentColor;padding-top:1px;margin:0 .06em;
 font-family:'Cambria Math','Times New Roman',Georgia,serif;font-style:normal;white-space:nowrap}
.ov+sup{font-style:normal;font-family:'Cambria Math','Times New Roman',Georgia,serif}
.card .fig{margin:12px 0 14px;text-align:center;line-height:0}
.card .fig svg{max-width:100%;height:auto;display:inline-block}
.card .fig .cap{display:block;line-height:1.5;margin-top:5px;font-size:12px;color:var(--mute)}
.card .cwarn{margin-top:9px;padding:11px 14px;background:var(--warnbg);color:var(--warn);
 border-radius:10px;font-size:13.5px;font-weight:700;line-height:1.6}
/* (0911) 되짚기(사후평가) — 풀지 않는다. 내 답·정답 한 줄 + 상태·원인 두 묶음 */
.pe-meta{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 2px;font-size:13.5px;color:var(--mute)}
.pe-meta b{color:var(--ink);font-weight:700}
.pe-meta .no{color:var(--no)}
.pe-meta .yes{color:var(--ok)}
.pe .choices{gap:6px}
.pe .ch{padding:10px 13px;font-size:14px}
.pe .ch.sel:disabled{border-color:var(--key);background:var(--tint)}
/* (0913 유강) 문제 자세히보기 — 어떤 문제였는지 기억 안 나는 애들이 있다. 기본은 접힘(8문항이면 페이지가 길다)
   (0926) <details>/<summary> 를 버리고 버튼+클래스로 — 일부 폰 브라우저에서 summary 탭이 안 먹힌다는 신고. 버튼은 어디서나 먹는다 */
.peek{margin:8px 0 2px}
.peek>.pk{display:inline-flex;align-items:center;gap:5px;cursor:pointer;background:#fff;
 font-size:13px;font-weight:700;font-family:inherit;line-height:1.3;color:var(--key);border:1px solid var(--line);border-radius:9px;
 padding:7px 12px;user-select:none;-webkit-appearance:none;appearance:none}
.peek>.pk::before{content:'＋';font-weight:400}
.peek.open>.pk::before{content:'－'}
.peek>.stem{display:none;margin-top:9px;padding:11px 13px;background:var(--soft);border-radius:10px}
.peek.open>.stem{display:block}
math{font-family:'Cambria Math','STIX Two Math','Latin Modern Math','Times New Roman',serif;font-size:1.06em}
.disp math{font-size:1.18em}
.stem math,.ch math,.sk math,.sol math{vertical-align:-0.1em}

.tw{padding:0 16px 90px;box-sizing:border-box}
.bub,.nx,.sum,.prob{scroll-margin-top:150px}
.prob{background:var(--card,#fff);border:1px solid var(--line,#e5e7eb);border-radius:14px;padding:14px 14px 10px;margin:14px 0}
.prob .ph{font-size:12px;color:#6b7280;margin-bottom:6px;font-weight:600}
.prob .stem{font-size:15px;line-height:1.7}
.prob .fig img{max-width:100%;height:auto}
.prob.fold .stem{max-height:5.2em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent)}
.prob .tog{font-size:12px;color:#6b7280;background:none;border:0;padding:4px 0;cursor:pointer}
.thread{margin-top:6px}
.bub{border-radius:14px;padding:12px 14px;margin:10px 0;line-height:1.65;font-size:15px;animation:up .25s ease}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bub.q{background:#fff;border:1px solid #e5e7eb}
.bub.q .lab{font-size:11px;font-weight:700;letter-spacing:.04em;color:#b45309;margin-bottom:4px}
.bub.q .lab.sub{color:#2563eb}
.bub.q .lab.h{color:#7c3aed}
.bub.say{background:#f3f4f6;border-left:3px solid #9ca3af}
.bub.say.ok{background:#ecfdf5;border-left-color:#10b981}
.bub.say.no{background:#fff7ed;border-left-color:#f97316}
.bub.say.sol{background:#eff6ff;border-left-color:#3b82f6}
.opts{display:grid;gap:8px;margin-top:10px}
.op{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid #e5e7eb;background:#fff;border-radius:12px;padding:11px 12px;font:inherit;font-size:15px;line-height:1.5;color:inherit;cursor:pointer}
.op b{flex:none;color:#9ca3af;font-weight:600}
.op:active{background:#f9fafb}
.op.pick{border-color:#111827;background:#f9fafb}
.op.right{border-color:#10b981;background:#ecfdf5}
.op.wrong{border-color:#f97316;background:#fff7ed}
.op.lock{opacity:.38;pointer-events:none;text-decoration:line-through}
.opts.done .op{pointer-events:none}
.opts.done .op:not(.pick):not(.right){opacity:.45}
.nx.cf{margin-top:12px}.nx.cf:disabled{background:#d1d5db;cursor:default}
.nx{display:block;width:100%;margin:12px 0 4px;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:700;background:#111827;color:#fff;cursor:pointer}
.sum{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin:14px 0}
.sum h3{margin:0 0 8px;font-size:15px}
.sum .row{display:flex;justify-content:space-between;padding:6px 0;border-top:1px dashed #e5e7eb;font-size:14px}
.sum .row:first-of-type{border-top:0}
.mk{font-weight:800}.mk.o{color:#059669}.mk.t{color:#d97706}.mk.x{color:#dc2626}.mk.s{color:#9ca3af}
.sum .weak{margin-top:10px;font-size:14px;background:#fff7ed;border-radius:10px;padding:10px}
.dots{display:flex;gap:6px;margin:10px 0 0}
.dots i{flex:1;height:5px;border-radius:3px;background:#e5e7eb}
.dots i.cur{background:#111827}.dots i.o{background:#10b981}.dots i.t{background:#f59e0b}.dots i.x{background:#ef4444}

>b<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><\/mrow><\/math> 이므로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003D;<\/mo><mi>b<\/mi><\/mrow><\/math> 로 두기", "이동한 원의 반지름을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mo>&#x0002B;<\/mo><msqrt><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>b<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msqrt><\/mrow><\/math> 로 두기", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo>&#x0003D;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>b<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math> 만 풀기"], "말": ["맞다. 두 절댓값 식이 서로 따로라, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math> 둘과 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><\/mrow><\/math> 둘을 짝지어 4쌍이 나온다.", "맞는 준비지만 아직 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>b<\/mi><\/mrow><\/math> 는 안 정해졌다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><\/mrow><\/math> 과 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><\/mrow><\/math> 이 같아야 할 이유가 있을까? 절댓값이 같은 것과 값이 같은 건 다르다.", "평행이동은 크기를 바꾸지 않는다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>a<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x0007C;<\/mo><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math> 를 풀면 해가 몇 개인지 다시 세어 보자."], "풀이": "중심이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/ row><mo>&#x02212;<\/mo><mn>3<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><\/mrow><\/math> 또는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><\/mrow><\/math>"], "말": ["맞다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><\/mrow><\/math> 도 같은 방식으로 두 값이다. 둘을 어떻게 짝지을지 보자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><\/math> 인 경우도 풀어 보자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><\/math> 를 다시 풀어 보자."]}}, {"질문": "처음 원의 중심 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 이 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 위에 있다는 사실은 풀이에서 무엇을 정하나?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>b<\/mi><\/mrow><\/math> 의 후보가 똑같이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mn>3<\/mn><\/mrow><\/math> 이 될 뿐, 짝은 자유롭다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003D;<\/mo><mi>b<\/mi><\/mrow><\/math> 인 순서쌍만 답이 되게 한다", "옮긴 원의 중심도 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/m "normal\">&#x02032;<\/mi><\/msup><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/math>", "A 에서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>l<\/mi><\/mrow><\/math> 까지의 거리", "A 를 원점에 대칭이동한 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi mathvariant=\"normal\">A<\/mi><mi>&#x02032;<\/mi><\/msup><\/mrow><\/math> 에 대해 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><msup><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">&#x02032;<\/mi><\/msup><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/math>"], "말": ["맞다. 이렇게 바꾸면 꺾인 선의 한 마디가 직선 반대편으로 넘어간다. 둘레 전체에 써 보자.", "그건 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/math> 의 최솟값일 뿐, B 마다 같은 값은 아니다.", "원점 대칭은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>l<\/mi><\/mrow><\/math> 과 관계없다. B 가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>l<\/mi><\/mrow><\/math> 위에 있다는 걸 살려야 한다."]}}, {"질문": "답을 결정짓는 단계는?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><msub><mi mathvariant=\"normal\">A<\/mi><mn>1<\/mn><\/msub><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><mo>&#x0002B;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">B<\/mi><mi mathvariant=\"normal\">C<\/mi><\/mrow><\/mrow><mo>&#x0002B;<\/mo><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">C<\/mi><msub><mi mathvariant=\"normal\">A<\/mi><mn>2<\/mn><\/msub><\/mrow><\/mrow>< sub><mi>C<\/mi><mrow><mn>2<\/mn><\/mrow><\/msub><\/mrow><\/math>라 하자. 두 원 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>C<\/mi><mrow><mn>1<\/mn><\/mrow><\/msub><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><msub><mi>C<\/mi><mrow><mn>2<\/mn><\/mrow><\/msub><\/mrow><\/math>가 서로 다른 두 점에서 만나고, 이 두 점을 지나는 직선의 기울기가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mn>5<\/mn><\/mrow><\/mfrac><\/mrow><\/math>일 때, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0002B;<\/mo><mi>b<\/mi><\/mrow><\/math>의 값을 구하시오. (단, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>b<\/mi><\/mrow><\/math>는 상수이다.)<\/p><\/div>", "M": [{"질문": "이 문제가 결국 묻는 핵심은?", "선지": ["두 원의 방정식을 빼서 두 교점을 지나는 직선을 얻는 것", "두 원의 중심을 잇는 직선의 기울기를 구하는 것", "원과 직선이 접할 조건을 점과 직선 거리로 세우는 것", "원을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math> 에 대칭이동하면 반지름이 바뀌는 것", "두 원의 교점의 좌표를 직접 구하는 것"], "말": ["맞다. 두 원을 빼면 이차항이 사라져 두 교점을 지나는 직선이 나온다.", "중심을 잇는 직선은 교점을 지나는 직선과 수직이다. 같은 직선이 아니다.", "접선 이야기는 발문에 없다. 두 원이 '두 점에서 만난다' 고 했다.", "대칭이동은 원을 뒤집기만 한다. 크기가 변할까?", "교점을 직접 구하면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>b<\/mi><\/mrow><\/math> 가 섞여 계산이 무겁다. 교점을 몰라도 그 직선을 얻는 방법이 있다."], "풀이": "두 원을 그대로 빼면 이차항이 사라져 두 교점을 지나는 직선이 나온다. 기울기 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>5<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 은 이 공통현의 기울기다. 중심을 잇는 직선은 공통현과 수직이라 다른 직선이다.", "보조": {"질문": "두 원 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn> mi><mrow><mn>2<\/mn><\/mrow><\/msup><mo>&#x02212;<\/mo><mn>6<\/mn><mi>x<\/mi><mo>&#x0002B;<\/mo><mn>2<\/mn><mi>y<\/mi><mo>&#x0002B;<\/mo><mn>6<\/mn><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math>과 서로 다른 두 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">A<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/math>에서 만난다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math>일 때, 상수 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><\/mrow><\/math>의 값을 구하시오.<\/p><\/div>", "M": [{"질문": "이 문제가 결국 묻는 핵심은?", "선지": ["곡선과 원이 같은 직선에 대칭이라 교점이 대칭쌍이 되는 것", "원과 포물선을 연립해 사차방정식을 푸는 것", "포물선의 꼭짓점이 원의 중심과 일치할 조건", "원과 직선이 만나서 생기는 현의 길이 공식", "원점에 대칭이동하면 곡선의 모양이 그대로라는 것"], "말": ["맞다. 두 그림이 같은 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math> 에 대칭이라 교점끼리 짝이 되고, 그래서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/math> 가 수평이다.", "연립하는 게 정석처럼 보이지. 근데 사차방정식이 나온다. 그 전에 그림 모양에서 읽을 게 없을까?", "꼭짓점과 중심을 맞추고 싶은 마음은 안다. 그런데 그런 조건은 문제 어디에도 없다.", "현의 길이 공식은 직선과 원 사이 얘기다. 여기서 원과 만나는 건 곡선이다.", "모양이 그대로인 건 맞다. 하지만 그것만으론 A, B 위치가 안 잡힌다. 위치를 정해 주는 게 뭘까?"], "풀이": "이동한 곡선의 축 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math> 과 원의 중심 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>좌표 3 이 같아 그림 전체가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math> 에 대칭이다. 그래서 두 교점은 서로 대칭이고 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/math> 는 수평이다. 사차방정식을 직접 풀 필요가 없다.", "보조": {"질문": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>4<\/mn><\/mfrac><\/mstyle><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mn>3<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>9<\/mn><mn>4<\/mn><\/mfrac><\/mstyle><mo>&#x02212;<\/mo><mi>k<\/mi><\/mrow><\/math> 와 원 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mn>3<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>y<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math> 가 함께 대칭인 직선은?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>x<\/mi><\/mrow><\/math>"], "말": ["맞다. 그럼 두 그림의 교점도 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math> 을 기준으로 짝을 이룬다. 처음 질문을 다시 보자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math> 은 원만 대칭인 선이다. 포물선은 위아래로 뒤집으면 모양이 바뀐다.", "원은 중심을 지나는 직선마다 대칭이지만, 포물선은 축 하나에만 대칭이다."]}}, {"질문": "답을 결정짓는 단계는?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math> 가 지름이라 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">A<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi mathvariant=\"normal\">B<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>5<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>", "원을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mn>3<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>y<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math> 로 고치기", "곡선의 꼭짓점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">&#x00028;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>9<\/mn><mn>4<\/mn><\/mfrac><\/mstyle><mo>&#x02212;<\/mo><mi>k<\/mi><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">&#x00029;<\/mo><\/mrow><\/mrow><\/math> 가 원 위에 있다고 두기", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/math> 가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>축에 평행하다고 두기", "원의 중심 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 이 곡선 위에 있다고 두기"], "말": ["맞다. 반지름이 2 라 길이 4 인 현은 지름뿐이고, 수평이니 두 점이 바로 나온다.", "표준형으로 고치는 건 꼭 필요하다. 다만 준비 단계다. 값이 확정되는 순간은 그 뒤에 있다.", "꼭짓점이 원 위라는 근거가 문제에 있을까? 주어진 건 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/math> 의 길이뿐이다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>축에 평행하면 두 점의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>좌표가 같아야 한다. 그림이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math> 에 대칭이라는 걸 떠올리면 방향이 어떨까?", "중심이 곡선 위에 있다는 조건은 없다. 길이 4 가 무엇을 뜻하는지부터 보자."], "풀이": "수평 현의 길이 4 가 지름이므로 현은 중심을 지나는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math> 이고 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">A<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi mathvariant=\"normal\">B<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>5<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 이다. 곡선에 넣으면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002B;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>9<\/mn><mn>4<\/mn><\/mfrac><\/mstyle><mo>&#x02212;<\/mo><mi>k<\/mi><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>9<\/mn><mn>4<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 다. 꼭짓점이 원 위라는 건 근거가 없다.", "보조": {"질문": "반지름이 2 인 원에서 길이가 4 인 현은?", "선지": ["반드시 중심을 지나는 지름", "중심에서 거리 1 인 현", "어떤 현이든 될 수 있다"], "말": ["맞다. 그럼 수평인 지름은 중심 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 을 지나는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/math> 위에 있다.", "중심에서 거리 1 이면 반현은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><mn>4<\/mn><mo>&#x02212;<\/mo><mn>1<\/mn><\/mrow><\/msqrt><mo>&#x0003D;<\/mo><msqrt><mn>3<\/mn><\/msqrt><\/mrow><\/math> 이다. 길이 4 와 맞지 않는다.", "현 중 가장 긴 게 지름 4 다. 길이가 최대면 위치도 정해진다."]}}, {"질문": "조건 '<b>서로 다른 두 점<\/b> A, B 에서 만난다' 는 풀이에서 어떤 역할을 하나?", "선지": ["교점이 둘뿐이라 A, B 가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math> 에 대한 대칭 짝임을 보장한다", "판별식 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>D<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math> 으로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><\/mrow><\/math> 의 범위를 먼저 구하게 한다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/math> 가 원의 지름이라는 것을 알려 준다", "그림 전체가 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math> 에 대칭임을 보장한다", "A, B 의 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>좌표가 서로 다르다는 것을 알려 준다"], "말": ["맞다. 대칭인 그림에서 교점은 짝으로 생기니, 둘뿐이면 그 둘이 서로 짝이다.", "교점 개수를 판별식으로 따지는 건 직선과 이차곡선일 때 방식이다. 여기선 사차식이라 그 길이 막힌다.", "지름이라는 건 길이 4 와 반지름 2 를 비교해야 나온다. '두 점'이라는 말만으로 길이가 정해질까?", "대칭은 곡선과 원의 식에서 이미 나온다. 교점 개수가 대칭을 만들지는 않는다. 이 조건은 그 다음에 쓰인다.", "'서로 다른'은 두 점이 겹치지 않는다는 뜻이다. 좌표 하나하나를 말하는 게 아니다."], "풀이": "그림 전체가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math> 에 대칭이라 한 교점을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math> 에 대칭시킨 점도 교점이다. 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math> 은 포물선과 한 점에서만 만나므로, 교점이 딱 둘이면 그 둘이 서로의 대칭점이고 그래서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/math> 가 수평이다. 교점이 넷이었다면 A, B 가 짝이 아닐 수도 있다. 실제로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>9<\/mn><mn>4<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 이면 교점은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo stretchy=\"false\">&#x00028;<\/mo><mn>5<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 둘뿐이다. 지름이라는 판단은 길이 4 와 반지름 2 에서 따로 나온다.", "보조": {"질문": "그림이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math> 에 대칭일 때 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 이 교점이면 반드시 교점인 점은?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>5<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>"], "말": ["맞다. 교점은 이렇게 짝으로 생긴다. 교점이 둘뿐이라면 A, B 는 어떤 관계일까?", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축에 대칭한 점이다. 그림이 대칭인 선은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math> 이다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>1<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>1<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 은 원점에 대칭한 점이다. 원점 대칭은 곡선을 만들 때 이미 썼다."]}}, {"질문": "문제에서 '원점에 대하여' 를 '<b><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축에 대하여<\/b>' 대칭이동으로 바꾸면 지금 풀이는?", "선지": ["곡선의 축이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>3<\/mn><\/mrow><\/math> 이 되어 '<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><\/mrow><\/math> 는 수평' 이 보장되지 않는다", "그대로 써서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>9<\/mn><mn>4<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 가 나온다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><\/mrow><\/math> 의 부호만 바뀌어 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>9<\/mn><mn>4<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 가 된다", "곡선이 위로 볼록해질 뿐 축은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math> 그대로다", "원도 함께 대칭이동해야 하므로 답은 같다"], "말": ["맞다. 축이 <math xmlns=\"http://www.w  끌린다. 그런데 거기서 교점 짝을 쓸 일이 있을까?", "ㄱ은 잘 봤다. ㄷ은 생김새가 같을 뿐, 묻는 게 무엇인지 다시 보자.", "다 닮아 보인다. 셋 중 '대칭인 짝'을 실제로 쓰는 게 어느 것인지 하나씩 보자."], "풀이": "ㄱ은 축 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>1<\/mn><\/mrow><\/math> 을 공유해 거리 6 이 지름이라 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo stretchy=\"false\">&#x00028;<\/mo><mn>4<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 을 넣어 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>9<\/mn><mn>4<\/mn><\/mfrac><\/mstyle><\/mrow><\/math>, ㄴ은 두 근이 축 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math> 에 대칭이라 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>&#x000B1;<\/mi><mn>3<\/mn><\/mrow><\/math> 으로, 둘 다 대칭쌍을 쓴다. ㄷ은 같은 곡선·같은 대칭이동이지만 꼭짓점만 구하는 문제다.", "보조": {"질문": "포물선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x02212;<\/mo><mn>4<\/mn><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>k<\/mi><\/mrow><\/math> 와 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축의 두 교점은 어느 직선에 대칭인가?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>k<\/mi><\/mrow><\/math>"], "말": ["맞다. 축에 대칭인 짝이라 거리 6 이면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>&#x000B1;<\/mi><mn>3<\/mn><\/mrow><\/math> 이다. 이 문제와 같은 구조다. 보기를 다시 보자.", "축은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mi>b<\/mi><\/mrow><mrow><mn>2<\/mn><mi>a<\/mi><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math> 다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>4<\/mn><mn>2<\/mn><\/mfrac><\/mstyle><\/mrow><\/math> 를 계산해 보자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mi>k<\/mi><\/mrow><\/math> 는 수평선이다. 두 교점은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축 위에 나란히 있다."]}}], "H": {"질문": "이 문제, 첫 발은 뭐로 뗄까?", "선지": ["대칭이동한 곡선과 원을 각각 표준형으로 바꿔 본다", "곡선과 원을 연립해 사차방정식을 세운다", "원래 곡선과 원을 바로 연립한다", "현의 길이 공식에 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mrow style=\"border-top:0.075em solid currentColor;padding-top:0.06em\"><mrow><mi mathvariant=\"normal\">A<\/mi><mi mathvariant=\"normal\">B<\/mi><\/mrow><\/mrow><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math> 를 넣는다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><mo>&#x0003D;<\/mo><mn>0<\/mn><\/mrow><\/math> 을 넣고 그림을 그려 본다"], "말": ["좋다. 꼭짓점과 중심이 보이면 두 그림이 같은 직선에 대칭이라는 게 드러난다.", "정직한 방법이지만 사차식이라 막힌다. 식보다 그림을 먼저 보자.", "원과 만나는 건 대칭이동한 뒤의 곡선이다. 옮기기 전 곡선을 쓰면 다른 문제가 된다.", "현의 길이 공식은 직선과 원 사이에 쓴다. A, B 를 잇는 직선이 뭔지 아직 모른다.", "값을 찍어 그려 보면 감은 오지만 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>k<\/mi><\/mrow><\/math> 가 정해지진 않는다. 식의 모양에서 대칭을 찾자."], "힌트": ["원점 대칭은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math> 를 모두 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mi>x<\/mi><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mi>y<\/mi><\/mrow><\/math> 로 바꾼다. 바꾼 곡선의 축과 원의 중심을 비교해 보자.", "대칭이동한 곡선은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>1<\/mn><mn>4<\/mn><\/mfrac><\/mstyle><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mn>3<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>9<\/mn><mn>4<\/mn><\/mfrac><\/mstyle><mo>&#x02212;<\/mo><mi>k<\/mi><\/mrow><\/math>, 원은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mn>3<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>y<\/mi><mo>&#x0002B;<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math> 다. 둘 다 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0003D;<\/mo><mn>3<\/mn><\/mrow><\/math> 에 대칭이다."]}}, {"id": "진덕고 #3-7", "단원": "도형의 이동", "발문": "<div class=\"print\"><p class=\"first\">두 양수 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>b<\/mi><\/mrow><\/math>에 대하여 원 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mrow><mn>2<\/mn><\/mrow><\/msup><mo>&#x0003D;<\/mo><mn>25<\/mn><\/mrow><\/math>를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축의 방향으로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math>만큼, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>축의 방향으로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><\/mrow><\/math>만큼 평행이동한 원을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C<\/mi><\/mrow><\/math>라 하자. 원 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C<\/mi><\/mrow><\/math>가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>축과 만나서 생기는 현의 길이가 각각 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>6<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>2<\/mn><msqrt><mrow><mn>21<\/mn><\/mrow><\/msqrt><\/mrow><\/math>일 때, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mi>b<\/mi><\/mrow><\/math>의 값을 구하시오.<\/p><\/div>", "M": [{"질문": "이 문제가 결국 묻는 핵심은?", "선지": ["반지름, 반현, 중심에서 축까지 거리가 직각삼각형을 이루는 것", "원이 두 축에 접할 조건을 구하는 것", "원과 축의 교점을 판별식으로 세는 것", "평행이동하면 원의 반지름이 바뀌는 것", "두 현의 길이의 비가 중심 좌표의 비와 같은 것"], "말": ["맞다. 반지름·반현·중심까지 거리가 직각삼각형을 이루고, 이걸 두 축에 한 번씩 쓴다.", "접할 조건은 현이 아예 안 생길 때다. 이 원은 두 축에서 현을 만든다.", "판별식은 교점이 있는지만 알려 준다. 현의 길이까지 정해 주진 않는다.", "평행이동은 원을 통째로 옮길 뿐이다. 크기가 바뀔까?", "비가 같을 것 같은 직관이다. 그런데 현의 길이는 거리에 비례하지 않는다. 식으로 확인해 보자."], "풀이": "중심에서 축에 내린 수선이 현을 이등분하므로 반지름²=반현²+거리² 이다. 이 관계를 두 축에 한 번씩 쓴다. 접할 조건은 현이 없는 경우라 이 문제와 다르다.", "보조": {"질문": "원의 중심에서 현에 내린 수선은 현을 어떻게 하나?", "선지": ["수직이등분한다", "현의 한 끝점을 지난다", "현과 평행하다"], "말": ["맞다. 그래서 반지름, 반현, 수선이 직각삼각형을 만든다. 처음 질문을 다시 보자.", "수선의 발은 현의 가운데에 떨어진다. 끝점이 아니다.", "수선은 현과 수직이다."]}}, {"질문": "답을 결정짓는 단계는?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축 현: <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><msqrt><mrow><mn>25<\/mn><mo>&#x02212;<\/mo><msup><mi>b<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msqrt><mo>&#x0003D;<\/mo><mn>6<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>축 현: <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><msqrt><mrow><mn>25<\/mn><mo>&#x02212;<\/mo><msup><mi>a<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msqrt><mo>&#x0003D;<\/mo><mn>2<\/mn><msqrt><mrow><mn>21<\/mn><\/mrow><\/msqrt><\/mrow><\/math>", "이동한 원을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mi>a<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>y<\/mi><mo>&#x02212;<\/mo><mi>b<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>25<\/mn><\/mrow><\/math> 로 쓰기", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축 현의 길이를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>b<\/mi><\/mrow><\/math> 로 두기", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mi>a<\/mi><mi>b<\/mi><\/mfrac><\/mstyle><mo>&#x0003D;<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>6<\/mn><\/mrow><mrow><mn>2<\/mn><msqrt><mrow><mn>21<\/mn><\/mrow><\/msqrt><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math> 로 두기", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>b<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>25<\/mn><\/mrow><\/math> 로 두기"], "말": ["맞다. 각 축에 맞는 거리를 짝지어 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math> 가 나온다.", "맞는 식이지만 출발점이다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><\/mrow><\/math> 가 정해지는 건 그다음이다.", "현의 길이를 중심 좌표 하나로 바로 쓸 수 있을까? 반지름이 어디에 들어가야 할지 보자.", "비례로 묶으면 편하지만 근거가 없다. 현 길이는 거리에 비례하지 않는다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>b<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>25<\/mn><\/mrow><\/math> 면 원이 원점을 지난다는 뜻이다. 그런 조건은 없었다."], "풀이": "중심 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 에서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축까지 거리는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>축까지 거리는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math> 다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>25<\/mn><mo>&#x02212;<\/mo><msup><mi>b<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>9<\/mn><\/mrow><\/math> 에서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>25<\/mn><mo>&#x02212;<\/mo><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>21<\/mn><\/mrow><\/math> 에서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mi>b<\/mi><mo>&#x0003D;<\/mo><mn>8<\/mn><\/mrow><\/math> 이다. 현을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><mi>b<\/mi><\/mrow><\/math> 로 두는 건 근거가 없다.", "보조": {"질문": "중심이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 인 원에서 중심과 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축 사이 거리는?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>b<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>a<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>b<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msqrt><\/mrow><\/math>"], "말": ["맞다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축 위 현에는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>축 위 현에는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math> 가 짝이다. 이걸로 식을 세워 보자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>a<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 는 중심과 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>축 사이 거리다. 축을 바꿔 짝지었다.", "그건 중심과 원점 사이 거리다."]}}, {"질문": "조건 '두 <b>양수<\/b> <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>b<\/mi><\/mrow><\/math>' 는 풀이에서 어떤 역할을 하나?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>b<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>16<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math> 에서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><mo>&#x0003D;<\/mo><mn>4<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>a<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math> 하나로 정해 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mi>b<\/mi><\/mrow><\/math> 의 부호를 정한다", "현의 길이가 양수가 되게 해 근호 안을 양수로 만든다", "원 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C<\/mi><\/mrow><\/math> 가 두 축과 반드시 만나도록 보장한다", "반지름 5 가 평행이동 뒤에도 그대로임을 보장한다", "답에는 영향이 없다 — <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mi>b<\/mi><\/mrow><\/math> 는 부호와 관계없이 8 이다"], "말": ["맞다. 식에서 나오는 건 제곱뿐이라, 양수 조건이 있어야 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mi>b<\/mi><\/mrow><\/math> 가 하나로 정해진다.", "근호 안이 양수인지는 현의 길이가 주어진 것으로 이미 해결된다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><\/mrow><\/math> 의 부호와는 다른 얘기다.", "두 축과 만나는 건 현의 길이가 주어진 순간 이미 알 수 있다.", "반지름이 그대로인 건 평행이동 자체의 성질이다. 조건이 따로 필요 없다.", "부호와 관계없는지 직접 확인해 보자. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math> 면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mi>b<\/mi><\/mrow><\/math> 는?"], "풀이": "현의 길이 식에서 나오는 건 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>b<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>16<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math> 뿐이다. 양수 조건이 없으면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003D;<\/mo><mi>&#x000B1;<\/mi><mn>2<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>b<\/mi><mo>&#x0003D;<\/mo><mi>&#x000B1;<\/mi><mn>4<\/mn><\/mrow><\/math> 라 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mi>b<\/mi><mo>&#x0003D;<\/mo><mi>&#x000B1;<\/mi><mn>8<\/mn><\/mrow><\/math> 로 답이 하나로 안 정해진다. 두 축과 만나는 건 현의 길이가 주어진 것으로 이미 알 수 있고, 반지름 유지는 평행이동 자체의 성질이다.", "보조": {"질문": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>b<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>16<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math> 만 알 때 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mi>b<\/mi><\/mrow><\/math> 로 가능한 값은?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>8<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>8<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>8<\/mn><\/mrow><\/math> 뿐", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>8<\/mn><\/mrow><\/math> 뿐"], "말": ["맞다. 두 값이 다 가능하다. 그럼 답을 하나로 못 박아 주는 건 어느 조건일까?", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>2<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math> 도 두 식을 만족한다. 그때 곱을 계산해 보자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math> 도 두 식을 만족한다."]}}, {"질문": "문제에서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축·<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>축 현의 길이를 서로 바꾸면(각각 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><msqrt><mrow><mn>21<\/mn><\/mrow><\/msqrt><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>6<\/mn><\/mrow><\/math>) <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mi>b<\/mi><\/mrow><\/math> 는?", "선지": ["그대로 8 — <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003D;<\/mo><mn>4<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>b<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math> 로 바뀔 뿐 곱은 같다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>8<\/mn><\/mrow><\/math> — 중심이 다른 사분면으로 간다", "2 — <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>b<\/mi><\/mrow><\/math> 가 모두 작아진다", "16 — 두 값이 모두 4 가 된다", "그런 원은 존재하지 않는다"], "말": ["맞다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><\/mrow><\/math> 가 자리를 바꿀 뿐이라 곱은 그대로다.", "음수가 되려면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><\/mrow><\/math> 중 하나가 음수여야 한다. 문제의 조건을 다시 보자.", "둘 다 작아진다고 느낀 거다. 두 식을 새로 세워서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><\/mrow><\/math> 를 직접 구해 보자.", "두 값이 같아지려면 두 현의 길이가 같아야 한다. 지금은 길이가 서로 다르다.", "길이를 맞바꿔도 각 현은 지름 10 보다 짧다. 원이 못 생길 이유가 있을까?"], "풀이": "길이를 바꾸면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>25<\/mn><mo>&#x02212;<\/mo><msup><mi>b<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>21<\/mn><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>25<\/mn><mo>&#x02212;<\/mo><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>9<\/mn><\/mrow><\/math> 라 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>a<\/mi><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math> 다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>b<\/mi><\/mrow><\/math> 가 자리만 바뀌어 곱은 8 그대로다. 양수 조건이 있어 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;<\/mo><mn>8<\/mn><\/mrow><\/math> 은 안 된다.", "보조": {"질문": "반지름 5 인 원이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축과 만나 생긴 현의 길이가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><msqrt><mrow><mn>21<\/mn><\/mrow><\/msqrt><\/mrow><\/math> 이면 중심과 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축 사이 거리는?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><mn>21<\/mn><\/mrow><\/msqrt><\/mrow><\/math>"], "말": ["맞다. 그럼 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math> 다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>축 쪽도 같은 방법으로 구해 보자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>4<\/mn><\/mrow><\/math> 는 거리의 제곱이다. 루트를 씌워야 한다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><mn>21<\/mn><\/mrow><\/msqrt><\/mrow><\/math> 은 반현이다. 직각삼각형의 다른 변을 구해야 한다."]}}, {"질문": "어떤 학생이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>25<\/mn><mo>&#x02212;<\/mo><msup><mi>b<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><msup><mn>6<\/mn><mn>2<\/mn><\/msup><\/mrow><\/math> 으로 세워서 '<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><\/mrow><\/math> 가 없다' 고 했다. 원인은?", "선지": ["현의 길이 6 을 그대로 썼다 — 반현 3 을 써야 한다", "중심에서 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축까지 거리를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><\/mrow><\/math> 로 짝지었다", "반지름을 25 로 읽었다", "이동한 중심을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mo>&#x02212;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mo>&#x02212;<\/mo><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 로 썼다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><\/mrow><\/math> 조건을 빠뜨렸다"], "말": ["맞다. 직각삼각형의 변은 현 전체가 아니라 반현이다.", "학생 식에는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축 현에 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><\/mrow><\/math> 가 제대로 짝지어져 있다. 짝짓기는 맞았다.", "반지름을 25 로 읽었다면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>25<\/mn><mn>2<\/mn><\/msup><\/mrow><\/math> 이 나왔을 거다. 학생 식의 25 는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>r<\/mi><mn>2<\/mn><\/msup><\/mrow><\/math> 자리로 맞다.", "중심 부호를 바꿔도 거리는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>b<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><\/math> 로 같다. 해가 없어지진 않는다.", "양수 조건은 해가 여러 개일 때 고르는 데 쓴다. 해가 아예 없는 건 다른 이유다."], "풀이": "직각삼각형의 변은 현 전체가 아니라 반현이다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>25<\/mn><mo>&#x02212;<\/mo><msup><mi>b<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>36<\/mn><\/mrow><\/math> 이면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>b<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mo>&#x02212;<\/mo><mn>11<\/mn><\/mrow><\/math> 로 해가 없다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>3<\/mn><mn>2<\/mn><\/msup><\/mrow><\/math> 을 써야 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math> 가 나온다.", "보조": {"질문": "길이 6 인 현에서, 중심에서 내린 수선의 발과 현의 한 끝 사이 거리는?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>3<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>6<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mn>6<\/mn><\/msqrt><\/mrow><\/math>"], "말": ["맞다. 직각삼각형에 들어가는 건 이 3 이다. 학생 식과 비교해 보자.", "수선은 현을 반으로 나눈다. 6 은 현 전체다.", "길이를 반으로 나눌 때 루트를 씌우진 않는다."]}}, {"질문": "이 문제와 같은 핵심 개념으로 푸는 것을 모두 고르면?<br>ㄱ. 원 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>10<\/mn><\/mrow><\/math> 과 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math> 가 만나서 생기는 현의 길이<br>ㄴ. 원 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mn>3<\/mn><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>9<\/mn><\/mrow><\/math> 를 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>y<\/mi><\/mrow><\/math>축 방향으로 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m<\/mi><mspace width=\"0.167em\" /><mo stretchy=\"false\">&#x00028;<\/mo><mi>m<\/mi><mo>&#x0003E;<\/mo><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math> 만큼 이동한 원이 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축에서 잘린 현의 길이가 4 일 때 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m<\/mi><\/mrow><\/math><br>ㄷ. 원 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mi>a<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>y<\/mi><mo>&#x02212;<\/mo><mi>b<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>25<\/mn><\/mrow><\/math> 가 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축에 접할 때 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b<\/mi><\/mrow><\/math>", "선지": ["ㄱ, ㄴ", "ㄴ", "ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "말": ["맞다. ㄱ, ㄴ 모두 반지름·반현·거리의 직각삼각형으로 푼다.", "ㄴ은 잘 봤다. 잘리는 선이 축이 아니어도 같은 삼각형이 생기는지 보자.", "ㄷ은 같은 원·같은 축이라 끌린다. 그런데 접하면 현이 생길까?", "ㄴ은 잘 봤다. ㄷ의 '접할 때'에 현이 있는지 다시 보자.", "셋 다 원과 직선이 나온다. 그중 현이 실제로 생기는 게 어느 것인지 보자."], "풀이": "ㄱ은 거리 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/math> 와 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>r<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>10<\/mn><\/mrow><\/math> 으로 반현 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mn>8<\/mn><\/msqrt><\/mrow><\/math>, ㄴ은 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>9<\/mn><mo>&#x02212;<\/mo><msup><mi>m<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>4<\/mn><\/mrow><\/math> 로 같은 직각삼각형을 쓴다. ㄷ은 같은 원·같은 축이지만 접할 조건(거리=반지름)이라 현이 없다.", "보조": {"질문": "원 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>10<\/mn><\/mrow><\/math> 의 중심과 직선 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><mo>&#x0002B;<\/mo><mi>y<\/mi><mo>&#x0003D;<\/mo><mn>2<\/mn><\/mrow><\/math> 사이 거리는?", "선지": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2<\/mn><\/mrow><\/math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><mn>10<\/mn><\/mrow><\/msqrt><\/mrow><\/math>"], "말": ["맞다. 거리와 반지름으로 반현을 구하는 건 이 문제와 같은 도구다. 보기를 다시 보자.", "점과 직선 거리는 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mo stretchy=\"false\">&#x0007C;<\/mo><mi>c<\/mi><mo stretchy=\"false\">&#x0007C;<\/mo><\/mrow><mrow><msqrt><mrow><msup><mi>a<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>b<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msqrt><\/mrow><\/mfrac><\/mstyle><\/mrow><\/math> 다. 분모를 빠뜨렸다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><mn>10<\/mn><\/mrow><\/msqrt><\/mrow><\/math> 은 반지름이다."]}}], "H": {"질문": "이 문제, 첫 발은 뭐로 뗄까?", "선지": ["이동한 원 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C<\/mi><\/mrow><\/math> 의 중심을 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;<\/mo><mi>a<\/mi><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mi>b<\/mi><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, 반지름을 5 로 적는다", "원 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C<\/mi><\/mrow><\/math> 와 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축을 연립해 판별식을 세운다", "현의 길이 6 을 반지름으로 놓는다", "원래 원 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>25<\/mn><\/mrow><\/math> 와 축의 교점부터 구한다", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003D;<\/mo><mi>b<\/mi><\/mrow><\/math> 라고 두고 식을 하나로 줄인다"], "말": ["좋다. 중심과 반지름이 보이면 중심에서 각 축까지 거리가 바로 나온다.", "연립해도 되지만 근의 차를 다시 계산해야 해서 돌아간다. 중심과 반지름으로 보는 길이 짧다.", "현과 반지름은 다르다. 반지름은 처음부터 5 로 주어져 있다.", "옮기기 전 원은 축과 길이 10 짜리 현을 만든다. 조건이 걸린 건 옮긴 뒤의 원이다.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x0003D;<\/mo><mi>b<\/mi><\/mrow><\/math> 는 근거가 없다. 두 현의 길이가 달라서 오히려 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a<\/mi><mo>&#x02260;<\/mo><mi>b<\/mi><\/mrow><\/math> 다."], "힌트": ["평행이동해도 반지름은 그대로다. 옮긴 원의 중심부터 적고, 중심에서 각 축까지의 거리를 보자.", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C<\/mi><mi>:<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mi>x<\/mi><mo>&#x02212;<\/mo><mi>a<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><mo stretchy=\"false\">&#x00028;<\/mo><mi>y<\/mi><mo>&#x02212;<\/mo><mi>b<\/mi><msup><mo stretchy=\"false\">&#x00029;<\/mo><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><mn>25<\/mn><\/mrow><\/math> 다. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>x<\/mi><\/mrow><\/math>축 위 현이면 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>3<\/mn><mn>2<\/mn><\/msup><mo>&#x0002B;<\/mo><msup><mi>b<\/mi><mn>2<\/mn><\/msup><mo>&#x0003D;<\/mo><msup><mn>5<\/mn><mn>2<\/mn><\/msup><\/mrow><\/math> 이다."]}}, {"id": "진덕고 #3-8", "단원": "도형의 이동", "발문": "<div class=\"print\"><p class=\"first\">그림과 같이 네 점 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">O<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>0<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">A<\/mi><mo stretchy=\"false\">&#x00028;<\/mo><mn>3<\/mn><mo>&#x0002C;<\/mo><mtext>&#x000A0;<\/mtext><mn>0<\/mn><mo stretchy=\"false\">&#x00029;<\/mo><\/mrow><\/math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi mathvariant=\"normal\">B<\/mi><mo stretchy=\"false\">&#
